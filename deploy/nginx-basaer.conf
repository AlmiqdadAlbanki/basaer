# basaer-managed
# install.sh never overwrites a site config that contains the marker line above,
# so edit server_name below freely. Delete the marker to opt out entirely.
#
# This block listens on port 80 only. `certbot --nginx` obtains the certificate,
# adds the 443 server block and the HTTP-to-HTTPS redirect itself.
server {
    listen 80;
    listen [::]:80;

    # PLACEHOLDER DOMAIN: replace with your real domain.
    # For testing without a domain, use:  server_name _;
    server_name app.basaerbh.com;

    # Largest accepted upload (student work).
    client_max_body_size 50m;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # Security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # HSTS: enable ONLY after HTTPS is confirmed working. certbot adds the 443
    # server block; put this line inside that block (or here, then re-check).
    # add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/basaer.access.log;
    error_log  /var/log/nginx/basaer.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Document generation takes a few seconds; the first LibreOffice run is longer.
        proxy_read_timeout 120s;
    }
}
