/* ============================================================
   صفحة "أداء الاختبار" (questions.html) — منقولة حرفيًا من معاينة التصميم المعتمدة
   basair-student-exam (styles.css)، بادئة sp-exam- لكل صنف لعزلها تمامًا عن باقي نظام sp-
   (رأس علوي خاص بالصفحة + بطاقة ملخّص جانبية لاصقة بعدّاد دائري وخريطة أسئلة + قائمة أسئلة
   رئيسية + نافذة تأكيد/نتيجة). الألوان تطابق --sp-basair/--sp-green/--sp-red-soft الحالية
   فعليًا (نفس القيم تمامًا بالمرجع الأصلي)، فلا حاجة لمتغيرات --exam-* منفصلة إلا لتظليل عدّاد
   الوقت عند اقتراب الانتهاء (--sp-exam-timer-accent، مضبوطة إنلاين على العنصر فقط، لا تُسرّب
   لأي عنصر آخر). حجم خط عنوان السؤال والإجابة كُبِّر عمدًا عن المرجع (طلب صريح).
   ============================================================ */
#studentPortal .sp-exam-app{ --sp-exam-timer-accent: var(--sp-basair); min-height:100vh; background:var(--sp-canvas,#f5f6f7); }

#studentPortal .sp-exam-header{ position:sticky; top:0; z-index:60; background:rgba(255,255,255,.96); border-bottom:1px solid var(--sp-line-strong); backdrop-filter:blur(12px); }
#studentPortal .sp-exam-header-inner{ width:min(1240px,calc(100% - 40px)); height:72px; margin:auto; display:flex; align-items:center; gap:24px; }
#studentPortal .sp-exam-brand{ width:148px; flex:0 0 auto; }
#studentPortal .sp-exam-brand img{ width:100%; height:auto; display:block; }
#studentPortal .sp-exam-copy{ padding-right:24px; border-right:1px solid var(--sp-line-strong); min-width:0; }
#studentPortal .sp-exam-copy span, #studentPortal .sp-exam-copy strong{ display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#studentPortal .sp-exam-copy span{ font-size:11px; color:var(--sp-muted); }
#studentPortal .sp-exam-copy strong{ font-size:14px; color:var(--sp-ink-soft); }
#studentPortal .sp-exam-header-status{ margin-right:auto; display:flex; align-items:center; gap:12px; }
#studentPortal .sp-exam-student-chip{ display:flex; align-items:center; gap:9px; min-width:190px; }
#studentPortal .sp-exam-student-chip>span{ width:38px; height:38px; display:grid; place-items:center; border-radius:50%; color:#fff; background:linear-gradient(145deg,var(--sp-basair-dark),var(--sp-basair)); font-weight:700; }
#studentPortal .sp-exam-student-chip small, #studentPortal .sp-exam-student-chip strong{ display:block; }
#studentPortal .sp-exam-student-chip small{ font-size:10px; color:var(--sp-muted); }
#studentPortal .sp-exam-student-chip strong{ font-size:13px; }
#studentPortal .sp-exam-mobile-timer{ display:none; direction:ltr; align-items:center; gap:7px; color:var(--sp-basair-dark); font-size:14px; }

#studentPortal .sp-exam-intro{ position:relative; overflow:hidden; background:#fff; border-bottom:1px solid var(--sp-line-strong); }
#studentPortal .sp-exam-intro-inner{ position:relative; z-index:1; width:min(1240px,calc(100% - 40px)); margin:auto; padding:34px 0; display:flex; align-items:center; justify-content:space-between; gap:44px; }
#studentPortal .sp-exam-eyebrow{ display:inline-flex; align-items:center; gap:8px; margin-bottom:3px; color:var(--sp-basair); font-size:12px; font-weight:700; }
#studentPortal .sp-exam-eyebrow i{ width:20px; height:2px; background:var(--sp-basair); }
#studentPortal .sp-exam-intro-inner h1{ margin:0 0 5px; font-size:27px; line-height:1.4; letter-spacing:0; }
#studentPortal .sp-exam-intro-inner p{ max-width:660px; margin:0; color:var(--sp-muted); font-size:14px; }
#studentPortal .sp-exam-facts{ margin:0; display:flex; align-items:stretch; border:1px solid var(--sp-line-strong); background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 4px 16px rgba(35,41,48,.04); }
#studentPortal .sp-exam-facts div{ min-width:118px; padding:12px 16px; border-left:1px solid var(--sp-line-strong); }
#studentPortal .sp-exam-facts div:last-child{ border-left:0; }
#studentPortal .sp-exam-facts dt{ display:flex; align-items:center; gap:6px; margin:0; color:var(--sp-muted); font-size:11px; font-weight:400; }
#studentPortal .sp-exam-facts dt i{ color:var(--sp-basair); }
#studentPortal .sp-exam-facts dd{ margin:3px 0 0; font-size:13px; font-weight:700; }

#studentPortal .sp-exam-layout{ width:min(1240px,calc(100% - 40px)); margin:28px auto 70px; display:grid; grid-template-columns:minmax(0,1fr) 286px; grid-template-areas:"questions summary"; gap:24px; align-items:start; }
#studentPortal .sp-exam-overview{ grid-area:summary; position:sticky; top:96px; padding:20px; background:#fff; border:1px solid var(--sp-line-strong); border-radius:8px; box-shadow:0 12px 34px rgba(35,41,48,.08); overflow:hidden; }
#studentPortal .sp-exam-overview-heading{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:15px; border-bottom:1px solid var(--sp-line-strong); }
#studentPortal .sp-exam-overview-heading span, #studentPortal .sp-exam-overview-heading h2{ display:block; margin:0; }
#studentPortal .sp-exam-overview-heading span{ color:var(--sp-muted); font-size:10px; }
#studentPortal .sp-exam-overview-heading h2{ font-size:16px; }
#studentPortal .sp-exam-overview-heading>i{ width:38px; height:38px; display:grid; place-items:center; border-radius:7px; color:var(--sp-basair); background:var(--sp-red-soft); font-size:19px; }
#studentPortal .sp-exam-timer-block{ display:grid; place-items:center; padding:20px 0 15px; }
#studentPortal .sp-exam-timer-ring{ --sp-exam-timer-progress:100%; width:142px; aspect-ratio:1; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--sp-exam-timer-accent) var(--sp-exam-timer-progress), #eceff2 0); position:relative; transition:background .4s linear; }
#studentPortal .sp-exam-timer-ring::before{ content:""; position:absolute; inset:8px; border-radius:50%; background:#fff; }
#studentPortal .sp-exam-timer-ring>div{ position:relative; text-align:center; }
#studentPortal .sp-exam-timer-ring span, #studentPortal .sp-exam-timer-ring strong{ display:block; }
#studentPortal .sp-exam-timer-ring span{ color:var(--sp-muted); font-size:10px; }
#studentPortal .sp-exam-timer-ring strong{ direction:ltr; font-family:"Readex Pro",sans-serif; font-size:25px; line-height:1.25; color:var(--sp-basair-dark); font-weight:700; font-variant-numeric:tabular-nums; }
#studentPortal .sp-exam-progress-block{ padding:14px 0; border-top:1px solid var(--sp-line-strong); border-bottom:1px solid var(--sp-line-strong); }
#studentPortal .sp-exam-progress-copy{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; font-size:12px; }
#studentPortal .sp-exam-progress-copy span{ color:var(--sp-muted); }
#studentPortal .sp-exam-progress-copy strong{ font-size:12px; }
#studentPortal .sp-exam-progress-track{ height:6px; border-radius:6px; overflow:hidden; background:#eceff2; }
#studentPortal .sp-exam-progress-track i{ display:block; width:0; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--sp-basair-dark),var(--sp-basair)); transition:width .25s ease; }
#studentPortal .sp-exam-navigator-block{ padding:14px 0 12px; }
#studentPortal .sp-exam-navigator-heading{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; color:var(--sp-ink-soft); font-size:12px; font-weight:700; }
#studentPortal .sp-exam-icon-btn{ width:34px; height:34px; display:inline-grid; place-items:center; border:1px solid var(--sp-line-strong); border-radius:6px; background:#fff; color:var(--sp-muted); }
#studentPortal .sp-exam-icon-btn:hover{ color:var(--sp-basair); border-color:#d9b8bb; background:var(--sp-red-soft); }
#studentPortal .sp-exam-question-map{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
#studentPortal .sp-exam-question-map button{ aspect-ratio:1; min-width:0; border:1px solid var(--sp-line-strong); border-radius:6px; background:#fff; color:var(--sp-muted); font-size:12px; font-weight:700; transition:.18s; }
#studentPortal .sp-exam-question-map button:hover, #studentPortal .sp-exam-question-map button.current{ border-color:var(--sp-basair); color:var(--sp-basair); box-shadow:0 0 0 2px rgba(181,38,44,.08); }
#studentPortal .sp-exam-question-map button.answered{ border-color:var(--sp-green); background:var(--sp-green); color:#fff; }
#studentPortal .sp-exam-question-map button.review{ border-color:#dba74f; background:#fff4df; color:#a76a14; }
#studentPortal .sp-exam-map-legend{ display:flex; flex-wrap:wrap; gap:7px 12px; margin-top:10px; color:var(--sp-muted); font-size:9.5px; }
#studentPortal .sp-exam-map-legend span{ display:flex; align-items:center; gap:5px; }
#studentPortal .sp-exam-map-legend i{ width:7px; height:7px; border-radius:2px; border:1px solid var(--sp-line-strong); background:#fff; }
#studentPortal .sp-exam-map-legend i.sp-exam-legend-answered{ border-color:var(--sp-green); background:var(--sp-green); }
#studentPortal .sp-exam-map-legend i.sp-exam-legend-review{ border-color:#dba74f; background:#fff4df; }
#studentPortal .sp-exam-submission-note{ display:flex; align-items:flex-start; gap:7px; margin:0 0 14px; padding:10px; border-radius:6px; color:var(--sp-ink-soft); background:var(--sp-canvas,#f5f6f7); font-size:10.5px; line-height:1.6; }
#studentPortal .sp-exam-submission-note i{ color:var(--sp-green); font-size:15px; }
#studentPortal .sp-exam-submit-btn{ position:relative; z-index:1; width:100%; min-height:43px; display:flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:6px; background:linear-gradient(135deg,var(--sp-basair-dark),var(--sp-basair)); color:#fff; font-weight:700; box-shadow:0 8px 20px rgba(141,29,34,.18); }
#studentPortal .sp-exam-submit-btn:hover{ filter:brightness(.96); }
#studentPortal .sp-exam-submit-btn:disabled{ opacity:.6; cursor:not-allowed; filter:none; }

#studentPortal .sp-exam-questions-region{ /*grid-area:questions;*/ min-width:0; }
#studentPortal .sp-exam-questions-heading{ display:flex; align-items:end; justify-content:space-between; gap:20px; margin:0 0 15px; }
#studentPortal .sp-exam-section-kicker{ display:block; margin-bottom:2px; color:var(--sp-basair); font-size:11px; font-weight:700; }
#studentPortal .sp-exam-questions-heading h2{ margin:0; font-size:21px; }
#studentPortal .sp-exam-completion-copy{ color:var(--sp-muted); font-size:12px; }
#studentPortal .sp-exam-validation-alert{ display:flex; align-items:flex-start; gap:10px; margin-bottom:14px; padding:12px 14px; border:1px solid #ead09e; border-radius:7px; background:#fff4df; color:#7f5717; font-size:12px; }
#studentPortal .sp-exam-validation-alert i{ font-size:17px; }
#studentPortal .sp-exam-questions-list{ display:grid; gap:14px; }

#studentPortal .sp-exam-question-card{ position:relative; padding:21px 22px; background:#fff; border:1px solid var(--sp-line-strong); border-radius:8px; box-shadow:0 5px 18px rgba(35,41,48,.045); scroll-margin-top:98px; transition:border-color .2s, box-shadow .2s; }
#studentPortal .sp-exam-question-card:focus-within{ border-color:#d8b1b4; box-shadow:0 8px 24px rgba(80,35,38,.08); }
#studentPortal .sp-exam-question-card.needs-answer{ animation:sp-exam-alert 1.25s ease; border-color:#d6a54d; box-shadow:0 0 0 3px rgba(219,167,79,.13); }
#studentPortal .sp-exam-question-card.correct{ border-color:#b8dccd; }
#studentPortal .sp-exam-question-card.wrong{ border-color:#e3b8bb; }
#studentPortal .sp-exam-question-head{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:12px; }
#studentPortal .sp-exam-question-number{ display:flex; align-items:center; gap:8px; color:var(--sp-basair); font-size:12px; font-weight:700; }
#studentPortal .sp-exam-question-number b{ width:29px; height:29px; display:grid; place-items:center; border-radius:6px; background:var(--sp-red-soft); font-size:12px; }
#studentPortal .sp-exam-review-btn{ display:flex; align-items:center; gap:6px; border:0; background:transparent; color:var(--sp-muted); font-size:10.5px; padding:5px 0; }
#studentPortal .sp-exam-review-btn:hover, #studentPortal .sp-exam-review-btn.active{ color:#a76a14; }
#studentPortal .sp-exam-review-btn i{ font-size:15px; }
/* حجم خط عنوان السؤال والإجابة مُكبَّر عمدًا عن المرجع الأصلي (16px/13.5px) بطلب صريح */
#studentPortal .sp-exam-question-title{ margin:0 0 16px; font-size:19.5px; line-height:1.9; font-weight:700; text-align:right; }

#studentPortal .sp-exam-answer-option:hover{ border-color:#d8b1b4; background:#fffafa; }
#studentPortal .sp-exam-answer-option:has(input:checked){ border-color:var(--sp-basair); background:var(--sp-red-soft); box-shadow:0 0 0 2px rgba(181,38,44,.07); }

#studentPortal .sp-exam-answer-option input:disabled{ cursor:not-allowed; }

#studentPortal .sp-exam-question-result{ display:flex; align-items:center; gap:7px; margin-top:12px; padding-top:11px; border-top:1px solid var(--sp-line-strong); font-size:12px; font-weight:700; }

#studentPortal .sp-exam-loading{ min-height:500px; pointer-events:none; }

#studentPortal .sp-exam-loading::before{ content:""; position:absolute; z-index:5; inset:20px; border-radius:6px; background:linear-gradient(90deg,#eef0f2 25%,#f8f9fa 38%,#eef0f2 52%); background-size:400% 100%; animation:sp-exam-shimmer 1.25s infinite; }

#studentPortal .sp-exam-modal-backdrop{ position:fixed; z-index:100; inset:0; display:grid; place-items:center; padding:18px; background:rgba(24,28,33,.58); backdrop-filter:blur(4px); }

#studentPortal .sp-exam-dialog-summary strong{ display:block; margin-top:2px; color:var(--sp-ink); font-size:13px; }
#studentPortal .sp-exam-dialog-actions{ display:flex; gap:9px; }

#studentPortal .sp-exam-primary-btn, #studentPortal .sp-exam-secondary-btn{ padding:8px 12px; min-height:43px; border-radius:6px; font-weight:700; }
