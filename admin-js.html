function pdfaiShowError(box, msg) {
  if (!box) return;
  box.hidden = false;
  var span = box.querySelector('span');
  if (span) span.textContent = msg;
}

function pdfaiFriendlyError(err) {
  if (err && err.message) return err.message;
  return 'حدث خطأ غير متوقع. حاول مرة أخرى.';
}

/** ينقل نموذج "تحليل جديد" (عنصر دائم واحد) فعليًا داخل المودال المشترك ويفتحه. */
function pdfaiOpenNewModal() {
  var panel = document.getElementById('pdfaiUploadPanel');
  var modalBody = document.getElementById('modalBody');
  if (!panel || !modalBody) return;

  var t = document.getElementById('modalTitle'); if (t) t.textContent = 'تحليل جديد';
  var e = document.getElementById('modalEyebrow'); if (e) e.textContent = 'تحليل ملف بالذكالي';
  var f = document.getElementById('modalFooter'); if (f) f.innerHTML = '';

  if (panel.parentElement !== modalBody) { modalBody.innerHTML = ''; modalBody.appendChild(panel); }
  panel.hidden = false;

  var m = document.getElementById('actionModal'); if (m) m.hidden = false;
  var actionModalEl = m ? m.querySelector('.action-modal') : null;
  if (actionModalEl) { actionModalEl.classList.remove('wide'); actionModalEl.classList.add('medium-wide'); }
  refreshIcons();
}

async function pdfaiStart() {
  var errBox = document.getElementById('pdfaiError');
  if (errBox) errBox.hidden = true;

  var fileInput = document.getElementById('pdfaiFileInput');
  var file = fileInput && fileInput.files && fileInput.files[0];
  if (!file) return pdfaiShowError(errBox, 'الرجاء اختيار ملف PDF.');
  if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) return pdfaiShowError(errBox, 'الملف يجب أن يكون بصيغة PDF.');
  if (file.size > 25 * 1024 * 1024) return pdfaiShowError(errBox, 'حجم الملف يتجاوز 25 ميجابايت.');

  var user = firebase.auth().currentUser;
  if (!user) return pdfaiShowError(errBox, 'يجب تسجيل الدخول لاستخدام هذه الميزة.');

  var questionCount = parseInt(document.getElementById('pdfaiQuestionCount').value, 10);
  if (!isFinite(questionCount) || questionCount < 5 || questionCount > 50) return pdfaiShowError(errBox, 'عدد الأسئلة يجب أن يكون بين 5 و50.');

  var withTree = !!document.querySelector('#pdfaiTogglesGroup [data-toggle="withTree"]').classList.contains('active');
  var consentToStore = !!document.querySelector('#pdfaiTogglesGroup [data-toggle="consentToStore"]').classList.contains('active');

  var startBtn = document.getElementById('pdfaiStartBtn');
  startBtn.disabled = true;
  startBtn.innerHTML = '<i data-icon="loader"></i>جارٍ رفع الملف...';
  refreshIcons();

  try {
    var safeName = file.name.replace(/[^\w؀-ۿ.\-]+/g, '_').slice(0, 120);
    var storagePath = 'uploads/' + user.uid + '/' + Date.now() + '_' + safeName;
    await pdfaiStorage().ref(storagePath).put(file, { contentType: 'application/pdf' });

    var startAnalysis = pdfaiFunctions().httpsCallable('startAnalysis');
    var res = await startAnalysis({
      storagePath: storagePath,
      originalName: file.name,
      questionCount: questionCount,
      difficulty: document.getElementById('pdfaiDifficulty').value,
      summaryLength: document.getElementById('pdfaiSummaryLength').value,
      withTree: withTree,
      userNotes: document.getElementById('pdfaiNotes').value,
      consentToStore: consentToStore
    });

    closeActionModal();
    document.getElementById('pdfaiProgressPanel').hidden = false;
    pdfaiSubscribe(res.data.jobId, withTree);
  } catch (err) {
    console.error(err);
    pdfaiShowError(errBox, pdfaiFriendlyError(err));
  } finally {
    startBtn.disabled = false;
    startBtn.innerHTML = '<i data-icon="sparkles"></i>ابدأ التحليل';
    refreshIcons();
  }
}

var PDFAI_STEPS_ = ['reading_file', 'building_summary', 'building_questions', 'awaiting_tree_image', 'building_files'];
var pdfaiTimerStart_ = null;
var pdfaiTimerInterval_ = null;

function pdfaiFormatElapsed(ms) {
  var totalSec = Math.floor(ms / 1000);
  var m = Math.floor(totalSec / 60);
  var s = totalSec % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function pdfaiStartTimer() {
  pdfaiStopTimer();
  pdfaiTimerStart_ = Date.now();
  var el = document.getElementById('pdfaiElapsed');
  if (el) el.textContent = '00:00';
  pdfaiTimerInterval_ = setInterval(function () {
    if (el) el.textContent = pdfaiFormatElapsed(Date.now() - pdfaiTimerStart_);
  }, 1000);
}

function pdfaiStopTimer() {
  if (pdfaiTimerInterval_) { clearInterval(pdfaiTimerInterval_); pdfaiTimerInterval_ = null; }
}

/** يحدّث أقسام الشريط (رمادي/نشِط نابض/أحمر مكتمل) حسب حالة المهمة الحالية. */
function pdfaiUpdateStepper(status, withTree) {
  var treeStepEl = document.getElementById('pdfaiStepTree');
  if (treeStepEl) treeStepEl.hidden = !withTree;

  var steps = PDFAI_STEPS_.filter(function (s) { return withTree || s !== 'awaiting_tree_image'; });
  var currentIndex = status === 'done' ? steps.length : steps.indexOf(status);

  document.querySelectorAll('#pdfaiStepper .pdfai-step').forEach(function (el) {
    var stepName = el.getAttribute('data-step');
    var idx = steps.indexOf(stepName);
    el.classList.remove('completed', 'active');
    if (idx === -1 || currentIndex === -1) return; // queued: كل الأقسام رمادية بعد
    if (idx < currentIndex) el.classList.add('completed');
    else if (idx === currentIndex) el.classList.add('active');
  });
}

function pdfaiSubscribe(jobId, withTree) {
  if (pdfaiUnsub_) { pdfaiUnsub_(); pdfaiUnsub_ = null; }
  pdfaiStartTimer();
  pdfaiUnsub_ = firebase.firestore().collection('analysisJobs').doc(jobId).onSnapshot(function (snap) {
    if (!snap.exists) return;
    var job = Object.assign({ id: jobId }, snap.data());
    pdfaiRenderProgress(job, withTree);
  }, function (err) {
    console.error(err);
    var errPanel = document.getElementById('pdfaiProgressError');
    var actions = document.getElementById('pdfaiProgressActions');
    if (errPanel) { errPanel.hidden = false; errPanel.querySelector('span').textContent = 'تعذّر متابعة حالة التحليل مباشرة. حدّث الصفحة للاطلاع على آخر حالة.'; }
    if (actions) actions.hidden = false;
    pdfaiStopTimer();
  });
}

function pdfaiRenderProgress(job, withTree) {
  if (job.status === 'error') {
    var errPanel = document.getElementById('pdfaiProgressError');
    var actions = document.getElementById('pdfaiProgressActions');
    if (errPanel) { errPanel.hidden = false; errPanel.querySelector('span').textContent = job.error || 'حدث خطأ أثناء المعالجة.'; }
    if (actions) actions.hidden = false;
    if (pdfaiUnsub_) { pdfaiUnsub_(); pdfaiUnsub_ = null; }
    pdfaiStopTimer();
    return;
  }

  pdfaiUpdateStepper(job.status, withTree);

  if (job.status === 'awaiting_tree_image' && job.result && job.result.tree) {
    pdfaiBuildTree(job);
    return;
  }

  if (job.status === 'done') {
    pdfaiUpdateStepper('done', withTree);
    pdfaiStopTimer();
    if (pdfaiUnsub_) { pdfaiUnsub_(); pdfaiUnsub_ = null; }
    pdfaiRenderResults(job);
    return;
  }
}

async function pdfaiBuildTree(job) {
  if (pdfaiTreeBuildStarted_ === job.id) return;
  pdfaiTreeBuildStarted_ = job.id;

  var box = document.getElementById('pdfaiTreeCaptureBox');
  var container = document.getElementById('pdfaiTreeContainer');
  if (box) box.hidden = false;

  try {
    if (!window.BasaerTree) throw new Error('تعذّر تحميل أداة رسم التشجير.');
    await BasaerTree.render(container, job.result.tree);
    var blob = await BasaerTree.toPng(job.result.tree, 2);

    var user = firebase.auth().currentUser;
    var treePath = 'trees/' + user.uid + '/' + job.id + '.png';
    await pdfaiStorage().ref(treePath).put(blob, { contentType: 'image/png' });

    await firebase.firestore().collection('analysisJobs').doc(job.id).update({
      status: 'building_files',
      treeImagePath: treePath
    });
  } catch (err) {
    console.error(err);
    pdfaiTreeBuildStarted_ = null;
    var errPanel = document.getElementById('pdfaiProgressError');
    var actions = document.getElementById('pdfaiProgressActions');
    if (errPanel) { errPanel.hidden = false; errPanel.querySelector('span').textContent = 'تعذّر بناء صورة تشجير الأفكار: ' + (err && err.message || err); }
    if (actions) actions.hidden = false;
  }
}

function pdfaiRenderResults(job) {
  document.getElementById('pdfaiProgressPanel').hidden = true;
  document.getElementById('pdfaiResultsPanel').hidden = false;
  pdfaiLoadHistory();

  var result = job.result || {};
  var files = job.files || {};

  var usageNote = document.getElementById('pdfaiUsageNote');
  if (usageNote) {
    if (job.usage) {
      var total = (job.usage.inputTokens || 0) + (job.usage.outputTokens || 0);
      usageNote.textContent = 'استهلاك هذا التحليل: ' + total.toLocaleString('ar-EG') + ' توكن (' +
        (job.usage.inputTokens || 0).toLocaleString('ar-EG') + ' إدخال + ' +
        (job.usage.outputTokens || 0).toLocaleString('ar-EG') + ' إخراج) — تكلفة تقديرية ~$' +
        (job.usage.costUsd || 0).toFixed(3);
    } else {
      usageNote.textContent = '';
    }
  }

  var warnBox = document.getElementById('pdfaiWarnings');
  if (warnBox) {
    warnBox.innerHTML = (job.warnings || []).map(function (w) {
      return '<div class="warning-note" style="margin-bottom:10px;"><i data-icon="triangle-alert"></i><span>' + escapeHtml(w) + '</span></div>';
    }).join('');
  }

  var dlMap = [
    { key: 'word', cls: '', icon: 'file-text', label: 'ملف Word (الملخص)' },
    { key: 'pdf', cls: 'pdf', icon: 'file-pdf', label: 'ملف PDF (الملخص)' },
    { key: 'excel', cls: 'excel', icon: 'file-spreadsheet', label: 'ملف Excel (الأسئلة)' },
    { key: 'tree', cls: '', icon: 'git-fork', label: 'صورة تشجير الأفكار' }
  ];
  var dlBox = document.getElementById('pdfaiDownloads');
  if (dlBox) {
    var rows = dlMap.filter(function (d) { return files[d.key] && files[d.key].url; }).map(function (d) {
      return '<div class="export-history-item"><span class="export-file-icon ' + d.cls + '"><i data-icon="' + d.icon + '"></i></span>' +
        '<div><strong>' + d.label + '</strong><small>صالح 24 ساعة من وقت الاكتمال</small></div>' +
        '<a class="icon-button" href="' + files[d.key].url + '" target="_blank" rel="noopener" title="تنزيل"><i data-icon="download"></i></a></div>';
    });
    dlBox.innerHTML = rows.join('') || '<p class="empty-note">لا توجد ملفات جاهزة للتنزيل.</p>';
  }

  var s = result.summary || {};
  var summaryHtml = '<div style="padding:16px;">';
  summaryHtml += '<h3 style="margin:0 0 8px;">' + escapeHtml(result.document_title || '') + '</h3>';
  if (s.introduction) summaryHtml += '<p>' + escapeHtml(s.introduction) + '</p>';
  if (Array.isArray(s.main_points) && s.main_points.length) {
    summaryHtml += '<ul>' + s.main_points.map(function (p) { return '<li>' + escapeHtml(p) + '</li>'; }).join('') + '</ul>';
  }
  (s.sections || []).forEach(function (sec, i) {
    summaryHtml += '<h4>' + (i + 1) + '. ' + escapeHtml(sec.title) + '</h4><p>' + escapeHtml(sec.content) + '</p>';
  });
  if (s.conclusion) summaryHtml += '<p><strong>الخاتمة:</strong> ' + escapeHtml(s.conclusion) + '</p>';
  if (Array.isArray(result.key_terms) && result.key_terms.length) {
    summaryHtml += '<h4>المصطلحات المهمة</h4><ul>' + result.key_terms.map(function (t) {
      return '<li><strong>' + escapeHtml(t.term) + ':</strong> ' + escapeHtml(t.definition) + '</li>';
    }).join('') + '</ul>';
  }
  summaryHtml += '</div>';
  var summaryBox = document.getElementById('pdfaiSummaryBox');
  if (summaryBox) summaryBox.innerHTML = summaryHtml;

  var qBox = document.getElementById('pdfaiQuestionsBox');
  if (qBox) {
    qBox.innerHTML = (result.questions || []).map(function (q) {
      var opts = [['A', q.option_a], ['B', q.option_b], ['C', q.option_c], ['D', q.option_d]];
      var optsHtml = opts.map(function (o) {
        var isCorrect = o[0] === q.correct_answer;
        return '<div style="padding:6px 10px;border-radius:6px;' + (isCorrect ? 'background:var(--primary-soft);color:var(--primary-dark);font-weight:600;' : '') + '">' + o[0] + '. ' + escapeHtml(o[1]) + '</div>';
      }).join('');
      return '<div class="panel" style="box-shadow:none;border:1px solid var(--line);margin-bottom:10px;padding:14px;">' +
        '<strong>' + q.number + '. ' + escapeHtml(q.question) + '</strong>' +
        '<div style="display:grid;gap:4px;margin:8px 0;">' + optsHtml + '</div>' +
        '<small style="color:var(--muted);">' + escapeHtml(q.explanation || '') + '</small></div>';
    }).join('');
  }

  refreshIcons();
}

var pdfaiHistoryData_ = [];
var pdfaiHistoryPage_ = 1;
var PDFAI_HISTORY_PAGE_SIZE_ = 50;

var PDFAI_STATUS_BADGE_ = {
  done: { cls: 'done', label: 'مكتمل' },
  error: { cls: 'rejected', label: 'خطأ' },
  queued: { cls: 'processing', label: 'قيد الانتظار' },
  reading_file: { cls: 'processing', label: 'جارٍ التحليل' },
  building_summary: { cls: 'processing', label: 'جارٍ التحليل' },
  building_questions: { cls: 'processing', label: 'جارٍ التحليل' },
  awaiting_tree_image: { cls: 'processing', label: 'جارٍ التحليل' },
  building_files: { cls: 'processing', label: 'جارٍ التحليل' }
};

function pdfaiLoadHistory() {
  var user = firebase.auth().currentUser;
  if (!user) return;
  firebase.firestore().collection('analysisJobs')
    .where('uid', '==', user.uid).orderBy('createdAt', 'desc').limit(100).get()
    .then(function (snap) {
      pdfaiHistoryData_ = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      pdfaiHistoryPage_ = 1;
      pdfaiRenderHistoryTable();
    })
    .catch(function (err) {
      console.error('pdfai history', err);
      var tbody = document.getElementById('pdfaiHistoryBody');
      if (tbody) tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--danger)">تعذّر تحميل السجل</td></tr>';
    });
}

function pdfaiRenderHistoryTable() {
  var tbody = document.getElementById('pdfaiHistoryBody');
  if (!tbody) return;

  var visEl = document.getElementById('pdfaiHistoryVisibleCount');
  if (visEl) visEl.textContent = pdfaiHistoryData_.length;

  renderPagination('pdfaiHistoryPagination', pdfaiHistoryData_.length, PDFAI_HISTORY_PAGE_SIZE_, pdfaiHistoryPage_, function (page) {
    pdfaiHistoryPage_ = page; pdfaiRenderHistoryTable();
  });

  if (!pdfaiHistoryData_.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--muted)">لا توجد تحليلات سابقة بعد</td></tr>';
    return;
  }

  var totalPages = Math.max(1, Math.ceil(pdfaiHistoryData_.length / PDFAI_HISTORY_PAGE_SIZE_));
  if (pdfaiHistoryPage_ > totalPages) pdfaiHistoryPage_ = totalPages;
  var startIdx = (pdfaiHistoryPage_ - 1) * PDFAI_HISTORY_PAGE_SIZE_;
  var pageData = pdfaiHistoryData_.slice(startIdx, startIdx + PDFAI_HISTORY_PAGE_SIZE_);
  var now = Date.now();

  tbody.innerHTML = pageData.map(function (job, iOnPage) {
    var i = startIdx + iOnPage;
    var badge = PDFAI_STATUS_BADGE_[job.status] || { cls: 'processing', label: job.status || '—' };
    var createdMs = job.createdAt && job.createdAt.toMillis ? job.createdAt.toMillis() : null;
    var dateStr = createdMs ? new Date(createdMs).toLocaleString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
    var title = (job.result && job.result.document_title) || job.originalName || '—';
    var qCount = job.result && Array.isArray(job.result.questions) ? job.result.questions.length : '—';
    var cost = job.usage && typeof job.usage.costUsd === 'number' ? '$' + job.usage.costUsd.toFixed(3) : '—';

    var downloadsHtml = '—';
    if (job.status === 'done' && job.files) {
      var expired = job.files.pdf && job.files.pdf.expiresAt && now > job.files.pdf.expiresAt;
      if (expired) {
        downloadsHtml = '<span style="color:var(--muted);font-size:calc(9px + var(--font-adjust));">انتهت الصلاحية</span>';
      } else {
        var dlKeys = [['word', 'file-text'], ['pdf', 'file-pdf'], ['excel', 'file-spreadsheet'], ['tree', 'git-fork']];
        downloadsHtml = '<div class="table-actions">' + dlKeys.filter(function (k) { return job.files[k[0]] && job.files[k[0]].url; }).map(function (k) {
          return '<a class="icon-button" href="' + job.files[k[0]].url + '" target="_blank" rel="noopener" title="' + k[0] + '"><i data-icon="' + k[1] + '"></i></a>';
        }).join('') + '</div>';
      }
    }

    return '<tr>' +
      '<td data-label="#">' + (i + 1) + '</td>' +
      '<td data-label="التاريخ">' + dateStr + '</td>' +
      '<td data-label="الملف">' + escapeHtml(title) + '</td>' +
      '<td data-label="الحالة"><span class="state-badge ' + badge.cls + '">' + badge.label + '</span></td>' +
      '<td data-label="الأسئلة">' + qCount + '</td>' +
      '<td data-label="التكلفة">' + cost + '</td>' +
      '<td data-label="تنزيل">' + downloadsHtml + '</td>' +
    '</tr>';
  }).join('');

  refreshIcons();
}

function pdfaiReset() {
  if (pdfaiUnsub_) { pdfaiUnsub_(); pdfaiUnsub_ = null; }
  pdfaiTreeBuildStarted_ = null;
  pdfaiStopTimer();

  document.getElementById('pdfaiProgressPanel').hidden = true;
  document.getElementById('pdfaiResultsPanel').hidden = true;

  var fileInput = document.getElementById('pdfaiFileInput'); if (fileInput) fileInput.value = '';
  var fileNameEl = document.getElementById('pdfaiFileName');
  if (fileNameEl) { fileNameEl.textContent = 'لم يُحدَّد أي ملف بعد'; fileNameEl.classList.remove('has-file'); }
  var notes = document.getElementById('pdfaiNotes'); if (notes) notes.value = '';
  document.querySelectorAll('#pdfaiTogglesGroup .staff-perm-btn').forEach(function (b) { b.classList.remove('active'); });

  var treeBox = document.getElementById('pdfaiTreeCaptureBox'); if (treeBox) treeBox.hidden = true;
  var treeContainer = document.getElementById('pdfaiTreeContainer'); if (treeContainer) treeContainer.innerHTML = '';
  var errPanel = document.getElementById('pdfaiProgressError'); if (errPanel) errPanel.hidden = true;
  var actions = document.getElementById('pdfaiProgressActions'); if (actions) actions.hidden = true;
  var elapsedEl = document.getElementById('pdfaiElapsed'); if (elapsedEl) elapsedEl.textContent = '00:00';
  document.querySelectorAll('#pdfaiStepper .pdfai-step').forEach(function (el) { el.classList.remove('completed', 'active'); });

  refreshIcons();
}

</script>
