// فالتعطيل هنا تجربة استخدام لا الحماية الفعلية.
function isBroadcastTargetBlockedByProvider_(targetType) {
  return whatsappProviderState_.loaded === true && whatsappProviderState_.provider !== 'meta' && targetType !== 'groups';
}

function applyBroadcastTargetAvailability_() {
  var group = document.getElementById('broadcastTargetTypeGroup');
  if (!group) return;
  ['students', 'staff'].forEach(function (type) {
    var btn = group.querySelector('button[data-target-type="' + type + '"]');
    if (!btn) return;
    var blocked = isBroadcastTargetBlockedByProvider_(type);
    btn.disabled = blocked;
    btn.title = blocked ? BROADCAST_INDIVIDUALS_DISABLED_NOTE_ : '';
  });
}

// تُستدعى فقط عند وصول/تغيّر المزوّد أثناء وقوف المسؤول على تبويب الحملة (لا عند فتح التبويب؛ فتحه
// تعالجه loadBroadcastRecipients_ بصمت): لو كانت فئة الطلاب/الموظفين محدَّدة والمزوّد Fonnte،
// ننبّه ونعيد التحميل، فتنقله loadBroadcastRecipients_ إلى "مجموعات" وتزامن الواجهة كلها.
function enforceBroadcastTargetForProvider_() {
  if (messagesActiveTab_ === 'broadcast' && isBroadcastTargetBlockedByProvider_(broadcastTargetType_)) {
    alertMSG(BROADCAST_INDIVIDUALS_DISABLED_NOTE_, 'info');
    loadBroadcastRecipients_();
  }
}

function getFirebaseIdTokenForSensitiveAction_(onSuccess, onFailure) {
  try {
    var authUser = firebase.auth().currentUser;
    if (!authUser) { onFailure('جلسة الدخول غير متاحة؛ أعد تسجيل الدخول'); return; }
    authUser.getIdToken(false).then(onSuccess).catch(function () { onFailure('تعذّر التحقق من جلسة الدخول؛ أعد المحاولة'); });
  } catch (err) {
    onFailure('تعذّر التحقق من جلسة الدخول؛ أعد تسجيل الدخول');
  }
}

function loadMessagesManagementView() {
  if (!messagesControlsBound_) {
    messagesControlsBound_ = true;
    setupMessagesTabControls_();
    setupWhatsAppProviderControls_();
    setupBroadcastControls_();
    setupFcmBroadcastControls_();
    setupMessagesStatusChannelControls_();
  }
  setRouteLoading('messages', true);
  loadWhatsAppProviderSettings_();
  activateMessagesTab_(messagesActiveTab_ || 'templates');
  setRouteLoading('messages', false);
}

function setupWhatsAppProviderControls_() {
  var group = document.getElementById('whatsappProviderSwitch');
  if (!group) return;
  group.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-whatsapp-provider]');
    if (!btn || btn.disabled) return;
    var provider = btn.getAttribute('data-whatsapp-provider');
    if (!whatsappProviderState_.canChange || provider === whatsappProviderState_.provider) return;
    var label = provider === 'meta' ? 'Meta الرسمي' : 'Fonnte';
    Swal.fire({
      title: 'تغيير مزوّد واتساب',
      text: provider === 'meta'
        ? 'هل تريد استخدام ' + label + ' للحملات الجديدة؟ الحملات الجارية تحتفظ بمزوّدها الحالي.'
        : 'اختيار ' + label + ' يقصر الإرسال الجماعي على مجموعات واتساب، ويُعطّل الإرسال إلى الطلاب والموظفين إلى أن تعود إلى Meta. الحملات الجارية أو المجدولة تكمل بمزوّدها الحالي. هل تريد المتابعة؟',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'تغيير المزوّد',
      cancelButtonText: 'إلغاء'
    }).then(function (answer) {
      if (!answer.isConfirmed) return;
      group.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
      getFirebaseIdTokenForSensitiveAction_(function (firebaseIdToken) {
        google.script.run.withSuccessHandler(function (res) {
          if (!res || res.error || !res.ok) {
            alertMSG((res && res.message) || 'تعذّر تغيير مزوّد واتساب', 'error');
            renderWhatsAppProviderState_();
            if (res && res.code === 'META_NOT_CONFIGURED') openMetaWhatsAppSettings_();
            return;
          }
          whatsappProviderState_.provider = res.provider;
          renderWhatsAppProviderState_();
          enforceBroadcastTargetForProvider_();
          alertMSG(provider === 'meta' ? 'تم اعتماد ' + label + ' للحملات الجديدة' : 'تم اعتماد ' + label + '، والإرسال الجماعي يقتصر الآن على المجموعات', 'success');
        }).withFailureHandler(function (err) {
          alertMSG('تعذّر تغيير مزوّد واتساب: ' + err, 'error');
          renderWhatsAppProviderState_();
        }).setWhatsAppProvider(getCurrentUserCpr(), provider, firebaseIdToken);
      }, function (message) {
        alertMSG(message, 'error');
        renderWhatsAppProviderState_();
      });
    });
  });
}

function loadWhatsAppProviderSettings_() {
  var hint = document.getElementById('whatsappProviderHint');
  if (hint) hint.textContent = 'جاري تحميل المزوّد الحالي...';
  google.script.run.withSuccessHandler(function (res) {
    if (!res || res.error) {
      if (hint) hint.textContent = (res && res.message) || 'تعذّر تحميل إعداد المزوّد';
      return;
    }
    res.loaded = true;
    whatsappProviderState_ = res;
    renderWhatsAppProviderState_();
    enforceBroadcastTargetForProvider_();
  }).withFailureHandler(function () {
    if (hint) hint.textContent = 'تعذّر تحميل إعداد المزوّد؛ لم يتغير أي إعداد.';
  }).getWhatsAppProviderSettings(getCurrentUserCpr());
}

function renderWhatsAppProviderState_() {
  var state = whatsappProviderState_ || {};
  var provider = state.provider === 'meta' ? 'meta' : 'fonnte';
  var group = document.getElementById('whatsappProviderSwitch');
  if (group) group.querySelectorAll('button[data-whatsapp-provider]').forEach(function (btn) {
    var active = btn.getAttribute('data-whatsapp-provider') === provider;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-checked', String(active));
    btn.disabled = !state.canChange;
  });

  var hint = document.getElementById('whatsappProviderHint');
  if (hint) {
    hint.textContent = provider === 'meta'
      ? 'الحملات الجديدة تستخدم WhatsApp Cloud API مباشرةً عبر Meta' + (state.metaConfigured ? '.' : ' — الإعداد غير مكتمل.')
      : 'مع Fonnte يقتصر الإرسال الجماعي على مجموعات واتساب؛ الإرسال للطلاب والموظفين يُتاح مع Meta. ' + (state.canChange ? 'يمكنك التبديل إلى Meta بعد اكتمال إعداده.' : 'التغيير متاح لـSuper Admin فقط.');
  }
  var settingsBtn = document.getElementById('metaWhatsappSettingsBtn');
  if (settingsBtn) settingsBtn.hidden = !state.canChange;
  var metaSettings = document.getElementById('broadcastMetaTemplateSettings');
  if (metaSettings) metaSettings.hidden = provider !== 'meta';
  var submitBtn = document.getElementById('submitMetaTemplateBtn');
  if (submitBtn) submitBtn.hidden = provider !== 'meta' || !state.canChange;
  var checkBtn = document.getElementById('checkMetaTemplateStatusBtn');
  if (checkBtn) checkBtn.hidden = provider !== 'meta' || !state.canChange;
  var categoryField = document.getElementById('broadcastMetaCategoryField');
  if (categoryField) categoryField.hidden = provider !== 'meta' || !state.canChange;
  var metaAdmin = document.getElementById('broadcastMetaTemplateAdmin');
  if (metaAdmin) metaAdmin.hidden = provider !== 'meta' || !state.canChange;
  var providerBadge = document.getElementById('broadcastProviderBadge');
  if (providerBadge) providerBadge.innerHTML = '<i class="fab fa-whatsapp"></i>واتساب عبر ' + (provider === 'meta' ? 'Meta الرسمي' : 'Fonnte');

  var groupTargetBtn = document.querySelector('#broadcastTargetTypeGroup button[data-target-type="groups"]');
  if (groupTargetBtn) {
    groupTargetBtn.disabled = provider === 'meta';
    groupTargetBtn.title = provider === 'meta' ? 'Meta Cloud API الرسمي لا يدعم مجموعات واتساب' : '';
  }
  if (provider === 'meta' && broadcastTargetType_ === 'groups') {
    var studentsBtn = document.querySelector('#broadcastTargetTypeGroup button[data-target-type="students"]');
    if (studentsBtn) studentsBtn.click();
  }
  syncMetaTemplateComposer_();
  if (provider === 'meta' && state.metaConfigured && messagesActiveTab_ === 'broadcast') {
    loadApprovedMetaTemplates_(false);
  } else if (provider === 'meta' && !state.metaConfigured) {
    var metaTemplateSelect = document.getElementById('broadcastMetaTemplateSelect');
    var metaTemplateHelp = document.getElementById('broadcastMetaTemplateHelp');
    if (metaTemplateSelect) {
      metaTemplateSelect.disabled = true;
      metaTemplateSelect.innerHTML = '<option value="">أكمل إعداد Meta أولًا</option>';
    }
    if (metaTemplateHelp) metaTemplateHelp.textContent = 'إعداد WhatsApp Cloud API غير مكتمل؛ تواصل مع Super Admin.';
    clearSelectedMetaTemplate_(true);
  }
  updateBroadcastCharacterCount_();
  updateBroadcastSendState_();
  updateBroadcastEstimate_();
  applyBroadcastTargetAvailability_();
  refreshIcons();
}

function openMetaWhatsAppSettings_() {
  if (!whatsappProviderState_.canChange) {
    alertMSG('إعداد Meta متاح لـSuper Admin فقط', 'error');
    return;
  }
  var meta = whatsappProviderState_.meta || {};
  var body = '<div class="form-grid">' +
    '<label class="field"><span>Graph API Version</span><input id="metaWaApiVersion" type="text" dir="ltr" value="' + escapeHtml(meta.apiVersion || 'v25.0') + '"></label>' +
    '<label class="field"><span>Phone Number ID</span><input id="metaWaPhoneNumberId" type="text" inputmode="numeric" dir="ltr" value="' + escapeHtml(meta.phoneNumberId || '') + '"></label>' +
    '<label class="field"><span>WhatsApp Business Account ID</span><input id="metaWaBusinessAccountId" type="text" inputmode="numeric" dir="ltr" value="' + escapeHtml(meta.businessAccountId || '') + '"></label>' +
    '<label class="field form-span-2"><span>System User Access Token</span><input id="metaWaAccessToken" type="password" dir="ltr" autocomplete="new-password" placeholder="' + (meta.hasAccessToken ? 'محفوظ بالفعل — اتركه فارغًا للاحتفاظ به' : 'ألصق الرمز هنا') + '"><small>يُحفظ في Script Properties ولا يُعاد عرضه أو تسجيله.</small></label>' +
    '</div>';
  var footer = '<button class="secondary-button" type="button" onclick="closeActionModal()">إلغاء</button>' +
    '<button class="primary-button" id="saveMetaWaSettingsBtn" type="button" onclick="saveMetaWhatsAppSettings_()"><i data-icon="save"></i>حفظ الإعدادات</button>';
  openActionModal('إعداد WhatsApp Cloud API', 'Meta الرسمي', body, footer, false);
}

function saveMetaWhatsAppSettings_() {
  var btn = document.getElementById('saveMetaWaSettingsBtn');
  if (btn) btn.disabled = true;
  var settings = {
    apiVersion: document.getElementById('metaWaApiVersion').value.trim(),
    phoneNumberId: document.getElementById('metaWaPhoneNumberId').value.trim(),
    businessAccountId: document.getElementById('metaWaBusinessAccountId').value.trim(),
    accessToken: document.getElementById('metaWaAccessToken').value.trim()
  };
  getFirebaseIdTokenForSensitiveAction_(function (firebaseIdToken) {
    google.script.run.withSuccessHandler(function (res) {
      if (!res || res.error || !res.ok) {
        if (btn) btn.disabled = false;
        alertMSG((res && res.message) || 'تعذّر حفظ إعداد Meta', 'error');
        return;
      }
      whatsappProviderState_.meta = res.meta;
      whatsappProviderState_.metaConfigured = res.metaConfigured;
      approvedMetaTemplatesLoaded_ = false;
      selectedMetaTemplate_ = null;
      closeActionModal();
      renderWhatsAppProviderState_();
      alertMSG('تم حفظ إعداد Meta بأمان', 'success');
    }).withFailureHandler(function (err) {
      if (btn) btn.disabled = false;
      alertMSG('تعذّر حفظ إعداد Meta: ' + err, 'error');
    }).saveMetaWhatsAppConfiguration(getCurrentUserCpr(), settings, firebaseIdToken);
  }, function (message) {
    if (btn) btn.disabled = false;
    alertMSG(message, 'error');
  });
}

function setMetaTemplateStatus_(message, tone) {
  var status = document.getElementById('metaTemplateStatusText');
  if (!status) return;
  status.textContent = message || '';
  status.className = 'meta-template-status' + (message && tone ? (' ' + tone) : '');
}

function metaTemplateKey_(template) {
  return template ? String(template.name || '') + '|' + String(template.language || '') : '';
}

function normalizeMetaTemplateBody_(value) {
  return String(value || '').replace(/\r\n/g, '\n').trim();
}

function syncMetaTemplateComposer_() {
  var isMeta = whatsappProviderState_.provider === 'meta';
  var messageInput = document.getElementById('broadcastMessageText');
  var summary = document.getElementById('metaTemplateSelectedSummary');
  var badge = document.getElementById('metaTemplateRequirementBadge');
  var nameInput = document.getElementById('broadcastMetaTemplateName');
  var languageInput = document.getElementById('broadcastMetaLanguageCode');

  if (selectedMetaTemplate_ && isMeta) {
    if (nameInput) nameInput.value = selectedMetaTemplate_.name || '';
    if (languageInput) languageInput.value = selectedMetaTemplate_.language || 'ar';
    if (messageInput && normalizeMetaTemplateBody_(messageInput.value) !== normalizeMetaTemplateBody_(selectedMetaTemplate_.body)) {
      broadcastMessageSyncing_ = true;
      messageInput.value = selectedMetaTemplate_.body || '';
      broadcastMessageSyncing_ = false;
    }
    if (messageInput) messageInput.readOnly = true;
    if (summary) summary.hidden = false;
    var selectedName = document.getElementById('metaTemplateSelectedName');
    var selectedDetails = document.getElementById('metaTemplateSelectedDetails');
    if (selectedName) selectedName.textContent = selectedMetaTemplate_.name || '';
    if (selectedDetails) selectedDetails.textContent = 'معتمد · اللغة: ' + (selectedMetaTemplate_.language || '—') + (selectedMetaTemplate_.category ? (' · ' + selectedMetaTemplate_.category) : '');
    if (badge) {
      badge.textContent = 'جاهز للإرسال';
      badge.classList.add('ready');
    }
  } else {
    if (nameInput) nameInput.value = '';
    if (languageInput) languageInput.value = '';
    if (messageInput) messageInput.readOnly = false;
    if (summary) summary.hidden = true;
    if (badge) {
      badge.textContent = 'اختيار مطلوب';
      badge.classList.remove('ready');
    }
  }
}

function selectMetaTemplate_(template) {
  selectedMetaTemplate_ = template || null;
  syncMetaTemplateComposer_();
  updateBroadcastCharacterCount_();
  updateBroadcastSendState_();
}

function clearSelectedMetaTemplate_(keepBody) {
  selectedMetaTemplate_ = null;
  var select = document.getElementById('broadcastMetaTemplateSelect');
  if (select) select.value = '';
  if (!keepBody) {
    var messageInput = document.getElementById('broadcastMessageText');
    if (messageInput) messageInput.value = '';
  }
  syncMetaTemplateComposer_();
  updateBroadcastCharacterCount_();
  updateBroadcastSendState_();
}

function renderApprovedMetaTemplateOptions_(preferredKey, stats) {
  var select = document.getElementById('broadcastMetaTemplateSelect');
  if (!select) return;
  var options = '<option value="">اختر قالبًا معتمدًا للإرسال</option>';
  options += approvedMetaTemplates_.map(function (template, index) {
    return '<option value="' + index + '">' + escapeHtml(template.name) + ' — ' + escapeHtml(template.language || 'ar') + (template.category ? (' · ' + escapeHtml(template.category)) : '') + '</option>';
  }).join('');
  select.innerHTML = options;
  select.disabled = false;

  var preferredIndex = approvedMetaTemplates_.findIndex(function (template) {
    return metaTemplateKey_(template) === preferredKey;
  });
  if (preferredIndex >= 0) {
    select.value = String(preferredIndex);
    selectMetaTemplate_(approvedMetaTemplates_[preferredIndex]);
  } else {
    clearSelectedMetaTemplate_(true);
  }

  var help = document.getElementById('broadcastMetaTemplateHelp');
  if (help) {
    var ignored = stats && +stats.unsupportedCount ? +stats.unsupportedCount : 0;
    help.textContent = approvedMetaTemplates_.length
      ? ('متاح ' + approvedMetaTemplates_.length + ' قالب معتمد ومتوافق مع {name}' + (ignored ? (' — تم إخفاء ' + ignored + ' قالب يحتاج متغيّرات أو وسائط إضافية.') : '.'))
      : 'لا توجد قوالب معتمدة متوافقة مع {name} حتى الآن.';
  }
  refreshIcons();
}

function loadApprovedMetaTemplates_(forceReload) {
  if (whatsappProviderState_.provider !== 'meta') return;
  if (approvedMetaTemplatesLoading_) return;
  var selectedKey = metaTemplateKey_(selectedMetaTemplate_);
  if (approvedMetaTemplatesLoaded_ && !forceReload) {
    renderApprovedMetaTemplateOptions_(selectedKey, null);
    return;
  }

  var select = document.getElementById('broadcastMetaTemplateSelect');
  var refreshBtn = document.getElementById('refreshMetaTemplatesBtn');
  var help = document.getElementById('broadcastMetaTemplateHelp');
  approvedMetaTemplatesLoading_ = true;
  if (select) {
    select.disabled = true;
    select.innerHTML = '<option value="">جاري تحميل القوالب المعتمدة...</option>';
  }
  if (refreshBtn) refreshBtn.disabled = true;
  if (help) help.textContent = 'يتم الآن جلب القوالب المعتمدة من حساب Meta.';

  google.script.run.withSuccessHandler(function (res) {
    approvedMetaTemplatesLoading_ = false;
    if (refreshBtn) refreshBtn.disabled = false;
    if (!res || res.error || !res.ok) {
      approvedMetaTemplatesLoaded_ = false;
      approvedMetaTemplates_ = [];
      if (select) {
        select.disabled = true;
        select.innerHTML = '<option value="">تعذّر تحميل القوالب</option>';
      }
      if (help) help.textContent = (res && res.message) || 'تعذّر تحميل قوالب Meta.';
      clearSelectedMetaTemplate_(true);
      return;
    }
    approvedMetaTemplates_ = Array.isArray(res.templates) ? res.templates : [];
    approvedMetaTemplatesLoaded_ = true;
    renderApprovedMetaTemplateOptions_(selectedKey, res);
  }).withFailureHandler(function (err) {
    approvedMetaTemplatesLoading_ = false;
    approvedMetaTemplatesLoaded_ = false;
    approvedMetaTemplates_ = [];
    if (refreshBtn) refreshBtn.disabled = false;
    if (select) {
      select.disabled = true;
      select.innerHTML = '<option value="">تعذّر تحميل القوالب</option>';
    }
    if (help) help.textContent = 'تعذّر تحميل قوالب Meta: ' + err;
    clearSelectedMetaTemplate_(true);
  }).getApprovedMetaWhatsAppTemplates(getCurrentUserCpr());
}

function setMetaTemplateActionBusy_(busy) {
  ['submitMetaTemplateBtn', 'checkMetaTemplateStatusBtn'].forEach(function (id) {
    var button = document.getElementById(id);
    if (button) button.disabled = !!busy;
  });
}

function checkCurrentMetaTemplateStatus_() {
  if (!whatsappProviderState_.canChange) return;
  var name = (document.getElementById('broadcastMetaDraftName').value || '').trim();
  var languageCode = (document.getElementById('broadcastMetaDraftLanguageCode').value || '').trim();
  if (!name || !languageCode) {
    setMetaTemplateStatus_('أدخل اسم القالب ورمز اللغة أولًا.', 'error');
    return;
  }
  setMetaTemplateActionBusy_(true);
  setMetaTemplateStatus_('جارٍ الاستعلام من Meta عن حالة القالب…', 'info');
  getFirebaseIdTokenForSensitiveAction_(function (firebaseIdToken) {
    google.script.run.withSuccessHandler(function (res) {
      setMetaTemplateActionBusy_(false);
      if (!res || res.error || !res.ok) {
        setMetaTemplateStatus_((res && res.message) || 'تعذّر فحص حالة القالب في Meta.', 'error');
        return;
      }
      if (!res.exists) {
        setMetaTemplateStatus_('القالب غير موجود في Meta حتى الآن.', 'warning');
        return;
      }
      var tone = res.status === 'APPROVED' ? 'success' : (res.status === 'REJECTED' ? 'error' : 'warning');
      setMetaTemplateStatus_('حالة القالب في Meta: ' + res.status + (res.category ? (' — التصنيف: ' + res.category) : ''), tone);
      if (res.status === 'APPROVED') loadApprovedMetaTemplates_(true);
    }).withFailureHandler(function (err) {
      setMetaTemplateActionBusy_(false);
      setMetaTemplateStatus_('تعذّر فحص حالة القالب: ' + err, 'error');
    }).getMetaWhatsAppTemplateStatus(getCurrentUserCpr(), name, languageCode, firebaseIdToken);
  }, function (message) {
    setMetaTemplateActionBusy_(false);
    setMetaTemplateStatus_(message, 'error');
  });
}

function submitCurrentMetaTemplate_() {
  if (!whatsappProviderState_.canChange) return;
  if (selectedMetaTemplate_) {
    alertMSG('استخدم «تغيير القالب» أولًا قبل إنشاء قالب جديد، حتى يصبح نص الرسالة قابلًا للتحرير', 'error');
    return;
  }
  var name = (document.getElementById('broadcastMetaDraftName').value || '').trim();
  var languageCode = (document.getElementById('broadcastMetaDraftLanguageCode').value || '').trim();
  var category = document.getElementById('broadcastMetaTemplateCategory').value;
  var body = (document.getElementById('broadcastMessageText').value || '').trim();
  if (!name || !body || body.indexOf('{name}') === -1) {
    alertMSG('أدخل اسم القالب ونصًا يحتوي {name} أولًا', 'error');
    return;
  }
  Swal.fire({
    title: 'إرسال القالب إلى Meta؟',
    text: 'سيُنشأ القالب باسم ' + name + ' ويرسل للمراجعة. لا تُرسل أي رسالة للطلاب في هذه الخطوة.',
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: 'إرسال للمراجعة',
    cancelButtonText: 'إلغاء'
  }).then(function (answer) {
    if (!answer.isConfirmed) return;
    var settled = false;
    var waitTimer;
    var finishRequest = function () {
      if (settled) return false;
      settled = true;
      if (waitTimer) clearTimeout(waitTimer);
      setMetaTemplateActionBusy_(false);
      return true;
    };
    setMetaTemplateActionBusy_(true);
    setMetaTemplateStatus_('جارٍ إرسال القالب إلى Meta؛ لا تغلق الصفحة…', 'info');
    waitTimer = setTimeout(function () {
      if (!finishRequest()) return;
      setMetaTemplateStatus_('لم يصل رد خلال 60 ثانية. استخدم «فحص حالة القالب» قبل إعادة الإرسال حتى لا يتكرر الطلب.', 'warning');
    }, 60000);
    getFirebaseIdTokenForSensitiveAction_(function (firebaseIdToken) {
      google.script.run.withSuccessHandler(function (res) {
        if (!finishRequest()) return;
        if (!res || res.error || !res.ok) {
          var errorMessage = (res && res.message) || 'تعذّر إرسال القالب إلى Meta';
          setMetaTemplateStatus_(errorMessage, 'error');
          alertMSG(errorMessage, 'error');
          return;
        }
        var successMessage = 'تم إرسال القالب إلى Meta للمراجعة — الحالة: ' + (res.status || 'PENDING');
        setMetaTemplateStatus_(successMessage, 'success');
        alertMSG(successMessage, 'success');
      }).withFailureHandler(function (err) {
        if (!finishRequest()) return;
        var failureMessage = 'تعذّر إرسال القالب إلى Meta: ' + err;
        setMetaTemplateStatus_(failureMessage, 'error');
        alertMSG(failureMessage, 'error');
      }).submitMetaWhatsAppTemplateForReview(getCurrentUserCpr(), {
        name: name,
        languageCode: languageCode,
        category: category,
        body: body
      }, firebaseIdToken);
    }, function (message) {
      if (!finishRequest()) return;
      setMetaTemplateStatus_(message, 'error');
      alertMSG(message, 'error');
    });
  });
}

function activateMessagesTab_(tab) {
  var group = document.getElementById('messagesTabGroup');
  if (!group) return;
  var btn = group.querySelector('button[data-msg-tab="' + tab + '"]');
  if (!btn) return;

  group.querySelectorAll('button[data-msg-tab]').forEach(function (b) {
    var active = b === btn;
    b.classList.toggle('active', active);
    b.setAttribute('aria-selected', String(active));
    b.setAttribute('tabindex', active ? '0' : '-1');
  });
  document.querySelectorAll('[data-msg-panel]').forEach(function (p) {
    p.hidden = p.getAttribute('data-msg-panel') !== tab;
  });
  messagesActiveTab_ = tab;
  if (tab !== 'log' && messageLogDeliveryPollTimer_) {
    clearTimeout(messageLogDeliveryPollTimer_);
    messageLogDeliveryPollTimer_ = null;
  }

  if (tab === 'templates') loadMessageTemplatesTab_();
  else if (tab === 'groups') loadWhatsappGroupsTab_();
  else if (tab === 'broadcast') loadBroadcastTab_();
  else if (tab === 'notifications') loadFcmBroadcastTab_();
  else if (tab === 'status') loadMessagesStatusTab_();
  else if (tab === 'log') loadMessageLogTab_();
}

function setupMessagesTabControls_() {
  var group = document.getElementById('messagesTabGroup');
  if (!group) return;
  group.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-msg-tab]');
    if (!btn) return;
    activateMessagesTab_(btn.getAttribute('data-msg-tab'));
  });
  group.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    var buttons = Array.from(group.querySelectorAll('button[data-msg-tab]'));
    var current = buttons.indexOf(document.activeElement);
    if (current < 0) return;
    e.preventDefault();
    var step = e.key === 'ArrowLeft' ? 1 : -1;
    var next = buttons[(current + step + buttons.length) % buttons.length];
    activateMessagesTab_(next.getAttribute('data-msg-tab'));
    next.focus();
  });

  var logSearch = document.getElementById('messageLogSearchInput');
  if (logSearch) logSearch.addEventListener('input', renderMessageLogTable_);
}

function renderMessageTemplatesGrid_(list) {
  var grid = document.getElementById('messageTemplatesGrid');

    grid.innerHTML = '<div class="message-state"><i data-icon="copy"></i><strong>لا توجد قوالب متاحة</strong><small>ستظهر هنا القوالب التي يستخدمها النظام في الرسائل التلقائية.</small></div>';

  }
  grid.innerHTML = list.map(function (t) {

    var body = String(t.body || t.defaultBody || 'لم يُضف نص لهذا القالب بعد.').replace(/\s+/g, ' ').trim();
    var requiredVars = Array.isArray(t.requiredVars) ? t.requiredVars : [];
    return '<article class="message-template-card">' +
      '<header class="message-template-head">' +
        '<span class="message-template-icon ' + meta.tone + '"><i data-icon="' + meta.icon + '"></i></span>' +
        '<div class="message-template-title"><h3>' + escapeHtml(t.label) + '</h3><small>' + escapeHtml(meta.description) + '</small></div>' +
        '<span class="message-template-status ' + (hasBody ? '' : 'fallback') + '">' + (hasBody ? 'مخصّص' : 'افتراضي') + '</span>' +
      '</header>' +

function openMessageTemplateModal_(key) {

var whatsappGroupsData_ = [];

// تُحمَّل من الشيت المحلي أولًا (سريع، بلا اعتماد خارجي) — getWhatsappGroupsFromFonnte
// (استدعاء get-whatsapp-group، قراءة فقط، آمن للتكرار) تُزامِن هذا الشيت تلقائيًا في الخلفية،
// فتظهر أي مجموعة جديدة اكتشفتها Fonnte فور اكتمالها بلا انتظار المستخدم. لا تستدعي fetch-group
// (الإجراء النادر الذي قد يعرّض الرقم لحظر واتساب لو أُسيء استخدامه) — ذاك فقط بزر صريح منفصل.
function loadWhatsappGroupsTab_() {
  var loadingBody = document.getElementById('whatsappGroupsRows');
  if (loadingBody) {
    loadingBody.innerHTML = '<tr class="message-table-state"><td colspan="3"><span class="message-state compact"><i data-icon="loader-circle"></i><strong>جاري تحميل المجموعات...</strong></span></td></tr>';
    refreshIcons();
  }
  google.script.run.withSuccessHandler(function (list) {
    whatsappGroupsData_ = Array.isArray(list) ? list : [];
    renderWhatsappGroupsTable_();
    // مزامنة خلفية بلا انتظار المستخدم لها — لو اكتشفت Fonnte مجموعات جديدة، أعِد جلب الشيت
    // المحلي (الآن مُزامَنًا) مرة واحدة فقط وأعِد الرسم؛ لا استدعاء متكرر لنفسها هنا (يمنع أي
    // احتمال حلقة لا نهائية).
    google.script.run.withSuccessHandler(function () {
      google.script.run.withSuccessHandler(function (freshList) {
        whatsappGroupsData_ = Array.isArray(freshList) ? freshList : whatsappGroupsData_;
        renderWhatsappGroupsTable_();
      }).withFailureHandler(function () {}).getWhatsappGroupsList();
    }).withFailureHandler(function () {}).getWhatsappGroupsFromFonnte(getCurrentUserCpr());
  }).withFailureHandler(function () {
    var tb = document.getElementById('whatsappGroupsRows');
    if (tb) {
      tb.innerHTML = '<tr class="message-table-state"><td colspan="3"><span class="message-state compact error"><i data-icon="triangle-alert"></i><strong>تعذّر تحميل المجموعات</strong><small>أعد المحاولة بعد التحقق من الاتصال.</small></span></td></tr>';
      refreshIcons();
    }
  }).getWhatsappGroupsList();
}

// زر "تحديث القائمة من واتساب" — يستدعي fetch-group (الإجراء النادر بتحذير Fonnte الرسمي: "قد
// يؤدي إساءة استخدامه لحظر رقم واتساب") — لذا تأكيد صريح إلزامي قبل كل استدعاء، ولا استدعاء
// تلقائي له إطلاقًا من أي مكان آخر بالكود.
function refreshWhatsappGroupsFromFonnte_() {
  Swal.fire({
    title: 'تحديث قائمة المجموعات من واتساب',
    html: 'هذا الإجراء يطلب من واتساب نفسه تحديث قائمة المجموعات — <strong>استخدمه فقط عند انضمام رقم الأكاديمية لمجموعة جديدة</strong>، فالاستخدام المتكرر بلا داعٍ قد يعرّض رقم واتساب للحظر حسب تحذير مزوّد الخدمة الرسمي. هل تريد المتابعة؟',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: 'نعم، حدّث الآن',
    cancelButtonText: 'إلغاء'
  }).then(function (result) {
    if (!result.isConfirmed) return;
    var btn = document.getElementById('refreshWhatsappGroupsBtn');
    if (btn) btn.disabled = true;
    google.script.run.withSuccessHandler(function (res) {
      if (btn) btn.disabled = false;
      if (!res || res.error) { alertMSG((res && res.message) || 'تعذّر التحديث', 'error'); return; }
      alertMSG('تم إرسال طلب التحديث — جارٍ جلب النتيجة...', 'success');
      loadWhatsappGroupsTab_();
    }).withFailureHandler(function (err) {
      if (btn) btn.disabled = false;
      alertMSG('تعذّر التحديث: ' + err, 'error');
    }).refreshWhatsappGroupsFromFonnte(getCurrentUserCpr());
  });
}

/* ---------- تبويب: إرسال رسالة جماعية ---------- */
var broadcastTargetType_ = 'students';
var broadcastStageFilter_ = 'all';
var broadcastGenderFilter_ = 'all';
var broadcastData_ = [];

function setupBroadcastControls_() {
  var targetGroup = document.getElementById('broadcastTargetTypeGroup');
  if (targetGroup) targetGroup.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-target-type]');
    if (!btn) return;
    if (isBroadcastTargetBlockedByProvider_(btn.getAttribute('data-target-type'))) {
      alertMSG(BROADCAST_INDIVIDUALS_DISABLED_NOTE_, 'error');
      return;
    }
    if (btn.getAttribute('data-target-type') === 'groups' && whatsappProviderState_.provider === 'meta') {
      alertMSG('Meta Cloud API الرسمي لا يدعم الإرسال إلى مجموعات واتساب؛ استخدم الطلاب/الموظفين أو بدّل إلى Fonnte', 'error');
      return;
    }
    targetGroup.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    broadcastTargetType_ = btn.getAttribute('data-target-type');
    // إعادة ضبط الفلاتر عند تبديل الفئة — تجنّبًا لبقاء فلتر جنس/مرحلة مطبَّقًا بصمت على فئة
    // (موظفين/مجموعات) لا يظهر لها أصلًا شريط الفلترة المقابل.
    broadcastStageFilter_ = 'all';
    broadcastGenderFilter_ = 'all';
    var isStudents = broadcastTargetType_ === 'students';
    var stageGroup = document.getElementById('broadcastStageGroup');
    if (stageGroup) {
      stageGroup.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-stage') === 'all'); });
      var stageRow = stageGroup.closest('.broadcast-filter-row');
      if (stageRow) stageRow.hidden = !isStudents;
    }
    var genderGroup = document.getElementById('broadcastGenderGroup');
    if (genderGroup) {
      genderGroup.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-gender') === 'all'); });
      var genderUnit = genderGroup.closest('.broadcast-filter-unit');
      if (genderUnit) genderUnit.hidden = !isStudents;
    }
    var colHeader = document.getElementById('broadcastTargetColHeader');
    if (colHeader) colHeader.textContent = broadcastTargetType_ === 'groups' ? 'معرّف المجموعة' : 'الهاتف';
    // "مجموعات" تُعرَض كقائمة منسدلة متعددة الاختيار بدل الجدول (بطلب المستخدم صراحةً) — عادةً
    // عدد قليل جدًا مقارنة بالطلاب/الموظفين، فالقائمة المنسدلة أنسب من جدول كامل بعمود اختيار.
    var isGroups = broadcastTargetType_ === 'groups';
    var tableWrap = document.getElementById('broadcastTableWrap');
    var groupsWrap = document.getElementById('broadcastGroupsSelectWrap');
    if (tableWrap) tableWrap.hidden = isGroups;
    if (groupsWrap) groupsWrap.hidden = !isGroups;
    var searchInput = document.getElementById('broadcastSearchInput');
    var searchWrap = searchInput ? searchInput.closest('.table-search') : null;
    if (searchWrap) searchWrap.hidden = isGroups;
    var splitRow = document.querySelector('.broadcast-filter-row-split');
    if (splitRow) {
      splitRow.hidden = isGroups;
      splitRow.classList.toggle('search-only', !isStudents);
    }
    loadBroadcastRecipients_();
  });

  var stageGroup = document.getElementById('broadcastStageGroup');
  if (stageGroup) stageGroup.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-stage]');
    if (!btn) return;
    stageGroup.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    broadcastStageFilter_ = btn.getAttribute('data-stage');
    renderBroadcastRecipientsTable_();
  });

  var genderGroup = document.getElementById('broadcastGenderGroup');
  if (genderGroup) genderGroup.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-gender]');
    if (!btn) return;
    genderGroup.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    broadcastGenderFilter_ = btn.getAttribute('data-gender');
    renderBroadcastRecipientsTable_();
  });

  var searchInp = document.getElementById('broadcastSearchInput');
  if (searchInp) searchInp.addEventListener('input', renderBroadcastRecipientsTable_);

  var selectAllCb = document.getElementById('broadcastSelectAll');
  if (selectAllCb) selectAllCb.addEventListener('change', function () {
    document.querySelectorAll('#broadcastRecipientsRows .broadcast-check').forEach(function (cb) { cb.checked = selectAllCb.checked; });
    updateBroadcastSelectedCount_();
  });

  var groupsSelect = document.getElementById('broadcastGroupsSelect');
  if (groupsSelect) groupsSelect.addEventListener('change', updateBroadcastSelectedCount_);

  var msgText = document.getElementById('broadcastMessageText');
  if (msgText) msgText.addEventListener('input', function () {
    if (broadcastMessageSyncing_) return;
    updateBroadcastCharacterCount_();
    updateBroadcastEstimate_();
  });

  var metaTemplateSelect = document.getElementById('broadcastMetaTemplateSelect');
  if (metaTemplateSelect) metaTemplateSelect.addEventListener('change', function () {
    var index = parseInt(metaTemplateSelect.value, 10);
    if (!isFinite(index) || !approvedMetaTemplates_[index]) clearSelectedMetaTemplate_(true);
    else selectMetaTemplate_(approvedMetaTemplates_[index]);
  });
  var refreshMetaTemplatesBtn = document.getElementById('refreshMetaTemplatesBtn');
  if (refreshMetaTemplatesBtn) refreshMetaTemplatesBtn.addEventListener('click', function () { loadApprovedMetaTemplates_(true); });
  var clearMetaTemplateBtn = document.getElementById('clearMetaTemplateBtn');
  if (clearMetaTemplateBtn) clearMetaTemplateBtn.addEventListener('click', function () { clearSelectedMetaTemplate_(true); });
  ['broadcastBatchSize', 'broadcastPerMessageDelay', 'broadcastBetweenBatches'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('input', updateBroadcastEstimate_);
  });

  var scheduleMode = document.getElementById('broadcastScheduleMode');
  if (scheduleMode) scheduleMode.addEventListener('change', function () {
    var field = document.getElementById('broadcastScheduleAtField');
    if (field) field.hidden = scheduleMode.value !== 'later';
  });

  var sendBtn = document.getElementById('broadcastSendBtn');
  if (sendBtn) sendBtn.addEventListener('click', sendBroadcastNow_);
}

function loadBroadcastTab_() {
  updateBroadcastCharacterCount_();
  renderWhatsAppProviderState_();
  if (whatsappProviderState_.provider === 'meta' && whatsappProviderState_.metaConfigured) loadApprovedMetaTemplates_(false);
  loadBroadcastRecipients_();
}

function loadBroadcastRecipients_() {
  var type = broadcastTargetType_;
  if (type === 'groups' && whatsappProviderState_.provider === 'meta') {
    type = broadcastTargetType_ = 'students';
  }
  // Fonnte: فئتا الطلاب/الموظفين معطَّلتان، فننتقل إلى "مجموعات". نضغط زر الفئة ليزامن معالجه الواجهة
  // كلها (الفلاتر والجدول والقائمة المنسدلة) ثم يستدعي هذه الدالة من جديد بفئة المجموعات.
  if (isBroadcastTargetBlockedByProvider_(type)) {
    var groupsBtn = document.querySelector('#broadcastTargetTypeGroup button[data-target-type="groups"]');
    if (groupsBtn) { groupsBtn.click(); return; }
  }
  var tb = document.getElementById('broadcastRecipientsRows');
  broadcastData_ = [];
  if (tb) {
    tb.dataset.rowsJson = '[]';
    tb.innerHTML = '<tr class="message-table-state"><td colspan="3"><span class="message-state compact"><i data-icon="loader-circle"></i><strong>جاري تحميل المستلمين...</strong></span></td></tr>';
    refreshIcons();
  }
  updateBroadcastSelectedCount_();

  if (type === 'groups') {
    loadBroadcastGroupsSelect_();
    return;
  }

  if (type === 'staff') {
    google.script.run.withSuccessHandler(function (list) {
      broadcastData_ = (Array.isArray(list) ? list : []).map(function (s) { return { name: s.name, target: s.phone, gender: s.gender }; });
      renderBroadcastRecipientsTable_();
    }).withFailureHandler(function () {
      broadcastData_ = [];
      if (tb) {
        tb.innerHTML = '<tr class="message-table-state"><td colspan="3"><span class="message-state compact error"><i data-icon="triangle-alert"></i><strong>تعذّر تحميل الموظفين</strong></span></td></tr>';
        refreshIcons();
      }
      updateBroadcastSelectedCount_();
    }).getStaffList();
    return;
  }

  google.script.run.withSuccessHandler(function (list) {
    broadcastData_ = (Array.isArray(list) ? list : []).map(function (s) {
      var stageIndex = [0, 1, 2, 3].findIndex(function (i) { return s['class' + i] === 'active'; });
      return { name: s.name, target: s.phone, gender: s.gender, stageIndex: stageIndex };
    });
    renderBroadcastRecipientsTable_();
  }).withFailureHandler(function () {
    broadcastData_ = [];
    if (tb) {
      tb.innerHTML = '<tr class="message-table-state"><td colspan="3"><span class="message-state compact error"><i data-icon="triangle-alert"></i><strong>تعذّر تحميل الطلاب</strong></span></td></tr>';
      refreshIcons();
    }
    updateBroadcastSelectedCount_();
  }).getPersons();
}

// يعبّئ القائمة المنسدلة بمجموعات واتساب الحقيقية التي رقم الأكاديمية عضو فيها — يُفضَّل
// getWhatsappGroupsFromFonnte (قراءة حيّة من Fonnte، تُزامِن شيتنا المحلي تلقائيًا بالخلفية)،
// ويسقط لـgetWhatsappGroupsList (شيتنا المحلي فقط) لو تعذّر الاتصال بـFonnte لأي سبب.
function loadBroadcastGroupsSelect_() {
  var sel = document.getElementById('broadcastGroupsSelect');
  if (sel) sel.innerHTML = '<option disabled>جاري التحميل...</option>';

  google.script.run.withSuccessHandler(function (list) {
    if (!list || list.error) { loadBroadcastGroupsSelectFallback_(); return; }
    renderBroadcastGroupsSelect_(Array.isArray(list) ? list.map(function (g) { return { name: g.name, target: g.id }; }) : []);
  }).withFailureHandler(loadBroadcastGroupsSelectFallback_).getWhatsappGroupsFromFonnte(getCurrentUserCpr());
}

function loadBroadcastGroupsSelectFallback_() {
  google.script.run.withSuccessHandler(function (list) {
    renderBroadcastGroupsSelect_((Array.isArray(list) ? list : []).map(function (g) { return { name: g.name, target: g.groupId }; }));
  }).withFailureHandler(function () {
    var sel = document.getElementById('broadcastGroupsSelect');
    if (sel) sel.innerHTML = '<option disabled>تعذّر تحميل المجموعات</option>';
    broadcastData_ = [];
    updateBroadcastSelectedCount_();
  }).getWhatsappGroupsList();
}

function renderBroadcastGroupsSelect_(groups) {
  broadcastData_ = groups;
  var sel = document.getElementById('broadcastGroupsSelect');
  if (!sel) return;
  if (!groups.length) {
    sel.innerHTML = '<option disabled>لا توجد مجموعات — استخدم "تحديث القائمة من واتساب" بتبويب "مجموعات واتساب"، أو أضِف يدويًا</option>';
  } else {
    sel.innerHTML = groups.map(function (g, i) { return '<option value="' + i + '">' + escapeHtml(g.name) + '</option>'; }).join('');
  }
  var filteredEl = document.getElementById('broadcastFilteredCount');
  if (filteredEl) filteredEl.textContent = groups.length;
  var noPhoneEl = document.getElementById('broadcastNoPhoneCount');
  if (noPhoneEl) noPhoneEl.textContent = 0;
  updateBroadcastSelectedCount_();
}

function getFilteredBroadcastRecipients_() {
  var rows = broadcastData_.slice();
  if (broadcastTargetType_ === 'students') {
    if (broadcastStageFilter_ !== 'all') rows = rows.filter(function (r) { return String(r.stageIndex) === broadcastStageFilter_; });
    if (broadcastGenderFilter_ !== 'all') rows = rows.filter(function (r) { return r.gender === broadcastGenderFilter_; });
  }
  var q = (document.getElementById('broadcastSearchInput').value || '').trim().toLowerCase();
  if (q) rows = rows.filter(function (r) { return String(r.name || '').toLowerCase().indexOf(q) !== -1; });
  return rows.filter(function (r) { return r.target; });
}

function renderBroadcastRecipientsTable_() {
  var tb = document.getElementById('broadcastRecipientsRows');
  if (!tb) return;
  var rows = getFilteredBroadcastRecipients_();
  var selectAllCb = document.getElementById('broadcastSelectAll');
  if (selectAllCb) selectAllCb.checked = false;

  var filteredEl = document.getElementById('broadcastFilteredCount');
  if (filteredEl) filteredEl.textContent = rows.length;
  var noPhoneCount = broadcastData_.length - broadcastData_.filter(function (r) { return r.target; }).length;
  var noPhoneEl = document.getElementById('broadcastNoPhoneCount');
  if (noPhoneEl) noPhoneEl.textContent = noPhoneCount;

  if (!rows.length) {
    tb.innerHTML = '<tr class="message-table-state"><td colspan="3"><span class="message-state compact"><i data-icon="search"></i><strong>لا يوجد مستلمون مطابقون</strong><small>غيّر الفلاتر أو عبارة البحث لعرض نتائج أخرى.</small></span></td></tr>';
    tb.dataset.rowsJson = '[]';
    updateBroadcastSelectedCount_();
    refreshIcons();
    return;
  }

  tb.innerHTML = rows.map(function (r, i) {
    return '<tr>' +
      '<td data-label="تحديد"><input type="checkbox" class="broadcast-check" data-idx="' + i + '" aria-label="تحديد ' + escapeHtml(r.name || 'المستلم') + '"></td>' +
      '<td data-label="الاسم"><strong>' + escapeHtml(r.name || '—') + '</strong></td>' +
      '<td data-label="الهاتف" dir="ltr"><span class="message-target-code">' + escapeHtml(r.target || '—') + '</span></td>' +
    '</tr>';
  }).join('');

  // القائمة المفلترة الحالية تُخزَّن على العنصر نفسه لقراءتها عند التحديد/الإرسال — يضمن تطابق
  // data-idx مع نفس الترتيب المعروض بالضبط، بلا إعادة حساب فلترة قد تتغيّر نتيجتها بين الرسم
  // والإرسال (مثال: كتابة بالبحث بعد التحديد مباشرة).
  tb.dataset.rowsJson = JSON.stringify(rows);

  tb.querySelectorAll('.broadcast-check').forEach(function (cb) { cb.addEventListener('change', updateBroadcastSelectedCount_); });
  updateBroadcastSelectedCount_();
}

// المصدر يختلف حسب الفئة: جدول بمربعات اختيار (طلاب/موظفين) أو قائمة منسدلة متعددة الاختيار
// (مجموعات) — راجع renderBroadcastGroupsSelect_ أعلاه لمصدر broadcastData_ عند "مجموعات".
function getSelectedBroadcastRecipients_() {
  if (broadcastTargetType_ === 'groups') {
    var sel = document.getElementById('broadcastGroupsSelect');
    if (!sel) return [];
    return Array.from(sel.selectedOptions).map(function (opt) { return broadcastData_[+opt.value]; }).filter(Boolean);
  }
  var tb = document.getElementById('broadcastRecipientsRows');
  if (!tb || !tb.dataset.rowsJson) return [];
  var rows = JSON.parse(tb.dataset.rowsJson);
  var checkedIdx = Array.from(document.querySelectorAll('#broadcastRecipientsRows .broadcast-check:checked')).map(function (cb) { return +cb.getAttribute('data-idx'); });
  return checkedIdx.map(function (i) { return rows[i]; }).filter(Boolean);
}

function updateBroadcastSelectedCount_() {
  var count = getSelectedBroadcastRecipients_().length;
  var el = document.getElementById('broadcastSelectedCount');
  if (el) el.textContent = count;
  var checks = Array.from(document.querySelectorAll('#broadcastRecipientsRows .broadcast-check'));
  var selectAll = document.getElementById('broadcastSelectAll');
  if (selectAll && broadcastTargetType_ !== 'groups') {
    selectAll.checked = checks.length > 0 && checks.every(function (cb) { return cb.checked; });
    selectAll.indeterminate = checks.some(function (cb) { return cb.checked; }) && !selectAll.checked;
  }
  updateBroadcastSendState_();
  updateBroadcastEstimate_();
}

function updateBroadcastCharacterCount_() {
  var input = document.getElementById('broadcastMessageText');
  var counter = document.getElementById('broadcastCharacterCount');
  if (counter) counter.textContent = String(input ? input.value.length : 0) + ' حرف';
  updateBroadcastSendState_();
}

function updateBroadcastSendState_() {
  var sendBtn = document.getElementById('broadcastSendBtn');
  if (!sendBtn) return;
  var messageInput = document.getElementById('broadcastMessageText');
  var message = messageInput ? messageInput.value.trim() : '';
  var hasRequiredName = broadcastTargetType_ === 'groups' || message.indexOf('{name}') !== -1;
  var metaReady = true;
  if (whatsappProviderState_.provider === 'meta') {
    var templateName = document.getElementById('broadcastMetaTemplateName');
    var languageCode = document.getElementById('broadcastMetaLanguageCode');
    metaReady = !!(
      whatsappProviderState_.metaConfigured &&
      selectedMetaTemplate_ &&
      templateName && templateName.value.trim() === selectedMetaTemplate_.name &&
      languageCode && languageCode.value.trim() === selectedMetaTemplate_.language &&
      normalizeMetaTemplateBody_(message) === normalizeMetaTemplateBody_(selectedMetaTemplate_.body)
    );
  }
  sendBtn.disabled = isBroadcastTargetBlockedByProvider_(broadcastTargetType_) || getSelectedBroadcastRecipients_().length === 0 || !message || !hasRequiredName || !metaReady;
}

// تقدير تقريبي — لا وعد قاطع (مشغّلات Apps Script الزمنية غير دقيقة تمامًا)، بطلب المستخدم
// صراحةً "يظهر الوقت المتوقع... بناء على تلك المدخلات". يُحسَب بالكامل بالمتصفح بلا أي طلب
// خادم، فيتحدّث فور تغيير أي حقل مباشرة.
function updateBroadcastEstimate_() {
  var count = getSelectedBroadcastRecipients_().length;
  var estEl = document.getElementById('broadcastEstimate');
  if (!estEl) return;
  if (!count) { estEl.innerHTML = ''; return; }

  var perMsg = Math.max(60, parseInt(document.getElementById('broadcastPerMessageDelay').value, 10) || 60);
  var batchSize = Math.max(1, parseInt(document.getElementById('broadcastBatchSize').value, 10) || 1);
  var betweenBatches = Math.max(0, parseInt(document.getElementById('broadcastBetweenBatches').value, 10) || 0);

  var batches = Math.ceil(count / batchSize);
  // (count - batches) تقريبي: فاصل "بين كل رسالة" يُطبَّق (batchSize-1) مرة لكل دفعة كاملة —
  // تقريب كافٍ لعرض تقديري، لا حساب دقيق لكل دفعة جزئية أخيرة.
  var totalSeconds = Math.max(0, (count - batches) * perMsg + Math.max(0, batches - 1) * betweenBatches);

  var providerLabel = whatsappProviderState_.provider === 'meta' ? 'Meta' : 'Fonnte';
  estEl.innerHTML = '<i data-icon="triangle-alert"></i>الوقت التقديري لإتمام الإرسال لـ' + count + (count === 1 ? ' مستلم' : ' مستلمًا') +
    ': ' + formatEstimateDuration_(totalSeconds) + ' (تقريبي غير مضمون بدقة — يعتمد على استجابة ' + providerLabel + ' ودقّة مُشغِّلات جوجل الزمنية)';
  refreshIcons();
}

function formatEstimateDuration_(totalSeconds) {
  var hours = Math.floor(totalSeconds / 3600);
  var minutes = Math.round((totalSeconds % 3600) / 60);
  if (hours < 1) return minutes + ' دقيقة تقريبًا';
  return hours + ' ساعة' + (minutes ? ' و' + minutes + ' دقيقة' : '') + ' تقريبًا';
}

function sendBroadcastNow_() {
  if (isBroadcastTargetBlockedByProvider_(broadcastTargetType_)) { alertMSG(BROADCAST_INDIVIDUALS_DISABLED_NOTE_, 'error'); return; }
  var selected = getSelectedBroadcastRecipients_();
  if (!selected.length) return;

  var message = document.getElementById('broadcastMessageText').value.trim();
  if (!message) { alertMSG('لا يمكن إرسال رسالة فارغة', 'error'); return; }
  if (broadcastTargetType_ !== 'groups' && message.indexOf('{name}') === -1) {
    alertMSG('يجب أن يحتوي النص على {name} لتخصيصها لكل مستلم — إجراء حماية من حظر واتساب', 'error');
    return;
  }
  var provider = whatsappProviderState_.provider === 'meta' ? 'meta' : 'fonnte';
  if (provider === 'meta' && broadcastTargetType_ === 'groups') {
    alertMSG('Meta Cloud API الرسمي لا يدعم الإرسال إلى مجموعات واتساب', 'error');
    return;
  }
  var metaTemplateName = provider === 'meta' ? document.getElementById('broadcastMetaTemplateName').value.trim() : '';
  var metaLanguageCode = provider === 'meta' ? document.getElementById('broadcastMetaLanguageCode').value.trim() : '';
  if (provider === 'meta' && (!whatsappProviderState_.metaConfigured || !selectedMetaTemplate_ || !/^[a-z0-9_]+$/.test(metaTemplateName))) {
    alertMSG('اختر قالب Meta معتمدًا قبل الإرسال', 'error');
    return;
  }
  if (provider === 'meta' && normalizeMetaTemplateBody_(message) !== normalizeMetaTemplateBody_(selectedMetaTemplate_.body)) {
    alertMSG('نص الرسالة لا يطابق قالب Meta المحدد؛ أعد اختيار القالب لاستعادة نصه المعتمد', 'error');
    return;
  }

  var batchSize = Math.max(1, parseInt(document.getElementById('broadcastBatchSize').value, 10) || 1);
  var perMessageDelaySec = Math.max(60, parseInt(document.getElementById('broadcastPerMessageDelay').value, 10) || 60);
  var betweenBatchesSec = Math.max(0, parseInt(document.getElementById('broadcastBetweenBatches').value, 10) || 0);
  var scheduleMode = document.getElementById('broadcastScheduleMode').value;
  var scheduledAt = '';
  if (scheduleMode === 'later') {
    var raw = document.getElementById('broadcastScheduleAt').value;
    if (!raw) { alertMSG('يرجى تحديد موعد الإرسال المستقبلي', 'error'); return; }
    scheduledAt = new Date(raw).toISOString();
  }

  var recipients = selected.map(function (r) {
    return broadcastTargetType_ === 'groups' ? { name: r.name, groupId: r.target } : { name: r.name, phone: r.target };
  });

  Swal.fire({
    title: 'تأكيد الإرسال',
    html: 'سيتم إرسال هذه الرسالة إلى <strong>' + selected.length + '</strong> ' + (broadcastTargetType_ === 'groups' ? 'مجموعة' : 'مستلم') +
      ' عبر <strong>' + (provider === 'meta' ? 'Meta الرسمي' : 'Fonnte') + '</strong>.' +
      (provider === 'meta' ? '<br><small>سيُستخدم قالب Meta المعتمد: <span dir="ltr">' + escapeHtml(metaTemplateName) + '</span>. قبول API للطلب لا يثبت التسليم أو القراءة.</small>' : '') +
      (document.getElementById('broadcastEstimate').textContent ? '<br><small>' + escapeHtml(document.getElementById('broadcastEstimate').textContent) + '</small>' : '') + ' هل أنت متأكد؟',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: scheduleMode === 'later' ? 'جدولة' : 'إرسال',
    cancelButtonText: 'إلغاء'
  }).then(function (result) {
    if (!result.isConfirmed) return;
    var sendBtn = document.getElementById('broadcastSendBtn');
    sendBtn.disabled = true;
    google.script.run.withSuccessHandler(function (res) {
      sendBtn.disabled = false;
      if (!res || res.ok === false || res.error) { alertMSG((res && (res.reason || res.message)) || 'تعذّر بدء الإرسال', 'error'); return; }
      // طابور الحملات: لو كانت هناك حملة أخرى جارية/مجدولة بالفعل، أُضيفت هذه الحملة لطابور
      // الانتظار بدل رفضها — تبدأ تلقائيًا فور انتهاء الحملة الحالية (لا حاجة لأي إجراء إضافي).
      if (res.queued) alertMSG('توجد حملة جارية بالفعل — أُضيفت حملتك لطابور الانتظار (الترتيب: #' + res.queuePosition + ')، وستبدأ تلقائيًا فور انتهاء الحملة الحالية', 'info');
      else alertMSG(scheduleMode === 'later' ? 'تمت جدولة الحملة بنجاح' : 'بدأ الإرسال في الخلفية', 'success');
      if (provider === 'meta') clearSelectedMetaTemplate_(false);
      else {
        document.getElementById('broadcastMessageText').value = '';
        updateBroadcastCharacterCount_();
      }
      updateBroadcastEstimate_();
      refreshWPQueueGlobalBanner_();
    }).withFailureHandler(function (err) {
      sendBtn.disabled = false;
      alertMSG('تعذّر بدء الإرسال: ' + err, 'error');
    }).prepareAndScheduleBroadcast(getCurrentUserCpr(), {
      targetType: broadcastTargetType_,
      recipients: recipients,
      message: message,
      metaTemplateName: metaTemplateName,
      metaLanguageCode: metaLanguageCode,
      batchSize: batchSize,
      perMessageDelaySec: perMessageDelaySec,
      betweenBatchesSec: betweenBatchesSec,
      scheduledAt: scheduledAt
    });
  });
}

/* ---------- تبويب: الإشعارات (FCM) — نظير تبويب "حملة جديدة" لكن لطلاب فعّلوا الإشعارات فقط،
   بلا فئات مستهدفين (طلاب فقط) ولا مجموعات، وبعنوان + نص بدل نص فقط. راجع fcmQueue.js
   وprepareAndScheduleFcmBroadcast (FCMService.js) للجزء الخادمي المطابق. ---------- */
var fcmStageFilter_ = 'all';
var fcmGenderFilter_ = 'all';
var fcmData_ = [];

function setupFcmBroadcastControls_() {
  var stageGroup = document.getElementById('fcmStageGroup');
  if (stageGroup) stageGroup.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-stage]');
    if (!btn) return;
    stageGroup.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    fcmStageFilter_ = btn.getAttribute('data-stage');
    renderFcmRecipientsTable_();
  });

  var genderGroup = document.getElementById('fcmGenderGroup');
  if (genderGroup) genderGroup.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-gender]');
    if (!btn) return;
    genderGroup.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    fcmGenderFilter_ = btn.getAttribute('data-gender');
    renderFcmRecipientsTable_();
  });

  var searchInp = document.getElementById('fcmSearchInput');
  if (searchInp) searchInp.addEventListener('input', renderFcmRecipientsTable_);

  var selectAllCb = document.getElementById('fcmSelectAll');
  if (selectAllCb) selectAllCb.addEventListener('change', function () {
    document.querySelectorAll('#fcmRecipientsRows .fcm-check').forEach(function (cb) { cb.checked = selectAllCb.checked; });
    updateFcmSelectedCount_();
  });

  var titleInp = document.getElementById('fcmTitleInput');
  if (titleInp) titleInp.addEventListener('input', updateFcmSendState_);

  var bodyText = document.getElementById('fcmBodyText');
  if (bodyText) bodyText.addEventListener('input', function () {
    updateFcmCharacterCount_();
    updateFcmEstimate_();
  });
  ['fcmBatchSize', 'fcmPerMessageDelay', 'fcmBetweenBatches'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('input', updateFcmEstimate_);
  });

  var scheduleMode = document.getElementById('fcmScheduleMode');
  if (scheduleMode) scheduleMode.addEventListener('change', function () {
    var field = document.getElementById('fcmScheduleAtField');
    if (field) field.hidden = scheduleMode.value !== 'later';
  });

  var sendBtn = document.getElementById('fcmSendBtn');
  if (sendBtn) sendBtn.addEventListener('click', sendFcmBroadcastNow_);
}

function loadFcmBroadcastTab_() {
  var tb = document.getElementById('fcmRecipientsRows');
  fcmData_ = [];
  if (tb) {
    tb.innerHTML = '<tr class="message-table-state"><td colspan="3"><span class="message-state compact"><i data-icon="loader-circle"></i><strong>جاري تحميل المستلمين...</strong></span></td></tr>';
    refreshIcons();
  }
  updateFcmSelectedCount_();
  google.script.run.withSuccessHandler(function (list) {
    fcmData_ = Array.isArray(list) ? list : [];
    renderFcmRecipientsTable_();
  }).withFailureHandler(function () {
    fcmData_ = [];
    if (tb) {
      tb.innerHTML = '<tr class="message-table-state"><td colspan="3"><span class="message-state compact error"><i data-icon="triangle-alert"></i><strong>تعذّر تحميل الطلاب المفعِّلين</strong></span></td></tr>';
      refreshIcons();
    }
    updateFcmSelectedCount_();
  }).getFcmActivatedStudents();
}

function getFilteredFcmRecipients_() {
  var rows = fcmData_;
  if (fcmStageFilter_ !== 'all') {
    var wanted = +fcmStageFilter_;
    rows = rows.filter(function (r) { return r.stageIndex === wanted; });
  }
  if (fcmGenderFilter_ !== 'all') rows = rows.filter(function (r) { return r.gender === fcmGenderFilter_; });
  var q = (document.getElementById('fcmSearchInput') || {}).value;
  q = (q || '').trim().toLowerCase();
  if (q) rows = rows.filter(function (r) { return String(r.name || '').toLowerCase().indexOf(q) !== -1; });
