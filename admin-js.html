// تصدير أسئلة النموذج المفتوح حاليًا (نصوصها + كل اختياراتها + الإجابة الصحيحة) إلى إكسل،
// بنفس تسمية أعمدة قالب الاستيراد أعلاه ('الاختيار 1'..، 'الإجابة الصحيحة' كرقم) — فالملف
// المُصدَّر هنا صالح لإعادة استيراده مباشرة (importQuestionsBulk) بعد أي تعديل عليه يدويًا.
function exportCurrentExamQuestions() {
  var ctx = getCurrentExamModel();
  if (!ctx.model || !ctx.model.questions.length) { alertMSG('لا توجد أسئلة لتصديرها', 'warning'); return; }

  var maxOptions = ctx.model.questions.reduce(function (mx, q) { return Math.max(mx, q.options.length); }, 2);

  var rows = ctx.model.questions.map(function (q, idx) {
    var row = { '#': idx + 1, 'السؤال': q.text };
    for (var i = 0; i < maxOptions; i++) row['الاختيار ' + (i + 1)] = q.options[i] ? q.options[i].text : '';
    var correctIdx = -1;
    q.options.forEach(function (o, i) { if (o.correct) correctIdx = i; });
    row['الإجابة الصحيحة'] = correctIdx > -1 ? (correctIdx + 1) : '';
    return row;
  });

  var examLabel = examEditorState_.mazhab ? (examEditorState_.name + ' — ' + examEditorState_.mazhab) : examEditorState_.name;
  exportRowsToExcel({
    title: 'أسئلة اختبار ' + examLabel + ' — ' + ctx.model.name,
    filename: 'أسئلة_' + examLabel + '_' + ctx.model.name,
    rows: rows
  });
}

// ============================================================================
// استيراد أسئلة من ملف إكسل إلى النموذج المفتوح حاليًا بمحرر الاختبار. التحليل بالكامل في
// العميل عبر مكتبة XLSX.js المحمَّلة أصلًا (Main.html، مستخدَمة سلفًا للتصدير بexport-js.html)
// — لا حاجة لرفع الملف للخادم؛ فقط مصفوفة الأسئلة الصالحة تُرسَل لimportQuestionsBulk بdataPost.js.
//
// المستخدم غالبًا عنده ملف إكسل جاهز مسبقًا بأعمدة بأسماء/ترتيب مختلف عن أي قالب — فبدل
// افتراض أسماء أعمدة ثابتة، بعد اختيار الملف تظهر مطابقة يدوية: قائمة منسدلة لكل حقل مطلوب
// (نص السؤال، الاختيار 1-5، عمود الإجابة الصحيحة) بها كل أعمدة الملف الفعلية، مع تخمين
// مبدئي تلقائي (guessColumnMapping) قابل للتعديل الكامل يدويًا قبل التأكيد.
// ============================================================================

function normalizeHeaderKey(k) { return String(k || '').replace(/\s+/g, '').trim(); }

// عمود "الإجابة الصحيحة" في ملفات جاهزة نادرًا ما يكون رقمًا نظيفًا من 1-5 — قد يكون حرفًا
// (A/B/C أو أ/ب/ج)، كلمة ترتيبية عربية أو إنجليزية، أو رقمًا بترقيم عربي هندي (١٢٣). هذه
// الدالة تحاول تفسير كل هذه الصيغ الشائعة وتُرجع رقمًا من 1 إلى 5، أو NaN لو غير مفهومة.
var CORRECT_ANSWER_WORD_MAP_ = {
  'a': 1, 'b': 2, 'c': 3, 'd': 4, 'e': 5,
  'أ': 1, 'إ': 1, 'ا': 1, 'آ': 1, 'ب': 2, 'ج': 3, 'د': 4, 'ه': 5, 'و': 5,
  'اول': 1, 'ثاني': 2, 'ثالث': 3, 'رابع': 4, 'خامس': 5,
  'first': 1, 'second': 2, 'third': 3, 'fourth': 4, 'fifth': 5
};
function parseCorrectAnswerIndex(raw) {
  if (raw == null) return NaN;
  var s = String(raw).trim().replace(/ـ/g, ''); // إزالة التطويل (هـ → ه)
  if (!s) return NaN;
  s = s.replace(/[٠-٩]/g, function (d) { return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)); }); // أرقام عربية هندية → لاتينية
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  var key = s.replace(/\s+/g, '').replace(/^ال/, '').toLowerCase();
  return CORRECT_ANSWER_WORD_MAP_.hasOwnProperty(key) ? CORRECT_ANSWER_WORD_MAP_[key] : NaN;
}

// تخمين مبدئي لأي عمود بالملف يوافق كل حقل، بمطابقة أسماء الأعمدة الشائعة — نقطة بداية
// معدَّلة يدويًا عبر قائمة الاختيار المنسدلة، وليست الاعتماد الوحيد (خلافًا للنسخة الأولى).
function guessColumnMapping(headers) {
  var find = function (pred) { return headers.find(pred) || ''; };
  return {
    question: find(function (h) { return normalizeHeaderKey(h).indexOf('السؤال') > -1; }),
    options: [1, 2, 3, 4, 5].map(function (n) {
      return find(function (h) {
        var nk = normalizeHeaderKey(h);
        return nk.indexOf('الاختيار') > -1 && nk.indexOf(String(n)) > -1;
      });
    }),
    correct: find(function (h) { return normalizeHeaderKey(h).indexOf('الإجابة') > -1; })
  };
}

function renderColumnOptions(headers, selected) {
  return '<option value="">— اختر عمودًا —</option>' + headers.map(function (h) {
    return '<option value="' + escapeHtml(h) + '"' + (h === selected ? ' selected' : '') + '>' + escapeHtml(h) + '</option>';
  }).join('');
}

function renderMappingGrid(headers, guess) {
  var wrap = document.getElementById('examImportMappingGrid');
  if (!wrap) return;
  var fields = [
    { key: 'question', label: 'عمود نص السؤال', wide: true, value: guess.question },
    { key: 'option1', label: 'عمود الاختيار 1', value: guess.options[0] },
    { key: 'option2', label: 'عمود الاختيار 2', value: guess.options[1] },
    { key: 'option3', label: 'عمود الاختيار 3 (اختياري)', value: guess.options[2] },
    { key: 'option4', label: 'عمود الاختيار 4 (اختياري)', value: guess.options[3] },
    { key: 'option5', label: 'عمود الاختيار 5 (اختياري)', value: guess.options[4] },
    { key: 'correct', label: 'عمود الإجابة الصحيحة', wide: true, value: guess.correct }
  ];
  wrap.innerHTML = fields.map(function (f) {
    return '<label class="field' + (f.wide ? ' wide' : '') + '"><span>' + f.label + '</span><select data-map-field="' + f.key + '">' + renderColumnOptions(headers, f.value) + '</select></label>';
  }).join('');
}

// يحوّل صفوف sheet_to_json الخام لمصفوفة أسئلة صالحة لimportQuestionsBulk + قائمة أخطاء لكل
// صف مرفوض (بدون رمي استثناء — كل الصفوف السيئة تُعرَض للمستخدم بدل فشل الاستيراد كله)،
// حسب مطابقة الأعمدة الحالية (mapping) اللي اختارها المستخدم من القوائم المنسدلة.
function buildQuestionsFromMapping(rawRows, mapping) {
  if (!mapping.question) return { questions: [], errors: [], total: rawRows.length, blockingError: 'اختر عمود نص السؤال أولًا.' };
  var mappedOptionCount = mapping.options.filter(function (c) { return c; }).length;
  if (mappedOptionCount < 2) return { questions: [], errors: [], total: rawRows.length, blockingError: 'اختر عمودين على الأقل للاختيارات.' };
  if (!mapping.correct) return { questions: [], errors: [], total: rawRows.length, blockingError: 'اختر عمود الإجابة الصحيحة.' };

  var questions = [], errors = [];
  rawRows.forEach(function (row, idx) {
    var rowNum = idx + 2; // +1 لصف العناوين، +1 للترقيم من 1
    var text = String(row[mapping.question] == null ? '' : row[mapping.question]).trim();
    var slots = mapping.options.map(function (col) { return col ? String(row[col] == null ? '' : row[col]).trim() : ''; });
    if (!text && slots.every(function (s) { return !s; })) return; // صف فارغ تمامًا — تجاهل صامت

    if (!text) { errors.push({ row: rowNum, reason: 'بلا نص سؤال' }); return; }
    var filledCount = slots.filter(function (s) { return s; }).length;
    if (filledCount < 2) { errors.push({ row: rowNum, reason: 'أقل من اختيارين مكتوبين' }); return; }

    var correctRaw = row[mapping.correct];
    var correctNum = parseCorrectAnswerIndex(correctRaw);
    if (!isFinite(correctNum) || correctNum < 1 || correctNum > 5 || !slots[correctNum - 1]) {
      errors.push({ row: rowNum, reason: 'قيمة عمود الإجابة الصحيحة غير مفهومة ("' + correctRaw + '")' });
      return;
    }

    var options = [];
    slots.forEach(function (s, i) { if (s) options.push({ text: s, correct: (i + 1) === correctNum }); });
    questions.push({ text: text, options: options });
  });

  return { questions: questions, errors: errors, total: rawRows.length };
}

function renderImportPreview(el, result) {
  if (result.blockingError) {
    el.innerHTML = '<div class="warning-note"><i data-icon="triangle-alert"></i><span>' + escapeHtml(result.blockingError) + '</span></div>';
    refreshIcons();
    return;
  }
  var html = '<div class="import-summary">سيتم استيراد <strong>' + result.questions.length + '</strong> سؤالًا من أصل ' + result.total + ' صفًا بالملف.</div>';
  if (result.errors.length) {
    html += '<div class="warning-note"><i data-icon="triangle-alert"></i><span>تجاهُل ' + result.errors.length + ' صفًا بها مشاكل — راجع القائمة أدناه.</span></div>' +
      '<ul class="import-errors">' + result.errors.slice(0, 30).map(function (e) {
        return '<li>صف ' + e.row + ': ' + escapeHtml(e.reason) + '</li>';
      }).join('') + '</ul>';
    if (result.errors.length > 30) html += '<small>(و' + (result.errors.length - 30) + ' صفًا آخر بنفس النوع من المشاكل...)</small>';
  }
  el.innerHTML = html;
  refreshIcons();
}

function examImportExcelModal() {
  var ctx = getCurrentExamModel();
  if (!examEditorState_ || !ctx.model) { alertMSG('افتح نموذجًا أولًا', 'warning'); return; }

  var bodyHtml =
    '<p class="modal-note">اختر ملف إكسل جاهز بأعمدته الحالية أيًا كانت، ثم حدّد أي عمود يوافق كل حقل مطلوب أدناه. عمود الإجابة الصحيحة يقبل رقمًا (1-5)، حرفًا (A/B/C.. أو أ/ب/ج..)، أو كلمة ترتيبية (الأول/الثاني..) — تُحوَّل تلقائيًا. سيُضاف كل سؤال صالح إلى <strong>' + escapeHtml(ctx.model.name) + '</strong> — اختبار <strong>' + escapeHtml(examEditorState_.mazhab ? (examEditorState_.name + ' — ' + examEditorState_.mazhab) : examEditorState_.name) + '</strong>.</p>' +
    '<button class="text-button" id="examImportTemplateBtn" type="button"><i data-icon="download"></i>تنزيل نموذج فارغ (إكسل)</button>' +
    '<label class="field wide" style="margin-top:12px"><span>اختر ملف إكسل</span><input type="file" id="examImportFileInput" accept=".xlsx,.xls"></label>' +
    '<div id="examImportMappingWrap" hidden><h3 class="import-mapping-title">مطابقة الأعمدة</h3><div class="form-grid" id="examImportMappingGrid"></div></div>' +
    '<div id="examImportPreview"></div>';
  var footerHtml = '<button class="secondary-button" type="button" onclick="closeActionModal()">إلغاء</button>' +
    '<button class="primary-button" id="examImportConfirmBtn" type="button" disabled>استيراد</button>';
  openActionModal('استيراد أسئلة من إكسل', 'محرر الأسئلة', bodyHtml, footerHtml);

  var rawRows = [];
  var parsedQuestions = [];
  var mappingWrap = document.getElementById('examImportMappingWrap');

  function currentMapping() {
    var get = function (key) { var el = document.querySelector('#examImportMappingGrid [data-map-field="' + key + '"]'); return el ? el.value : ''; };
    return { question: get('question'), options: ['option1', 'option2', 'option3', 'option4', 'option5'].map(get), correct: get('correct') };
  }

  function refreshPreview() {
    var preview = document.getElementById('examImportPreview');
    var confirmBtn = document.getElementById('examImportConfirmBtn');
    var result = buildQuestionsFromMapping(rawRows, currentMapping());
    parsedQuestions = result.questions;
    if (preview) renderImportPreview(preview, result);
    if (confirmBtn) confirmBtn.disabled = parsedQuestions.length === 0;
  }

  var templateBtn = document.getElementById('examImportTemplateBtn');
  if (templateBtn) templateBtn.addEventListener('click', function () {
    exportRowsToExcel({
      title: 'قالب استيراد الأسئلة',
      filename: 'قالب_استيراد_الأسئلة',
      rows: [{
        'السؤال': 'مثال: كم عدد أركان الإسلام؟',
        'الاختيار 1': 'ثلاثة',
        'الاختيار 2': 'أربعة',
        'الاختيار 3': 'خمسة',
        'الاختيار 4': 'ستة',
        'الاختيار 5': '',
        'الإجابة الصحيحة': 3
      }]
    });
  });

  if (mappingWrap) mappingWrap.addEventListener('change', function (e) {
    if (e.target.hasAttribute('data-map-field')) refreshPreview();
  });

  var fileInput = document.getElementById('examImportFileInput');
  if (fileInput) fileInput.addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    var preview = document.getElementById('examImportPreview');
    var confirmBtn = document.getElementById('examImportConfirmBtn');
    if (mappingWrap) mappingWrap.hidden = true;
    rawRows = []; parsedQuestions = [];
    if (confirmBtn) confirmBtn.disabled = true;
    if (preview) preview.innerHTML = '';
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function (evt) {
      try {
        var data = new Uint8Array(evt.target.result);
        var wb = XLSX.read(data, { type: 'array' });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var headerRow = (XLSX.utils.sheet_to_json(ws, { header: 1 })[0] || [])
          .map(function (h) { return String(h == null ? '' : h).trim(); }).filter(function (h) { return h; });
        if (!headerRow.length) {
          if (preview) preview.innerHTML = '<div class="warning-note"><i data-icon="triangle-alert"></i><span>لم يُعثر على صف عناوين بالملف.</span></div>';
          refreshIcons();
          return;
        }
        rawRows = XLSX.utils.sheet_to_json(ws, { defval: '' });
        renderMappingGrid(headerRow, guessColumnMapping(headerRow));
        if (mappingWrap) mappingWrap.hidden = false;
        refreshIcons();
        refreshPreview();
      } catch (err) {
        if (preview) preview.innerHTML = '<div class="warning-note"><i data-icon="triangle-alert"></i><span>تعذّر قراءة الملف: ' + escapeHtml(String(err)) + '</span></div>';
        refreshIcons();
      }
    };
    reader.readAsArrayBuffer(file);
  });

  var confirmBtn = document.getElementById('examImportConfirmBtn');
  if (confirmBtn) confirmBtn.addEventListener('click', function () {
    if (!parsedQuestions.length) return;
    var examId = examsCurrentExamId_, modelId = ctx.model.id, mazhab = examEditorState_ && examEditorState_.mazhab;
    confirmBtn.disabled = true;
    google.script.run.withSuccessHandler(function (res) {
      confirmBtn.disabled = false;
      if (!res || res.error) { alertMSG((res && res.message) || 'تعذّر استيراد الأسئلة', 'error'); return; }
      closeActionModal();
      alertMSG('تم استيراد ' + res.imported + ' سؤالًا مكتملًا؛ النموذج بانتظار الاعتماد', 'success');
      examsCurrentModelId_ = modelId;
      openExamEditor(examId, mazhab);
    }).withFailureHandler(function (err) {
      confirmBtn.disabled = false;
      alertMSG('تعذّر استيراد الأسئلة: ' + err, 'error');
    }).importQuestionsBulk(getCurrentUserCpr(), examId, modelId, parsedQuestions, mazhab || null);
  });

  refreshIcons();
}

/* ==========================================================================
   مودال "إحصائية الاستبانات" — استبانتا قبل/بعد الاختبار (surveys بـanswersData،
   getExamSurveyStats بdataGet.js). رسم بياني بشكل أشرطة أفقية بنفس قالب .stage-bars
   المستخدَم أصلًا بلوحة المعلومات (توزيع الطلاب حسب الأعمار/المناطق)، وتصدير التقرير
   كصفحة مصمَّمة عبر نافذة طباعة مستقلة (نفس أسلوب exportRowsToPDF بexport-js.html).
   ========================================================================== */
var SURVEY_RATING_COLORS_ = ['#c6373e', '#cf6f3e', '#a77d52', '#5a9c6a', '#24875a'];

function openExamSurveyStatsModal(examId) {
  var exam = examsData_.find(function (x) { return String(x.id) === String(examId); });
  if (!exam) return;
  var levelName = (exam.stage !== null && exam.stage !== undefined) ? getLevelName(exam.stage) : '';
  var bodyHtml = '<div id="surveyStatsBody"><p class="empty-note">جاري تحميل الإحصائية...</p></div>';
  var footerHtml = '<button class="secondary-button" type="button" onclick="closeActionModal()">إغلاق</button>' +
    '<button class="primary-button" id="surveyStatsExportBtn" type="button" onclick="exportSurveyStatsReport()" disabled><i data-icon="download"></i>تصدير التقرير</button>';
  openActionModal('إحصائية الاستبانات — ' + exam.name + (levelName ? ' / ' + levelName : ''), 'إدارة الاختبارات', bodyHtml, footerHtml, true);

  google.script.run.withSuccessHandler(function (stats) {
    renderSurveyStatsModalBody(stats, exam, levelName);
  }).withFailureHandler(function (err) {
    var body = document.getElementById('surveyStatsBody');
    if (body) body.innerHTML = '<p class="empty-note" style="color:var(--danger)">تعذّر تحميل الإحصائية: ' + escapeHtml(String(err)) + '</p>';
  }).getExamSurveyStats(exam.name, exam.level);
}

// بطاقة سؤال واحد: حلقة "الإجمالي" الزخرفية بنفس تصميم حلقة "الإجمالي" بلوحة المعلومات
// (adminDashboard.html: .stage-total، توزيع الطلاب حسب المراحل) + شريط توزيع التقييمات
// الأفقي القائم أصلًا (stage-bars)، جنبًا إلى جنب داخل بطاقة واحدة.
function surveyStatFieldHtml(field) {
  var barsHtml = field.dist.map(function (count, i) {
    var pct = field.count ? Math.round((count / field.count) * 100) : 0;
    return '<div><span>' + escapeHtml(field.options[i]) + '<small>' + count + ' (' + pct + '%)</small></span><div><i style="width:' + pct + '%;background:' + SURVEY_RATING_COLORS_[i] + '"></i></div></div>';
  }).join('');
  var avgBadge = field.count ? ('<span class="soft-badge ' + (field.avg >= 3.5 ? 'green' : 'pink') + '">' + field.avg.toFixed(1) + ' / 5</span>') : '<span class="soft-badge">—</span>';
  return '<div class="panel survey-field-card">' +
    '<div class="survey-field-card-header"><span>' + escapeHtml(field.label) + '</span>' + avgBadge + '</div>' +
    '<div class="stage-chart">' +
      '<div class="stage-total"><span>الإجمالي</span><strong>' + field.count + '</strong><small>ردًا</small></div>' +
      '<div class="stage-bars">' + barsHtml + '</div>' +
    '</div>' +
  '</div>';
}

// بطاقتان جنبًا إلى جنب على الشاشات الكبيرة، بطاقة واحدة على الهاتف
function surveyStatFieldsGridHtml(fields) {
  return '<div class="survey-fields-grid">' + fields.map(surveyStatFieldHtml).join('') + '</div>';
}

// مجموعة أسئلة تحت عنوان فرعي واحد (المادة المقررة/المحاضر/تقييم عام)
function surveyStatGroupHtml(title, fields) {
  return '<div class="survey-stat-group"><h4 class="survey-stat-group-title">' + escapeHtml(title) + '</h4>' + surveyStatFieldsGridHtml(fields) + '</div>';
}

function surveyStatCommentsCardHtml(comments) {
  if (!comments.length) return '';
  return '<div class="panel survey-comments-card"><h4>آخر الملاحظات</h4><div class="survey-comments">' + comments.map(function (c) { return '<blockquote>' + escapeHtml(c) + '</blockquote>'; }).join('') + '</div></div>';
}

// isPre: استبانة ما قبل الاختبار تُعرَض على مجموعات (survey.groups) + سؤال عام مستقل
// (survey.standalone)، أما ما بعد الاختبار فأسئلة مستقلة فقط (لا تجميع، الاستبانة كلها
// عن الاختبار نفسه أصلًا).
function surveyStatSectionHtml(survey, title, isPre) {
  var countLabel = survey.count ? (survey.count + ' ردًا') : 'لا توجد ردود بعد';
  var innerHtml;
  if (!survey.count) {
    innerHtml = '<p class="empty-note">لم يُشارك أي طالب في هذه الاستبانة بعد.</p>';
  } else if (isPre) {
    innerHtml = survey.groups.map(function (g) { return surveyStatGroupHtml(g.title, g.fields); }).join('') +
      surveyStatGroupHtml('تقييم عام', survey.standalone);
  } else {
    innerHtml = surveyStatFieldsGridHtml(survey.standalone);
  }
  var commentsHtml = surveyStatCommentsCardHtml(survey.comments);
  return '<section class="survey-stat-block"><header class="survey-stat-header"><h3>' + escapeHtml(title) + '</h3><small>' + escapeHtml(countLabel) + '</small></header>' + innerHtml + commentsHtml + '</section>';
}

function renderSurveyStatsModalBody(stats, exam, levelName) {
  lastSurveyStats_ = stats;
  lastSurveyStatsExam_ = { name: exam.name, level: exam.level, levelName: levelName };
  var body = document.getElementById('surveyStatsBody');
  if (body) body.innerHTML = surveyStatSectionHtml(stats.pre, 'استبانة ما قبل الاختبار', true) + surveyStatSectionHtml(stats.post, 'استبانة ما بعد الاختبار', false);
  var exportBtn = document.getElementById('surveyStatsExportBtn');
  if (exportBtn) exportBtn.disabled = !(stats.pre.count || stats.post.count);
  refreshIcons();
}

// تقرير مصوَّر مستقل لكامل محتوى المودال — نافذة طباعة منفصلة بنفس هوية بصائر البصرية
// (شعار/ألوان/خط) بدلًا من استدعاء exportRowsToPDF (مصمَّمة لتصدير جداول بيانات فقط، لا
// تخطيط أشرطة بيانية حرة كهذا). آخر إحصائية مُحمَّلة (lastSurveyStats_) تُصدَّر كما هي —
// بلا إعادة طلب من الخادم.
function exportSurveyStatsReport() {
  if (!lastSurveyStats_ || !lastSurveyStatsExam_) return;
  var stats = lastSurveyStats_, examInfo = lastSurveyStatsExam_;
  var reportDate = new Intl.DateTimeFormat('ar-BH', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date());
  var logoUrl = 'https://drive.google.com/thumbnail?id=1iOIJNIzjaUi55iSEtqGzubUp7ZhDkdbX&sz=w300';
  var printWindow = window.open('', '_blank');
  if (!printWindow) { alertMSG('تعذّر فتح نافذة المعاينة؛ يرجى السماح بالنوافذ المنبثقة ثم إعادة المحاولة', 'error'); return; }

  function esc(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function fieldHtml(field) {
    var rows = field.dist.map(function (count, i) {
      var pct = field.count ? Math.round((count / field.count) * 100) : 0;
      return '<div class="rpt-bar-row"><span>' + esc(field.options[i]) + '<b>' + count + ' (' + pct + '%)</b></span><div class="rpt-bar-track"><i style="width:' + pct + '%;background:' + SURVEY_RATING_COLORS_[i] + '"></i></div></div>';
    }).join('');
    return '<div class="rpt-field-card">' +
      '<div class="rpt-field-card-header"><span>' + esc(field.label) + '</span><em>' + (field.count ? field.avg.toFixed(1) + ' / 5' : '—') + '</em></div>' +
      '<div class="rpt-ring-row">' +
        '<div class="rpt-ring"><span>الإجمالي</span><strong>' + field.count + '</strong><small>ردًا</small></div>' +
        '<div class="rpt-bars">' + rows + '</div>' +
      '</div>' +
    '</div>';
  }
  function fieldsGridHtml(fields) { return '<div class="rpt-fields-grid">' + fields.map(fieldHtml).join('') + '</div>'; }
  function groupHtml(title, fields) { return '<div class="rpt-group"><h4 class="rpt-group-title">' + esc(title) + '</h4>' + fieldsGridHtml(fields) + '</div>'; }
  function sectionHtml(survey, title, isPre) {
    if (!survey.count) return '<section class="rpt-survey"><h3>' + title + '</h3><p class="rpt-empty">لا توجد ردود بعد</p></section>';
    var fieldsHtml = isPre
      ? survey.groups.map(function (g) { return groupHtml(g.title, g.fields); }).join('') + groupHtml('تقييم عام', survey.standalone)
      : fieldsGridHtml(survey.standalone);
    return '<section class="rpt-survey"><h3>' + title + ' <small>(' + survey.count + ' ردًا)</small></h3>' + fieldsHtml + '</section>';
  }
  function commentsHtml(comments, title) {
    return '<section class="rpt-survey"><h3>ملاحظات ' + title + '</h3><div class="rpt-comments-card">' +
      comments.map(function (c) { return '<blockquote>' + esc(c) + '</blockquote>'; }).join('') + '</div></section>';
  }

  var examLabel = examInfo.name + (examInfo.levelName ? ' — ' + examInfo.levelName : '');
  var brandHtml = '<div class="brand-header"><div><h2>تقرير إحصائية الاستبانات</h2><h4>' + esc(examLabel) + ' — <span class="date-accent">' + reportDate + '</span></h4></div><img class="rpt-logo" src="' + logoUrl + '" alt="بصائر"></div>';

  // كل استبانة (وملاحظاتها إن وُجدت) صفحة PDF مستقلة كاملة (ترويسة+تذييل خاصان بها)، بدل
  // الاعتماد على page-break-before داخل صندوق واحد متصل — نفس أسلوب exportRowsToPDF
  // (export-js.html): الهامش العلوي لصندوق مُجزَّأ بالطباعة لا يتكرر مع كل صفحة جديدة في
  // معظم المتصفحات (درس مستفاد سابقًا وموثَّق بنفس الدالة)، فالحل الموثوق صفحة <div> مستقلة
  // بهامشها (padding) الحقيقي الكامل لكل جزء من التقرير.
  var pageContents = [sectionHtml(stats.pre, 'استبانة ما قبل الاختبار', true)];
  if (stats.pre.comments.length) pageContents.push(commentsHtml(stats.pre.comments, 'استبانة ما قبل الاختبار'));
  pageContents.push(sectionHtml(stats.post, 'استبانة ما بعد الاختبار', false));
  if (stats.post.comments.length) pageContents.push(commentsHtml(stats.post.comments, 'استبانة ما بعد الاختبار'));

  var totalPages = pageContents.length;
  var pagesHtml = pageContents.map(function (content, i) {
    var isLast = i === pageContents.length - 1;
    return '<div class="rpt-page' + (isLast ? '' : ' rpt-page-break-after') + '">' +
      brandHtml + content +
      '<div class="pdf-footer"><span>أكاديمية بصائر للعلوم الشرعية</span><span>صفحة ' + (i + 1) + ' من ' + totalPages + '</span></div>' +
    '</div>';
  }).join('');

  var css =
    "body{font-family:'IBM Plex Sans Arabic',sans-serif;margin:0;color:#20252d;}" +
    '.rpt-page{width:210mm;min-height:297mm;padding:16mm 14mm;box-sizing:border-box;display:flex;flex-direction:column;}' +
    '.rpt-page-break-after{page-break-after:always;}' +
    '.brand-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #b5262c;padding-bottom:10px;margin-bottom:16px;}' +
    '.brand-header h2{margin:0;font-size:19px;color:#8d1d22;}.brand-header h4{margin:5px 0 0;font-size:12px;color:#555;font-weight:600;}' +
    '.brand-header img{height:52px;}.date-accent{font-weight:bold;color:#b5262c;}' +
    '.rpt-survey{margin-bottom:22px;page-break-inside:avoid;}' +
    '.rpt-survey>h3{margin:0 0 12px;font-size:15px;color:#8d1d22;border-right:4px solid #b5262c;padding-right:8px;}' +
    '.rpt-survey>h3 small{color:#777;font-weight:600;font-size:11px;}' +
    '.rpt-empty{color:#888;font-size:12px;}' +
    '.rpt-group{margin-bottom:14px;page-break-inside:avoid;}' +
    '.rpt-group-title{margin:0 0 8px;padding-right:8px;border-right:3px solid #b5262c;font-size:12px;font-weight:800;color:#8d1d22;}' +
    '.rpt-fields-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px;}' +
    '.rpt-field-card{border:1px solid #e5e5e5;border-radius:7px;padding:8px 9px;page-break-inside:avoid;}' +
    '.rpt-field-card-header{display:flex;justify-content:space-between;gap:4px;margin-bottom:7px;font-size:9.5px;font-weight:700;}' +
    '.rpt-field-card-header span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}' +
    '.rpt-field-card-header em{flex:0 0 auto;font-style:normal;font-weight:800;color:#b5262c;}' +
    '.rpt-ring-row{display:flex;align-items:center;gap:7px;}' +
    '.rpt-ring{flex:0 0 54px;width:54px;height:54px;border-radius:50%;border:7px solid #f2e4e5;border-top-color:#b5262c;border-right-color:#a77d52;display:grid;place-content:center;text-align:center;}' +
    '.rpt-ring span,.rpt-ring small{display:block;font-size:6px;color:#888;}' +
    '.rpt-ring strong{display:block;margin:1px 0;font-size:12px;color:#20252d;}' +
    '.rpt-bars{flex:1;min-width:0;}' +
    '.rpt-bar-row{margin-bottom:3px;}' +
    '.rpt-bar-row>span{display:flex;justify-content:space-between;gap:4px;margin-bottom:2px;font-size:7px;color:#555;}' +
    '.rpt-bar-track{height:6px;border-radius:4px;background:#eef0f2;overflow:hidden;}' +
    '.rpt-bar-track i{display:block;height:100%;border-radius:inherit;}' +
    '.rpt-comments-card{border:1px solid #e5e5e5;border-radius:8px;padding:10px 12px;margin-top:4px;}' +
    '.rpt-comments-card blockquote{margin:0 0 5px;padding:6px 10px;border-right:3px solid #ddd;background:#f7f9fa;border-radius:5px;font-size:10px;color:#555;}' +
    '.pdf-footer{display:flex;justify-content:space-between;margin-top:auto;padding-top:6px;border-top:1px solid #ddd;font-size:10px;color:#777;}';

  printWindow.document.open();
  printWindow.document.write(
    '<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>تقرير الاستبانات - ' + esc(examLabel) + '</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">' +
    '<style>@page{size:A4;margin:0;}' + css + '</style></head><body>' +
    pagesHtml +
    '<script>window.onload=function(){var img=document.querySelector(".rpt-logo");function go(){setTimeout(function(){window.print();window.close();},400);}if(!img||img.complete){go();}else{img.addEventListener("load",go);img.addEventListener("error",go);}}<\/script>' +
    '</body></html>'
  );
  printWindow.document.close();
}

function setupExamsControls() {
  if (examsControlsBound_) return;
  examsControlsBound_ = true;

  var createBtn = document.getElementById('createExamBtn');
  if (createBtn) createBtn.addEventListener('click', function () { examModal(null); });

  var statusFilter = document.getElementById('examStatusFilter');
  if (statusFilter) statusFilter.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-exam-status]');
    if (!btn) return;
    statusFilter.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    examsStatusFilter_ = btn.getAttribute('data-exam-status');
    renderExamsTable();
  });

  var stageFilter = document.getElementById('examStageFilter');
  if (stageFilter) stageFilter.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-exam-stage]');
    if (!btn) return;
    stageFilter.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    examsStageFilter_ = btn.getAttribute('data-exam-stage');
    renderExamsTable();
  });

  var searchInp = document.getElementById('examSearchInput');
  if (searchInp) searchInp.addEventListener('input', function () {
    examsSearchQuery_ = searchInp.value || '';
    renderExamsTable();
  });

  var examTable = document.getElementById('examTable');
  if (examTable) examTable.querySelectorAll('th[data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      var key = th.getAttribute('data-sort');
      if (examsSortField_ === key) examsSortDir_ = examsSortDir_ === 'asc' ? 'desc' : 'asc';
      else { examsSortField_ = key; examsSortDir_ = 'asc'; }
      renderExamsTable();
    });
  });

  // إغلاق أي قائمة إجراءات مفتوحة عند الضغط خارجها (خارج .exam-actions-menu) — مُسجَّلة هنا
  // مرة واحدة فقط بفضل حارس examsControlsBound_ أعلى الدالة.
  document.addEventListener('click', function (e) {
    if (e.target.closest('.exam-actions-menu')) return;
    document.querySelectorAll('.exam-actions-list.open').forEach(function (l) { l.classList.remove('open'); });
  });

  var examRowsEl = document.getElementById('examRows');
  if (examRowsEl) examRowsEl.addEventListener('click', function (e) {
    var toggleBtn = e.target.closest('.exam-actions-toggle');
    if (toggleBtn) {
      var list = toggleBtn.nextElementSibling;
      var willOpen = !list.classList.contains('open');
      document.querySelectorAll('.exam-actions-list.open').forEach(function (l) { l.classList.remove('open'); });
      if (willOpen) list.classList.add('open');
      toggleBtn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
      return;
    }
    var qBtn = e.target.closest('.exam-questions');
    if (qBtn) { openExamEditor(qBtn.getAttribute('data-id')); return; }
    var editBtn = e.target.closest('.exam-edit');
    if (editBtn) { examModal(examsData_.find(function (x) { return String(x.id) === editBtn.getAttribute('data-id'); })); return; }
    var dupBtn = e.target.closest('.exam-duplicate');
    if (dupBtn) {
      dupBtn.disabled = true;
      google.script.run.withSuccessHandler(function (res) {
        dupBtn.disabled = false;
        if (!res || res.error) { alertMSG((res && res.message) || 'تعذّر نسخ الاختبار', 'error'); return; }
        alertMSG('تم نسخ الاختبار', 'success');
        loadExamsView();
      }).withFailureHandler(function (err) {
        dupBtn.disabled = false;
        alertMSG('تعذّر نسخ الاختبار: ' + err, 'error');
      }).duplicateExam(getCurrentUserCpr(), dupBtn.getAttribute('data-id'));
      return;
    }
    var retakeBtn = e.target.closest('.exam-retake-toggle');
    if (retakeBtn) {
      var retakeId = retakeBtn.getAttribute('data-id');
      var nextOpen = retakeBtn.getAttribute('data-open') !== '1';
      retakeBtn.disabled = true;
      google.script.run.withSuccessHandler(function (res) {
        retakeBtn.disabled = false;
        if (!res || res.error) { alertMSG((res && res.message) || 'تعذّر تحديث حالة إعادة المحاولة', 'error'); return; }
        alertMSG(nextOpen ? 'تم فتح إعادة المحاولة لمن رسب في هذا الاختبار' : 'تم إغلاق إعادة المحاولة', 'success');
        loadExamsView();
      }).withFailureHandler(function (err) {
        retakeBtn.disabled = false;
        alertMSG('تعذّر تحديث حالة إعادة المحاولة: ' + err, 'error');
      }).setExamRetakeOpen(getCurrentUserCpr(), retakeId, nextOpen);
      return;
    }
    var delBtn = e.target.closest('.exam-delete');
    if (delBtn) {
      var id = delBtn.getAttribute('data-id');
      var exam = examsData_.find(function (x) { return String(x.id) === id; });
      if (!exam) return;
      Swal.fire({ title: 'حذف الاختبار؟', text: 'سيُخفى "' + exam.name + '" عن الطلاب والقوائم (تُحفظ بياناته ولا تُحذف فعليًا)', icon: 'warning', showCancelButton: true, confirmButtonColor: '#c6373e', confirmButtonText: 'نعم، احذف', cancelButtonText: 'إلغاء' }).then(function (result) {
        if (!result.isConfirmed) return;
        google.script.run.withSuccessHandler(function (res) {
          if (!res || res.error) { alertMSG((res && res.message) || 'تعذّر حذف الاختبار', 'error'); return; }
          alertMSG('تم حذف الاختبار', 'success');
          loadExamsView();
        }).withFailureHandler(function (err) {
          alertMSG('تعذّر حذف الاختبار: ' + err, 'error');
        }).archiveExam(getCurrentUserCpr(), id);
      });
      return;
    }
    var restoreBtn = e.target.closest('.exam-restore');
    if (restoreBtn) {
      var restoreId = restoreBtn.getAttribute('data-id');
      restoreBtn.disabled = true;
      google.script.run.withSuccessHandler(function (res) {
        restoreBtn.disabled = false;
        if (!res || res.error) { alertMSG((res && res.message) || 'تعذّر استعادة الاختبار', 'error'); return; }
        alertMSG('تمت استعادة الاختبار', 'success');
        loadExamsView();
      }).withFailureHandler(function (err) {
        restoreBtn.disabled = false;
        alertMSG('تعذّر استعادة الاختبار: ' + err, 'error');
      }).unarchiveExam(getCurrentUserCpr(), restoreId);
      return;
    }
    var surveyBtn = e.target.closest('.exam-survey-stats');
    if (surveyBtn) { openExamSurveyStatsModal(surveyBtn.getAttribute('data-id')); return; }
  });

  // ===== محرر الأسئلة: كل الربط بالتفويض (delegation) لأن #questionNav/#examQuestionForm
  // يُعاد بناء محتواهما بالكامل عند كل تغيير حالة =====
  var mazhabTabs = document.getElementById('examMazhabTabs');
  if (mazhabTabs) mazhabTabs.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-mazhab]');
    if (!btn || !examEditorState_) return;
    var chosen = btn.getAttribute('data-mazhab');
    if (chosen === examEditorState_.mazhab) return;
    openExamEditor(examsCurrentExamId_, chosen);
  });

  var modelTabs = document.getElementById('examModelTabs');
  if (modelTabs) modelTabs.addEventListener('click', function (e) {
    if (e.target.closest('#examAddModelBtn')) {
      var exam = examEditorState_;
      if (!exam) return;
      var newModel = { id: String(examEditorModelCounter_++), name: 'نموذج ' + (exam.models.length + 1), status: 'draft', questions: [] };
      exam.models.push(newModel);
      examsCurrentModelId_ = newModel.id;
      examsCurrentQuestionId_ = null;
      renderExamEditor();
      return;
    }
    var tabBtn = e.target.closest('button[data-model-id]');
    if (tabBtn) {
      examsCurrentModelId_ = tabBtn.getAttribute('data-model-id');
      var ctx = getCurrentExamModel();
      examsCurrentQuestionId_ = (ctx.model && ctx.model.questions.length) ? ctx.model.questions[0].id : null;
      renderExamModelTabs(); renderExamQuestionNav(); renderExamQuestionForm(); renderExamSummary();
    }
  });

  var modelApprovalBtn = document.getElementById('examModelApprovalBtn');
  if (modelApprovalBtn) modelApprovalBtn.addEventListener('click', function () {
    var ctx = getCurrentExamModel();
    if (!ctx.model || !examEditorState_) return;
    var approve = ctx.model.status !== 'approved';
    modelApprovalBtn.disabled = true;
    google.script.run.withSuccessHandler(function (res) {
      modelApprovalBtn.disabled = false;
      if (!res || res.error) { alertMSG((res && res.message) || 'تعذّر تحديث اعتماد النموذج', 'error'); return; }
      ctx.model.status = res.status;
      renderExamModelTabs(); renderExamSummary();
      alertMSG(approve ? 'تم اعتماد النموذج وأصبح متاحًا للاختيار' : 'أُلغي اعتماد النموذج وأصبح مسودة', 'success');
    }).withFailureHandler(function (err) {
      modelApprovalBtn.disabled = false;
      alertMSG('تعذّر تحديث اعتماد النموذج: ' + err, 'error');
    }).setExamModelApproval(getCurrentUserCpr(), examsCurrentExamId_, ctx.model.id, examEditorState_.mazhab || null, approve);
  });

  var deleteModelBtn = document.getElementById('examDeleteModelBtn');
  if (deleteModelBtn) deleteModelBtn.addEventListener('click', function () {
    var ctx = getCurrentExamModel();
    if (!ctx.model || !examEditorState_) return;
    var modelId = ctx.model.id;
    var modelName = ctx.model.name;
    var questionCount = ctx.model.questions.length;
    Swal.fire({
      title: 'حذف النموذج كاملًا؟',
      html: 'سيُحذف <strong>' + escapeHtml(modelName) + '</strong> مع ' + questionCount + ' سؤالًا حذفًا نهائيًا، كما سيُلغى اعتماده إن كان معتمدًا.',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#c6373e',
      confirmButtonText: 'نعم، احذف النموذج',
      cancelButtonText: 'إلغاء'
    }).then(function (result) {
      if (!result.isConfirmed) return;
      deleteModelBtn.disabled = true;
      google.script.run.withSuccessHandler(function (res) {
        deleteModelBtn.disabled = false;
        if (!res || res.error) { alertMSG((res && res.message) || 'تعذّر حذف النموذج', 'error'); return; }

        var exam = examEditorState_;
        var deletedIndex = exam.models.findIndex(function (model) { return String(model.id) === String(modelId); });
        exam.models = exam.models.filter(function (model) { return String(model.id) !== String(modelId); });
        if (!exam.models.length) {
          exam.models = [{ id: '1', name: 'نموذج 1', status: 'draft', questions: [] }];
          examEditorModelCounter_ = 2;
          deletedIndex = 0;
        }
        var nextModel = exam.models[Math.min(Math.max(deletedIndex, 0), exam.models.length - 1)];
        examsCurrentModelId_ = nextModel.id;
        examsCurrentQuestionId_ = nextModel.questions.length ? nextModel.questions[0].id : null;
        renderExamEditor();
        alertMSG('تم حذف النموذج كاملًا مع ' + (res.deletedQuestions || 0) + ' سؤالًا', 'success');
      }).withFailureHandler(function (err) {
        deleteModelBtn.disabled = false;
        alertMSG('تعذّر حذف النموذج: ' + err, 'error');
      }).deleteExamModel(getCurrentUserCpr(), examsCurrentExamId_, modelId, examEditorState_.mazhab || null);
    });
  });

  var questionNav = document.getElementById('questionNav');
  if (questionNav) questionNav.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-question-id]');
    if (!btn) return;
    examsCurrentQuestionId_ = btn.getAttribute('data-question-id');
    renderExamQuestionNav(); renderExamQuestionForm();
  });

  var addQBtn = document.getElementById('examAddQuestionBtn');
  if (addQBtn) addQBtn.addEventListener('click', addNewExamQuestion);
  var addQTopBtn = document.getElementById('examAddQuestionTopBtn');
  if (addQTopBtn) addQTopBtn.addEventListener('click', addNewExamQuestion);
  var importExcelBtn = document.getElementById('examImportExcelBtn');
  if (importExcelBtn) importExcelBtn.addEventListener('click', examImportExcelModal);
  var exportExcelBtn = document.getElementById('examExportExcelBtn');
  if (exportExcelBtn) exportExcelBtn.addEventListener('click', exportCurrentExamQuestions);

  var qForm = document.getElementById('examQuestionForm');
  if (qForm) {
    qForm.addEventListener('input', function (e) {
      var ctx = getCurrentExamModel();
      var q = ctx.model ? ctx.model.questions.find(function (x) { return x.id === examsCurrentQuestionId_; }) : null;
      if (!q) return;
      if (e.target.id === 'examQuestionText') {
        q.text = e.target.value;
        var countEl = document.getElementById('examQuestionTextCount');
        if (countEl) countEl.textContent = e.target.value.length;
      } else if (e.target.hasAttribute('data-option-text-id')) {
        var optId = parseInt(e.target.getAttribute('data-option-text-id'), 10);
        var opt = q.options.find(function (o) { return o.id === optId; });
        if (opt) opt.text = e.target.value;
      }
    });

    qForm.addEventListener('change', function (e) {
      if (e.target.type === 'radio' && e.target.hasAttribute('data-option-id')) {
        var ctx = getCurrentExamModel();
        var q = ctx.model ? ctx.model.questions.find(function (x) { return x.id === examsCurrentQuestionId_; }) : null;
        if (!q) return;
        var optId = parseInt(e.target.getAttribute('data-option-id'), 10);
        q.options.forEach(function (o) { o.correct = (o.id === optId); });
        renderExamAnswerOptions(q);
      }
    });

    // حفظ حقيقي بشيت questions (saveQuestion بالخادم) — يستبدل معرّف السؤال المؤقت
    // (new_...) بمعرّف الخادم الحقيقي عند النجاح، فالحفظ التالي لنفس السؤال يُحدِّثه بدل
    // تكراره كسؤال جديد. الزران يُعطَّلان أثناء الطلب لمنع تكرار الضغط.
    function saveCurrentQuestion(onDone) {
      var ctx = getCurrentExamModel();
      var q = ctx.model ? ctx.model.questions.find(function (x) { return x.id === examsCurrentQuestionId_; }) : null;
      if (!q || !ctx.model || !examEditorState_) return;

      var saveBtn = document.getElementById('examSaveQBtn');
      var saveNextBtn = document.getElementById('examSaveNextQBtn');
      [saveBtn, saveNextBtn].forEach(function (b) { if (b) b.disabled = true; });

      google.script.run.withSuccessHandler(function (res) {
        [saveBtn, saveNextBtn].forEach(function (b) { if (b) b.disabled = false; });
        if (!res || res.error) { alertMSG((res && res.message) || 'تعذّر حفظ السؤال', 'error'); return; }
        q.id = res.id;
        ctx.model.status = res.modelStatus || 'draft';
        examsCurrentQuestionId_ = q.id;
        renderExamModelTabs(); renderExamQuestionNav(); renderExamSummary();
        alertMSG('تم حفظ السؤال', 'success');
        if (onDone) onDone(ctx.model, q);
      }).withFailureHandler(function (err) {
        [saveBtn, saveNextBtn].forEach(function (b) { if (b) b.disabled = false; });
        alertMSG('تعذّر حفظ السؤال: ' + err, 'error');
      }).saveQuestion(getCurrentUserCpr(), examsCurrentExamId_, ctx.model.id, { id: q.id, text: q.text, options: q.options }, examEditorState_.mazhab || null);
    }

    qForm.addEventListener('click', function (e) {
      var ctx = getCurrentExamModel();
      var q = ctx.model ? ctx.model.questions.find(function (x) { return x.id === examsCurrentQuestionId_; }) : null;

      if (e.target.closest('#examAddOptionBtn')) {
        if (!q) return;
        q.options.push({ id: examsNextId(), text: '', correct: false });
        renderExamAnswerOptions(q);
        var countSpan = qForm.querySelector('.answer-heading span');
        if (countSpan) countSpan.textContent = q.options.length + ' اختيارات';
        return;
      }
      var removeBtn = e.target.closest('[data-remove-option-id]');
      if (removeBtn) {
        if (!q) return;
        if (q.options.length <= 2) { alertMSG('يجب أن يبقى اختياران على الأقل', 'warning'); return; }
        var remId = parseInt(removeBtn.getAttribute('data-remove-option-id'), 10);
        var removed = q.options.find(function (o) { return o.id === remId; });
        q.options = q.options.filter(function (o) { return o.id !== remId; });
        if (removed && removed.correct && q.options.length) q.options[0].correct = true;
        renderExamAnswerOptions(q);
        var countSpan2 = qForm.querySelector('.answer-heading span');
        if (countSpan2) countSpan2.textContent = q.options.length + ' اختيارات';
        return;
      }
      if (e.target.closest('#examDuplicateQBtn')) {
        if (!q || !ctx.model) return;
        var copy = { id: 'new_' + examsNextId(), text: q.text, options: q.options.map(function (o) { return { id: examsNextId(), text: o.text, correct: o.correct }; }) };
        var idx = ctx.model.questions.indexOf(q);
        ctx.model.questions.splice(idx + 1, 0, copy);
        examsCurrentQuestionId_ = copy.id;
        renderExamModelTabs(); renderExamQuestionNav(); renderExamQuestionForm(); renderExamSummary();
        return;
      }
      if (e.target.closest('#examDeleteQBtn')) {
        if (!q || !ctx.model) return;
        Swal.fire({ title: 'حذف السؤال؟', text: 'لا يمكن التراجع عن هذا الإجراء', icon: 'warning', showCancelButton: true, confirmButtonColor: '#c6373e', confirmButtonText: 'نعم، احذف', cancelButtonText: 'إلغاء' }).then(function (result) {
          if (!result.isConfirmed) return;
          google.script.run.withSuccessHandler(function (res) {
            if (!res || res.error) { alertMSG((res && res.message) || 'تعذّر حذف السؤال', 'error'); return; }
            var idx = ctx.model.questions.indexOf(q);
            ctx.model.questions.splice(idx, 1);
            ctx.model.status = res.modelStatus || 'draft';
            examsCurrentQuestionId_ = ctx.model.questions.length ? ctx.model.questions[Math.min(idx, ctx.model.questions.length - 1)].id : null;
            renderExamModelTabs(); renderExamQuestionNav(); renderExamQuestionForm(); renderExamSummary();
          }).withFailureHandler(function (err) {
            alertMSG('تعذّر حذف السؤال: ' + err, 'error');
          }).deleteQuestion(getCurrentUserCpr(), q.id);
        });
        return;
      }
      if (e.target.closest('#examSaveQBtn')) {
        saveCurrentQuestion(function () { renderExamQuestionForm(); });
        return;
      }
      if (e.target.closest('#examSaveNextQBtn')) {
        saveCurrentQuestion(function (model, savedQ) {
          var curIdx = model.questions.indexOf(savedQ);
          if (curIdx > -1 && curIdx < model.questions.length - 1) {
            examsCurrentQuestionId_ = model.questions[curIdx + 1].id;
            renderExamQuestionNav(); renderExamQuestionForm();
          } else {
            addNewExamQuestion();
          }
        });
      }
    });
  }
}

/* ==========================================================================
   التقارير — بناء تقارير مخصصة وتصدير حقيقي Excel/PDF/CSV، بديلاً عن حالة
   "لا توجد بيانات بعد". محرك التصدير (exportCsv/exportExcel/printReportPdf)
   منقول حرفيًا من منطق المرجع (دوال عامة لا تعتمد على بيانات وهمية بالأصل).
   البيانات الفعلية لكل نوع تقرير مبنية من نفس دوال الخادم المستخدمة بالفعل
   في صفحات الطلاب/الحضور/الشهادات (getPersons/getAttendance/getDectationData/
   getAnswersData/getAllStWrks) — بجلب مستقل خاص بهذه الصفحة، لا حاجة لأي دالة
   خادم جديدة ولا اعتماد على زيارة صفحات أخرى أولًا.
   ملاحظة: صناديق "البيانات المتضمنة" تؤثر فقط على تقدير عدد المجموعات
   المعروض بتذييل المُنشئ (تمامًا كما في المرجع الأصلي، الذي لا يستخدمها
   لتصفية أعمدة التصدير الفعلية أيضًا)، وليس على أعمدة الملف المُصدَّر.
   عمود "مؤشر التقدم" الوهمي في تقرير المرجع للتقدم الأكاديمي (صيغة مُختلَقة
   على بيانات تجريبية) حُذف عمدًا هنا بلا بديل مُختلَق — نكتفي بالأرقام الحقيقية
   الثلاثة (حضور/أوراد/اختبارات ناجحة)، اتساقًا مع قاعدة عدم افتراع بيانات.
   ========================================================================== */
var reportsPersonsData_ = null, reportsAttendData_ = [], reportsRecitData_ = [], reportsAnswersData_ = [], reportsStWorksData_ = [];
var reportsPersonsMap_ = {};
var reportsAttendCountByCpr_ = {}, reportsRecitByCpr_ = {}, reportsAnswersByCpr_ = {};
var reportsExportHistory_ = [];
var reportsControlsBound_ = false;

var REPORT_TYPES_ = {
  students:      { title: 'الطلاب الشامل',    icon: 'users-round',      tone: 'red',   fields: 'البيانات الأساسية، المرحلة، الحضور، الأوراد، الاختبارات' },
  attendance:    { title: 'الحضور والغياب',   icon: 'calendar-check-2', tone: 'green', fields: 'سجلات الحضور اليومية بالمرحلة وطريقة التسجيل' },
  exams:         { title: 'نتائج الاختبارات', icon: 'clipboard-list',   tone: 'blue',  fields: 'نتائج الاختبارات والمتون والتقديرات' },
  academic:      { title: 'التقدم الأكاديمي', icon: 'trending-up',      tone: 'gold',  fields: 'مؤشرات الحضور والأوراد والاختبارات لكل طالب' },
  registrations: { title: 'طلبات التسجيل',    icon: 'user-round-plus',  tone: 'red',   fields: 'بيانات المتقدمين وحالة طلباتهم' },
  certificates:  { title: 'الشهادات',         icon: 'award',            tone: 'blue',  fields: 'شهادات الاختبارات وأعمال الطلاب' }
};
var REPORT_PRESET_IDS_ = ['students', 'attendance', 'registrations', 'certificates'];

function loadReportsView() {
  setRouteLoading('reports', true);
  setupReportsControls();
  loadExamLevelStats(function () {});

  var fromEl = document.getElementById('reportDateFrom');
  var toEl = document.getElementById('reportDateTo');
  var todayStr = new Date().toISOString().slice(0, 10);
  if (fromEl && !fromEl.value) fromEl.value = todayStr.slice(0, 8) + '01';
  if (toEl && !toEl.value) toEl.value = todayStr;

  var loaded = { persons: false, attend: false, recit: false, answers: false, stworks: false };
  function tryDone() {
    if (!loaded.persons || !loaded.attend || !loaded.recit || !loaded.answers || !loaded.stworks) return;

    reportsPersonsMap_ = {};
    (reportsPersonsData_ || []).forEach(function (p) { reportsPersonsMap_[p.cpr] = p; });

    reportsAttendCountByCpr_ = {};
    var seenDay = {};
    (reportsAttendData_ || []).forEach(function (e) {
      var d = new Date(e.date);
      if (isNaN(d.getTime())) return;
      var key = e.cpr + '_' + d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
      if (seenDay[key]) return;
      seenDay[key] = true;
      reportsAttendCountByCpr_[e.cpr] = (reportsAttendCountByCpr_[e.cpr] || 0) + 1;
    });

    reportsRecitByCpr_ = {};
    (reportsRecitData_ || []).forEach(function (e) {
      if (!e || !e.stuCpr) return;
      (reportsRecitByCpr_[e.stuCpr] = reportsRecitByCpr_[e.stuCpr] || []).push(e);
    });

    reportsAnswersByCpr_ = {};
    (reportsAnswersData_ || []).forEach(function (a) {
      if (!a || !a.cpr) return;
      (reportsAnswersByCpr_[a.cpr] = reportsAnswersByCpr_[a.cpr] || []).push(a);
    });

    renderReportPresets();
    renderReportLibrary();
    renderExportHistory();
    updateReportEstimate();
    setRouteLoading('reports', false);
  }

  google.script.run.withSuccessHandler(function (d) { reportsPersonsData_ = Array.isArray(d) ? d : []; loaded.persons = true; tryDone(); })
    .withFailureHandler(function () { reportsPersonsData_ = []; loaded.persons = true; tryDone(); }).getPersons();
  google.script.run.withSuccessHandler(function (d) { reportsAttendData_ = Array.isArray(d) ? d : []; loaded.attend = true; tryDone(); })
    .withFailureHandler(function () { reportsAttendData_ = []; loaded.attend = true; tryDone(); }).getAttendance();
  google.script.run.withSuccessHandler(function (d) { reportsRecitData_ = Array.isArray(d) ? d : []; loaded.recit = true; tryDone(); })
    .withFailureHandler(function () { reportsRecitData_ = []; loaded.recit = true; tryDone(); }).getDectationData();
  google.script.run.withSuccessHandler(function (d) { reportsAnswersData_ = Array.isArray(d) ? d : []; loaded.answers = true; tryDone(); })
    .withFailureHandler(function () { reportsAnswersData_ = []; loaded.answers = true; tryDone(); }).getAnswersData(null);
  google.script.run.withSuccessHandler(function (json) {
    try { reportsStWorksData_ = JSON.parse(json); } catch (e) { reportsStWorksData_ = []; }
    if (!Array.isArray(reportsStWorksData_)) reportsStWorksData_ = [];
    loaded.stworks = true; tryDone();
  }).withFailureHandler(function () { reportsStWorksData_ = []; loaded.stworks = true; tryDone(); }).getAllStWrks();
}

function getReportsDateRange() {
  var fromEl = document.getElementById('reportDateFrom');
  var toEl = document.getElementById('reportDateTo');
  return {
    from: fromEl && fromEl.value ? new Date(fromEl.value + 'T00:00:00') : null,
    to: toEl && toEl.value ? new Date(toEl.value + 'T23:59:59') : null
  };
}
function reportsDateInRange(dateVal, range) {
  var d = dateVal ? new Date(dateVal) : null;
  if (!d || isNaN(d.getTime())) return !range.from && !range.to;
  if (range.from && d < range.from) return false;
  if (range.to && d > range.to) return false;
  return true;
}
function getReportsStageFilter() {
  var btn = document.querySelector('#reportStages [data-report-stage].active');
  var v = btn ? btn.getAttribute('data-report-stage') : 'all';
  return v === 'all' ? null : parseInt(v, 10);
}

// يبني {headers, rows} فعليًا من البيانات المُحمّلة فعلًا لهذه الصفحة، حسب النوع
// + فلتري التاريخ/المرحلة. filters اختيارية (تُستخدم لحساب أعداد البطاقات/المكتبة
// بالتصفية الافتراضية دومًا بصرف النظر عمّا هو مضبوط حاليًا بمُنشئ التقرير المخصص).
function getReportData(type, filters) {
  var range = (filters && filters.range !== undefined) ? filters.range : getReportsDateRange();
  var stage = (filters && filters.stage !== undefined) ? filters.stage : getReportsStageFilter();

  if (type === 'attendance') {
    var rows = [];
    var seenDay = {};
    (reportsAttendData_ || []).forEach(function (e) {
      var d = new Date(e.date);
      if (isNaN(d.getTime())) return;
      var dayKey = e.cpr + '_' + d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
      if (seenDay[dayKey]) return;
      seenDay[dayKey] = true;
      if (!reportsDateInRange(e.date, range)) return;
      var person = reportsPersonsMap_[e.cpr];
      // مستوى الطالب وقت الحضور الفعلي (عمود level المخزَّن)، وليس مستواه الحالي — طالب تقدَّم
      // لمرحلة جديدة يجب أن تبقى سجلات حضوره القديمة منسوبة لمرحلته وقتها. سجلات أقدم من إضافة
      // هذا العمود (بلا level مخزَّن) تعتمد المستوى الحالي كأفضل تقدير متاح.
      var lvl = (e.level !== null && e.level !== undefined) ? e.level : (person ? getStudentCurrentLevel(person) : null);
      if (stage !== null && lvl !== stage) return;
      var reportIsManual = String(e.resp) === 'manual';
      rows.push([rows.length + 1, e.name, getLevelName(lvl), formatDateAr(e.date) + ' — ' + formatTimeOnly(e.date), reportIsManual ? 'إدخال يدوي' : 'رمز QR', reportIsManual ? 'إدخال يدوي' : (e.resp || '—')]);
    });
    return { headers: ['#', 'الطالب', 'المرحلة', 'وقت الحضور', 'الطريقة', 'المسجل بواسطة'], rows: rows };
  }

  if (type === 'exams') {
    var rows = [];
    (reportsAnswersData_ || []).forEach(function (a) {
      if (!reportsDateInRange(a.date, range)) return;
      var person = reportsPersonsMap_[a.cpr];
      // مستوى الطالب وقت أداء الاختبار (عمود level في answers)، وليس مستواه الحالي — لنفس سبب
      // سجلات الحضور أعلاه.
      var lvl = (a.level !== null && a.level !== undefined && a.level !== '') ? a.level : (person ? getStudentCurrentLevel(person) : null);
      if (stage !== null && lvl !== stage) return;
      rows.push([person ? person.name : (a.cpr || '—'), getLevelName(lvl), a.exam || a.matn || '—', a.rate || '—', a.result || '—', a.certificate ? 'مستخرَجة' : '—']);
    });
    return { headers: ['الطالب', 'المرحلة', 'الاختبار/المتن', 'التقدير', 'النتيجة', 'الشهادة'], rows: rows };
  }

  if (type === 'academic') {
    var rows = [];
    (reportsPersonsData_ || []).forEach(function (p) {
      var lvl = getStudentCurrentLevel(p);
      if (stage !== null && lvl !== stage) return;
      if (!reportsDateInRange(p.time, range)) return;
      var passedExams = (reportsAnswersByCpr_[p.cpr] || []).filter(function (a) { return a.rate !== 'راسب'; }).length;
      rows.push([p.name, getLevelName(lvl), reportsAttendCountByCpr_[p.cpr] || 0, (reportsRecitByCpr_[p.cpr] || []).length, passedExams]);
    });
    return { headers: ['الطالب', 'المرحلة', 'أيام الحضور', 'الأوراد', 'الاختبارات الناجحة'], rows: rows };
  }

  if (type === 'registrations') {
    var rows = [];
    (reportsPersonsData_ || []).forEach(function (p) {
      var pendingLvl = p.class0 === true ? 0 : p.class1 === true ? 1 : p.class2 === true ? 2 : p.class3 === true ? 3 : null;
      if (pendingLvl === null) return;
      if (stage !== null && pendingLvl !== stage) return;
      if (!reportsDateInRange(p.time, range)) return;
      rows.push([p.name, p.cpr, getLevelName(pendingLvl), p.gender || '—', p.nationality || '—', p.phone || '—', p.pastStudies || '—', formatDateAr(p.time)]);
    });
    return { headers: ['الاسم', 'الرقم الشخصي', 'المرحلة', 'الجنس', 'الجنسية', 'الهاتف', 'الدراسة السابقة', 'تاريخ الطلب'], rows: rows };
  }

  if (type === 'certificates') {
    var records = [];
    (reportsAnswersData_ || []).forEach(function (a) {
      if (a.rate === 'راسب') return;
      var person = reportsPersonsMap_[a.cpr];
      records.push({ name: person ? person.name : (a.cpr || '—'), cpr: a.cpr, program: a.exam || a.matn || '—', type: 'شهادة اختبار', date: a.date || null, level: (a.level !== null && a.level !== undefined && a.level !== '') ? a.level : null, status: a.certificate ? 'ready' : 'pending' });
    });
    (reportsStWorksData_ || []).forEach(function (w) {
      // لا يوجد تاريخ ولا مستوى مخزَّن لشهادات الأعمال أصلًا (getAllStWrks لا يعيد أيًّا منهما) —
      // date تبقى null دومًا هنا، والمستوى يعتمد مستوى الطالب الحالي كبديل وحيد متاح.
      records.push({ name: w.name || w.cpr || '—', cpr: w.cpr, program: w.stWorks || '—', type: 'شهادة أعمال', date: null, level: null, status: w.certificate ? 'ready' : 'pending' });
    });
    var rows = [];
    records.forEach(function (r) {
      // سجلات بلا تاريخ أصلًا (شهادات الأعمال) تُستثنى من فلتر التاريخ نفسه بدل استبعادها
      // بالكامل كلما كان هناك أي مدى زمني مضبوط (وهو الافتراضي دومًا عند فتح الصفحة)
      if (r.date && !reportsDateInRange(r.date, range)) return;
      var person = reportsPersonsMap_[r.cpr];
      var lvl = r.level !== null ? r.level : (person ? getStudentCurrentLevel(person) : null);
      if (stage !== null && lvl !== stage) return;
      rows.push([r.name, r.program, r.date ? formatDateAr(r.date) : '—', r.type, r.status === 'ready' ? 'جاهزة' : 'قيد التجهيز']);
    });
    return { headers: ['الطالب', 'البرنامج/الاختبار', 'التاريخ', 'نوع الشهادة', 'الحالة'], rows: rows };
  }

  // students (الافتراضي)
  var rows = [];
  (reportsPersonsData_ || []).forEach(function (p) {
    var lvl = getStudentCurrentLevel(p);
    if (stage !== null && lvl !== stage) return;
    if (!reportsDateInRange(p.time, range)) return;
    var passedExams = (reportsAnswersByCpr_[p.cpr] || []).filter(function (a) { return a.rate !== 'راسب'; }).length;
    rows.push([rows.length + 1, p.cpr, p.name, p.gender || '—', p.phone || '—', p.nationality || '—', getLevelName(lvl), reportsAttendCountByCpr_[p.cpr] || 0, (reportsRecitByCpr_[p.cpr] || []).length, passedExams]);
  });
  return { headers: ['#', 'الرقم الشخصي', 'الاسم', 'الجنس', 'الهاتف', 'الجنسية', 'المرحلة', 'أيام الحضور', 'الأوراد', 'الاختبارات الناجحة'], rows: rows };
}

// ===== محرك التصدير — منقول حرفيًا من منطق المرجع (دوال عامة {headers, rows} → ملف) =====
function downloadReportBlob(content, type, filename) {
  var url = URL.createObjectURL(new Blob([content], { type: type }));
  var link = document.createElement('a');
  link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); link.remove();
  window.setTimeout(function () { URL.revokeObjectURL(url); }, 1200);
}

function exportReportCsv(data, filename) {
  var cell = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
  var csv = [data.headers].concat(data.rows).map(function (row) { return row.map(cell).join(','); }).join('\r\n');
  downloadReportBlob('﻿' + csv, 'text/csv;charset=utf-8', filename);
}

// يحوّل {headers, rows:[[...]]} (الصيغة الموضعية القديمة) إلى مصفوفة Objects بمفاتيح
// = نص العمود، وهي الصيغة التي يتوقعها نظام التصدير الموحّد exportRowsToExcel/exportRowsToPDF
// في export-js.html (القاعدة العامة الموثّقة في design-guidelines.md القسم 5).
function reportDataToRowObjects(data) {
  return data.rows.map(function (row) {
    var obj = {};
    data.headers.forEach(function (h, i) { obj[h] = row[i]; });
    return obj;
  });
}

function exportReportExcel(data, title, filename) {
  exportRowsToExcel({ title: title, rows: reportDataToRowObjects(data), filename: title });
}

function printReportPdf(data, title) {
  var columns = data.headers.map(function (h) { return { key: h, label: h }; });
  exportRowsToPDF({ title: title, subtitle: 'أكاديمية بصائر', columns: columns, rows: reportDataToRowObjects(data) });
}

function performReportExport(id, format, filters) {
  var meta = REPORT_TYPES_[id] || REPORT_TYPES_.students;
  var data = getReportData(id, filters);
  if (data.rows.length === 0) { alertMSG('لا توجد سجلات مطابقة لهذا التقرير بالفلاتر الحالية', 'warning'); return; }
  var filename = reportFileNameFor(id, format);
  if (format === 'csv') exportReportCsv(data, filename);
  else if (format === 'pdf') printReportPdf(data, meta.title);
  else exportReportExcel(data, meta.title, filename);

  reportsExportHistory_.unshift({ id: id, name: filename, format: format, meta: data.rows.length.toLocaleString('en-US') + ' سجل', time: formatTimeOnly(new Date()) });
  renderExportHistory();
  alertMSG(format === 'pdf' ? 'تم فتح نسخة التقرير الجاهزة للحفظ بصيغة PDF' : ('تم تجهيز ' + filename + ' وبدء التنزيل'), 'success');
}

/* ==========================================================================
   قسم "تحليل ملف بالذكالي" — يرفع ملف PDF مباشرة إلى Firebase
   Storage، يستدعي دالة Cloud Functions startAnalysis (europe-west1)، ويتابع
   حالة المهمة حيًّا عبر Firestore onSnapshot (مجموعة analysisJobs). صورة
   التشجير تُبنى داخل المتصفح عبر BasaerTree (website/assets/js/basaer-tree.js)
   وتُرفع من العميل مباشرة، وهو التحديث الوحيد المسموح به للعميل على مستند
   المهمة (راجع firestore.rules). راجع 00-newFunc-notebookLM لتفاصيل الخادم.
   ========================================================================== */
var pdfaiInitDone_ = false;
var pdfaiUnsub_ = null;
var pdfaiTreeBuildStarted_ = null;

// مطابقة عمدًا لموقع bucket التخزين الحقيقي (coming-soon-basaer.firebasestorage.app) — لا
// يُعتمد على التخمين الافتراضي لأن إعداد firebase.initializeApp في auth-js.html لا يمرر
// storageBucket أصلًا (غير محتاج لتسجيل الدخول العادي).
function pdfaiStorage() { return firebase.app().storage('gs://coming-soon-basaer.firebasestorage.app'); }
function pdfaiFunctions() { return firebase.app().functions('europe-west1'); }

function pdfaiInit() {
  if (pdfaiInitDone_) return;
  pdfaiInitDone_ = true;

  // basaer-tree.js يفترض افتراضيًا مسارًا نسبيًا (/assets/fonts/...) يُحسَب من أصل الصفحة
  // الحالية — وهذا هنا نطاق iframe المعزول لـApps Script (googleusercontent.com)، وليس
  // استضافة Firebase حيث الخط فعليًا موجود. لازم رابط مطلق صريح.
  if (window.BasaerTree) BasaerTree.setFontUrl('https://coming-soon-basaer.web.app/assets/fonts/IBMPlexSansArabic-Regular.woff2');

  var togglesGroup = document.getElementById('pdfaiTogglesGroup');
  if (togglesGroup) togglesGroup.addEventListener('click', function (e) {
    var btn = e.target.closest('.staff-perm-btn');
    if (!btn) return;

  });

  if (browseBtn && fileInput) browseBtn.addEventListener('click', function () { fileInput.click(); });
  if (fileInput && fileNameEl) fileInput.addEventListener('change', function () {

    if (file) {
      fileNameEl.textContent = file.name + ' (' + (file.size / 1048576).toFixed(1) + ' م.ب)';
      fileNameEl.classList.add('has-file');
    } else {
      fileNameEl.textContent = 'لم يُحدَّد أي ملف بعد';
      fileNameEl.classList.remove('has-file');
    }
  });

  var startBtn = document.getElementById('pdfaiStartBtn');
  if (startBtn) startBtn.addEventListener('click', pdfaiStart);

  var newBtn = document.getElementById('pdfaiNewBtn');
  if (newBtn) newBtn.addEventListener('click', pdfaiOpenNewModal);

  pdfaiLoadHistory();

  firebase.firestore().collection('stats').doc('geminiUsage').onSnapshot(function (snap) {
    var d = snap.exists ? snap.data() : {};

    if (costEl) costEl.textContent = '$' + (d.costUsd || 0).toFixed(2);
