function refreshIcons() {
  document.querySelectorAll('[data-icon]').forEach(function (icon) {
    var classes = fontAwesomeIcons_[icon.dataset.icon] || ['fa-solid', 'fa-circle'];
    icon.className = classes.concat('fa-fw').join(' ');
    icon.setAttribute('aria-hidden', 'true');
  });
}

/* ==========================================================================
   حجم خط الواجهة (محفوظ محليًا على الجهاز)
   ========================================================================== */
function applyFontSize(value, announce) {
  var labels = { small: 'الصغير', medium: 'المتوسط', large: 'الكبير' };
  var selected = labels.hasOwnProperty(value) ? value : 'medium';
  document.body.dataset.fontSize = selected;
  try { localStorage.setItem('basair-admin-font-size', selected); } catch (e) {}
  document.querySelectorAll('[data-font-size]').forEach(function (btn) {
    var active = btn.dataset.fontSize === selected;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-pressed', String(active));
  });
  if (announce) alertMSG('تم اعتماد حجم الخط ' + labels[selected], 'success');
}

/* ==========================================================================
   الهيكل العظمي المتحرك أثناء التحميل (Skeleton) — يظهر داخل أي عنصر يحمل
   السمة [data-live] إلى أن يُزال الكلاس is-loading عنه عند اكتمال البيانات
   الحقيقية الخاصة به. منقول من basair-admin-suite/app.js.
   ========================================================================== */
function skeletonMarkup(type) {
  if (type === 'stat') return '<div class="skeleton-overlay skeleton-stat"><span class="skeleton-circle"></span><div><i class="skeleton-line w55"></i><i class="skeleton-line tall w40"></i><i class="skeleton-line w70"></i></div></div>';
  if (type === 'compact') return '<div class="skeleton-overlay skeleton-compact"><span class="skeleton-circle"></span><div><i class="skeleton-line w55"></i><i class="skeleton-line w85"></i></div></div>';
  if (type === 'chart') return '<div class="skeleton-overlay skeleton-chart"><i class="skeleton-line w40"></i><div class="skeleton-bars"><i></i><i></i><i></i><i></i><i></i></div></div>';
  if (type === 'list') return '<div class="skeleton-overlay skeleton-list">' + Array.from({ length: 6 }, function () { return '<div class="skeleton-row"><i class="skeleton-circle"></i><i class="skeleton-line w70"></i><i class="skeleton-line"></i></div>'; }).join('') + '</div>';
  return '<div class="skeleton-overlay skeleton-table">' + Array.from({ length: 6 }, function () { return '<div class="skeleton-row"><i class="skeleton-line w85"></i><i class="skeleton-line w70"></i><i class="skeleton-line w55"></i><i class="skeleton-line w40"></i></div>'; }).join('') + '</div>';
}

function installSkeletons() {
  document.querySelectorAll('[data-live]').forEach(function (block) {
    if (!block.querySelector(':scope > .skeleton-overlay')) block.insertAdjacentHTML('beforeend', skeletonMarkup(block.dataset.skeleton || 'table'));
  });
}

function setRouteLoading(route, loading) {
  var page = document.querySelector('.page-view[data-page="' + route + '"]');
  if (!page) return;
  page.querySelectorAll('[data-live]').forEach(function (block) { block.classList.toggle('is-loading', loading); });
}

/* ==========================================================================
   الدرج والمودال العامّان (لعرض تفاصيل سريعة مستقبلًا)
   ========================================================================== */
// onOpenPage اختياري: عند تمريره، يظهر زر إضافي بجوار الاسم أقصى يسار رأس الدرج (بنفس أيقونة
// "فتح الصفحة" في الجدول) وينفّذه عند الضغط. يُخفى تلقائيًا لأي استدعاء آخر لا يمرّره.
function openDrawer(title, eyebrow, bodyHtml, footerHtml, onOpenPage) {
  var t = document.getElementById('drawerTitle'); if (t) t.textContent = title;
  var e = document.getElementById('drawerEyebrow'); if (e) e.textContent = eyebrow;
  var b = document.getElementById('drawerBody'); if (b) b.innerHTML = bodyHtml;
  var f = document.getElementById('drawerFooter');
  if (f) f.innerHTML = footerHtml || '<button class="secondary-button" type="button" onclick="closeDrawer()">إغلاق</button>';
  var openPageBtn = document.getElementById('drawerOpenPageBtn');
  if (openPageBtn) {
    if (typeof onOpenPage === 'function') {
      openPageBtn.hidden = false;
      openPageBtn.onclick = onOpenPage;
    } else {
      openPageBtn.hidden = true;
      openPageBtn.onclick = null;
    }
  }
  var d = document.getElementById('detailDrawer');
  if (d) { d.classList.add('open'); d.setAttribute('aria-hidden', 'false'); }
  var o = document.getElementById('drawerOverlay'); if (o) o.classList.add('open');
  refreshIcons();
}
function closeDrawer() {
  var d = document.getElementById('detailDrawer');
  if (d) { d.classList.remove('open'); d.setAttribute('aria-hidden', 'true'); }
  var o = document.getElementById('drawerOverlay'); if (o) o.classList.remove('open');
}
function openActionModal(title, eyebrow, bodyHtml, footerHtml, wide) {
  var t = document.getElementById('modalTitle'); if (t) t.textContent = title;
  var e = document.getElementById('modalEyebrow'); if (e) e.textContent = eyebrow;
  var b = document.getElementById('modalBody'); if (b) b.innerHTML = bodyHtml;
  var f = document.getElementById('modalFooter');
  if (f) f.innerHTML = footerHtml || '<button class="secondary-button" type="button" onclick="closeActionModal()">إغلاق</button>';
  var m = document.getElementById('actionModal'); if (m) m.hidden = false;
  var panel = m ? m.querySelector('.action-modal') : null;
  if (panel) panel.classList.toggle('wide', !!wide);
  refreshIcons();
}
function closeActionModal() {
  var m = document.getElementById('actionModal');
  if (m) {
    // لا تُبقِ أي سر مكتوب في حقول المودال داخل DOM بعد إغلاقه (مثل Access Token الخاص بـMeta).
    m.querySelectorAll('input[type="password"]').forEach(function (input) { input.value = ''; });
    m.hidden = true;
  }
}

/* ==========================================================================
   تهيئة غلاف لوحة الإدارة (مرة واحدة فقط) — يُستدعى من js.html عبر حلقة
   الانتظار في loadDashboard() إلى أن يعيد true (نفس التعاقد القديم للاسم
   والقيمة المُعادة، حتى لا يلزم تعديل js.html).
   ========================================================================== */
function prepareDashboardPage(debugMode) {
  var sidebar = document.getElementById('sidebar');
  var mobileMenuBtn = document.getElementById('mobileMenu');
  var shell = document.querySelector('.app-shell');

  if (!sidebar || !mobileMenuBtn || !shell) {
    if (debugMode) console.log('Missing elements in admin shell');
    return false;
  }
  if (mobileMenuBtn.hasAttribute('data-init')) return true;
  mobileMenuBtn.setAttribute('data-init', 'true');

  // فتح/إغلاق القائمة الجانبية في الموبايل
  mobileMenuBtn.addEventListener('click', function () { document.body.classList.add('sidebar-open'); });
  var sidebarClose = document.getElementById('sidebarClose');
  if (sidebarClose) sidebarClose.addEventListener('click', function () { document.body.classList.remove('sidebar-open'); });
  var overlay = document.getElementById('sidebarOverlay');
  if (overlay) overlay.addEventListener('click', function () { document.body.classList.remove('sidebar-open'); });

  // التنقل بين الأقسام عبر [data-route]/[data-go] (روابط الشريط الجانبي + أزرار "انتقال")
  document.addEventListener('click', function (e) {
    var route = e.target.closest('[data-route], [data-go]');
    if (!route) return;
    activateAdminRoute(route.dataset.route || route.dataset.go);
    // إغلاق قائمة المستخدم العلوية عند اختيار مسار من داخلها (مثال: "الملف الشخصي")
    if (userMenu && route.closest('#userMenu')) userMenu.hidden = true;
  });

  // قائمة المستخدم + قائمة حجم الخط
  var userButton = document.getElementById('userButton');
  var userMenu = document.getElementById('userMenu');
  var fontSizeButton = document.getElementById('fontSizeButton');
  var fontSizeMenu = document.getElementById('fontSizeMenu');

  if (userButton && userMenu) {
    userButton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (fontSizeMenu) { fontSizeMenu.hidden = true; if (fontSizeButton) fontSizeButton.setAttribute('aria-expanded', 'false'); }
      userMenu.hidden = !userMenu.hidden;
    });
  }
  if (fontSizeButton && fontSizeMenu) {
    fontSizeButton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (userMenu) userMenu.hidden = true;
      fontSizeMenu.hidden = !fontSizeMenu.hidden;
      fontSizeButton.setAttribute('aria-expanded', String(!fontSizeMenu.hidden));
    });
    fontSizeMenu.addEventListener('click', function (e) {
      e.stopPropagation();
      var option = e.target.closest('[data-font-size]');
      if (!option) return;
      applyFontSize(option.dataset.fontSize, true);
      fontSizeMenu.hidden = true;
      fontSizeButton.setAttribute('aria-expanded', 'false');
    });
  }
  document.addEventListener('click', function (e) {
    if (userMenu && !e.target.closest('#userButton, #userMenu')) userMenu.hidden = true;
    if (fontSizeMenu && !e.target.closest('#fontSizeButton, #fontSizeMenu')) {
      fontSizeMenu.hidden = true;
      if (fontSizeButton) fontSizeButton.setAttribute('aria-expanded', 'false');
    }
  });

  // إغلاق الدرج/المودال العامّين
  var drawerClose = document.getElementById('drawerClose');
  if (drawerClose) drawerClose.addEventListener('click', closeDrawer);
  var drawerOverlay = document.getElementById('drawerOverlay');
  if (drawerOverlay) drawerOverlay.addEventListener('click', closeDrawer);
  var modalClose = document.getElementById('modalClose');
  if (modalClose) modalClose.addEventListener('click', closeActionModal);
  var actionModalEl = document.getElementById('actionModal');
  if (actionModalEl) actionModalEl.addEventListener('click', function (e) { if (e.target.id === 'actionModal') closeActionModal(); });

  // اختصارات لوحة المفاتيح: Ctrl/Cmd+K للبحث، Escape لإغلاق كل الطبقات العائمة
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      var gs = document.getElementById('globalSearch'); if (gs) gs.focus();
    }
    if (e.key === 'Escape') {
      closeDrawer(); closeActionModal();
      document.body.classList.remove('sidebar-open');
      if (userMenu) userMenu.hidden = true;
      if (fontSizeMenu) { fontSizeMenu.hidden = true; if (fontSizeButton) fontSizeButton.setAttribute('aria-expanded', 'false'); }
    }
  });

  var acceptSelectedBtn = document.getElementById('acceptSelectedBtn');
  if (acceptSelectedBtn) acceptSelectedBtn.addEventListener('click', function () { acceptSelectedNewStu(); });

  initAdminIdentity();
  initDualRoleLinks_();
  updateDashboardGreeting();
  applyFontSize(localStorage.getItem('basair-admin-font-size') || 'medium', false);
  installSkeletons();
  refreshIcons();
  initAcceptBatchBanner();
  initWPQueueBanner_();
  initWPQueueMetaBanner_();
  initFCMQueueBanner_();

  var timeElement = document.getElementById('sidebarSyncTime');
  if (timeElement) timeElement.textContent = 'آخر مزامنة ' + new Date().toLocaleTimeString('ar-BH', { hour: '2-digit', minute: '2-digit' });

  return true;
}

/* ==========================================================================
   شريط "دفعة قبول جارية" — عنصر واحد يُحقَن في document.body (وليس داخل .app-shell أو أي
   page-view) حتى يبقى ثابتًا ومرئيًا بصرف النظر عن أي تنقّل بين أقسام لوحة الإدارة، ومرة واحدة
   فقط بصرف النظر عن استدعاء prepareDashboardPage أكثر من مرة. استطلاع دوري (كل 4 ثوانٍ)
   لـgetAcceptBatchStatus (dataPost.js/oldJS.js) — أي موظف آخر يشغّل دفعة قبول من جهازه سيظهر
   هذا الشريط تلقائيًا لكل من لديه لوحة الإدارة مفتوحة، لا لمن بدأ الدفعة فقط. يحل محل مودال
   #loadingModal/#studentsList القديم (كان محليًا خاصًا بمن بدأ العملية فقط) — راجع مناقشات.md.
   ========================================================================== */
function initAcceptBatchBanner() {
  if (document.getElementById('acceptBatchBanner')) return; // مُحقَن بالفعل (تشغيل سابق لهذه الدالة)

  var banner = document.createElement('div');
  banner.id = 'acceptBatchBanner';
  banner.className = 'accept-batch-banner';
  banner.hidden = true;
  banner.innerHTML =
    '<div class="accept-batch-banner-head">' +
      '<span class="accept-batch-banner-count" id="acceptBatchCount">0 / 0</span>' +
      '<div class="accept-batch-banner-text"><strong>جارٍ قبول الطلاب...</strong><small id="acceptBatchSub">يرجى الانتظار حتى اكتمال المعالجة.</small></div>' +
    '</div>' +
    '<div class="accept-batch-banner-track"><div class="accept-batch-banner-fill" id="acceptBatchFill"></div></div>';
  document.body.appendChild(banner);

  pollAcceptBatchStatus();
  setInterval(pollAcceptBatchStatus, 4000);
}

function pollAcceptBatchStatus() {
  google.script.run.withSuccessHandler(renderAcceptBatchStatus).withFailureHandler(function () {}).getAcceptBatchStatus();
}

function renderAcceptBatchStatus(status) {
  var banner = document.getElementById('acceptBatchBanner');
  if (!banner) return;
  if (!status || !status.active) { banner.hidden = true; return; }

  var total = status.total || 0;
  var completed = Math.min(status.completed || 0, total);
  var percent = total > 0 ? Math.round((completed / total) * 100) : 0;

  var countEl = document.getElementById('acceptBatchCount');
  var subEl = document.getElementById('acceptBatchSub');
  var fillEl = document.getElementById('acceptBatchFill');
  if (countEl) countEl.textContent = completed + ' / ' + total;
  if (subEl) subEl.textContent = status.staffName
    ? ('يقوم ' + status.staffName + ' حاليًا بمعالجة طلبات القبول، يرجى الانتظار حتى الاكتمال.')
    : 'يرجى الانتظار حتى اكتمال المعالجة.';
  if (fillEl) fillEl.style.width = percent + '%';
  banner.hidden = false;
}

/* ==========================================================================
   هوية المستخدم الحالي في الشريط الجانبي/العلوي — تُقرأ من المتغيّر العام
   userData الذي يضبطه auth-js.html (loadLoginDataForAuthedUser) عند دخول
   أي موظف، قبل استدعاء loadDashboard() مباشرة.
   ========================================================================== */
function initAdminIdentity() {
  var me = (typeof userData !== 'undefined' && userData && userData[0]) ? userData[0] : null;
  var fullName = (me && me.name) ? me.name : 'المستخدم';
  // نعرض الاسم الأول والأخير فقط في الشريط الجانبي/العلوي، وليس الاسم الرباعي كاملًا
  var name = shortDisplayName(fullName);
  var role = (me && me.job) ? me.job : ((me && me.manage) ? 'صلاحية الإدارة الكاملة' : 'متعاون');
  var avatarUrl = (me && me.avatarUrl) ? me.avatarUrl : DEFAULT_AVATAR_URL_;

  ['sidebarUserName', 'topbarUserName'].forEach(function (id) { var el = document.getElementById(id); if (el) el.textContent = name; });
  ['sidebarUserRole', 'topbarUserRole'].forEach(function (id) { var el = document.getElementById(id); if (el) el.textContent = role; });
  ['sidebarUserAvatar', 'topbarUserAvatar'].forEach(function (id) { var el = document.getElementById(id); if (el) el.innerHTML = '<img src="' + escapeHtml(avatarUrl) + '" alt="">'; });
}

function updateDashboardGreeting() {
  var eyebrowEl = document.getElementById('dashboardEyebrow');
  if (eyebrowEl) {
    try { eyebrowEl.textContent = new Date().toLocaleDateString('ar-BH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }); }
    catch (e) { eyebrowEl.textContent = new Date().toLocaleDateString(); }
  }
}

function animateCounter(id, end, suffix) {
  suffix = suffix || '';
  var obj = document.getElementById(id);
  if (!obj) return;
  var start = 0, duration = 1000, range = end - start;
  if (range === 0) { obj.innerText = end + suffix; return; }
  var increment = end > start ? 1 : -1;
  var stepTime = Math.abs(Math.floor(duration / range));
  var current = start;
  var timer = setInterval(function () {
    current += increment;
    obj.innerText = current + suffix;
    if (current === end) clearInterval(timer);
  }, stepTime);
}

function renderStageBars(levels) {

  levels.forEach(function (count, idx) {
    var countEl = document.getElementById('stageCount' + idx); if (countEl) countEl.textContent = count;
    var barEl = document.getElementById('stageBar' + idx); if (barEl) barEl.style.width = (max > 0 ? Math.round(count / max * 100) : 0) + '%';
  });
}

   (segmented، بنفس أسلوب #studentFilterGroup في صفحة الطلاب). البيانات الخام

var areaRecordsCache_ = [];
var areaStageFilter_ = 'all';

var ageGenderFilter_ = 'all';

var AREA_STAGE_LABELS_ = { all: 'جميع المراحل', 0: 'التأهيلية', 1: 'التأسيسية', 2: 'التأصيلية', 3: 'التحصيلية', pending: 'طلبات جديدة' };
var AREA_GENDER_LABELS_ = { all: 'الجميع', 'ذكر': 'ذكور', 'أنثى': 'إناث' };

// يبني قائمة المناطق مصفّاة حسب فلترَي المرحلة/الجنس الحاليَين — يُستخدَم من العرض والتصدير
// معًا حتى يطابق ملف Excel المُصدَّر تمامًا ما هو ظاهر على الشاشة.
function computeFilteredAreaData() {
  var records = areaRecordsCache_;
  if (areaStageFilter_ === 'pending') records = records.filter(function (r) { return r.pending; });
  else if (areaStageFilter_ !== 'all') { var lvl = parseInt(areaStageFilter_, 10); records = records.filter(function (r) { return r.level === lvl; }); }
  if (areaGenderFilter_ !== 'all') records = records.filter(function (r) { return r.gender === areaGenderFilter_; });

  var counts = {};
  records.forEach(function (r) { counts[r.area] = (counts[r.area] || 0) + 1; });
  var areas = Object.keys(counts).map(function (name) { return { name: name, count: counts[name] }; })
    .sort(function (a, b) { return b.count - a.count; });

  return {
    areas: areas,
    stageLabel: AREA_STAGE_LABELS_[areaStageFilter_] || 'جميع المراحل',
    genderLabel: AREA_GENDER_LABELS_[areaGenderFilter_] || 'الجميع'
  };
}

// عدّاد كل زر مرحلة يعكس فلتر الجنس الحالي أيضًا (مطابقة كاملة، لا أرقام ثابتة قديمة)
function updateAreaStageCounts() {
  var genderFiltered = areaGenderFilter_ === 'all' ? areaRecordsCache_ : areaRecordsCache_.filter(function (r) { return r.gender === areaGenderFilter_; });
  var allEl = document.getElementById('areaStageCount-all'); if (allEl) allEl.textContent = genderFiltered.length;
  [0, 1, 2, 3].forEach(function (lvl) {
    var el = document.getElementById('areaStageCount-' + lvl);
    if (el) el.textContent = genderFiltered.filter(function (r) { return r.level === lvl; }).length;
  });
  var pendingEl = document.getElementById('areaStageCount-pending');
  if (pendingEl) pendingEl.textContent = genderFiltered.filter(function (r) { return r.pending; }).length;
}

function renderAreaBarsFiltered() {
  var container = document.getElementById('areaBars');
  if (!container) return;

  var areas = computeFilteredAreaData().areas;
  if (areas.length === 0) { container.innerHTML = '<p class="empty-note">لا توجد بيانات مناطق مطابقة لهذا الفلتر</p>'; return; }
  var max = Math.max.apply(null, areas.map(function (a) { return a.count; }).concat([1]));
  container.innerHTML = areas.map(function (a) {
    var pct = max > 0 ? Math.round(a.count / max * 100) : 0;
    return '<div><span>' + escapeHtml(a.name) + ' <small>' + a.count + '</small></span><div><i style="width:' + pct + '%;background:var(--primary)"></i></div></div>';
  }).join('');
}

function exportAreaBarsToExcel() {
  var data = computeFilteredAreaData();
  if (data.areas.length === 0) { alertMSG('لا توجد بيانات مطابقة لهذا الفلتر لتصديرها', 'warning'); return; }

  var title = 'توزيع الطلاب حسب المناطق السكنية — ' + data.stageLabel + ' — ' + data.genderLabel;
  var headers = ['#', 'المنطقة', 'عدد الطلاب'];
  var rows = data.areas.map(function (a, idx) { return [idx + 1, a.name, a.count]; });
  var filename = 'توزيع_المناطق_' + data.stageLabel + '_' + data.genderLabel + '.xls';
  exportReportExcel({ headers: headers, rows: rows }, title, filename);
}

/* ==========================================================================
   توزيع الطلاب حسب الأعمار — نفس نمط لوحة "توزيع الطلاب حسب المناطق السكنية"
   أعلاه حرفيًا (نفس الفلاتر، نفس أسلوب الرسم بالأشرطة، نفس مسار تصدير Excel)،
   لكن التجميع بفئات عمرية ثابتة (كل 5 أعوام من 10 إلى 100) بدل قيم نصية حرة.
   ========================================================================== */
var ageFilterControlsBound_ = false;
var AGE_BRACKET_MIN_ = 10, AGE_BRACKET_MAX_ = 100, AGE_BRACKET_STEP_ = 5;
var AGE_BRACKETS_ = (function () {
  var list = [];
  for (var start = AGE_BRACKET_MIN_; start < AGE_BRACKET_MAX_; start += AGE_BRACKET_STEP_) {
    list.push({ label: start + ' - ' + (start + AGE_BRACKET_STEP_) + ' عامًا', min: start, max: start + AGE_BRACKET_STEP_ });
  }
  return list;
})();

    ageGenderFilter_ = btn.getAttribute('data-filter');

// يبني فئات الأعمار مصفّاة حسب فلترَي المرحلة/الجنس الحاليَين — يُستخدَم من العرض والتصدير معًا.
// الترتيب زمني تصاعدي (10-15 ثم 15-20 ...) بخلاف لوحة المناطق التي تُرتَّب بالعدد تنازليًا، لأن
// الترتيب الطبيعي هنا أوضح لعرض توزيع عمري. الفئات الفارغة (عدد = صفر) تُخفى من القائمة.
function computeFilteredAgeData() {
  var records = ageRecordsCache_;
  if (ageStageFilter_ === 'pending') records = records.filter(function (r) { return r.pending; });
  else if (ageStageFilter_ !== 'all') { var lvl = parseInt(ageStageFilter_, 10); records = records.filter(function (r) { return r.level === lvl; }); }
  if (ageGenderFilter_ !== 'all') records = records.filter(function (r) { return r.gender === ageGenderFilter_; });

  var buckets = [];
  var ltCount = records.filter(function (r) { return r.age != null && r.age < AGE_BRACKET_MIN_; }).length;
  if (ltCount > 0) buckets.push({ name: 'أقل من ' + AGE_BRACKET_MIN_ + ' أعوام', count: ltCount });
  AGE_BRACKETS_.forEach(function (b) {
    var count = records.filter(function (r) { return r.age != null && r.age >= b.min && r.age < b.max; }).length;
    if (count > 0) buckets.push({ name: b.label, count: count });
  });
  var gtCount = records.filter(function (r) { return r.age != null && r.age >= AGE_BRACKET_MAX_; }).length;
  if (gtCount > 0) buckets.push({ name: 'أكثر من ' + AGE_BRACKET_MAX_ + ' عامًا', count: gtCount });
  var unknownCount = records.filter(function (r) { return r.age == null; }).length;
  if (unknownCount > 0) buckets.push({ name: 'غير محدَّد (بلا تاريخ ميلاد مسجَّل)', count: unknownCount });

  return {
    buckets: buckets,
    stageLabel: AREA_STAGE_LABELS_[ageStageFilter_] || 'جميع المراحل',
    genderLabel: AREA_GENDER_LABELS_[ageGenderFilter_] || 'الجميع'
  };
}

function updateAgeStageCounts() {
  var genderFiltered = ageGenderFilter_ === 'all' ? ageRecordsCache_ : ageRecordsCache_.filter(function (r) { return r.gender === ageGenderFilter_; });
  var allEl = document.getElementById('ageStageCount-all'); if (allEl) allEl.textContent = genderFiltered.length;
  [0, 1, 2, 3].forEach(function (lvl) {
    var el = document.getElementById('ageStageCount-' + lvl);
    if (el) el.textContent = genderFiltered.filter(function (r) { return r.level === lvl; }).length;
  });
  var pendingEl = document.getElementById('ageStageCount-pending');
  if (pendingEl) pendingEl.textContent = genderFiltered.filter(function (r) { return r.pending; }).length;
}

function renderAgeBarsFiltered() {

  var buckets = computeFilteredAgeData().buckets;
  if (buckets.length === 0) { container.innerHTML = '<p class="empty-note">لا توجد بيانات أعمار مطابقة لهذا الفلتر</p>'; return; }
  var max = Math.max.apply(null, buckets.map(function (b) { return b.count; }).concat([1]));
  container.innerHTML = buckets.map(function (b) {
    var pct = max > 0 ? Math.round(b.count / max * 100) : 0;
    return '<div><span>' + escapeHtml(b.name) + ' <small>' + b.count + '</small></span><div><i style="width:' + pct + '%;background:var(--primary)"></i></div></div>';
  }).join('');
}

function exportAgeBarsToExcel() {
  var data = computeFilteredAgeData();
  if (data.buckets.length === 0) { alertMSG('لا توجد بيانات مطابقة لهذا الفلتر لتصديرها', 'warning'); return; }

  var title = 'توزيع الطلاب حسب الأعمار — ' + data.stageLabel + ' — ' + data.genderLabel;
  var headers = ['#', 'الفئة العمرية', 'عدد الطلاب'];
  var rows = data.buckets.map(function (b, idx) { return [idx + 1, b.name, b.count]; });
  var filename = 'توزيع_الأعمار_' + data.stageLabel + '_' + data.genderLabel + '.xls';
  exportReportExcel({ headers: headers, rows: rows }, title, filename);
}

/* ==========================================================================
   أدوات مشتركة (خلية شخص، شارة مرحلة، ترقيم صفحات، تهريب نصوص)
   ========================================================================== */
function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// avatarUrl اختياري (رابعة) — لو موجودة تُعرَض صورة الشخص الحقيقية، وإلا الصورة الافتراضية
// الموحّدة DEFAULT_AVATAR_URL_ (js.html) — لا يظهر حرف أول كنص إطلاقًا بعد الآن.
function personCellHtml(name, subtitle, tone, avatarUrl) {
  var avatarInner = '<img src="' + escapeHtml(avatarUrl || DEFAULT_AVATAR_URL_) + '" alt="">';
  return '<div class="person-cell"><span class="avatar small' + (tone ? (' ' + tone) : '') + '">' + avatarInner + '</span>' +
    '<span><strong>' + escapeHtml(name || '—') + '</strong><small>' + escapeHtml(subtitle || '') + '</small></span></div>';
}

function getStudentCurrentLevel(s) {
  if (!s) return null;
  if (s.class0 === 'active') return 0;
  if (s.class1 === 'active') return 1;
  if (s.class2 === 'active') return 2;
  if (s.class3 === 'active') return 3;
  return null;
}

function getLevelName(lvl) {
  if (lvl === 0) return 'التأهيلية';
  if (lvl === 1) return 'التأسيسية';
  if (lvl === 2) return 'التأصيلية';
  if (lvl === 3) return 'التحصيلية';
  return '—';
}

function stageBadgeHtml(levelIndex) {
  return '<span class="stage-badge s' + levelIndex + '">' + getLevelName(levelIndex) + '</span>';
}

function formatDateAr(input) {
  if (!input) return '—';
  var d = new Date(input);
  if (isNaN(d.getTime())) return '—';
  try { return d.toLocaleDateString('ar-BH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }); }
  catch (e) { return d.toLocaleDateString(); }
}

function formatTimeOnly(input) {
  if (!input) return '—';
  var d = new Date(input);
  if (isNaN(d.getTime())) return '—';
  try { return d.toLocaleTimeString('ar-BH', { hour: '2-digit', minute: '2-digit' }); }
  catch (e) { return d.toLocaleTimeString(); }
}

// مؤشر الترتيب البصري (سهم ↑/↓) على رأس العمود النشط حاليًا بجدول ما، ومسحه من بقية
// رؤوس نفس الجدول — تُستدعى من كل معالِج نقر th[data-sort] بعد تحديث حقل/اتجاه الترتيب.
function updateSortIndicator(tableId, sortField, sortDir) {
  var table = document.getElementById(tableId);
  if (!table) return;
  table.querySelectorAll('th[data-sort]').forEach(function (th) {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.getAttribute('data-sort') === sortField) th.classList.add(sortDir === 'desc' ? 'sort-desc' : 'sort-asc');
  });
}

// أداة ترقيم صفحات عامة (تُستخدم لقوائم الطلاب والمتعاونين)، بنفس شكل أزرار
// الترقيم في التصميم المرجعي (.pagination > button، لا Bootstrap).
function renderPagination(containerId, totalItems, pageSize, currentPage, onPageChange) {
  var container = document.getElementById(containerId);
  if (!container) return;
  var totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;
  if (totalPages <= 1) { container.innerHTML = ''; return; }

  var html = '';
  html += '<button' + (currentPage <= 1 ? ' disabled' : '') + ' data-page="' + (currentPage - 1) + '"><i data-icon="chevron-right"></i></button>';
  var start = Math.max(1, currentPage - 2);
  var end = Math.min(totalPages, start + 4);
  start = Math.max(1, end - 4);
  for (var p = start; p <= end; p++) {
    html += '<button' + (p === currentPage ? ' class="active"' : '') + ' data-page="' + p + '">' + p + '</button>';
  }
  html += '<button' + (currentPage >= totalPages ? ' disabled' : '') + ' data-page="' + (currentPage + 1) + '"><i data-icon="chevron-left"></i></button>';
  container.innerHTML = html;
  refreshIcons();

  container.querySelectorAll('button[data-page]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (btn.disabled) return;
      var page = parseInt(btn.getAttribute('data-page'), 10);
      if (!page || page < 1 || page > totalPages || page === currentPage) return;
      onPageChange(page);
    });
  });
}

   قسم "قوائم الطلاب"

var allStudentsData = [];
var currentStudentFilter = 'all';
var currentStudentModeFilter = 'all'; // all | onsite | remote
var studentsFilterSetupDone = false;
var studentsPageSize = 50;
var studentsCurrentPage = 1;
var studentsSortField = null;
var studentsSortDir = 'asc';
var studentsAttendCountMap = {};
var studentsAttendByCpr = {};
var studentsRecitByCpr = {};
var studentsAnswersByCpr = {};
var detailsTargetCpr = null;

// نمط الدراسة: getPersons تُرجع isRemote من عمود outsideBahrain (الذي يكتبه التسجيل وتحويل النمط
// معًا مع studyType)، فهو المرجع الوحيد هنا — طلاب قدامى بلا قيمة بالعمود = حضوري.
function isRemoteStudent_(s) {
  return !!(s && s.isRemote);
}
function studyModeLabel_(s) {
  return isRemoteStudent_(s) ? 'عن بُعد' : 'حضوري';
}

function buildStudentAttendMaps_(records) {
  studentsAttendCountMap = {};
  studentsAttendByCpr = {};
  if (!Array.isArray(records)) return;
  var seen = {};
  records.forEach(function (e) {
    if (!e || e.cpr === undefined || e.cpr === null || e.cpr === '') return;
    var d = new Date(e.date);
    if (isNaN(d.getTime())) return;
    var dateStr = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    var key = e.cpr + '_' + dateStr;
    if (seen[key]) return;
    seen[key] = true;
    studentsAttendCountMap[e.cpr] = (studentsAttendCountMap[e.cpr] || 0) + 1;
    (studentsAttendByCpr[e.cpr] = studentsAttendByCpr[e.cpr] || []).push({ date: e.date, code: e.code, name: e.name });
  });
  Object.keys(studentsAttendByCpr).forEach(function (k) {
    studentsAttendByCpr[k].sort(function (a, b) { return new Date(b.date).getTime() - new Date(a.date).getTime(); });
  });
}

function buildStudentRecitMap_(records) {
  studentsRecitByCpr = {};
  if (!Array.isArray(records)) return;
  records.forEach(function (e) {
    if (!e || e.stuCpr === undefined || e.stuCpr === null || e.stuCpr === '') return;
    (studentsRecitByCpr[e.stuCpr] = studentsRecitByCpr[e.stuCpr] || []).push(e);
  });
}

function buildStudentAnswersMap_(records) {
  studentsAnswersByCpr = {};
  if (!Array.isArray(records)) return;
  records.forEach(function (e) {
    if (!e || e.cpr === undefined || e.cpr === null || e.cpr === '') return;
    (studentsAnswersByCpr[e.cpr] = studentsAnswersByCpr[e.cpr] || []).push(e);
  });
}

// تحميل مشترك لخرائط تفاصيل الطالب (حضور/أوراد/اختبارات) التي تعتمد عليها نوافذ
// openAttendDetails/openRecitDetails/openExamDetails — أصلًا كانت تُحمَّل فقط عند فتح "قوائم
// الطلاب"، فلا تعمل أزرار التفاصيل من أي صفحة أخرى (مثل "مرشّحو الاجتياز") قبل زيارة تلك الصفحة
// أولًا بنفس الجلسة. تُجلَب مرة واحدة فقط لكل جلسة (studentDetailMapsLoaded_) ثم تُعاد فورًا.
var studentDetailMapsLoaded_ = false;
function ensureStudentDetailMapsLoaded_(callback) {
  if (studentDetailMapsLoaded_) { callback(); return; }
  var loaded = { persons: false, attend: false, recit: false, answers: false };
  var personsData = null, attendRecords = null, recitRecords = null, answersRecords = null;

  function tryFinish() {
    if (!loaded.persons || !loaded.attend || !loaded.recit || !loaded.answers) return;
    buildStudentAttendMaps_(attendRecords);
    buildStudentRecitMap_(recitRecords);
    buildStudentAnswersMap_(answersRecords);
    if (!allStudentsData.length) allStudentsData = Array.isArray(personsData) ? personsData : [];
    studentDetailMapsLoaded_ = true;
    callback();
  }

  google.script.run.withSuccessHandler(function (data) { personsData = data; loaded.persons = true; tryFinish(); })
    .withFailureHandler(function () { personsData = []; loaded.persons = true; tryFinish(); }).getPersons();
  google.script.run.withSuccessHandler(function (data) { attendRecords = Array.isArray(data) ? data : []; loaded.attend = true; tryFinish(); })
    .withFailureHandler(function () { attendRecords = []; loaded.attend = true; tryFinish(); }).getAttendance();
  google.script.run.withSuccessHandler(function (data) { recitRecords = Array.isArray(data) ? data : []; loaded.recit = true; tryFinish(); })
    .withFailureHandler(function () { recitRecords = []; loaded.recit = true; tryFinish(); }).getDectationData();
  google.script.run.withSuccessHandler(function (data) { answersRecords = Array.isArray(data) ? data : []; loaded.answers = true; tryFinish(); })
    .withFailureHandler(function () { answersRecords = []; loaded.answers = true; tryFinish(); }).getAnswersData(null);
}

// شارات "طالب أيضًا"/"له صلاحية إدارية" بجدولَي "قوائم الطلاب" و"إدارة المتعاونين" — قائمة
// الأرقام المزدوجة تُجلَب مرة واحدة فقط لكل جلسة (getDualRoleCprList، dataGet.js)، ولا تحجب
// عرض الجدول: يُعاد الرسم تلقائيًا فور توفّرها لو لم تكن جاهزة عند أول رسم. عرض فقط، بلا أي
// تأثير على البيانات أو الصلاحيات. راجع مناقشات.md "طالب بصلاحية إدارية".
var dualRoleCprSet_ = {};
var dualRoleCprSetLoaded_ = false;
function ensureDualRoleCprSet_(onLoaded) {
  if (dualRoleCprSetLoaded_) { if (onLoaded) onLoaded(); return; }
  google.script.run.withSuccessHandler(function (list) {
    (Array.isArray(list) ? list : []).forEach(function (c) { dualRoleCprSet_[String(c)] = true; });
    dualRoleCprSetLoaded_ = true;
    if (onLoaded) onLoaded();
  }).withFailureHandler(function () { dualRoleCprSetLoaded_ = true; if (onLoaded) onLoaded(); }).getDualRoleCprList();
}

function loadStudentsView() {
  setRouteLoading('students', true);
  setupStudentsFilterControls();

  var tbody = document.getElementById('students-table-body');
  if (tbody) tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:24px;">جاري التحميل...</td></tr>';

  var loaded = { persons: false, attend: false, recit: false, answers: false };
  var personsData = null, attendRecords = null, recitRecords = null, answersRecords = null;

  function tryRender() {
    if (!loaded.persons || !loaded.attend || !loaded.recit || !loaded.answers) return;
    buildStudentAttendMaps_(attendRecords);
    buildStudentRecitMap_(recitRecords);
    buildStudentAnswersMap_(answersRecords);
    studentDetailMapsLoaded_ = true;

    allStudentsData = Array.isArray(personsData) ? personsData : [];
    currentStudentFilter = 'all';
    document.querySelectorAll('#studentFilterGroup button[data-filter]').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-filter') === 'all');
    });
    currentStudentModeFilter = 'all';
    syncStudentModeFilterButtons_();
    var searchInp = document.getElementById('students-search-input');
    if (searchInp) searchInp.value = '';

    updateStudentFilterCounts();
    renderStudentsTable();
    setRouteLoading('students', false);
    ensureDualRoleCprSet_(renderStudentsTable);
  }

  google.script.run.withSuccessHandler(function (data) {
    personsData = data; loaded.persons = true; tryRender();
  }).withFailureHandler(function (err) {
    console.error('فشل تحميل الطلاب', err);
    if (tbody) tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:24px;color:var(--danger)">تعذّر تحميل بيانات الطلاب</td></tr>';
    personsData = []; loaded.persons = true; setRouteLoading('students', false);
  }).getPersons();

  google.script.run.withSuccessHandler(function (data) {
    attendRecords = Array.isArray(data) ? data : []; loaded.attend = true; tryRender();
  }).withFailureHandler(function () { attendRecords = []; loaded.attend = true; tryRender(); }).getAttendance();

  google.script.run.withSuccessHandler(function (data) {
    recitRecords = Array.isArray(data) ? data : []; loaded.recit = true; tryRender();
  }).withFailureHandler(function () { recitRecords = []; loaded.recit = true; tryRender(); }).getDectationData();

  google.script.run.withSuccessHandler(function (data) {
    answersRecords = Array.isArray(data) ? data : []; loaded.answers = true; tryRender();
  }).withFailureHandler(function () { answersRecords = []; loaded.answers = true; tryRender(); }).getAnswersData(null);
}

function setupStudentsFilterControls() {
  if (studentsFilterSetupDone) return;

  var group = document.getElementById('studentFilterGroup');
  if (group) {
    group.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-filter]');
      if (!btn) return;
      group.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
      currentStudentFilter = btn.getAttribute('data-filter');
      studentsCurrentPage = 1;
      renderStudentsTable();
    });
  }

  var modeGroup = document.getElementById('studentModeFilterGroup');
  if (modeGroup) {
    modeGroup.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-mode-filter]');
      if (!btn) return;
      currentStudentModeFilter = btn.getAttribute('data-mode-filter');
      syncStudentModeFilterButtons_();
      studentsCurrentPage = 1;
      renderStudentsTable();
    });
  }

  var searchInp = document.getElementById('students-search-input');
  if (searchInp) searchInp.addEventListener('input', function () { studentsCurrentPage = 1; renderStudentsTable(); });

  var pageSizeSel = document.getElementById('students-page-size');
  if (pageSizeSel) {
    pageSizeSel.value = String(studentsPageSize);
    pageSizeSel.addEventListener('change', function () {
      studentsPageSize = parseInt(pageSizeSel.value, 10) || 50;
      studentsCurrentPage = 1;
      renderStudentsTable();
    });
  }

  setupStudentsSortHeaders();
  studentsFilterSetupDone = true;
}

function updateStudentFilterCounts() {
  var setText = function (id, n) { var el = document.getElementById(id); if (el) el.textContent = n; };
  setText('count-all', allStudentsData.length);
  setText('count-class0', allStudentsData.filter(function (s) { return s.class0 === 'active'; }).length);
  setText('count-class1', allStudentsData.filter(function (s) { return s.class1 === 'active'; }).length);
  setText('count-class2', allStudentsData.filter(function (s) { return s.class2 === 'active'; }).length);
  setText('count-class3', allStudentsData.filter(function (s) { return s.class3 === 'active'; }).length);

  var remoteCount = allStudentsData.filter(isRemoteStudent_).length;
  setText('count-mode-all', allStudentsData.length);
  setText('count-mode-onsite', allStudentsData.length - remoteCount);
  setText('count-mode-remote', remoteCount);
}

function syncStudentModeFilterButtons_() {
  document.querySelectorAll('#studentModeFilterGroup button[data-mode-filter]').forEach(function (b) {
    var active = b.getAttribute('data-mode-filter') === currentStudentModeFilter;
    b.classList.toggle('active', active);
    b.setAttribute('aria-pressed', active ? 'true' : 'false');
  });
}

function getFilteredStudents() {
  var data = allStudentsData.slice();
  if (currentStudentFilter === 'class0') data = data.filter(function (s) { return s.class0 === 'active'; });
  else if (currentStudentFilter === 'class1') data = data.filter(function (s) { return s.class1 === 'active'; });
  else if (currentStudentFilter === 'class2') data = data.filter(function (s) { return s.class2 === 'active'; });
  else if (currentStudentFilter === 'class3') data = data.filter(function (s) { return s.class3 === 'active'; });

  if (currentStudentModeFilter === 'remote') data = data.filter(isRemoteStudent_);
  else if (currentStudentModeFilter === 'onsite') data = data.filter(function (s) { return !isRemoteStudent_(s); });

  var inp = document.getElementById('students-search-input');
  var q = inp ? (inp.value || '').trim().toLowerCase() : '';
  if (q) {
    data = data.filter(function (s) {
      return (String(s.name || '').toLowerCase().indexOf(q) !== -1) ||
             (String(s.phone || '').toLowerCase().indexOf(q) !== -1) ||
             (String(s.cpr || '').toLowerCase().indexOf(q) !== -1);
    });
  }

  if (studentsSortField) {
    var field = studentsSortField, dir = studentsSortDir === 'desc' ? -1 : 1;
    data.sort(function (a, b) { return String(a[field] || '').localeCompare(String(b[field] || ''), 'ar') * dir; });
  }
  return data;
}

function setupStudentsSortHeaders() {
  document.querySelectorAll('#studentsTable th[data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      var field = th.getAttribute('data-sort');
      if (studentsSortField === field) studentsSortDir = studentsSortDir === 'asc' ? 'desc' : 'asc';
      else { studentsSortField = field; studentsSortDir = 'asc'; }
      updateSortIndicator('studentsTable', studentsSortField, studentsSortDir);
      studentsCurrentPage = 1;
      renderStudentsTable();
    });
  });
}

function exportStudentsToExcel() {
  var data = getFilteredStudents();
  if (!data || data.length === 0) {
    Swal.fire({ icon: 'info', title: 'لا يوجد بيانات لتصديرها', timer: 1800, showConfirmButton: false });
    return;
  }

  var rows = data.map(function (s, i) {
    var lvl = getStudentCurrentLevel(s);
    var programs = [];
    if (s.class0 === 'active') programs.push('التأهيلية');
    if (s.class1 === 'active') programs.push('التأسيسية');
    if (s.class2 === 'active') programs.push('التأصيلية');
    if (s.class3 === 'active') programs.push('التحصيلية');

    var attendCount = studentsAttendCountMap[s.cpr] || 0;
    var recitCount = (lvl === null) ? 0 : (studentsRecitByCpr[s.cpr] || []).filter(function (r) { return r.level === lvl; }).length;
    var examCount = (lvl === null) ? 0 : (studentsAnswersByCpr[s.cpr] || []).filter(function (a) {
      return a.level === lvl && a.rate !== 'راسب' && a.rate !== '' && a.rate !== undefined && a.rate !== null;
    }).length;

    return {
      '#': i + 1,
      'الرقم الشخصي': s.cpr || '',
      'الاسم': s.name || '',
      'الجنس': s.gender || '',
      'الهاتف': s.phone || '',
      'المذهب': s.mazhab || '',
      'الجنسية': s.nationality || '',
      'نمط الدراسة': studyModeLabel_(s),
      'البرامج المسجلة': programs.join('، '),
      'المستوى الحالي': lvl === null ? '—' : getLevelName(lvl),
      'أيام الحضور': attendCount,
      'الأوراد (المستوى الحالي)': recitCount,
      'الاختبارات الناجحة (المستوى الحالي)': examCount
    };
  });

  exportRowsToExcel({ title: 'قائمة الطلاب', rows: rows, filename: 'قائمة الطلاب' });
  alertMSG('تم تصدير ' + data.length + ' طالب', 'success');
}

function renderStudentsTable() {
  var tbody = document.getElementById('students-table-body');
  if (!tbody) return;

  var fullData = getFilteredStudents();
  var visEl = document.getElementById('students-visible-count');
  if (visEl) visEl.textContent = fullData.length;

  renderPagination('students-pagination', fullData.length, studentsPageSize, studentsCurrentPage, function (page) {
    studentsCurrentPage = page; renderStudentsTable();
  });

  if (fullData.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--muted)">لا يوجد طلاب مطابقون</td></tr>';
    return;
  }

  var totalPages = Math.max(1, Math.ceil(fullData.length / studentsPageSize));
  if (studentsCurrentPage > totalPages) studentsCurrentPage = totalPages;
  var startIdx = (studentsCurrentPage - 1) * studentsPageSize;
  var data = fullData.slice(startIdx, startIdx + studentsPageSize);

  var rows = data.map(function (s, iOnPage) {
    var i = startIdx + iOnPage;
    var cprStr = escapeHtml(s.cpr);
    var phoneStr = escapeHtml(s.phone);

    var attendCount = studentsAttendCountMap[s.cpr] || 0;
    var lvl = getStudentCurrentLevel(s);
    var recitList = studentsRecitByCpr[s.cpr] || [];
    var recitCount = (lvl === null) ? 0 : recitList.filter(function (r) { return r.level === lvl; }).length;
    var ansList = studentsAnswersByCpr[s.cpr] || [];
    var passedExamsCount = (lvl === null) ? 0 : ansList.filter(function (a) {
      return a.level === lvl && a.rate !== 'راسب' && a.rate !== '' && a.rate !== undefined && a.rate !== null;
    }).length;

    var programBadges = ['class0', 'class1', 'class2', 'class3'].map(function (key, idx) {
      return s[key] === 'active' ? stageBadgeHtml(idx) : '';
    }).join(' ').trim();
    if (!programBadges) programBadges = '<span style="color:#b7bec5">—</span>';

    var phoneCell = s.phone
      ? '<td data-label="الهاتف" dir="ltr" ondblclick="openWhatsApp(\'' + phoneStr + '\')" title="ضغطتان لفتح واتساب" style="cursor:pointer;"><i class="fab fa-whatsapp" style="color:#25D366;margin-left:6px;"></i>' + phoneStr + '</td>'
      : '<td data-label="الهاتف">—</td>';

    var dualBadge = dualRoleCprSet_[cprStr] ? ' <span class="permission-badge" title="له صلاحية إدارية أيضًا"><i data-icon="shield-check"></i>إداري أيضًا</span>' : '';
    var isRemote = isRemoteStudent_(s);
    // شارة لطلاب "عن بُعد" فقط (الحضوري هو الأصل فلا داعي لتكرارها على كل صف)، بنفس شكل طلبات التسجيل.
    var modeBadge = isRemote ? ' <span class="soft-badge blue tiny students-mode-badge" title="يدرس عن بُعد"><i data-icon="globe"></i>عن بُعد</span>' : '';

    return '<tr data-cpr="' + cprStr + '">' +
      '<td data-label="#">' + (i + 1) + '</td>' +
      '<td ondblclick="adminPreviewStudentPage(\'' + cprStr + '\')" title="ضغطتان لعرض صفحة الطالب" style="cursor:pointer;">' + personCellHtml(s.name, cprStr, null, s.avatarUrl) + modeBadge + dualBadge + '</td>' +
      phoneCell +
      '<td data-label="الجنسية">' + (s.nationality ? escapeHtml(s.nationality) : '—') + '</td>' +
      '<td data-label="البرنامج">' + programBadges + '</td>' +
      '<td data-label="الحضور"><button class="text-button" type="button" onclick="openAttendDetails(\'' + cprStr + '\')">' + attendCount + '</button></td>' +
      '<td data-label="الأوراد">' + (lvl === null ? '<span style="color:#b7bec5">—</span>' : '<button class="text-button" type="button" onclick="openRecitDetails(\'' + cprStr + '\')">' + recitCount + '</button>') + '</td>' +
      '<td data-label="الاختبارات">' + (lvl === null ? '<span style="color:#b7bec5">—</span>' : '<button class="text-button" type="button" onclick="openExamDetails(\'' + cprStr + '\')">' + passedExamsCount + '</button>') + '</td>' +
      '<td><div class="table-actions">' +
        '<button class="icon-button" type="button" title="' + (isRemote ? 'تحويل إلى حضوري' : 'تحويل إلى عن بُعد') + '" aria-label="تحويل نمط دراسة ' + escapeHtml(s.name) + '" onclick="changeStudentStudyMode(\'' + cprStr + '\')"><i data-icon="arrow-left-right"></i></button>' +
        '<button class="icon-button" type="button" title="تفاصيل الطالب" onclick="showStudentDetailsDrawer(\'' + cprStr + '\')"><i data-icon="panel-left-open"></i></button>' +
        '<button class="icon-button" type="button" title="المزيد" onclick="showStudentDetailsDrawer(\'' + cprStr + '\')"><i data-icon="more-horizontal"></i></button>' +
      '</div></td>' +
    '</tr>';
  }).join('');

  tbody.innerHTML = rows;
  refreshIcons();
}

/* ============ القائمة الجانبية لتفاصيل الطالب (النموذج المعتمد) ============ */
/* تُفتح من مفتاحَي الإجراءات في جدول الطلاب — تعرض ملخصًا سريعًا من نفس
   البيانات المحمَّلة أصلاً للجدول (بلا أي طلب إضافي للخادم). أيقونة "فتح صفحة
   الطالب" في أقصى يسار رأس الدرج (بجوار الاسم) هي المسار الوحيد الآن لوضع
   المعاينة الكامل adminPreviewStudentPage — أُزيلت من صف الجدول نفسه. */
/* ================================================================== */
function showStudentDetailsDrawer(cpr) {
  var stu = findStudentByCpr(cpr);
  if (!stu) { alertMSG('تعذّر العثور على بيانات هذا الطالب', 'error'); return; }

  var lvl = getStudentCurrentLevel(stu);
  var levelName = lvl === null ? '—' : getLevelName(lvl);
  var attendCount = studentsAttendCountMap[stu.cpr] || 0;
  var recitList = studentsRecitByCpr[stu.cpr] || [];
  var recitCount = (lvl === null) ? 0 : recitList.filter(function (r) { return r.level === lvl; }).length;
  var ansList = studentsAnswersByCpr[stu.cpr] || [];
  var passedExamsCount = (lvl === null) ? 0 : ansList.filter(function (a) {
    return a.level === lvl && a.rate !== 'راسب' && a.rate !== '' && a.rate !== undefined && a.rate !== null;
  }).length;
  var bodyHtml =
    '<div class="profile-summary"><span class="avatar"><img src="' + escapeHtml(stu.avatarUrl || DEFAULT_AVATAR_URL_) + '" alt=""></span>' +
      '<div><strong>' + escapeHtml(stu.name) + '</strong><small>' + escapeHtml(stu.cpr) + ' · ' + escapeHtml(levelName) + '</small></div>' +
    '</div>' +
    '<section class="detail-list"><h3>البيانات الأساسية</h3><dl>' +
      '<div><dt>الهاتف</dt><dd>' + (stu.phone ? escapeHtml(stu.phone) : '—') + '</dd></div>' +
      '<div><dt>الجنسية</dt><dd>' + (stu.nationality ? escapeHtml(stu.nationality) : '—') + '</dd></div>' +
      '<div><dt>الجنس</dt><dd>' + (stu.gender ? escapeHtml(stu.gender) : '—') + '</dd></div>' +
      '<div><dt>المرحلة</dt><dd>' + escapeHtml(levelName) + '</dd></div>' +
      '<div><dt>نمط الدراسة</dt><dd>' + studyModeLabel_(stu) + '</dd></div>' +
    '</dl></section>' +
    '<section class="detail-list"><h3>ملخص المتابعة</h3><dl>' +
      '<div><dt>أيام الحضور</dt><dd>' + attendCount + '</dd></div>' +
      '<div><dt>الأوراد</dt><dd>' + recitCount + '</dd></div>' +
      '<div><dt>اختبارات ناجحة</dt><dd>' + passedExamsCount + '</dd></div>' +
    '</dl></section>';

  var convertLabel = isRemoteStudent_(stu) ? 'تحويل إلى حضوري' : 'تحويل إلى عن بُعد';
  openDrawer(stu.name, 'ملف الطالب', bodyHtml,
    '<button class="secondary-button" type="button" onclick="changeStudentStudyMode(\'' + escapeHtml(stu.cpr) + '\', true)"><i data-icon="arrow-left-right"></i>' + convertLabel + '</button>' +
    '<button class="secondary-button" type="button" onclick="closeDrawer()">إغلاق</button>',
    function () { closeDrawer(); adminPreviewStudentPage(stu.cpr); }
  );
}

/* ==========================================================================
   تحويل نمط دراسة الطالب (حضوري ⇄ عن بُعد) — من زر الصف بجدول "قوائم الطلاب" أو من درج تفاصيل
   الطالب (fromDrawer = true فيُحدَّث الدرج بعد النجاح). يُغيِّر النمط فقط؛ الرقم الشخصي/معرّف
   الدخول وكل سجلات الطالب تبقى كما هي (راجع setStudentStudyMode في dataPost.js). بعد النجاح
   يُحدَّث السجل المحلي وتُعاد الفلاتر والعدّادات دون إعادة تحميل الجدول من الخادم.
   ========================================================================== */
var studyModeChangeBusy_ = false;
function changeStudentStudyMode(cpr, fromDrawer) {
  if (studyModeChangeBusy_) return;
  var stu = findStudentByCpr(cpr);
  if (!stu) { alertMSG('تعذّر العثور على بيانات هذا الطالب', 'error'); return; }

  var toRemote = !isRemoteStudent_(stu);
  var fromLabel = toRemote ? 'حضوري' : 'عن بُعد';
  var toLabel = toRemote ? 'عن بُعد' : 'حضوري';

  Swal.fire({
    title: 'تحويل نمط الدراسة',
    html: 'سيتحوّل الطالب <strong>' + escapeHtml(stu.name) + '</strong> من الدراسة <strong>' + fromLabel + '</strong> إلى الدراسة <strong>' + toLabel + '</strong>.' +
      '<br><small style="color:#687481;">لا يتغيّر رقمه الشخصي ولا أي من سجلاته (الحضور، الأوراد، الاختبارات).</small>',
    icon: 'question',
    showCancelButton: true,
    confirmButtonColor: '#b5262c',
    confirmButtonText: 'تحويل إلى ' + toLabel,
    cancelButtonText: 'إلغاء'
  }).then(function (result) {
    if (!result.isConfirmed) return;
    studyModeChangeBusy_ = true;
    google.script.run.withSuccessHandler(function (res) {
      studyModeChangeBusy_ = false;
      if (!res || res.error) { alertMSG(escapeHtml((res && res.message) || 'تعذّر تحويل نمط الدراسة'), 'error'); return; }
      stu.isRemote = !!res.isRemote;
      stu.studyType = res.studyType;
      updateStudentFilterCounts();
      renderStudentsTable();
      if (fromDrawer) showStudentDetailsDrawer(stu.cpr);
      alertMSG('تم تحويل ' + escapeHtml(stu.name) + ' إلى الدراسة ' + toLabel, 'success');
    }).withFailureHandler(function (err) {
      studyModeChangeBusy_ = false;
      alertMSG('تعذّر تحويل نمط الدراسة: ' + escapeHtml(String((err && err.message) || err)), 'error');
    }).setStudentStudyMode(getCurrentUserCpr(), stu.cpr, toRemote ? 'remote' : 'onsite');
  });
}

/* ================================================================== */
/* ============ عرض صفحة طالب (وضع معاينة للإدارة) ============ */
/* يفتح صفحة الطالب (student.html) مباشرة ببيانات طالب حقيقي مُختار من
   الجدول، بدون تسجيل دخول فعلي ودون المساس بجلسة الموظف الحالية —
   فقط لمراجعة التصميم ببيانات حقيقية. زر "العودة إلى لوحة الإدارة" في
   الشريط العلوي لصفحة الطالب (يظهر فقط في وضع المعاينة) يُعيد لوحة
   الإدارة كما كانت. */
/* ================================================================== */
function adminPreviewStudentPage(cpr) {
  var rec = (allStudentsData || []).find(function (s) { return String(s.cpr) === String(cpr); });
  if (!rec) { alertMSG('تعذّر العثور على بيانات هذا الطالب', 'error'); return; }

  // نفس الآلية بالضبط سواء كانت معاينة لطالب آخر أو دخول الإداري لحسابه الشخصي كطالب (زر
  // "حسابي كطالب") — الفرق فقط بنص التأكيد، لأن "دون أي تأثير على حسابك" غير منطقي حين يكون
  // الحساب المعروض هو حساب المستخدم نفسه بالضبط.
  var isSelf = String(cpr) === String(getCurrentUserCpr());
  var confirmHtml = isSelf
    ? 'ستنتقل الآن لعرض حسابك <strong>كطالب</strong>. يمكنك العودة للوحة الإدارة في أي وقت من الشريط الذي سيظهر أعلى الصفحة.'
    : 'ستنتقل الآن لعرض صفحة الطالب <strong>' + escapeHtml(rec.name) + '</strong> كما تظهر له تمامًا (وضع معاينة للإدارة، دون أي تأثير على حسابك).';

  Swal.fire({
    title: isSelf ? 'الدخول لحسابي كطالب' : 'عرض صفحة الطالب',
    html: confirmHtml,
    icon: 'info',
    showCancelButton: true,
    confirmButtonColor: '#b5262c',
    confirmButtonText: 'عرض الصفحة',
    cancelButtonText: 'إلغاء'
  }).then(function (result) {
    if (!result.isConfirmed) return;
    adminPreviewActive_ = true;
    studentData = [rec];
    stuCpr = rec.cpr;
    loadingStart();
    getMatnsRef();
    getDectationDataRef();
    loadStudent();
    loadingEnd();
  });
}

// زر "حسابي كطالب" بقائمة المستخدم العلوية — يضمن تحميل allStudentsData أولًا (قد تكون فارغة
// لو لم تُزَر "قوائم الطلاب" بهذه الجلسة بعد) ثم يُعيد استخدام adminPreviewStudentPage نفسها
// بدل أي آلية دخول موازية. راجع مناقشات.md "طالب بصلاحية إدارية" للسياق الكامل.
function goToOwnStudentAccount_() {
  var cpr = getCurrentUserCpr();
  if (!cpr) return;
  ensureStudentDetailMapsLoaded_(function () { adminPreviewStudentPage(cpr); });
}

// هل المستخدم الإداري الحالي له أيضًا صف طالب نشط؟ يُظهر/يُخفي زر "حسابي كطالب" بقائمة
// المستخدم تبعًا لذلك — يُستدعى مرة كل تحميل للوحة الإدارة (راجع prepareDashboardPage).
function initDualRoleLinks_() {
  var btn = document.getElementById('userMenuGoStudentBtn');
  if (!btn) return;
  var cpr = getCurrentUserCpr();
  if (!cpr) { btn.hidden = true; return; }
  google.script.run.withSuccessHandler(function (info) {
    btn.hidden = !(info && info.isStudent && info.active);
  }).withFailureHandler(function () { btn.hidden = true; }).checkIsAlsoStudent(cpr);
}

/* ===================== فتح واتساب من رقم الهاتف ===================== */
/* ================================================================== */
// نظير toInternationalWhatsAppNumber في code.js (الخادم) وjs.html (بوابة الطالب) — نسخة
// محلية هنا لأن admin-js.html لا يُحمَّل مع js.html (صفحتان منفصلتان تمامًا).
function openWhatsApp(rawPhone) {
  if (!rawPhone) return;
  var digits = String(rawPhone).replace(/\D+/g, '');
  if (!digits) return;
  if (digits.indexOf('00') === 0) digits = digits.substring(2);
  while (digits.charAt(0) === '0' && digits.length > 8) digits = digits.substring(1);
  if (digits.length === 8) digits = '973' + digits;
  window.open('https://wa.me/' + digits, '_blank');
}

/* ============= مودالات تفاصيل (حضور / أوراد / اختبارات) ============= */
/* ================================================================== */
function findStudentByCpr(cpr) {
  return allStudentsData.find(function (s) { return String(s.cpr) === String(cpr); }) || null;
}

function openAttendDetails(cpr) {
  var stu = findStudentByCpr(cpr);
  if (!stu) return;
  detailsTargetCpr = cpr;
  document.getElementById('attendDetailsLabel').innerHTML = '<i class="fas fa-calendar-check me-1"></i> أيام حضور: ' + escapeHtml(stu.name);
  renderAttendDetailsBody(cpr);
  var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('attendDetailsModal'));
  modal.show();
}

function renderAttendDetailsBody(cpr) {
  var stu = findStudentByCpr(cpr);
  var list = studentsAttendByCpr[cpr] || [];
  var subtitle = document.getElementById('attendDetailsSubtitle');
  var body = document.getElementById('attendDetailsBody');
  if (!body) return;

  subtitle.innerHTML = '<i class="bi bi-person-vcard me-1"></i> ' + escapeHtml(stu ? stu.name : '') +
    ' • <span class="text-muted">CPR: </span>' + escapeHtml(cpr) +
    ' • <span class="text-success fw-bold">' + list.length + ' يوم</span>';

  if (list.length === 0) {
    body.innerHTML = '<div class="col-12 text-center text-muted py-4"><i class="bi bi-calendar-x fs-1 d-block mb-2"></i>لا توجد أيام حضور مسجلة. يمكن إضافة يوم يدوياً بالضغط على زر +</div>';
    return;
  }

  body.innerHTML = list.map(function (rec) {
    return '<div class="col-md-6 col-lg-4"><div class="detail-card attend-card">' +
      '<div class="detail-card-header"><i class="bi bi-calendar-event"></i> ' + escapeHtml(formatDateAr(rec.date)) + '</div>' +
      '<div class="detail-card-body"><div class="detail-row"><span class="detail-label">الوقت</span><span class="detail-value">' + escapeHtml(formatTimeOnly(rec.date)) + '</span></div>' +
      (rec.code ? ('<div class="detail-row"><span class="detail-label">المُعرّف</span><span class="detail-value small">' + escapeHtml(rec.code) + '</span></div>') : '') +
      '</div></div></div>';
  }).join('');
}

function openRecitDetails(cpr) {
  var stu = findStudentByCpr(cpr);
  if (!stu) return;
  var lvl = getStudentCurrentLevel(stu);
  if (lvl === null) return;

  var all = studentsRecitByCpr[cpr] || [];
  var list = all.filter(function (r) { return r.level === lvl; });
  list.sort(function (a, b) {
    var m = String(a.matn || '').localeCompare(String(b.matn || ''));
    if (m !== 0) return m;
    return new Date(b.date || 0).getTime() - new Date(a.date || 0).getTime();
  });

  document.getElementById('recitDetailsLabel').innerHTML = '<i class="fas fa-book-open me-1"></i> أوراد: ' + escapeHtml(stu.name);
  document.getElementById('recitDetailsSubtitle').innerHTML = '<i class="bi bi-person-vcard me-1"></i> ' + escapeHtml(stu.name) +
    ' • <span class="text-muted">CPR: </span>' + escapeHtml(cpr) +
    ' • المستوى: <span class="fw-bold">' + escapeHtml(getLevelName(lvl)) + '</span>' +
    ' • <span class="text-primary fw-bold">' + list.length + ' ورد</span>';

  var body = document.getElementById('recitDetailsBody');
  if (list.length === 0) {
    body.innerHTML = '<div class="col-12 text-center text-muted py-4"><i class="bi bi-journal-x fs-1 d-block mb-2"></i>لا توجد أوراد مسموعة في المستوى الحالي</div>';
  } else {
    body.innerHTML = list.map(function (r) {
      var isFail = String(r.rate) === 'راسب';
      var rateHtml = isFail ? '<span class="badge grade-fail">راسب</span>' : '<span class="badge grade-recit">' + escapeHtml(r.rate || '—') + '</span>';
      return '<div class="col-md-6 col-lg-4"><div class="detail-card recit-card">' +
        '<div class="detail-card-header"><i class="bi bi-book"></i> ' + escapeHtml(r.matn || '—') + '</div>' +
        '<div class="detail-card-body">' +
          '<div class="detail-row"><span class="detail-label">الورد</span><span class="detail-value">' + escapeHtml(r.werd || '—') + '</span></div>' +
          '<div class="detail-row"><span class="detail-label">الدرجة</span><span>' + rateHtml + '</span></div>' +
          '<div class="detail-row"><span class="detail-label">الشيخ</span><span class="detail-value">' + escapeHtml(r.resp || '—') + '</span></div>' +
          '<div class="detail-row"><span class="detail-label">التاريخ</span><span class="detail-value small">' + escapeHtml(formatDateAr(r.date)) + '</span></div>' +
        '</div></div></div>';
    }).join('');
  }

  var checklistEl = document.getElementById('recitDetailsChecklist');
  if (checklistEl) {
    checklistEl.innerHTML = '<div class="text-muted small"><i class="fas fa-spinner fa-spin me-1"></i>جارٍ تحميل قائمة الأوراد المفروضة...</div>';
    google.script.run.withSuccessHandler(function (breakdown) {
      renderRecitChecklist(checklistEl, breakdown);
    }).withFailureHandler(function () {
      checklistEl.innerHTML = '';
    }).getStudentRecitationBreakdown(getCurrentUserCpr(), cpr, lvl);
  }

  var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('recitDetailsModal'));
  modal.show();
}

// قائمة تحقّق كاملة لأوراد المرحلة المفروضة (المسمَّع أخضر، الباقي رمادي) + ملخّص "X من Y" —
// للتحقق من صحة نسبة التسميع الظاهرة بالجدول، بطلب المستخدم صراحةً (2026-09-16). راجع
// getStudentRecitationBreakdown (dataPost.js) ومناقشات.md "شهادات الاجتياز" للسياق الكامل.
function renderRecitChecklist(container, breakdown) {
  if (!breakdown || breakdown.error || !breakdown.total) { container.innerHTML = ''; return; }

  var groups = {}, order = [];
  breakdown.items.forEach(function (it) {
    if (!groups[it.matn]) { groups[it.matn] = []; order.push(it.matn); }
    groups[it.matn].push(it);
  });

  var groupsHtml = order.map(function (matn) {
    var chips = groups[matn].map(function (it) {
      var cls = it.recited ? 'recit-chip recit-chip-done' : 'recit-chip recit-chip-pending';
      var title = it.recited
        ? ('سُمِّع بتاريخ ' + escapeHtml(formatDateAr(it.date)) + (it.rate ? (' — ' + escapeHtml(it.rate)) : ''))
        : 'لم يُسمَّع بعد';
      var icon = it.recited ? '<i class="bi bi-check-circle-fill"></i>' : '<i class="bi bi-circle"></i>';
      return '<span class="' + cls + '" title="' + title + '">' + icon + ' ورد ' + escapeHtml(it.werd) + '</span>';
    }).join('');
    return '<div class="recit-checklist-group"><div class="recit-checklist-matn">' + escapeHtml(matn) + '</div>' +
      '<div class="recit-checklist-chips">' + chips + '</div></div>';
  }).join('');

  container.innerHTML =
    '<div class="recit-summary-banner"><i class="bi bi-clipboard-check"></i> <b>' + breakdown.recited + '</b> من <b>' + breakdown.total + '</b> أوراد مسمّعة' +
    (breakdown.considerMadhab ? ' <span class="text-muted fw-normal">(المقام: أوراد مذهب الطالب الفقهي فقط)</span>' : '') +
    '</div>' + groupsHtml;
}

function openExamDetails(cpr) {
  var stu = findStudentByCpr(cpr);
  if (!stu) return;
  var lvl = getStudentCurrentLevel(stu);
  if (lvl === null) return;

  var all = studentsAnswersByCpr[cpr] || [];
  var passed = all.filter(function (a) { return a.level === lvl && a.rate !== 'راسب' && a.rate !== '' && a.rate !== undefined && a.rate !== null; });
  var failed = all.filter(function (a) { return a.level === lvl && a.rate === 'راسب'; });
  passed.sort(function (a, b) { return new Date(b.date || 0).getTime() - new Date(a.date || 0).getTime(); });
  failed.sort(function (a, b) { return new Date(b.date || 0).getTime() - new Date(a.date || 0).getTime(); });

  document.getElementById('examDetailsLabel').innerHTML = '<i class="fas fa-certificate me-1"></i> اختبارات: ' + escapeHtml(stu.name);
  document.getElementById('examDetailsSubtitle').innerHTML = '<i class="bi bi-person-vcard me-1"></i> ' + escapeHtml(stu.name) +
    ' • <span class="text-muted">CPR: </span>' + escapeHtml(cpr) +
    ' • المستوى: <span class="fw-bold">' + escapeHtml(getLevelName(lvl)) + '</span>' +
    ' • <span class="text-success fw-bold">ناجح: ' + passed.length + '</span>' +
    (failed.length ? ' • <span class="text-danger fw-bold">راسب: ' + failed.length + '</span>' : '');

  var body = document.getElementById('examDetailsBody');

  function examCardHtml(a, ok) {
    var rateBadge = ok ? '<span class="badge grade-pass">' + escapeHtml(a.rate || '—') + '</span>' : '<span class="badge grade-fail">راسب</span>';
    var certLink = a.certificate ? '<a href="' + escapeHtml(a.certificate) + '" target="_blank" data-issued-file class="btn btn-sm btn-success mt-2 w-100"><i class="bi bi-file-earmark-check"></i> فتح الشهادة</a>' : '';
    var isFiqh = a.exam === 'الفقه';
    var matnRow = isFiqh
      ? (a.mazhab ? ('<div class="detail-row"><span class="detail-label">المذهب</span><span class="detail-value">' + escapeHtml(a.mazhab) + '</span></div>') : '')
      : (a.matn ? ('<div class="detail-row"><span class="detail-label">المتن</span><span class="detail-value">' + escapeHtml(a.matn) + '</span></div>') : '');
    return '<div class="col-md-6 col-lg-4"><div class="detail-card ' + (ok ? 'exam-card-ok' : 'exam-card-fail') + '">' +
      '<div class="detail-card-header"><i class="bi bi-clipboard-check"></i> ' + escapeHtml(a.exam || '—') + '</div>' +
      '<div class="detail-card-body">' +
        matnRow +
        '<div class="detail-row"><span class="detail-label">الدرجة</span><span>' + rateBadge + '</span></div>' +
        '<div class="detail-row"><span class="detail-label">التاريخ</span><span class="detail-value small">' + escapeHtml(formatDateAr(a.date)) + '</span></div>' +
        certLink +
      '</div></div></div>';
  }

  var html = '';
  if (passed.length === 0 && failed.length === 0) {
    html = '<div class="col-12 text-center text-muted py-4"><i class="bi bi-clipboard-x fs-1 d-block mb-2"></i>لا توجد نتائج اختبارات في المستوى الحالي</div>';
  } else {
    html += passed.map(function (a) { return examCardHtml(a, true); }).join('');
    if (failed.length > 0) {
      html += '<div class="col-12 mt-3"><div class="border-top pt-2 text-danger small fw-bold"><i class="bi bi-x-circle"></i> اختبارات لم يجتزها بعد</div></div>';
      html += failed.map(function (a) { return examCardHtml(a, false); }).join('');
    }
  }
  body.innerHTML = html;

  var checklistEl = document.getElementById('examDetailsChecklist');
  if (checklistEl) {
    checklistEl.innerHTML = '<div class="text-muted small"><i class="fas fa-spinner fa-spin me-1"></i>جارٍ تحميل قائمة الاختبارات المفروضة...</div>';
    google.script.run.withSuccessHandler(function (breakdown) {
      renderExamChecklist(checklistEl, breakdown);
    }).withFailureHandler(function () {
      checklistEl.innerHTML = '';
    }).getStudentExamPassBreakdown(getCurrentUserCpr(), cpr, lvl);
  }

  var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('examDetailsModal'));
  modal.show();
}

// قائمة تحقّق كاملة لاختبارات المرحلة المفروضة بدرجاتها الفعلية (أخضر=ناجح، أحمر=راسب،
// رمادي=لم يُخَض) + متوسط الدرجات — للتحقق من صحة نسبة النجاح الظاهرة بالجدول (بطلب المستخدم
// صراحةً 2026-09-16). راجع getStudentExamPassBreakdown (dataPost.js) ومناقشات.md "شهادات
// الاجتياز" للسياق الكامل.
function renderExamChecklist(container, breakdown) {
  if (!breakdown || breakdown.error || !breakdown.total) { container.innerHTML = ''; return; }

  var chips = breakdown.items.map(function (it) {
    var cls, icon, title;
    if (!it.attempted) {
      cls = 'recit-chip recit-chip-pending';
      icon = '<i class="bi bi-circle"></i>';
      title = 'لم يُخَض بعد';
    } else if (it.rate === 'راسب') {
      cls = 'recit-chip recit-chip-fail';
      icon = '<i class="bi bi-x-circle-fill"></i>';
      title = 'خاضه بتاريخ ' + escapeHtml(formatDateAr(it.date)) + (it.degree !== null ? (' — درجة ' + it.degree + '%') : '');
    } else {
      cls = 'recit-chip recit-chip-done';
      icon = '<i class="bi bi-check-circle-fill"></i>';
      title = 'خاضه بتاريخ ' + escapeHtml(formatDateAr(it.date)) + (it.degree !== null ? (' — درجة ' + it.degree + '%') : '');
    }
    var scoreLabel = it.degree !== null ? (' (' + it.degree + '%)') : '';
    return '<span class="' + cls + '" title="' + title + '">' + icon + ' ' + escapeHtml(it.exam) + scoreLabel + '</span>';
  }).join('');

  container.innerHTML =
    '<div class="recit-summary-banner"><i class="bi bi-clipboard-check"></i> متوسط الدرجات <b>' + (breakdown.average != null ? breakdown.average + '%' : '—') + '</b>' +
    ' — خاض <b>' + breakdown.attempted + '</b> من <b>' + breakdown.total + '</b> اختبارًا مفروضًا' +
    (breakdown.considerAllExams ? ' <span class="text-muted fw-normal">(المقام: كل الاختبارات المفروضة)</span>' : ' <span class="text-muted fw-normal">(المقام: ما خاضه فقط)</span>') +
    '</div><div class="recit-checklist-chips">' + chips + '</div>';
}

function handleAddManualAttend() {
  if (!detailsTargetCpr) return;
  var stu = findStudentByCpr(detailsTargetCpr);
  if (!stu) return;

  addManualAttendanceFlow(detailsTargetCpr, stu.name, function (dateStr) {
    var newDate = new Date(dateStr + 'T08:00:00');
    studentsAttendByCpr[detailsTargetCpr] = studentsAttendByCpr[detailsTargetCpr] || [];

    var localDayStr = newDate.getFullYear() + '-' + (newDate.getMonth() + 1) + '-' + newDate.getDate();
    var already = studentsAttendByCpr[detailsTargetCpr].some(function (r) {
      var d = new Date(r.date);
      return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate() === localDayStr;
    });
    if (!already) {
      studentsAttendByCpr[detailsTargetCpr].unshift({ date: newDate.toString(), code: 'manual', name: stu.name });
      studentsAttendCountMap[detailsTargetCpr] = (studentsAttendCountMap[detailsTargetCpr] || 0) + 1;
    }
    studentsAttendByCpr[detailsTargetCpr].sort(function (a, b) { return new Date(b.date).getTime() - new Date(a.date).getTime(); });

    renderAttendDetailsBody(detailsTargetCpr);
    renderStudentsTable();
  });
}

/* ==========================================================================
   بطاقات مقاييس "طلبات التسجيل" — تُحدَّث من newStuRegData (js.html/funcs-js.html)
   بعد كل تحميل/تحديث لبيانات الطلبات (استدعتها updateRegTabBadges في funcs-js.html).
   ========================================================================== */
function updateRegMetricCards() {
  if (typeof newStuRegData === 'undefined' || !Array.isArray(newStuRegData)) return;

  var pending = newStuRegData.filter(function (r) {
    return r.class0 === true || r.class1 === true || r.class2 === true || r.class3 === true ||
      (typeof isStagelessReg === 'function' && isStagelessReg(r));
  });
  var accepted = newStuRegData.filter(function (r) { return r.cardUrl !== ''; });

  var newEl = document.getElementById('regMetricNew');
  if (newEl) newEl.textContent = pending.length;
  var newSubEl = document.getElementById('regMetricNewSub');
  if (newSubEl) {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var todayCount = pending.filter(function (r) {
      var d = new Date(r.time);
      return !isNaN(d.getTime()) && d >= today;
    }).length;
    newSubEl.textContent = todayCount > 0 ? (todayCount + ' منها اليوم') : 'لا جديد اليوم';
  }

  var remoteCount = pending.filter(function (r) { return r.isRemote; }).length;
  var remoteEl = document.getElementById('regMetricRemote');
  if (remoteEl) remoteEl.textContent = remoteCount;
  var remoteSubEl = document.getElementById('regMetricRemoteSub');
  if (remoteSubEl) remoteSubEl.textContent = pending.length > 0 ? (Math.round(remoteCount / pending.length * 100) + '% من الطلبات الجديدة') : '—';

  var acceptedEl = document.getElementById('regMetricAccepted');
  if (acceptedEl) acceptedEl.textContent = accepted.length;

  var oldestEl = document.getElementById('regMetricOldest');
  var oldestSubEl = document.getElementById('regMetricOldestSub');
  if (oldestEl) {
    if (pending.length === 0) {
      oldestEl.textContent = '—';
      if (oldestSubEl) oldestSubEl.textContent = 'لا توجد طلبات معلّقة';
    } else {
      var oldestTime = null;
      pending.forEach(function (r) {
        var d = new Date(r.time);
        if (!isNaN(d.getTime()) && (oldestTime === null || d < oldestTime)) oldestTime = d;
      });
      if (oldestTime) {
        var days = Math.max(0, Math.floor((Date.now() - oldestTime.getTime()) / 86400000));
        oldestEl.textContent = days === 0 ? 'اليوم' : (days === 1 ? 'يوم واحد' : (days === 2 ? 'يومان' : (days + ' أيام')));
        if (oldestSubEl) oldestSubEl.textContent = days > 2 ? 'يحتاج إلى مراجعة' : 'ضمن المدى المعتاد';
      } else {
        oldestEl.textContent = '—';
        if (oldestSubEl) oldestSubEl.textContent = '—';
      }
    }
  }
}

/* ==========================================================================
   تصحيح "grade" المشتركة قبل وصول القبول/الرفض للمُستمِع العام في js.html —
   ضروري فقط في تبويب "الكل" حيث لا توجد مرحلة واحدة ثابتة لكل الصفوف.
   ملاحظة مهمة: js.html يسجّل مُستمِعه العام على document نفسها وبطور الالتقاط
   (capture) — أي مُستمِع capture آخر مسجَّل من ملف يُحمَّل بعده (كهذا الملف) على
   عنصر ابن لـ document (كـ #usersContainer) يصل إليه الحدث *بعد* document في
   رحلة الالتقاط، فلا يسبقه أبدًا. الحل: الاعتماد على mousedown بدل click —
   يسبق click زمنيًا دائمًا (تسلسل الأحداث: mousedown ثم mouseup ثم click)،
   بصرف النظر تمامًا عن طور الأحداث أو ترتيب تسجيل المُستمِعين.
   ========================================================================== */
function setupRegistrationsGradeFix() {
  var container = document.getElementById('usersContainer');
  if (!container || container.dataset.gradeFixBound) return;
  container.dataset.gradeFixBound = '1';
  container.addEventListener('mousedown', function (e) {
    var row = e.target.closest('tr[data-grade]');
    if (row && (e.target.closest('.acceptNewStu') || e.target.closest('.refuseNewStu'))) {
      // تُضبَط دومًا (رقمًا صحيحًا أو null) بدل تجاهل القيم غير الصالحة فقط — تفاديًا لبقاء
      // grade على قيمة صف سابق عالقة (stale) حين يكون هذا الصف بلا مرحلة مُختارة بعد
      // (طالب سجّل دون اختيار مرحلة ولم يُحدِّد له الموظف مرحلة من خانة renderStagelessStageSelect).
      var g = parseInt(row.dataset.grade, 10);
      grade = isNaN(g) ? null : g;
    }
  });
}

/* ==========================================================================
   "قبول المحدد" — قبول حقيقي (وليس شكليًا) لكل الطلاب المحدَّدين بمربعات الاختيار، بنفس آلية
   acceptAllNewStu() (js.html) — تقدّم الدفعة يظهر عبر الشريط المشترك acceptBatchBanner لكل
   الموظفين، لا مودال محلي — بمرحلة كل طالب الخاصة به (row.dataset.grade) بدل مرحلة واحدة
   مشتركة، لأن التحديد المتعدد قد يشمل طلابًا من مراحل مختلفة (تبويب "الكل").
   ========================================================================== */
function acceptSelectedNewStu() {
  var checked = Array.from(document.querySelectorAll('#usersContainer .registration-check:checked'));
  if (checked.length === 0) return;

  Swal.fire({
    title: 'قبول الطلاب المحددين',
    text: 'هل أنت متأكد من قبول ' + checked.length + (checked.length === 1 ? ' طالب' : ' طالبًا') + '؟',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#b5262c',
    confirmButtonText: 'نعم، اقبلهم',
    cancelButtonText: 'إلغاء',
    reverseButtons: true
  }).then(function (result) {
    if (!result.isConfirmed) return;

    var rows = checked.map(function (cb) { return cb.closest('tr'); }).filter(Boolean);
    var staffName = (typeof userData !== 'undefined' && userData && userData[0] && userData[0].name) || '';
    var total = rows.length, completed = 0;
    var failures = [];

    google.script.run.startAcceptBatch(total, staffName);

    function processRow(index) {
      if (index >= rows.length) {
        google.script.run.endAcceptBatch();
        setTimeout(function () {
          if (failures.length === 0) {
            alertMSG('تم قبول ' + total + (total === 1 ? ' طالب' : ' طالبًا') + ' وإنشاء الملفات المطلوبة', 'success');
            if (typeof getNewStuRegData === 'function') getNewStuRegData();
          } else {
            Swal.fire({
              icon: 'warning',
              title: 'اكتملت العملية مع بعض الأخطاء',
              html: 'نجح: ' + (total - failures.length) + ' من ' + total + '<br><br>تعذّرت معالجة:<br>' +
                failures.map(function (f) { return escapeHtml(f.name) + ' — ' + escapeHtml(f.reason); }).join('<br>')
            }).then(function () { if (typeof getNewStuRegData === 'function') getNewStuRegData(); });
          }
        }, 400);
        return;
      }
      var row = rows[index];
      var cpr = row.id;
      var nameEl = row.querySelector('.name');
      var studentName = nameEl ? nameEl.textContent : cpr;
      var rowGrade = parseInt(row.dataset.grade, 10);

      // طالب سجّل دون اختيار مرحلة ولم يُحدِّد له الموظف مرحلة بعد من الخانة اليدوية — يُستبعَد من
      // دفعة القبول، دون أن يمنع ذلك بقية الدفعة من إكمال معالجتها.
      if (isNaN(rowGrade)) {
        failures.push({ name: studentName, reason: 'لم تُحدَّد مرحلة لهذا الطالب' });
        completed++;
        google.script.run.updateAcceptBatchProgress(completed);
        processRow(index + 1);
        return;
      }

      google.script.run.withSuccessHandler(function () {
        completed++;
        google.script.run.updateAcceptBatchProgress(completed);
        processRow(index + 1);
      }).withFailureHandler(function (err) {
        failures.push({ name: studentName, reason: String(err) });
        completed++;
        google.script.run.updateAcceptBatchProgress(completed);
        processRow(index + 1);
      }).setStudentsQrCard(cpr, 'yes', rowGrade, staffName, getCurrentUserCpr());
    }
    processRow(0);
  });
}

/* ==========================================================================
   قسم "الحضور" — الشكل مُعاد بناؤه بالكامل (allAttend.html) بنفس منطق العمل
   الحالي: getAttendance()/getPersons() للبيانات، addManualAttendanceFlow
   ومُستمِعات js.html العامة (.showCard/.wpd/.deleteAttendBtn) للإجراءات. قارئ QR
   انتقل لاحقًا (2026-08-11) لصفحة مستقلة خارج Apps Script — openQrScannerPage()
   في js.html — بعد اكتشاف أن getUserMedia يفشل دومًا داخل iframe Apps Script.
   ملاحظة: setAttendData() (js.html) كانت لا تعرض جدول الإدارة إطلاقًا (خطأ سابق
   موجود قبل هذا التعديل — الدالة كانت خاصة ببطاقة "حضوري" في بوابة الطالب فقط)؛
   أُضيف استدعاء renderAttendanceAdminTable() داخلها تحديدًا لهذا السبب.
   ========================================================================== */
var attendPersonsData_ = null; // null = لم تُجلب بعد، [] = جُلبت وفارغة
var attendPersonsMap_ = {};
var attendCurrentPage_ = 1, attendPageSize_ = 50, attendSortField_ = null, attendSortDir_ = 'asc';
var attendDateFilter_ = null; // null = كل الأيام، وإلا نص 'YYYY-MM-DD' من التقويم المقيَّد
var attendSearchQuery_ = '';
var attendDatePickerInstance_ = null;

function updateAttendReqToggleLabel(isOpen) {
  var label = document.getElementById('attendReqToggleText');

// تفعيل/إلغاء ظهور زر "طلب إضافة حضور" بصفحة الطالب — بنفس فكرة initRegistrationToggle
// تمامًا (مفتاح فتح/إغلاق التسجيل)، وبنفس شيت main (عمود attendanceRequestsOpen الجديد).
function initAttendanceRequestsToggle() {
  var toggle = document.getElementById('attendReqToggle');
  if (!toggle || toggle.dataset.bound) return;
  toggle.dataset.bound = '1';

  google.script.run.withSuccessHandler(function (dr) {
    toggle.checked = !!dr.attendanceRequestsOpen;
    updateAttendReqToggleLabel(toggle.checked);
  }).getMainStatus();

  toggle.addEventListener('change', function () {
    var next = toggle.checked;
    google.script.run.withSuccessHandler(function () {
      updateAttendReqToggleLabel(next);
      alertMSG(next ? 'تم تفعيل طلبات الحضور' : 'تم إلغاء طلبات الحضور', 'success');
    }).withFailureHandler(function (err) {
      toggle.checked = !next;
      alertMSG('تعذّر تحديث حالة طلبات الحضور: ' + err, 'error');
    }).setAttendanceRequestsStatus(next);
  });
}

    // نستدعي setAttendData() مباشرة (نفس ما تفعله loadAllAttend داخليًا) بلا الحَقن المكرر.

    updateAttendanceAvgMetric();
