function setupAttendanceControls() {
  var searchInp = document.getElementById('attendSearchInput');
  if (searchInp && !searchInp.dataset.bound) {
    searchInp.dataset.bound = '1';
    searchInp.addEventListener('input', function () {
      attendSearchQuery_ = searchInp.value || '';
      attendCurrentPage_ = 1;
      renderAttendanceAdminTable();
    });
  }
  var pageSizeSel = document.getElementById('attendPageSize');
  if (pageSizeSel && !pageSizeSel.dataset.bound) {
    pageSizeSel.dataset.bound = '1';
    pageSizeSel.value = String(attendPageSize_);
    pageSizeSel.addEventListener('change', function () {
      attendPageSize_ = parseInt(pageSizeSel.value, 10) || 50;
      attendCurrentPage_ = 1;
      renderAttendanceAdminTable();
    });
  }
  document.querySelectorAll('#attendTable th[data-sort]').forEach(function (th) {
    if (th.dataset.bound) return;
    th.dataset.bound = '1';
    th.addEventListener('click', function () {
      var field = th.getAttribute('data-sort');
      if (attendSortField_ === field) attendSortDir_ = attendSortDir_ === 'asc' ? 'desc' : 'asc';
      else { attendSortField_ = field; attendSortDir_ = 'asc'; }
      updateSortIndicator('attendTable', attendSortField_, attendSortDir_);
      attendCurrentPage_ = 1;
      renderAttendanceAdminTable();
    });
  });
}

// تقويم مقيَّد: أيام السجل الفعلية فقط قابلة للاختيار (enable: validDates)، بديلاً عن قائمة
// المدى الزمني القديمة (اليوم/آخر 7 أيام/هذا الشهر)، بنفس آلية التقويم القديمة لكن بتصميم جديد.
function refreshAttendDatePicker(dedupedRecords) {
  var input = document.getElementById('attendDateFilter');
  if (!input || typeof flatpickr === 'undefined') return;

  var seenDay = {}, validDates = [];
  dedupedRecords.forEach(function (e) {
    if (!seenDay[e._dayStr]) { seenDay[e._dayStr] = true; validDates.push(e._dayStr); }
  });

  if (attendDatePickerInstance_) {
    attendDatePickerInstance_.set('enable', validDates);
    return;
  }

  attendDatePickerInstance_ = flatpickr(input, {
    locale: 'ar',
    dateFormat: 'Y-m-d',
    enable: validDates,
    disableMobile: true,
    static: true,
    onChange: function (selectedDates, dateStr) {
      attendDateFilter_ = dateStr || null;
      attendCurrentPage_ = 1;
      var clearBtn = document.getElementById('attendDateClearBtn');
      if (clearBtn) clearBtn.style.display = dateStr ? '' : 'none';
      renderAttendanceAdminTable();
    }
  });

  var clearBtn = document.getElementById('attendDateClearBtn');
  if (clearBtn && !clearBtn.dataset.bound) {
    clearBtn.dataset.bound = '1';
    clearBtn.addEventListener('click', function () {
      attendDatePickerInstance_.clear(false);
      attendDateFilter_ = null;
      attendCurrentPage_ = 1;
      clearBtn.style.display = 'none';
      renderAttendanceAdminTable();
    });
  }
}

function renderAttendanceAdminTable() {
  if (attendPersonsData_ === null) return; // لم يصل getPersons() بعد
  var tbody = document.getElementById('attendRowsContainer');
  if (!tbody) return; // القسم غير معروض حاليًا

  updateAttendanceMetrics();

  var records = Array.isArray(attendData) ? attendData.slice() : [];

  // إزالة تكرار: نفس الطالب أكثر من مرة بنفس اليوم = سجل حضور واحد فقط
  var seen = {};
  records = records.filter(function (e) {
    var d = new Date(e.date);
    if (isNaN(d.getTime())) return false;
    var dayStr = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    var key = e.cpr + '_' + dayStr;
    if (seen[key]) return false;
    seen[key] = true;
    e._dayStr = dayStr;
    return true;
  });

  refreshAttendDatePicker(records);

  if (attendDateFilter_) {
    records = records.filter(function (e) { return e._dayStr === attendDateFilter_; });
  }

  var q = (attendSearchQuery_ || '').trim().toLowerCase();
  if (q) {
    records = records.filter(function (e) {
      return String(e.name || '').toLowerCase().indexOf(q) !== -1 || String(e.cpr || '').toLowerCase().indexOf(q) !== -1;
    });
  }

  records.sort(function (a, b) {
    if (attendSortField_ === 'name') {
      var cmp = String(a.name || '').localeCompare(String(b.name || ''), 'ar');
      return attendSortDir_ === 'desc' ? -cmp : cmp;
    }
    var cmp2 = new Date(b.date).getTime() - new Date(a.date).getTime();
    return attendSortDir_ === 'desc' ? -cmp2 : cmp2;
  });

  var visEl = document.getElementById('attend-visible-count');
  if (visEl) visEl.textContent = records.length;

  renderPagination('attendPagination', records.length, attendPageSize_, attendCurrentPage_, function (page) {
    attendCurrentPage_ = page; renderAttendanceAdminTable();
  });

  if (records.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--muted)">لا توجد سجلات حضور مطابقة</td></tr>';
    setRouteLoading('attendance', false);
    return;
  }

  var totalPages = Math.max(1, Math.ceil(records.length / attendPageSize_));
  if (attendCurrentPage_ > totalPages) attendCurrentPage_ = totalPages;
  var startIdx = (attendCurrentPage_ - 1) * attendPageSize_;
  var pageData = records.slice(startIdx, startIdx + attendPageSize_);

  var rows = pageData.map(function (e, iOnPage) {

    // التمييز بين يدوي/QR أصبح عبر عمود "المسجَّل بواسطة" (resp === 'manual' حرفيًا للتحضير
    // اليدوي) لا عمود الرمز التعريفي — الأخير أصبح يحمل رمز الطالب الحقيقي في الحالتين معًا الآن.
    var methodIsManual = String(e.resp) === 'manual';

    var cardBtn = (person && person.cardUrl)

      : '';
    var wpBtn = phoneStr
      ? '<button type="button" class="icon-button wpd" data-phone="' + phoneStr + '" title="تواصل واتساب"><i data-icon="message-circle"></i></button>'
      : '';

    return '<tr>' +
      '<td data-label="#">' + (i + 1) + '</td>' +

      '<td data-label="المرحلة">' + stageHtml + '</td>' +
      '<td data-label="وقت الحضور">' + escapeHtml(formatDateAr(e.date)) + ' — ' + escapeHtml(formatTimeOnly(e.date)) + '</td>' +
      '<td data-label="طريقة التسجيل">' + methodHtml + '</td>' +
      '<td data-label="المسجل بواسطة">' + (methodIsManual ? 'إدخال يدوي' : (e.resp ? escapeHtml(e.resp) : '—')) + '</td>' +
      '<td><div class="table-actions">' + cardBtn + wpBtn +
        '<button type="button" class="icon-button danger deleteAttendBtn" data-cpr="' + cprStr + '" data-name="' + escapeHtml(e.name) + '" data-date="' + e._dayStr + '" title="حذف سجل الحضور"><i data-icon="trash-2"></i></button>' +
      '</div></td>' +
    '</tr>';
  }).join('');

  tbody.innerHTML = rows;
  refreshIcons();
  setRouteLoading('attendance', false);
}

function updateAttendanceMetrics() {
  if (attendPersonsData_ === null) return;
  var records = Array.isArray(attendData) ? attendData : [];
  var now = new Date();
  var todayStr = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2);

  var todaySet = {};
  var lastTime = null;
  records.forEach(function (e) {
    var d = new Date(e.date);
    if (isNaN(d.getTime())) return;
    if (lastTime === null || d > lastTime) lastTime = d;
    var dayStr = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    if (dayStr === todayStr) todaySet[e.cpr] = true;
  });
  var todayCount = Object.keys(todaySet).length;

  var activeCprs = {};
  attendPersonsData_.forEach(function (p) {
    if (p.class0 === 'active' || p.class1 === 'active' || p.class2 === 'active' || p.class3 === 'active') activeCprs[p.cpr] = true;
  });
  var activeTotal = Object.keys(activeCprs).length;
  var absentCount = Math.max(0, activeTotal - todayCount);

  var elToday = document.getElementById('attendMetricToday'); if (elToday) elToday.textContent = todayCount;
  var elTodaySub = document.getElementById('attendMetricTodaySub'); if (elTodaySub) elTodaySub.textContent = activeTotal > 0 ? ('من ' + activeTotal + ' طالبًا نشطًا') : '—';
  var elAbsent = document.getElementById('attendMetricAbsent'); if (elAbsent) elAbsent.textContent = absentCount;
  var elLast = document.getElementById('attendMetricLast'); if (elLast) elLast.textContent = lastTime ? formatTimeOnly(lastTime) : '—';
}

function updateAttendanceAvgMetric() {
  google.script.run.withSuccessHandler(function (stats) {
    var el = document.getElementById('attendMetricAvg');
    if (el && stats) el.textContent = (stats.attendanceRate || 0) + '%';
  }).withFailureHandler(function () {}).getPublicDashboardStats();
}

/* ==========================================================================
   مودال "طلبات الحضور" — طلبات الطلاب (resp='request' بشيت attendance، من requestAttendance
   في dataPost.js) بانتظار قبول/رفض الإدارة. تحديد جماعي + قبول/رفض دفعة واحدة، مع تثبيت
   شريط التحديد ورأس الجدول أثناء التمرير.
   ========================================================================== */
var attendReqCache_ = null;
var attendReqSortField_ = 'date', attendReqSortDir_ = 'desc';
var attendReqSelected_ = {}; // key: "cpr_date" -> {cpr, date}

function attendReqKey(item) { return item.cpr + '_' + item.date; }

function openAttendanceRequestsModal() {
  attendReqCache_ = null;
  attendReqSelected_ = {};
  var bodyHtml =
    '<div class="attend-req-toolbar">' +
      '<label class="attend-req-selectall"><input type="checkbox" id="attendReqSelectAll"><span>تحديد الكل (<b id="attendReqSelectedCount">0</b> من <b id="attendReqTotalCount">0</b>)</span></label>' +
      '<div class="attend-req-actions">' +
        '<button class="danger-button" id="attendReqRejectBtn" type="button" disabled><i data-icon="user-x"></i>رفض المحدَّد</button>' +
        '<button class="primary-button" id="attendReqAcceptBtn" type="button" disabled><i data-icon="circle-check"></i>قبول المحدَّد</button>' +
      '</div>' +
    '</div>' +
    '<div id="attendReqTableWrap"><p class="empty-note">جاري التحميل...</p></div>';
  openActionModal('طلبات الحضور', 'الحضور', bodyHtml, '<button class="secondary-button" type="button" onclick="closeActionModal()">إغلاق</button>', true);

  var selectAllCb = document.getElementById('attendReqSelectAll');
  if (selectAllCb) selectAllCb.addEventListener('change', function () {
    if (!attendReqCache_) return;
    if (selectAllCb.checked) attendReqCache_.forEach(function (it) { attendReqSelected_[attendReqKey(it)] = it; });
    else attendReqSelected_ = {};
    renderAttendanceRequestsTable();
  });

  var acceptBtn = document.getElementById('attendReqAcceptBtn');
  if (acceptBtn) acceptBtn.addEventListener('click', function () { submitAttendanceRequestsDecision('accept'); });
  var rejectBtn = document.getElementById('attendReqRejectBtn');
  if (rejectBtn) rejectBtn.addEventListener('click', function () { submitAttendanceRequestsDecision('reject'); });

  fetchAttendanceRequests();
}

function fetchAttendanceRequests() {
  var wrap = document.getElementById('attendReqTableWrap');
  if (wrap) wrap.innerHTML = '<p class="empty-note">جاري التحميل...</p>';
  google.script.run.withSuccessHandler(function (data) {
    attendReqCache_ = Array.isArray(data) ? data : [];
    attendReqSelected_ = {};
    renderAttendanceRequestsTable();
  }).withFailureHandler(function (err) {
    if (wrap) wrap.innerHTML = '<p class="empty-note" style="color:var(--danger)">تعذّر تحميل طلبات الحضور: ' + err + '</p>';
  }).getAttendanceRequests();
}

function computeAttendanceRequestsRows() {
  var list = (attendReqCache_ || []).slice();
  var field = attendReqSortField_, dir = attendReqSortDir_;
  list.sort(function (a, b) {
    var va, vb;
    if (field === 'name') { va = a.name || ''; vb = b.name || ''; return dir === 'desc' ? vb.localeCompare(va, 'ar') : va.localeCompare(vb, 'ar'); }
    if (field === 'level') { va = +a.level || 0; vb = +b.level || 0; return dir === 'desc' ? vb - va : va - vb; }
    va = new Date(a.date).getTime() || 0; vb = new Date(b.date).getTime() || 0;
    return dir === 'desc' ? vb - va : va - vb;
  });
  return list;
}

function renderAttendanceRequestsTable() {
  var wrap = document.getElementById('attendReqTableWrap');
  if (!wrap || !attendReqCache_) return;

  var rows = computeAttendanceRequestsRows();
  var selectedCount = Object.keys(attendReqSelected_).length;

  var totalEl = document.getElementById('attendReqTotalCount'); if (totalEl) totalEl.textContent = rows.length;
  var selEl = document.getElementById('attendReqSelectedCount'); if (selEl) selEl.textContent = selectedCount;
  var selectAllCb = document.getElementById('attendReqSelectAll');
  if (selectAllCb) selectAllCb.checked = rows.length > 0 && selectedCount === rows.length;
  var acceptBtn = document.getElementById('attendReqAcceptBtn'); if (acceptBtn) acceptBtn.disabled = selectedCount === 0;
  var rejectBtn = document.getElementById('attendReqRejectBtn'); if (rejectBtn) rejectBtn.disabled = selectedCount === 0;

  if (rows.length === 0) {
    wrap.innerHTML = '<p class="empty-note">لا توجد طلبات حضور معلَّقة حاليًا</p>';
    return;
  }

  var theadCols = '<th style="width:36px;"></th><th data-sort="date">التاريخ واليوم</th><th data-sort="name">الاسم</th><th data-sort="level">المرحلة</th><th>السبب</th>';
  var tbodyRows = rows.map(function (r) {
    var key = attendReqKey(r);
    var checked = !!attendReqSelected_[key];
    var d = new Date(r.date);
    var dateStr = !isNaN(d.getTime()) ? d.toLocaleDateString('ar-BH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : escapeHtml(r.date);
    var stageHtml = (r.level !== null && r.level !== undefined) ? stageBadgeHtml(+r.level) : '<span style="color:#b7bec5">—</span>';
    return '<tr><td><input type="checkbox" class="attend-req-row-check" data-key="' + escapeHtml(key) + '"' + (checked ? ' checked' : '') + '></td>' +
      '<td>' + escapeHtml(dateStr) + '</td>' +
      '<td>' + escapeHtml(r.name) + '</td>' +
      '<td>' + stageHtml + '</td>' +
      '<td class="reason-cell">' + escapeHtml(r.reason || '—') + '</td></tr>';
  }).join('');

  wrap.innerHTML = '<div class="responsive-table"><table id="attendReqTable"><thead><tr>' + theadCols + '</tr></thead><tbody>' + tbodyRows + '</tbody></table></div>';

  updateSortIndicator('attendReqTable', attendReqSortField_, attendReqSortDir_);

  var table = document.getElementById('attendReqTable');
  if (table) {
    table.querySelectorAll('th[data-sort]').forEach(function (th) {
      th.addEventListener('click', function () {
        var key = th.getAttribute('data-sort');
        if (attendReqSortField_ === key) attendReqSortDir_ = attendReqSortDir_ === 'asc' ? 'desc' : 'asc';
        else { attendReqSortField_ = key; attendReqSortDir_ = 'asc'; }
        renderAttendanceRequestsTable();
      });
    });
    table.querySelectorAll('.attend-req-row-check').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var key = cb.getAttribute('data-key');
        var item = rows.find(function (r) { return attendReqKey(r) === key; });
        if (!item) return;
        if (cb.checked) attendReqSelected_[key] = item;
        else delete attendReqSelected_[key];
        var count = Object.keys(attendReqSelected_).length;
        var selCountEl = document.getElementById('attendReqSelectedCount'); if (selCountEl) selCountEl.textContent = count;
        var selAllCb = document.getElementById('attendReqSelectAll');
        if (selAllCb) selAllCb.checked = rows.length > 0 && count === rows.length;
        var accBtn = document.getElementById('attendReqAcceptBtn'); if (accBtn) accBtn.disabled = count === 0;
        var rejBtn = document.getElementById('attendReqRejectBtn'); if (rejBtn) rejBtn.disabled = count === 0;
      });
    });
  }

  // تثبيت رأس الجدول تحت شريط التحديد/القبول مباشرة (ارتفاع الشريط متغيّر حسب حجم الخط)
  var toolbar = document.querySelector('.attend-req-toolbar');
  if (toolbar) {
    var h = toolbar.offsetHeight;
    document.querySelectorAll('#attendReqTable thead th').forEach(function (th) { th.style.top = h + 'px'; });
  }

  refreshIcons();
}

function submitAttendanceRequestsDecision(action) {
  var items = Object.keys(attendReqSelected_).map(function (k) { return attendReqSelected_[k]; })
    .map(function (it) { return { cpr: it.cpr, date: it.date }; });
  if (items.length === 0) return;

  var isAccept = action === 'accept';
  Swal.fire({
    title: isAccept ? 'قبول الطلبات المحدَّدة؟' : 'رفض الطلبات المحدَّدة؟',
    text: isAccept ? ('سيتحول ' + items.length + ' طلبًا إلى حضور فعلي معتمد.') : ('سيُحذف ' + items.length + ' طلبًا نهائيًا، ولن يظهر كحضور.'),
    icon: 'warning', showCancelButton: true,
    confirmButtonColor: isAccept ? '#198754' : '#c6373e',
    confirmButtonText: isAccept ? 'نعم، اقبل' : 'نعم، ارفض', cancelButtonText: 'إلغاء'
  }).then(function (result) {
    if (!result.isConfirmed) return;

    var acceptBtn = document.getElementById('attendReqAcceptBtn');
    var rejectBtn = document.getElementById('attendReqRejectBtn');
    [acceptBtn, rejectBtn].forEach(function (b) { if (b) b.disabled = true; });

    var onDone = function (res) {
      [acceptBtn, rejectBtn].forEach(function (b) { if (b) b.disabled = false; });
      if (!res || res.ok === false) { alertMSG((res && res.message) || 'تعذّر تنفيذ العملية', 'error'); return; }
      alertMSG(isAccept ? 'تم قبول الطلبات المحدَّدة' : 'تم رفض الطلبات المحدَّدة', 'success');
      attendReqSelected_ = {};
      fetchAttendanceRequests();
      loadAttendanceView(); // تحديث جدول الحضور الرئيسي وإحصائياته فورًا بعد القبول/الرفض
    };
    var onFail = function (err) {
      [acceptBtn, rejectBtn].forEach(function (b) { if (b) b.disabled = false; });
      alertMSG('تعذّر تنفيذ العملية: ' + err, 'error');
    };

    if (isAccept) {
      var adminName = (typeof userData !== 'undefined' && userData && userData[0] && userData[0].name) || 'الإدارة';
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).acceptAttendanceRequests(adminName, items);
    } else {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).rejectAttendanceRequests(items);
    }
  });
}

/* ==========================================================================
   مودال "إضافة حضور يدوي" من رأس صفحة الحضور مباشرة — بحث عن الطالب أولًا، ثم تقويم مقيَّد
   بأيام الحضور الفعلية فقط (نفس فكرة refreshAttendDatePicker للفلتر، بلا اعتماد فعلي عليه —
   حساب مستقل لتفادي أي تعارض مع حالة الفلتر الحالية) — يمنع إضافة يوم لم يحضر فيه أي طالب أصلًا
   (عطلة، تاريخ مستقبلي، خطأ كتابة) عن طريق الخطأ.
   ========================================================================== */
var manualAttendSelectedCpr_ = null;
var manualAttendSelectedName_ = null;
var manualAttendDatePicker_ = null;

function openManualAttendModal() {
  if (attendPersonsData_ === null) { alertMSG('بيانات الطلاب لا تزال قيد التحميل، حاول بعد قليل', 'warning'); return; }
  manualAttendSelectedCpr_ = null;
  manualAttendSelectedName_ = null;

  var bodyHtml =
    '<div class="field wide">' +
      '<span>ابحث عن الطالب (بالاسم أو الرقم الشخصي)</span>' +
      '<input type="text" id="manualAttendSearchInput" placeholder="اكتب للبحث...">' +
      '<div class="manual-attend-results" id="manualAttendSearchResults"></div>' +
    '</div>' +
    '<div class="field wide" id="manualAttendDateWrap" style="display:none;margin-top:14px;">' +
      '<span>التاريخ — الأيام التي بها حضور سابق فقط</span>' +
      '<input type="text" id="manualAttendDateInput" placeholder="اختر تاريخًا..." readonly>' +
    '</div>';
  var footerHtml =
    '<button class="secondary-button" type="button" onclick="closeActionModal()">إلغاء</button>' +
    '<button class="primary-button" id="manualAttendSubmitBtn" type="button" disabled>إضافة الحضور</button>';

  openActionModal('إضافة حضور يدوي', 'الحضور', bodyHtml, footerHtml);

  var searchInp = document.getElementById('manualAttendSearchInput');
  var resultsEl = document.getElementById('manualAttendSearchResults');

  searchInp.addEventListener('input', function () {
    manualAttendSelectedCpr_ = null;
    document.getElementById('manualAttendSubmitBtn').disabled = true;
    var q = searchInp.value.trim().toLowerCase();
    if (!q) { resultsEl.innerHTML = ''; resultsEl.classList.remove('show'); return; }
    var matches = attendPersonsData_.filter(function (p) {
      return String(p.name || '').toLowerCase().indexOf(q) !== -1 || String(p.cpr || '').indexOf(q) !== -1;
    }).slice(0, 8);
    resultsEl.innerHTML = matches.length
      ? matches.map(function (p) {
          return '<button type="button" class="manual-attend-result" data-cpr="' + escapeHtml(p.cpr) + '" data-name="' + escapeHtml(p.name) + '">' +
            escapeHtml(p.name) + '<small>' + escapeHtml(p.cpr) + '</small></button>';
        }).join('')
      : '<div class="manual-attend-no-results">لا نتائج مطابقة</div>';
    resultsEl.classList.add('show');
  });

  resultsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.manual-attend-result');
    if (!btn) return;
    manualAttendSelectedCpr_ = btn.getAttribute('data-cpr');
    manualAttendSelectedName_ = btn.getAttribute('data-name');
    searchInp.value = manualAttendSelectedName_;
    resultsEl.innerHTML = '';
    resultsEl.classList.remove('show');
    document.getElementById('manualAttendDateWrap').style.display = '';
    initManualAttendDatePicker();
  });

  var submitBtn = document.getElementById('manualAttendSubmitBtn');
  var submitBtnDefaultHtml_ = submitBtn.innerHTML;
  submitBtn.addEventListener('click', function () {
    var dateInp = document.getElementById('manualAttendDateInput');
    if (!manualAttendSelectedCpr_ || !dateInp.value) return;
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارٍ تسجيل الحضور...';
    google.script.run.withSuccessHandler(function (res) {
      submitBtn.disabled = false;
      submitBtn.innerHTML = submitBtnDefaultHtml_;
      if (res && res.ok) {
        closeActionModal();
        alertMSG('تمت إضافة الحضور بنجاح', 'success');
        if (typeof loadAllAttend === 'function') loadAllAttend();
      } else {
        alertMSG((res && res.message) || 'تعذّرت الإضافة', 'error');
      }
    }).withFailureHandler(function (err) {
      submitBtn.disabled = false;
      submitBtn.innerHTML = submitBtnDefaultHtml_;
      alertMSG('تعذّر الاتصال بالخادم: ' + err, 'error');
    }).addManualAttendance({
      cpr: manualAttendSelectedCpr_,
      name: manualAttendSelectedName_,
      date: dateInp.value
    });
  });
}

function initManualAttendDatePicker() {
  var input = document.getElementById('manualAttendDateInput');
  if (!input || typeof flatpickr === 'undefined') return;
  var seenDay = {}, validDates = [];
  (Array.isArray(attendData) ? attendData : []).forEach(function (e) {
    var d = new Date(e.date);
    if (isNaN(d.getTime())) return;
    var dayStr = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    if (!seenDay[dayStr]) { seenDay[dayStr] = true; validDates.push(dayStr); }
  });
  if (manualAttendDatePicker_) { try { manualAttendDatePicker_.destroy(); } catch (e) {} manualAttendDatePicker_ = null; }
  var dateWrap = document.getElementById('manualAttendDateWrap');
  manualAttendDatePicker_ = flatpickr(input, {
    locale: 'ar',
    dateFormat: 'Y-m-d',
    enable: validDates,
    disableMobile: true,
    static: true,
    // المودال قصير افتراضيًا، فإذا فُتح التقويم دون حجز مساحة له يُقصّه overflow:hidden
    // الخاص بـ .action-modal (نفس اتساع المودال في الوضع المغلق يبقى دون تغيير)
    onOpen: function () { if (dateWrap) dateWrap.classList.add('picker-open'); },
    onClose: function () { if (dateWrap) dateWrap.classList.remove('picker-open'); },
    onChange: function (selectedDates, dateStr) {
      var submitBtn = document.getElementById('manualAttendSubmitBtn');
      if (submitBtn) submitBtn.disabled = !(manualAttendSelectedCpr_ && dateStr);
    }
  });
}

    (Array.isArray(data) ? data : []).forEach(function (p) { certPersonsMap_[p.cpr] = p; });
  }).withFailureHandler(function () {}).getPersons();

  google.script.run.withSuccessHandler(function (data) {
    certAnswersData_ = Array.isArray(data) ? data : [];
    renderCertificatesTable();
  }).withFailureHandler(function () {
    certAnswersData_ = [];
    renderCertificatesTable();
  }).getAnswersData(null);

  google.script.run.withSuccessHandler(function (json) {
    try { certStWrksData_ = JSON.parse(json); } catch (e) { certStWrksData_ = []; }
    if (!Array.isArray(certStWrksData_)) certStWrksData_ = [];
    renderCertificatesTable();
  }).withFailureHandler(function () {
    certStWrksData_ = [];
    renderCertificatesTable();
  }).getAllStWrks();
}

function buildCertRecords() {
  var records = [];
  (certAnswersData_ || []).forEach(function (a) {
    if (a.rate === 'راسب') return; // لا شهادة تُستخرج للراسبين إطلاقًا
    var person = certPersonsMap_[a.cpr];
    records.push({
      name: person ? person.name : (a.cpr || '—'),
      cpr: a.cpr,
      program: a.exam || a.matn || '—',
      type: 'شهادة اختبار',
      date: a.date || null,
      certUrl: a.certificate || '',
      status: a.certificate ? 'ready' : 'pending'
    });
  });
  (certStWrksData_ || []).forEach(function (w) {
    records.push({
      name: w.name || w.cpr || '—',
      cpr: w.cpr,
      program: w.stWorks || '—',
      type: 'شهادة أعمال',
      date: null,
      certUrl: w.certificate || '',
      status: w.certificate ? 'ready' : 'pending'
    });
  });
  return records;
}

function updateCertMetrics(records) {
  var ready = records.filter(function (r) { return r.status === 'ready'; }).length;
  var pending = records.filter(function (r) { return r.status === 'pending'; }).length;
  var total = ready + pending;
  var rate = total > 0 ? Math.round((ready / total) * 100) : 0;

  var elTotal = document.getElementById('certMetricTotal'); if (elTotal) elTotal.textContent = ready;
  var elPending = document.getElementById('certMetricPending'); if (elPending) elPending.textContent = pending;
  var elRate = document.getElementById('certMetricRate'); if (elRate) elRate.textContent = rate + '%';
}

function setupCertificatesControls() {
  var filterGroup = document.getElementById('certFilterGroup');
  if (filterGroup && !filterGroup.dataset.bound) {
    filterGroup.dataset.bound = '1';
    filterGroup.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-filter]');
      if (!btn) return;
      filterGroup.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
      certFilter_ = btn.getAttribute('data-filter');
      certCurrentPage_ = 1;
      renderCertificatesTable();
    });
  }
  var searchInp = document.getElementById('certSearchInput');
  if (searchInp && !searchInp.dataset.bound) {
    searchInp.dataset.bound = '1';
    searchInp.addEventListener('input', function () {
      certSearchQuery_ = searchInp.value || '';
      certCurrentPage_ = 1;
      renderCertificatesTable();
    });
  }
  var pageSizeSel = document.getElementById('certPageSize');
  if (pageSizeSel && !pageSizeSel.dataset.bound) {
    pageSizeSel.dataset.bound = '1';
    pageSizeSel.value = String(certPageSize_);
    pageSizeSel.addEventListener('change', function () {
      certPageSize_ = parseInt(pageSizeSel.value, 10) || 50;
      certCurrentPage_ = 1;
      renderCertificatesTable();
    });
  }
  document.querySelectorAll('#certTable th[data-sort]').forEach(function (th) {
    if (th.dataset.bound) return;
    th.dataset.bound = '1';
    th.addEventListener('click', function () {
      var field = th.getAttribute('data-sort');
      if (certSortField_ === field) certSortDir_ = certSortDir_ === 'asc' ? 'desc' : 'asc';
      else { certSortField_ = field; certSortDir_ = 'asc'; }
      updateSortIndicator('certTable', certSortField_, certSortDir_);
      certCurrentPage_ = 1;
      renderCertificatesTable();
    });
  });
}

function renderCertificatesTable() {
  // ما زلنا ننتظر أحد المصدرين (الاختبارات أو الأعمال) — لا نعرض جدولًا جزئيًا
  if (certAnswersData_ === null || certStWrksData_ === null) return;

  var tbody = document.getElementById('certTableBody');
  if (!tbody) { setRouteLoading('certificates', false); return; }

  certRecords_ = buildCertRecords();
  updateCertMetrics(certRecords_);

  var countAllEl = document.getElementById('certCountAll');
  var countReadyEl = document.getElementById('certCountReady');
  var countPendingEl = document.getElementById('certCountPending');
  if (countAllEl) countAllEl.textContent = certRecords_.length;
  if (countReadyEl) countReadyEl.textContent = certRecords_.filter(function (r) { return r.status === 'ready'; }).length;
  if (countPendingEl) countPendingEl.textContent = certRecords_.filter(function (r) { return r.status === 'pending'; }).length;

  var data = certRecords_.slice();
  if (certFilter_ !== 'all') data = data.filter(function (r) { return r.status === certFilter_; });

  var q = (certSearchQuery_ || '').trim().toLowerCase();
  if (q) {
    data = data.filter(function (r) {
      return String(r.name || '').toLowerCase().indexOf(q) !== -1 || String(r.program || '').toLowerCase().indexOf(q) !== -1;
    });
  }

  if (certSortField_) {
    var sField = certSortField_, sDir = certSortDir_ === 'desc' ? -1 : 1;
    data.sort(function (a, b) {
      if (sField === 'date') return ((new Date(a.date || 0)).getTime() - (new Date(b.date || 0)).getTime()) * sDir;
      return String(a[sField] || '').localeCompare(String(b[sField] || ''), 'ar') * sDir;
    });
  }

  var visEl = document.getElementById('cert-visible-count');
  if (visEl) visEl.textContent = data.length;

  renderPagination('certPagination', data.length, certPageSize_, certCurrentPage_, function (page) {
    certCurrentPage_ = page; renderCertificatesTable();
  });

  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--muted)">لا توجد سجلات مطابقة</td></tr>';
    setRouteLoading('certificates', false);
    return;
  }

  var totalPages = Math.max(1, Math.ceil(data.length / certPageSize_));
  if (certCurrentPage_ > totalPages) certCurrentPage_ = totalPages;
  var startIdx = (certCurrentPage_ - 1) * certPageSize_;
  var pageData = data.slice(startIdx, startIdx + certPageSize_);

  tbody.innerHTML = pageData.map(function (r, iOnPage) {
    var i = startIdx + iOnPage;
    var statusHtml = r.status === 'ready'
      ? '<span class="state-badge active"><i data-icon="circle-check"></i>جاهزة</span>'
      : '<span class="state-badge pending"><i data-icon="timer"></i>قيد التجهيز</span>';
    var actionHtml = r.certUrl
      ? '<a href="' + escapeHtml(r.certUrl) + '" target="_blank" data-issued-file class="icon-button" title="فتح الشهادة"><i data-icon="eye"></i></a>'
      : '<span style="color:#b7bec5">—</span>';
    return '<tr>' +
      '<td data-label="#">' + (i + 1) + '</td>' +
      '<td>' + personCellHtml(r.name, r.cpr) + '</td>' +
      '<td data-label="البرنامج">' + escapeHtml(r.program) + '</td>' +
      '<td data-label="التاريخ">' + (r.date ? escapeHtml(formatDateAr(r.date)) : '—') + '</td>' +
      '<td data-label="النوع">' + escapeHtml(r.type) + '</td>' +
      '<td data-label="الحالة">' + statusHtml + '</td>' +
      '<td><div class="table-actions">' + actionHtml + '</div></td>' +
    '</tr>';
  }).join('');

  refreshIcons();
  setRouteLoading('certificates', false);
}

var dictationStatsSortField_ = 'name';
var dictationStatsSortDir_ = 'asc';
var dictationStatsCache_ = null;

function openDictationStatsModal() {
  var bodyHtml =
    '<div class="form-grid" style="margin-bottom:14px;">' +
      '<label class="field"><span>بداية فترة الرصد</span><input type="date" id="dictationStatsFrom"></label>' +

  });

function fetchDictationStats(fromDate, toDate) {
  var body = document.getElementById('dictationStatsBody');
  if (body) body.innerHTML = '<p class="empty-note">جاري التحميل...</p>';
  google.script.run.withSuccessHandler(function (stats) {
    dictationStatsCache_ = stats || { matns: [], byName: {} };
    dictationStatsSortField_ = 'name';
    dictationStatsSortDir_ = 'asc';
    renderDictationStatsTable();
  }).withFailureHandler(function (err) {
    if (body) body.innerHTML = '<p class="empty-note" style="color:var(--danger)">تعذّر تحميل بيانات التسميع: ' + err + '</p>';
  }).getDictationStats(fromDate || '', toDate || '');
}

// يبني قائمة الصفوف مرتَّبة بحسب حالة الترتيب الحالية — يُستخدَم من العرض والتصدير معًا
// حتى يطابق ملف Excel المُصدَّر تمامًا ما هو ظاهر على الشاشة.
function computeDictationStatsRows() {
  var matns = (dictationStatsCache_ && dictationStatsCache_.matns) || [];
  var byName = (dictationStatsCache_ && dictationStatsCache_.byName) || {};
  var rows = (allStaffData || []).filter(function (s) { return s.dictation; }).map(function (s) {
    var counts = byName[s.name] || {};
    var total = matns.reduce(function (sum, m) { return sum + (counts[m] || 0); }, 0);
    return { name: s.name, counts: counts, total: total };
  });

  var field = dictationStatsSortField_, dir = dictationStatsSortDir_;
  rows.sort(function (a, b) {
    if (field === 'name') {
      var an = a.name || '', bn = b.name || '';
      return dir === 'desc' ? bn.localeCompare(an, 'ar') : an.localeCompare(bn, 'ar');
    }
    var va = field === 'total' ? a.total : (a.counts[field] || 0);
    var vb = field === 'total' ? b.total : (b.counts[field] || 0);
    return dir === 'desc' ? vb - va : va - vb;
  });

  return { matns: matns, rows: rows };
}

function renderDictationStatsTable() {
  var body = document.getElementById('dictationStatsBody');
  if (!body || !dictationStatsCache_) return;

  var computed = computeDictationStatsRows();
  var matns = computed.matns, rows = computed.rows;

  var theadCols = '<th style="width:36px;">#</th><th data-sort="name">الاسم</th>' +
    matns.map(function (m) { return '<th data-sort="' + escapeHtml(m) + '">' + escapeHtml(m) + '</th>'; }).join('') +
    '<th data-sort="total">المجموع</th>';

  var tbodyRows = rows.map(function (r, idx) {
    return '<tr><td>' + (idx + 1) + '</td><td>' + escapeHtml(r.name) + '</td>' +
      matns.map(function (m) { return '<td>' + (r.counts[m] || 0) + '</td>'; }).join('') +
      '<td><strong>' + r.total + '</strong></td></tr>';
  }).join('');

  body.innerHTML =
    '<div class="responsive-table"><table id="dictationStatsTable"><thead><tr>' + theadCols + '</tr></thead><tbody>' +
    (rows.length ? tbodyRows : '<tr><td colspan="' + (matns.length + 3) + '" style="text-align:center;padding:20px;">لا يوجد شيوخ تسميع حاليًا</td></tr>') +
    '</tbody></table></div>';

  updateSortIndicator('dictationStatsTable', dictationStatsSortField_, dictationStatsSortDir_);

  var table = document.getElementById('dictationStatsTable');
  if (table) table.querySelectorAll('th[data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      var key = th.getAttribute('data-sort');
      if (dictationStatsSortField_ === key) dictationStatsSortDir_ = dictationStatsSortDir_ === 'asc' ? 'desc' : 'asc';
      else { dictationStatsSortField_ = key; dictationStatsSortDir_ = key === 'name' ? 'asc' : 'desc'; }
      renderDictationStatsTable();
    });
  });
}

function exportDictationStatsToExcel() {
  if (!dictationStatsCache_) { alertMSG('لا توجد بيانات لتصديرها بعد', 'warning'); return; }
  var computed = computeDictationStatsRows();
  var matns = computed.matns, rows = computed.rows;
  if (rows.length === 0) { alertMSG('لا توجد سجلات مطابقة لهذه الفترة', 'warning'); return; }

  var headers = ['#', 'الاسم'].concat(matns, ['المجموع']);
  var dataRows = rows.map(function (r, idx) {
    return [idx + 1, r.name].concat(matns.map(function (m) { return r.counts[m] || 0; }), [r.total]);
  });

  var fromInp = document.getElementById('dictationStatsFrom');
  var toInp = document.getElementById('dictationStatsTo');
  var periodSuffix = (fromInp && fromInp.value) || (toInp && toInp.value)
    ? ('_' + ((fromInp && fromInp.value) || 'البداية') + '_' + ((toInp && toInp.value) || 'الآن'))
    : '';
  exportReportExcel({ headers: headers, rows: dataRows }, 'تفاصيل التسميع', 'تفاصيل_التسميع' + periodSuffix + '.xls');
}

function setupStaffFilterControls() {

      staffCurrentPage = 1;

    });

function getFilteredStaff() {
  var data = allStaffData.slice();

             (String(s.phone || '').toLowerCase().indexOf(q) !== -1) ||

  if (staffSortField) {
    var field = staffSortField, dir = staffSortDir === 'desc' ? -1 : 1;
    data.sort(function (a, b) { return String(a[field] || '').localeCompare(String(b[field] || ''), 'ar') * dir; });

function getStaffPermBadges(s) {

    '</div>' +
    '<div class="warning-note" id="staffModalError" hidden><i data-icon="triangle-alert"></i><span></span></div>';

  var footerHtml = '<button class="secondary-button" type="button" onclick="closeActionModal()">إلغاء</button>' +
    '<button class="primary-button" id="staffSaveBtn" type="button"><i data-icon="save"></i>حفظ المتعاون</button>';

  openActionModal(rec ? 'تعديل بيانات متعاون' : 'إضافة متعاون', 'الصلاحيات', bodyHtml, footerHtml);

  var permsGroup = document.getElementById('staffPermsGroup');
  if (permsGroup) permsGroup.addEventListener('click', function (e) {
    var btn = e.target.closest('.staff-perm-btn');
    if (!btn) return;
    btn.classList.toggle('active');
  });

  var saveBtn = document.getElementById('staffSaveBtn');
  if (saveBtn) saveBtn.addEventListener('click', saveStaff);
}

async function saveStaff() {
  var staffEmailEl = document.getElementById('staffEmail');
  var emailVal = staffEmailEl.value.trim();
  if (emailVal) {
    var emailGate_ = await confirmEmailProviderOk(emailVal);
    if (!emailGate_.proceed) return;
    if (emailGate_.correctedEmail) {
      emailVal = emailGate_.correctedEmail;
      staffEmailEl.value = emailVal;
    }
  }

  var activePerms = {};
  document.querySelectorAll('#staffPermsGroup .staff-perm-btn.active').forEach(function (btn) {
    activePerms[btn.getAttribute('data-perm')] = true;
  });

  var data = {
    cpr: document.getElementById('staffCpr').value.trim(),
    name: document.getElementById('staffName').value.trim(),
    phone: document.getElementById('staffPhone').value.trim(),
    email: emailVal,
    job: document.getElementById('staffJob').value.trim(),
    code: document.getElementById('staffCode').value.trim(),
    gender: document.getElementById('staffGender').value,
    registration: !!activePerms.registration,
    dictation: !!activePerms.dictation,
    exam: !!activePerms.exam,
    manage: !!activePerms.manage,
    followUp: !!activePerms.followUp,
    lecturer: !!activePerms.lecturer
  };

  var originalCpr = staffModalOriginalCpr_;
  var errBox = document.getElementById('staffModalError');
  var saveBtn = document.getElementById('staffSaveBtn');
  if (errBox) errBox.hidden = true;
  if (saveBtn) { saveBtn.disabled = true; saveBtn.innerHTML = '<i data-icon="save"></i>جارٍ الحفظ...'; refreshIcons(); }

  function onDone(res) {
    if (!res || !res.ok) {
      if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = '<i data-icon="save"></i>حفظ المتعاون'; refreshIcons(); }
      if (errBox) { errBox.hidden = false; errBox.querySelector('span').textContent = (res && res.message) || 'تعذّر حفظ البيانات.'; }
      return;
    }
    closeActionModal();
    alertMSG(originalCpr ? 'تم تحديث بيانات المتعاون بنجاح' : 'تمت إضافة المتعاون بنجاح', 'success');
    loadStaffView();
  }

  function onFail(err) {
    if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = '<i data-icon="save"></i>حفظ المتعاون'; refreshIcons(); }
    if (errBox) { errBox.hidden = false; errBox.querySelector('span').textContent = 'تعذّر حفظ البيانات: ' + err; }
  }

  if (originalCpr) google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).updateStaff(originalCpr, data);
  else google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).addStaff(data);
}

function deleteStaffConfirm(cpr) {
  var rec = (allStaffData || []).find(function (s) { return String(s.cpr) === String(cpr); });
  if (!rec) return;

  Swal.fire({
    title: 'حذف متعاون',
    html: 'هل أنت متأكد من حذف <strong>' + escapeHtml(rec.name) + '</strong> نهائيًا من قائمة المتعاونين؟ لا يمكن التراجع عن هذا الإجراء.',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#dc3545',
    confirmButtonText: 'حذف نهائيًا',
    cancelButtonText: 'إلغاء'
  }).then(function (result) {
    if (!result.isConfirmed) return;
    google.script.run.withSuccessHandler(function (res) {
      if (!res || !res.ok) { alertMSG((res && res.message) || 'تعذّر حذف المتعاون', 'error'); return; }
      alertMSG('تم حذف المتعاون بنجاح', 'success');
      loadStaffView();
    }).withFailureHandler(function (err) {
      alertMSG('تعذّر حذف المتعاون: ' + err, 'error');
    }).deleteStaff(cpr);
  });
}

/* ==========================================================================
   قسم "إدارة المحاضرات" — سجل/جدول محاضرات إداري بحت (رقم الدرس/التاريخ/الدرس/المادة/
   المرحلة/المحاضر)، منفصل تمامًا عن نظام lecAttend القديم. الوصول مقصور على manage=true
   فقط (نفس بقية أقسام adminDashboard.html) — صلاحية "محاضر" الجديدة لا تفتح وصولًا لهذه
   الصفحة، دورها فقط تحديد من يظهر بقائمة "المحاضرين" المنسدلة هنا. راجع مناقشات.md
   § "صفحة إدارة المحاضرات" للمواصفات الكاملة.
   ========================================================================== */
// عمود "stage" في شيت ref يخزّن اسم المرحلة الحقيقي نصًّا (بطلب صريح من المستخدم)، وليس
// ترميزًا رقميًا 0-3 كبقية المشروع — هذه المصفوفة محلية لقسم المحاضرات فقط، تُستخدم للترتيب
// المنطقي وربط لون البادچ، ولا تُكتب أو تُقرأ من الشيت نفسه (الشيت دائمًا نص خام).
var LECTURE_STAGE_LABELS_ = ['التأهيلية', 'التأسيسية', 'التأصيلية', 'التحصيلية'];

// levels: مصفوفة أسماء مراحل (درس واحد ممكن يخص أكثر من مرحلة) — بادچ لكل مرحلة صحيحة.
function lectureStageBadgesHtml(levels) {
  var arr = Array.isArray(levels) ? levels : (levels ? [levels] : []);
  var html = arr.map(function (label) {
    var idx = LECTURE_STAGE_LABELS_.indexOf(label);
    return idx === -1 ? '' : '<span class="stage-badge s' + idx + '">' + escapeHtml(label) + '</span>';
  }).join(' ');
  return html || '<span style="color:#b7bec5">—</span>';
}

var allLecturesData_ = [];
var allLecturersData_ = [];
var lecturesFilterSetupDone_ = false;
var lectureStageFilter_ = 'all';
var lecturesPageSize_ = 50;
var lecturesCurrentPage_ = 1;
var lecturesSortField_ = null;
var lecturesSortDir_ = 'asc';
var lectureModalOriginalId_ = '';

function loadLecturesView() {
  setRouteLoading('lectures', true);
  setupLecturesFilterControls();
  var tbody = document.getElementById('lectures-table-body');
  if (tbody) tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;">جاري التحميل...</td></tr>';

  var loaded = { lectures: false, lecturers: false };
  function tryRender() {
    if (!loaded.lectures || !loaded.lecturers) return;
    lecturesCurrentPage_ = 1;
    updateLectureFilterCounts();
    renderLecturesTable();
    setRouteLoading('lectures', false);
  }

  google.script.run.withSuccessHandler(function (data) {
    allLecturesData_ = Array.isArray(data) ? data : []; loaded.lectures = true; tryRender();
  }).withFailureHandler(function (err) {
    console.error('فشل تحميل المحاضرات', err);
    if (tbody) tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--danger)">تعذّر تحميل سجل المحاضرات</td></tr>';
    allLecturesData_ = []; loaded.lectures = true; tryRender();
  }).getLecturesRef();

  google.script.run.withSuccessHandler(function (data) {
    allLecturersData_ = Array.isArray(data) ? data : []; loaded.lecturers = true; tryRender();
  }).withFailureHandler(function () { allLecturersData_ = []; loaded.lecturers = true; tryRender(); }).getLecturersList();
}

// إعادة جلب سجل المحاضرات فقط (لا قائمة المحاضرين معًا) — تُستخدَم بعد حفظ/حذف محاضرة، بلا
// setRouteLoading الذي كان يُظهر الصفحة كلها وكأنها أُعيدت تحميلًا (راجع نفس الإصلاح بصفحة
// "إدارة المواد" ومناقشات.md "تحديث تبويب واحد بدل الصفحة كلها بعد الحفظ/الحذف").
function refreshLecturesData(silent) {
  var btn = document.getElementById('refreshLecturesBtn');
  if (btn) { btn.disabled = true; btn.classList.add('spinning'); }
  google.script.run.withSuccessHandler(function (data) {
    allLecturesData_ = Array.isArray(data) ? data : [];
    lecturesCurrentPage_ = 1;
    updateLectureFilterCounts();
    renderLecturesTable();
    if (btn) { btn.disabled = false; btn.classList.remove('spinning'); }
    if (!silent) alertMSG('تم تحديث البيانات', 'success');
  }).withFailureHandler(function (err) {
    console.error('تعذّر تحديث سجل المحاضرات', err);
    if (btn) { btn.disabled = false; btn.classList.remove('spinning'); }
    if (!silent) alertMSG('تعذّر تحديث البيانات: ' + err, 'error');
  }).getLecturesRef();
}

function setupLecturesFilterControls() {
  if (lecturesFilterSetupDone_) return;

  var refreshBtn = document.getElementById('refreshLecturesBtn');
  if (refreshBtn) refreshBtn.addEventListener('click', function () { refreshLecturesData(); });

  var group = document.getElementById('lectureFilterGroup');
  if (group) group.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    group.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    lectureStageFilter_ = btn.getAttribute('data-filter');
    lecturesCurrentPage_ = 1;
    renderLecturesTable();
  });

  var searchInp = document.getElementById('lecture-search-input');
  if (searchInp) searchInp.addEventListener('input', function () { lecturesCurrentPage_ = 1; renderLecturesTable(); });

  var pageSizeSel = document.getElementById('lectures-page-size');
  if (pageSizeSel) {
    pageSizeSel.value = String(lecturesPageSize_);
    pageSizeSel.addEventListener('change', function () {
      lecturesPageSize_ = parseInt(pageSizeSel.value, 10) || 50;
      lecturesCurrentPage_ = 1;
      renderLecturesTable();
    });
  }

  document.querySelectorAll('#lecturesTable th[data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      var field = th.getAttribute('data-sort');
      if (lecturesSortField_ === field) lecturesSortDir_ = lecturesSortDir_ === 'asc' ? 'desc' : 'asc';
      else { lecturesSortField_ = field; lecturesSortDir_ = 'asc'; }
      updateSortIndicator('lecturesTable', lecturesSortField_, lecturesSortDir_);
      lecturesCurrentPage_ = 1;
      renderLecturesTable();
    });
  });

  lecturesFilterSetupDone_ = true;
}

function updateLectureFilterCounts() {
  var setText = function (id, n) { var el = document.getElementById(id); if (el) el.textContent = n; };
  setText('lectureCount-all', allLecturesData_.length);
  // درس يخص أكثر من مرحلة يُحتسَب ضمن عدّاد كل مرحلة من مراحله (نفس منطق عدّ الوسوم المتعددة)
  LECTURE_STAGE_LABELS_.forEach(function (label, idx) {
    setText('lectureCount-' + idx, allLecturesData_.filter(function (l) { return Array.isArray(l.level) && l.level.indexOf(label) !== -1; }).length);
  });
  updateLectureOverview_();
}

function updateLectureOverview_() {
  var setText = function (id, n) { var el = document.getElementById(id); if (el) el.textContent = n; };
  var now = new Date();
  var monthKey = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  var subjects = {};
  var lecturers = {};
  var monthCount = 0;
  allLecturesData_.forEach(function (lecture) {
    var dateValue = lecture.date ? String(lecture.date).split('T')[0] : '';
    if (dateValue.slice(0, 7) === monthKey) monthCount++;
    var subject = String(lecture.subject || '').trim();
    var lecturer = String(lecture.lecturer || '').trim();
    if (subject) subjects[subject] = true;
    if (lecturer) lecturers[lecturer] = true;
  });
  setText('lectureMetricTotal', allLecturesData_.length);
  setText('lectureMetricMonth', monthCount);
  setText('lectureMetricSubjects', Object.keys(subjects).length);
  setText('lectureMetricLecturers', Object.keys(lecturers).length);
}

function lectureWeekdayHtml_(value) {
  if (!value) return '—';
  var dateText = String(value).split('T')[0];
  var parts = dateText.split('-');
  var weekday = '';
  if (parts.length === 3) {
    try { weekday = new Date(+parts[0], +parts[1] - 1, +parts[2]).toLocaleDateString('ar-BH', { weekday: 'long' }); }
    catch (e) { weekday = ''; }
  }
  return '<span class="academic-date-cell"><strong>' + escapeHtml(formatDateAr(value)) + '</strong>' + (weekday ? '<small>' + escapeHtml(weekday) + '</small>' : '') + '</span>';
}

function lecturePersonHtml_(name) {
  var safeName = String(name || '').trim();
  if (!safeName) return '<span class="academic-muted">—</span>';
  return '<span class="academic-person-cell"><span class="academic-person-avatar">' + escapeHtml(safeName.charAt(0)) + '</span><span>' + escapeHtml(safeName) + '</span></span>';
}

function getFilteredLectures() {
  var data = allLecturesData_.slice();
  if (lectureStageFilter_ !== 'all') data = data.filter(function (l) { return Array.isArray(l.level) && l.level.indexOf(lectureStageFilter_) !== -1; });

  var inp = document.getElementById('lecture-search-input');
  var q = inp ? (inp.value || '').trim().toLowerCase() : '';
  if (q) {
    data = data.filter(function (l) {
      return String(l.lesson || '').toLowerCase().indexOf(q) !== -1 ||
             String(l.subject || '').toLowerCase().indexOf(q) !== -1 ||
             String(l.lecturer || '').toLowerCase().indexOf(q) !== -1;
    });
  }

  if (lecturesSortField_) {
    var field = lecturesSortField_, dir = lecturesSortDir_ === 'desc' ? -1 : 1;
    data.sort(function (a, b) {
      if (field === 'lessonNumber') return ((Number(a[field]) || 0) - (Number(b[field]) || 0)) * dir;
      if (field === 'level') {
        var minIdx = function (levels) {
          var idxs = (Array.isArray(levels) ? levels : []).map(function (lv) { return LECTURE_STAGE_LABELS_.indexOf(lv); }).filter(function (i) { return i !== -1; });
          return idxs.length ? Math.min.apply(null, idxs) : 99;
        };
        return (minIdx(a.level) - minIdx(b.level)) * dir;
      }
      if (field === 'date') return ((new Date(a.date || 0)).getTime() - (new Date(b.date || 0)).getTime()) * dir;
      return String(a[field] || '').localeCompare(String(b[field] || ''), 'ar') * dir;
    });
  }
  return data;
}

function renderLecturesTable() {
  var tbody = document.getElementById('lectures-table-body');
  if (!tbody) return;

  var fullData = getFilteredLectures();
  var visEl = document.getElementById('lectures-visible-count');
  if (visEl) visEl.textContent = fullData.length;
  var visSummary = document.getElementById('lectureVisibleSummary');
  if (visSummary) visSummary.textContent = fullData.length;

  renderPagination('lecturesPagination', fullData.length, lecturesPageSize_, lecturesCurrentPage_, function (page) {
    lecturesCurrentPage_ = page; renderLecturesTable();
  });

  if (fullData.length === 0) {
    tbody.innerHTML = '<tr><td class="academic-empty-cell" colspan="8"><span class="academic-empty-state"><i data-icon="calendar-days"></i><strong>لا توجد محاضرات مطابقة</strong><span>جرّب تغيير المرحلة أو عبارة البحث.</span></span></td></tr>';
    refreshIcons();
    return;
  }

  var totalPages = Math.max(1, Math.ceil(fullData.length / lecturesPageSize_));
  if (lecturesCurrentPage_ > totalPages) lecturesCurrentPage_ = totalPages;
  var startIdx = (lecturesCurrentPage_ - 1) * lecturesPageSize_;
  var data = fullData.slice(startIdx, startIdx + lecturesPageSize_);

  tbody.innerHTML = data.map(function (l, iOnPage) {
    var i = startIdx + iOnPage;
    return '<tr>' +
      '<td data-label="#"><span class="academic-sequence">' + (i + 1) + '</span></td>' +
      '<td data-label="رقم الدرس">' + (l.lessonNumber === '' || l.lessonNumber == null ? '<span class="academic-muted">—</span>' : '<span class="academic-lesson-number">' + escapeHtml(l.lessonNumber) + '</span>') + '</td>' +
      '<td data-label="التاريخ">' + lectureWeekdayHtml_(l.date) + '</td>' +
      '<td data-label="الدرس"><span class="academic-entity-cell"><span class="academic-entity-icon"><i data-icon="calendar-check"></i></span><span class="academic-entity-copy"><strong>' + escapeHtml(l.lesson || 'بلا عنوان') + '</strong><small>عنوان المحاضرة</small></span></span></td>' +
      '<td data-label="المادة"><span class="academic-relation"><i data-icon="book-open-check"></i>' + escapeHtml(l.subject || '—') + '</span></td>' +
      '<td data-label="المرحلة">' + lectureStageBadgesHtml(l.level) + '</td>' +
      '<td data-label="المحاضر">' + lecturePersonHtml_(l.lecturer) + '</td>' +
      '<td data-label="الإجراءات"><div class="table-actions">' +
        '<button class="icon-button" type="button" title="تعديل" onclick="openLectureModal(\'' + escapeHtml(l.id) + '\')"><i data-icon="pencil"></i></button>' +
        '<button class="icon-button danger" type="button" title="حذف" onclick="deleteLectureConfirm(\'' + escapeHtml(l.id) + '\')"><i data-icon="trash-2"></i></button>' +
      '</div></td>' +
    '</tr>';
  }).join('');

  refreshIcons();
}

function openLectureModal(id) {
  var rec = id ? allLecturesData_.find(function (l) { return String(l.id) === String(id); }) : null;
  lectureModalOriginalId_ = rec ? String(rec.id) : '';

  // اختيار المرحلة بنفس أسلوب اختيار صلاحيات المتعاون بالضبط (.choice-grid من أزرار
  // .staff-perm-btn قابلة للتفعيل المتعدد) — بطلب صريح من المستخدم، ولإتاحة اختيار أكثر
  // من مرحلة للدرس الواحد (كان Dropdown بقيمة واحدة فقط).
  var recLevels = rec && Array.isArray(rec.level) ? rec.level : [];
  var stagesHtml = LECTURE_STAGE_LABELS_.map(function (label) {
    var active = recLevels.indexOf(label) !== -1;
    return '<button type="button" class="staff-perm-btn' + (active ? ' active' : '') + '" data-stage="' + escapeHtml(label) + '">' + escapeHtml(label) + '</button>';
  }).join('');

  var lecturerOptions = ['<option value="">اختر المحاضر</option>'].concat(
    (allLecturersData_ || []).map(function (lec) {
      var selected = rec && rec.lecturer === lec.name ? ' selected' : '';
      return '<option value="' + escapeHtml(lec.name) + '"' + selected + '>' + escapeHtml(lec.name) + '</option>';
    })
  ).join('');

  var bodyHtml = '<div class="form-grid">' +
    '<label class="field"><span>رقم الدرس</span><input id="lectureNumber" type="number" inputmode="numeric" value="' + (rec && rec.lessonNumber !== null ? escapeHtml(rec.lessonNumber) : '') + '" placeholder="مثال: 12"></label>' +
    '<label class="field"><span>التاريخ</span><input id="lectureDate" type="date" value="' + (rec ? escapeHtml(rec.date || '') : '') + '"></label>' +
    '<label class="field wide"><span>الدرس</span><input id="lectureLesson" value="' + (rec ? escapeHtml(rec.lesson || '') : '') + '" placeholder="عنوان الدرس"></label>' +
    '<label class="field"><span>المادة</span><input id="lectureSubject" value="' + (rec ? escapeHtml(rec.subject || '') : '') + '" placeholder="اسم المادة"></label>' +
    '<label class="field"><span>المحاضر</span><select id="lectureLecturer">' + lecturerOptions + '</select></label>' +
    '<div class="field wide"><span>المرحلة (يمكن اختيار أكثر من مرحلة)</span><div class="choice-grid" id="lectureStagesGroup">' + stagesHtml + '</div></div>' +
    '</div>' +
    '<div class="warning-note" id="lectureModalError" hidden><i data-icon="triangle-alert"></i><span></span></div>';

  var footerHtml = '<button class="secondary-button" type="button" onclick="closeActionModal()">إلغاء</button>' +
    '<button class="primary-button" id="lectureSaveBtn" type="button"><i data-icon="save"></i>حفظ المحاضرة</button>';

  openActionModal(rec ? 'تعديل محاضرة' : 'إضافة محاضرة', 'إدارة المحاضرات', bodyHtml, footerHtml);

  var stagesGroup = document.getElementById('lectureStagesGroup');
  if (stagesGroup) stagesGroup.addEventListener('click', function (e) {
    var btn = e.target.closest('.staff-perm-btn');
    if (!btn) return;
    btn.classList.toggle('active');
  });

  var saveBtn = document.getElementById('lectureSaveBtn');
  if (saveBtn) saveBtn.addEventListener('click', saveLecture);
}

function saveLecture() {
  var activeStages = [];
  document.querySelectorAll('#lectureStagesGroup .staff-perm-btn.active').forEach(function (btn) {
    activeStages.push(btn.getAttribute('data-stage'));
  });

  var data = {
    lessonNumber: document.getElementById('lectureNumber').value.trim(),
    date: document.getElementById('lectureDate').value,
    lesson: document.getElementById('lectureLesson').value.trim(),
    subject: document.getElementById('lectureSubject').value.trim(),
    level: activeStages,
    lecturer: document.getElementById('lectureLecturer').value
  };

  var id = lectureModalOriginalId_;
  var errBox = document.getElementById('lectureModalError');
  var saveBtn = document.getElementById('lectureSaveBtn');
  if (errBox) errBox.hidden = true;
  if (saveBtn) { saveBtn.disabled = true; saveBtn.innerHTML = '<i data-icon="save"></i>جارٍ الحفظ...'; refreshIcons(); }

  google.script.run.withSuccessHandler(function (res) {
    if (!res || !res.ok) {
      if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = '<i data-icon="save"></i>حفظ المحاضرة'; refreshIcons(); }
      if (errBox) { errBox.hidden = false; errBox.querySelector('span').textContent = (res && res.message) || 'تعذّر حفظ المحاضرة.'; }
      return;
    }
    closeActionModal();
    alertMSG(id ? 'تم تحديث المحاضرة بنجاح' : 'تمت إضافة المحاضرة بنجاح', 'success');
    refreshLecturesData(true);
  }).withFailureHandler(function (err) {
    if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = '<i data-icon="save"></i>حفظ المحاضرة'; refreshIcons(); }
    if (errBox) { errBox.hidden = false; errBox.querySelector('span').textContent = 'تعذّر حفظ المحاضرة: ' + err; }
  }).saveLectureRef(id, data);
}

function deleteLectureConfirm(id) {
  var rec = (allLecturesData_ || []).find(function (l) { return String(l.id) === String(id); });
  if (!rec) return;

  Swal.fire({
    title: 'حذف محاضرة',
    html: 'هل أنت متأكد من حذف محاضرة <strong>' + escapeHtml(rec.lesson) + '</strong> نهائيًا؟ لا يمكن التراجع عن هذا الإجراء.',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#dc3545',
    confirmButtonText: 'حذف نهائيًا',
    cancelButtonText: 'إلغاء'
  }).then(function (result) {
    if (!result.isConfirmed) return;
    google.script.run.withSuccessHandler(function (res) {
      if (!res || !res.ok) { alertMSG((res && res.message) || 'تعذّر حذف المحاضرة', 'error'); return; }
      alertMSG('تم حذف المحاضرة بنجاح', 'success');
      refreshLecturesData(true);
    }).withFailureHandler(function (err) {
      alertMSG('تعذّر حذف المحاضرة: ' + err, 'error');
    }).deleteLectureRef(id);
  });
}

/* ==========================================================================
   صفحة "إدارة المواد" — مواد + مقررات (شيت curricula البسيط) + مذاهب + أوراد (شيت
   matns الحقيقي — راجع مناقشات.md "تصحيح مفهوم المقررات/الأوراد" و"دمج إدارة
   المقررات" لتفاصيل استبدال صفحة "إدارة المقررات" المستقلة القديمة بتبويب الأوراد هنا).
   الأربعة بنفس مزايا باقي جداول لوحة الإدارة (بحث/فرز/ترقيم صفحات — renderPagination/
   updateSortIndicator العامّتان القائمتان، بنفس نمط جدول المحاضرات).
   ========================================================================== */
var curriculumData_ = { subjects: [], curricula: [], matnCatalog: [], madhabs: [], awrad: [] };
var curriculumActiveTab_ = 'subjects';
var curriculumControlsBound_ = false;
var curriculumModalEntity_ = '';
var curriculumModalId_ = '';
var awradStageFilter_ = 'all';
var matnsStageFilter_ = 'all';
var matnsSubjectFilter_ = 'all';

// matnCatalog (تبويب "المتون"): مفهوم منفصل تمامًا عن curricula (المقررات) — مادة واحدة قد
// تضم مقررات ومتونًا معًا بلا أي تبعية بينهما، بطلب صريح من المستخدم. راجع تعليق
// getMatnCatalogList بdataGet.js للتفصيل الكامل، ولماذا اسم الشيت matnCatalog لا matns
// (المحجوز فعليًا لشيت الأوراد الحقيقي).
var CURRICULUM_PANEL_IDS_ = { subjects: 'curriculumSubjectsPanel', curricula: 'curriculumCurriculaPanel', matnCatalog: 'curriculumMatnsPanel', madhabs: 'curriculumMadhabsPanel', awrad: 'curriculumAwradPanel' };
var CURRICULUM_LABELS_ = { subjects: 'مادة', curricula: 'مقرر', matnCatalog: 'متن', madhabs: 'مذهب', awrad: 'وِرد' };

// مباشرة (الأوراد مبنية على المتون، وليست هي نفسها المتون أو المقررات)
var CURRICULUM_GET_FN_ = { subjects: 'getSubjectsList', curricula: 'getCurriculaList', matnCatalog: 'getMatnCatalogList', madhabs: 'getMadhabsList', awrad: 'getMatns' };
var CURRICULUM_SAVE_FN_ = { subjects: 'saveSubject', curricula: 'saveCurriculum', matnCatalog: 'saveMatnCatalog', madhabs: 'saveMadhab', awrad: 'saveMatnsItem' };
var CURRICULUM_DELETE_FN_ = { subjects: 'deleteSubject', curricula: 'deleteCurriculum', matnCatalog: 'deleteMatnCatalog', madhabs: 'deleteMadhab', awrad: 'deleteMatnsItem' };
var CURRICULUM_SEARCH_INPUT_ID_ = { subjects: 'subjects-search-input', curricula: 'curricula-search-input', matnCatalog: 'matns-search-input', madhabs: 'madhabs-search-input', awrad: 'awrad-search-input' };
var CURRICULUM_TABLE_ID_ = { subjects: 'subjectsTable', curricula: 'curriculaTable', matnCatalog: 'matnsTable', madhabs: 'madhabsTable', awrad: 'awradTable' };
var CURRICULUM_ROWS_ID_ = { subjects: 'subjectsRows', curricula: 'curriculaRows', matnCatalog: 'matnsRows', madhabs: 'madhabsRows', awrad: 'awradRows' };
var CURRICULUM_PAGINATION_ID_ = { subjects: 'subjectsPagination', curricula: 'curriculaPagination', matnCatalog: 'matnsPagination', madhabs: 'madhabsPagination', awrad: 'awradPagination' };
var CURRICULUM_VISIBLE_COUNT_ID_ = { subjects: 'subjects-visible-count', curricula: 'curricula-visible-count', matnCatalog: 'matns-visible-count', madhabs: 'madhabs-visible-count', awrad: 'awrad-visible-count' };
var CURRICULUM_PAGE_SIZE_SELECT_ID_ = { subjects: 'subjects-page-size', curricula: 'curricula-page-size', matnCatalog: 'matns-page-size', madhabs: 'madhabs-page-size', awrad: 'awrad-page-size' };
var CURRICULUM_REFRESH_BTN_ID_ = { subjects: 'refreshSubjectsBtn', curricula: 'refreshCurriculaBtn', matnCatalog: 'refreshMatnsBtn', madhabs: 'refreshMadhabsBtn', awrad: 'refreshAwradBtn' };
var CURRICULUM_EMPTY_COLSPAN_ = { subjects: 4, curricula: 5, matnCatalog: 6, madhabs: 4, awrad: 10 };

var curriculumTableState_ = {

  curricula: { sortField: 'name', sortDir: 'asc', page: 1, pageSize: 50 },
  matnCatalog: { sortField: 'name', sortDir: 'asc', page: 1, pageSize: 50 },
  madhabs: { sortField: 'name', sortDir: 'asc', page: 1, pageSize: 50 },
  awrad: { sortField: 'matn', sortDir: 'asc', page: 1, pageSize: 50 }
};

function loadCurriculumView() {
  setRouteLoading('curriculum', true);
  setupCurriculumControls();

  var pending = 5;
  function tryDone() {
    pending--;
    if (pending <= 0) {
      updateCurriculumOverview_();
      setCurriculumTabUi_(curriculumActiveTab_);
      renderCurriculumTab(curriculumActiveTab_);
      setRouteLoading('curriculum', false);
    }
  }

  ['subjects', 'curricula', 'matnCatalog', 'madhabs', 'awrad'].forEach(function (entity) {
    google.script.run.withSuccessHandler(function (rows) {
      curriculumData_[entity] = Array.isArray(rows) ? rows : []; tryDone();
    }).withFailureHandler(function (err) {
      console.error('تعذّر تحميل قائمة ' + CURRICULUM_LABELS_[entity], err);
      curriculumData_[entity] = []; tryDone();
    })[CURRICULUM_GET_FN_[entity]]();
  });
}

// إعادة جلب تبويب واحد فقط (لا الأربعة معًا) — تُستخدَم بعد أي حفظ/حذف ناجح، وعند الضغط على
// زر "تحديث" اليدوي فوق كل جدول. بلا setRouteLoading (الذي كان يُظهر تحميل الصفحة بأكملها
// لكل التبويبات معًا حتى لو تبويب واحد فقط هو المتأثر) — فقط أيقونة الزر تدور أثناء الجلب.
function refreshCurriculumEntity(entity, silent) {
  var btn = document.getElementById(CURRICULUM_REFRESH_BTN_ID_[entity]);
  if (btn) { btn.disabled = true; btn.classList.add('spinning'); }
  google.script.run.withSuccessHandler(function (rows) {
    curriculumData_[entity] = Array.isArray(rows) ? rows : [];
    updateCurriculumOverview_();
    renderCurriculumTab(entity);
    if (btn) { btn.disabled = false; btn.classList.remove('spinning'); }
    if (!silent) alertMSG('تم تحديث البيانات', 'success');
  }).withFailureHandler(function (err) {
    console.error('تعذّر تحديث قائمة ' + CURRICULUM_LABELS_[entity], err);
    if (btn) { btn.disabled = false; btn.classList.remove('spinning'); }
    if (!silent) alertMSG('تعذّر تحديث البيانات: ' + err, 'error');
  })[CURRICULUM_GET_FN_[entity]]();
}

function updateCurriculumOverview_() {
  ['subjects', 'curricula', 'matnCatalog', 'madhabs', 'awrad'].forEach(function (entity) {
    var count = document.getElementById('curriculumCount-' + entity);
    if (count) count.textContent = (curriculumData_[entity] || []).length;
  });
}

function setCurriculumTabUi_(tab) {
  var tabGroup = document.getElementById('curriculumTabGroup');
  if (tabGroup) tabGroup.querySelectorAll('button[data-tab]').forEach(function (btn) {
    var active = btn.getAttribute('data-tab') === tab;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', String(active));
    btn.setAttribute('tabindex', active ? '0' : '-1');
  });
  Object.keys(CURRICULUM_PANEL_IDS_).forEach(function (key) {
    var panel = document.getElementById(CURRICULUM_PANEL_IDS_[key]);
    if (panel) panel.hidden = key !== tab;
  });
}

function setupCurriculumControls() {
  if (curriculumControlsBound_) return;
  curriculumControlsBound_ = true;

  var tabGroup = document.getElementById('curriculumTabGroup');
  if (tabGroup) tabGroup.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-tab]');
    if (!btn) return;
    curriculumActiveTab_ = btn.getAttribute('data-tab');
    setCurriculumTabUi_(curriculumActiveTab_);
    renderCurriculumTab(curriculumActiveTab_);
  });
  if (tabGroup) tabGroup.addEventListener('keydown', function (e) {
    var btn = e.target.closest('button[data-tab]');
    if (!btn || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
    var tabs = Array.from(tabGroup.querySelectorAll('button[data-tab]'));
    var current = tabs.indexOf(btn);
    var offset = e.key === 'ArrowLeft' ? 1 : -1;
    var next = tabs[(current + offset + tabs.length) % tabs.length];
    e.preventDefault();
    curriculumActiveTab_ = next.getAttribute('data-tab');
    setCurriculumTabUi_(curriculumActiveTab_);
    renderCurriculumTab(curriculumActiveTab_);
    next.focus();
  });
  setCurriculumTabUi_(curriculumActiveTab_);

  var addSubjectBtn = document.getElementById('addSubjectBtn');
  if (addSubjectBtn) addSubjectBtn.addEventListener('click', function () { openCurriculumItemModal('subjects', null); });
  var addCurriculumBtn = document.getElementById('addCurriculumBtn');
  if (addCurriculumBtn) addCurriculumBtn.addEventListener('click', function () { openCurriculumItemModal('curricula', null); });
  var addMatnBtn = document.getElementById('addMatnBtn');
  if (addMatnBtn) addMatnBtn.addEventListener('click', function () { openCurriculumItemModal('matnCatalog', null); });
  var importMatnsBtn = document.getElementById('importMatnsBtn');
  if (importMatnsBtn) importMatnsBtn.addEventListener('click', function () {
    importMatnsBtn.disabled = true; importMatnsBtn.innerHTML = '<i data-icon="download"></i>جارٍ الاستيراد...'; refreshIcons();
    google.script.run.withSuccessHandler(function (res) {
      importMatnsBtn.disabled = false; importMatnsBtn.innerHTML = '<i data-icon="download"></i>استيراد من الأوراد'; refreshIcons();
      if (!res || res.error) { alertMSG((res && res.message) || 'تعذّر الاستيراد', 'error'); return; }
      alertMSG(res.imported > 0 ? ('تم استيراد ' + res.imported + ' متنًا جديدًا') : 'لا توجد أسماء متون جديدة لاستيرادها', 'success');
      refreshCurriculumEntity('matnCatalog', true);
    }).withFailureHandler(function (err) {
      importMatnsBtn.disabled = false; importMatnsBtn.innerHTML = '<i data-icon="download"></i>استيراد من الأوراد'; refreshIcons();
      alertMSG('تعذّر الاستيراد: ' + err, 'error');
    }).importMatnCatalogFromAwrad(getCurrentUserCpr());
  });
  var addMadhabBtn = document.getElementById('addMadhabBtn');
  if (addMadhabBtn) addMadhabBtn.addEventListener('click', function () { openCurriculumItemModal('madhabs', null); });
  var addAwradBtn = document.getElementById('addAwradBtn');
  if (addAwradBtn) addAwradBtn.addEventListener('click', function () { openCurriculumItemModal('awrad', null); });

  var awradStageGroup = document.getElementById('awradStageFilterGroup');
  if (awradStageGroup) awradStageGroup.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    awradStageGroup.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    awradStageFilter_ = btn.getAttribute('data-filter');
    curriculumTableState_.awrad.page = 1;
    renderCurriculumTab('awrad');
  });

  var matnsStageGroup = document.getElementById('matnsStageFilterGroup');
  if (matnsStageGroup) matnsStageGroup.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    matnsStageGroup.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    matnsStageFilter_ = btn.getAttribute('data-filter');
    curriculumTableState_.matnCatalog.page = 1;
    renderCurriculumTab('matnCatalog');
  });

  // مجموعة أزرار "المادة" هنا تُبنى ديناميكيًا (راجع renderMatnsSubjectFilter_) لأن قائمة
  // المواد بيانات متغيرة لا عدد ثابت كالمرحلة — الربط هنا بالتفويض (event delegation) على
  // الحاوية الثابتة نفسها، فيبقى فعّالًا رغم إعادة بناء الأزرار الداخلية لاحقًا.
  var matnsSubjectGroup = document.getElementById('matnsSubjectFilterGroup');
  if (matnsSubjectGroup) matnsSubjectGroup.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    matnsSubjectFilter_ = btn.getAttribute('data-filter');
    curriculumTableState_.matnCatalog.page = 1;
    renderCurriculumTab('matnCatalog');
  });

  ['subjects', 'curricula', 'matnCatalog', 'madhabs', 'awrad'].forEach(function (entity) {
    var refreshBtn = document.getElementById(CURRICULUM_REFRESH_BTN_ID_[entity]);
    if (refreshBtn) refreshBtn.addEventListener('click', function () { refreshCurriculumEntity(entity); });

    var rowsEl = document.getElementById(CURRICULUM_ROWS_ID_[entity]);
    if (rowsEl) rowsEl.addEventListener('click', function (e) {
      var editBtn = e.target.closest('.curriculum-edit');
      if (editBtn) { openCurriculumItemModal(editBtn.getAttribute('data-entity'), editBtn.getAttribute('data-id')); return; }
      var delBtn = e.target.closest('.curriculum-delete');
      if (delBtn) { deleteCurriculumItemConfirm(delBtn.getAttribute('data-entity'), delBtn.getAttribute('data-id')); return; }
    });

    var searchInp = document.getElementById(CURRICULUM_SEARCH_INPUT_ID_[entity]);
    if (searchInp) searchInp.addEventListener('input', function () {
      curriculumTableState_[entity].page = 1;
      renderCurriculumTab(entity);
    });

    var pageSizeSel = document.getElementById(CURRICULUM_PAGE_SIZE_SELECT_ID_[entity]);
    if (pageSizeSel) {
      pageSizeSel.value = String(curriculumTableState_[entity].pageSize);
      pageSizeSel.addEventListener('change', function () {
        curriculumTableState_[entity].pageSize = parseInt(pageSizeSel.value, 10) || 50;
        curriculumTableState_[entity].page = 1;
        renderCurriculumTab(entity);
      });
    }

    var table = document.getElementById(CURRICULUM_TABLE_ID_[entity]);
    if (table) table.querySelectorAll('th[data-sort]').forEach(function (th) {
      th.addEventListener('click', function () {
        var field = th.getAttribute('data-sort');
        var state = curriculumTableState_[entity];
        if (state.sortField === field) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
        else { state.sortField = field; state.sortDir = 'asc'; }
        updateSortIndicator(CURRICULUM_TABLE_ID_[entity], state.sortField, state.sortDir);
        state.page = 1;
        renderCurriculumTab(entity);
      });
    });
  });

  initMazhabChangeToggle();
}

// نفس نمط initRegistrationToggle بالضبط (بيانات المفتاح جزء من getMainStatus الموحَّدة).
function updateMazhabChangeToggleLabel(isOpen) {
  var label = document.getElementById('mazhabChangeToggleText');
  if (label) label.textContent = isOpen ? 'تغيير المذهب مفتوح' : 'تغيير المذهب مغلق';
}

function initMazhabChangeToggle() {
  var toggle = document.getElementById('mazhabChangeToggle');
  if (!toggle || toggle.dataset.bound) return;
  toggle.dataset.bound = '1';

  google.script.run.withSuccessHandler(function (dr) {
    toggle.checked = !!dr.allowMazhabChange;
    updateMazhabChangeToggleLabel(toggle.checked);
  }).getMainStatus();

  toggle.addEventListener('change', function () {
    var next = toggle.checked;
    google.script.run.withSuccessHandler(function () {
      updateMazhabChangeToggleLabel(next);
      alertMSG(next ? 'أصبح بإمكان الطلاب اختيار/تغيير مذهبهم الفقهي' : 'أُغلق تغيير المذهب الفقهي للطلاب (الاختيار الأول لمن لم يختر بعد يبقى متاحًا)', 'success');
    }).withFailureHandler(function (err) {
      toggle.checked = !next;
      alertMSG('تعذّر تحديث حالة تغيير المذهب: ' + err, 'error');
    }).setAllowMazhabChangeStatus(next);
  });
}

function getFilteredCurriculumRows(entity) {
  var rows = curriculumData_[entity].slice();
  var state = curriculumTableState_[entity];

  if (entity === 'awrad' && awradStageFilter_ !== 'all') {
    rows = rows.filter(function (r) { return String(r.level) === awradStageFilter_; });
  }

  if (entity === 'matnCatalog') {
    if (matnsStageFilter_ !== 'all') {
      rows = rows.filter(function (r) {
        return String(r.level || '').split(',').map(function (s) { return s.trim(); }).indexOf(matnsStageFilter_) !== -1;
      });
    }
    if (matnsSubjectFilter_ === 'none') {
      rows = rows.filter(function (r) { return !r.subjectId; });
    } else if (matnsSubjectFilter_ !== 'all') {
      rows = rows.filter(function (r) { return r.subjectId === matnsSubjectFilter_; });
    }
  }

  var searchInp = document.getElementById(CURRICULUM_SEARCH_INPUT_ID_[entity]);
  var q = searchInp ? (searchInp.value || '').trim().toLowerCase() : '';
  if (q) {
    rows = entity === 'awrad'
      ? rows.filter(function (r) { return String(r.matn || '').toLowerCase().indexOf(q) !== -1; })
      : rows.filter(function (r) { return String(r.name || '').toLowerCase().indexOf(q) !== -1 || String(r.description || '').toLowerCase().indexOf(q) !== -1; });
  }

  if (state.sortField) {
    var field = state.sortField, dir = state.sortDir === 'desc' ? -1 : 1;
    rows.sort(function (a, b) {
      if (field === 'level' || field === 'werd') return ((+a[field] || 0) - (+b[field] || 0)) * dir;
      return String(a[field] || '').localeCompare(String(b[field] || ''), 'ar') * dir;
    });
  }
  return rows;
}

function updateAwradStageFilterCounts() {
  var setText = function (id, n) { var el = document.getElementById(id); if (el) el.textContent = n; };
  var rows = curriculumData_.awrad || [];
  setText('awradStageCount-all', rows.length);
  [0, 1, 2, 3].forEach(function (idx) {
    setText('awradStageCount-' + idx, rows.filter(function (r) { return String(r.level) === String(idx); }).length);
  });
}

function updateMatnsStageFilterCounts_() {
  var setText = function (id, n) { var el = document.getElementById(id); if (el) el.textContent = n; };
  var rows = curriculumData_.matnCatalog || [];
  setText('matnsStageCount-all', rows.length);
  LECTURE_STAGE_LABELS_.forEach(function (lv, idx) {
    setText('matnsStageCount-' + idx, rows.filter(function (r) {
      return String(r.level || '').split(',').map(function (s) { return s.trim(); }).indexOf(lv) !== -1;
    }).length);
  });
}

// أزرار تصفية "المادة" بتبويب المتون تُبنى ديناميكيًا (لا ثابتة بHTML كالمرحلة) لأن قائمة
// المواد بيانات متغيرة يديرها المستخدم — تُخفى أي مادة ليس لها متن واحد بعد لتفادي ازدحام
// شريط التصفية بخيارات فارغة دومًا. راجع ربط النقر بالتفويض على matnsSubjectFilterGroup أعلاه.
function renderMatnsSubjectFilter_() {
  var group = document.getElementById('matnsSubjectFilterGroup');
  if (!group) return;
  var matns = curriculumData_.matnCatalog || [];
  var subjectsById = {};
  (curriculumData_.subjects || []).forEach(function (s) { subjectsById[s.id] = s.name; });

  var html = '<button class="' + (matnsSubjectFilter_ === 'all' ? 'active' : '') + '" data-filter="all" type="button">كل المواد <b>' + matns.length + '</b></button>';
  var counted = {};
  matns.forEach(function (m) {
    if (!m.subjectId || !subjectsById[m.subjectId] || counted[m.subjectId]) return;
    counted[m.subjectId] = true;
  });
  Object.keys(counted).forEach(function (subjectId) {
    var count = matns.filter(function (m) { return m.subjectId === subjectId; }).length;
    var active = matnsSubjectFilter_ === subjectId ? ' active' : '';
    html += '<button class="' + active + '" data-filter="' + escapeHtml(subjectId) + '" type="button">' + escapeHtml(subjectsById[subjectId]) + ' <b>' + count + '</b></button>';
  });
  var noSubjectCount = matns.filter(function (m) { return !m.subjectId; }).length;
  if (noSubjectCount) {
    html += '<button class="' + (matnsSubjectFilter_ === 'none' ? 'active' : '') + '" data-filter="none" type="button">بلا مادة <b>' + noSubjectCount + '</b></button>';
  }
  group.innerHTML = html;
}

function renderCurriculumTab(tab) {
  var tbody = document.getElementById(CURRICULUM_ROWS_ID_[tab]);
  if (!tbody) return;

  updateCurriculumOverview_();
  if (tab === 'awrad') updateAwradStageFilterCounts();
  if (tab === 'matnCatalog') { updateMatnsStageFilterCounts_(); renderMatnsSubjectFilter_(); }

  var fullData = getFilteredCurriculumRows(tab);
  var state = curriculumTableState_[tab];
  var visEl = document.getElementById(CURRICULUM_VISIBLE_COUNT_ID_[tab]);
  if (visEl) visEl.textContent = fullData.length;

  renderPagination(CURRICULUM_PAGINATION_ID_[tab], fullData.length, state.pageSize, state.page, function (page) {
    state.page = page; renderCurriculumTab(tab);
  });

  if (fullData.length === 0) {
    tbody.innerHTML = '<tr><td class="academic-empty-cell" colspan="' + CURRICULUM_EMPTY_COLSPAN_[tab] + '"><span class="academic-empty-state"><i data-icon="book-open-check"></i><strong>لا توجد ' + CURRICULUM_LABELS_[tab] + ' مطابقة</strong><span>جرّب تعديل عبارة البحث أو أضف عنصرًا جديدًا.</span></span></td></tr>';
    refreshIcons();
    return;
  }

  var totalPages = Math.max(1, Math.ceil(fullData.length / state.pageSize));
  if (state.page > totalPages) state.page = totalPages;
  var pageRows = fullData.slice((state.page - 1) * state.pageSize, state.page * state.pageSize);

  if (tab === 'subjects') tbody.innerHTML = pageRows.map(subjectRowHtml).join('');
  else if (tab === 'curricula') tbody.innerHTML = pageRows.map(curriculumRowHtml).join('');
  else if (tab === 'matnCatalog') {
    var awradCountsByMatn = {};
    (curriculumData_.awrad || []).forEach(function (werd) {
      var matnName = String(werd.matn || '').trim();
      if (matnName) awradCountsByMatn[matnName] = (awradCountsByMatn[matnName] || 0) + 1;
    });
    tbody.innerHTML = pageRows.map(function (matn) { return matnCatalogRowHtml(matn, awradCountsByMatn); }).join('');
  }
  else if (tab === 'awrad') tbody.innerHTML = pageRows.map(awradRowHtml).join('');
  else tbody.innerHTML = pageRows.map(madhabRowHtml).join('');

  refreshIcons();
}

// صف "متن" — مفهوم منفصل تمامًا عن "مقرر" أعلاه (لا تبعية بينهما، كلاهما تابع لمادة مباشرة
