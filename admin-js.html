// صف "وِرد" هنا = صف خام بشيت matns (كتاب/متن + رقم وِرد واحد + مداه — قد يتكرر نفس اسم
// الكتاب/المتن بعدة صفوف، صف لكل وِرد من أورادِه، بنفس البنية الأصلية القائمة أصلًا). الأوراد
// مبنية على المقررات (عمود الكتاب/المتن هو اسم المقرر نصًّا، بلا id مرتبط — نفس أسلوب مطابقة

function madhabRowHtml(r) {

// خيارات "المادة" بمودال إضافة/تعديل متن — تُقصَر على المواد التي تخص إحدى المراحل المختارة
// حاليًا بمجموعة أزرار المرحلة أعلاه (بطلب المستخدم)، ولا فلترة إطلاقًا لو لم تُختَر أي مرحلة
// بعد. selectedId يُبقي المادة المختارة فعليًا بالقائمة دائمًا (حتى لو لم تعد مطابقة بعد تبديل
// المراحل) تفاديًا لضياع اختيار المستخدم بصمت.
function matnSubjectOptionsHtml_(activeStages, selectedId) {
  var opts = ['<option value="">بلا مادة محدَّدة</option>'];
  curriculumData_.subjects.forEach(function (s) {
    var subjLevels = String(s.level || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean);
    var matches = activeStages.length === 0 || subjLevels.some(function (lv) { return activeStages.indexOf(lv) !== -1; });
    if (!matches && s.id !== selectedId) return;
    var selected = selectedId && s.id === selectedId ? ' selected' : '';
    opts.push('<option value="' + escapeHtml(s.id) + '"' + selected + '>' + escapeHtml(s.name) + '</option>');
  });
  return opts.join('');
}

function openCurriculumItemModal(entity, id) {
  curriculumModalEntity_ = entity;
  curriculumModalId_ = id || '';
  var rec = id ? curriculumData_[entity].find(function (r) { return String(r.id) === String(id); }) : null;
  var label = CURRICULUM_LABELS_[entity];
  var bodyHtml;

  if (entity === 'awrad') {
    // شكل مختلف تمامًا عن مواد/مقررات/مذاهب — يطابق أعمدة matns الحقيقية (لا اسم/وصف عامّين)
    var levelOptions = [0, 1, 2, 3].map(function (i) {
      return '<option value="' + i + '"' + (rec && String(rec.level) === String(i) ? ' selected' : '') + '>' + getLevelName(i) + '</option>';
    }).join('');
    var subjectOptions = ['<option value="">بلا مادة محدَّدة</option>'].concat(
      curriculumData_.subjects.map(function (s) {
        var selected = rec && rec.subjectId === s.id ? ' selected' : '';
        return '<option value="' + escapeHtml(s.id) + '"' + selected + '>' + escapeHtml(s.name) + '</option>';
      })
    ).join('');

    // اقتراح تلقائي (datalist) من كتالوج "المتون" الجديد (matnCatalog) — لا قائمة منسدلة صارمة
    // عمدًا: القيمة المخزَّنة تبقى نصًّا حرًّا كما هي دائمًا (أنظمة أخرى كثيرة كالتسميع تُطابِقها
    // بالاسم النصي فقط لا بمعرّف)، فلا يجوز منع إدخال اسم غير مُكتلَج بعد بالمتون.
    var matnListOptions = curriculumData_.matnCatalog.map(function (m) { return '<option value="' + escapeHtml(m.name) + '">'; }).join('');

    bodyHtml = '<div class="form-grid">' +
      '<label class="field wide"><span>الكتاب / المتن</span><input id="curriculumItemMatn" list="curriculumMatnList" value="' + (rec ? escapeHtml(rec.matn) : '') + '" placeholder="اختر من المتون المُكتلَجة أو اكتب اسمًا جديدًا"><datalist id="curriculumMatnList">' + matnListOptions + '</datalist></label>' +
      '<label class="field"><span>المرحلة</span><select id="curriculumItemLevel"><option value="">اختر المرحلة</option>' + levelOptions + '</select></label>' +
      '<label class="field"><span>رقم الوِرد</span><input id="curriculumItemWerd" type="number" min="1" value="' + (rec && rec.werd !== '' ? escapeHtml(rec.werd) : '') + '" placeholder="مثال: 1"></label>' +
      '<label class="field"><span>من</span><input id="curriculumItemStart" type="number" value="' + (rec && rec.start !== '' ? escapeHtml(rec.start) : '') + '"></label>' +
      '<label class="field"><span>إلى</span><input id="curriculumItemEnd" type="number" value="' + (rec && rec.end !== '' ? escapeHtml(rec.end) : '') + '"></label>' +
      '<label class="field wide"><span>المادة (اختياري)</span><select id="curriculumItemSubject">' + subjectOptions + '</select></label>' +
      '</div>' +
      '<div class="warning-note" id="curriculumItemError" hidden><i data-icon="triangle-alert"></i><span></span></div>';
  } else {
    var stagesFieldHtml = '';
    if (entity === 'subjects' || entity === 'curricula' || entity === 'matnCatalog' || entity === 'madhabs') {
      // نفس أسلوب اختيار مرحلة المحاضرة بالضبط (.choice-grid من أزرار .staff-perm-btn قابلة
      // للتفعيل المتعدد) — بطلب صريح من المستخدم، مادة/مقرر/متن/مذهب واحد قد يخص أكثر من مرحلة معًا.
      // بالنسبة للمذاهب تحديدًا: هذه المرحلة/المراحل هي ما يُحدِّد (بوابة الطالب،
      // renderMazhabSelection بfuncs-js.html) هل تظهر صفحة "المذهب الفقهي" لطالب بمرحلته الحالية.
      var recLevels = rec ? String(rec.level || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean) : [];
      var stagesHtml = LECTURE_STAGE_LABELS_.map(function (lv) {
        var active = recLevels.indexOf(lv) !== -1;
        return '<button type="button" class="staff-perm-btn' + (active ? ' active' : '') + '" data-stage="' + escapeHtml(lv) + '">' + escapeHtml(lv) + '</button>';
      }).join('');
      stagesFieldHtml = '<div class="field wide"><span>المرحلة (يمكن اختيار أكثر من مرحلة)</span><div class="choice-grid" id="curriculumStagesGroup">' + stagesHtml + '</div></div>';
    }

    var subjectFieldHtml = '';
    if (entity === 'curricula' || entity === 'matnCatalog') {
      var curriculumSubjectOptions;
      if (entity === 'matnCatalog') {
        // المواد المعروضة هنا تتبع المرحلة/المراحل المختارة أعلاه (راجع matnSubjectOptionsHtml_
        // وربط النقر على أزرار المرحلة أسفل هذه الدالة) — بطلب صريح من المستخدم.
        curriculumSubjectOptions = matnSubjectOptionsHtml_(recLevels, rec ? rec.subjectId : '');
      } else {
        curriculumSubjectOptions = ['<option value="">بلا مادة محدَّدة</option>'].concat(
          curriculumData_.subjects.map(function (s) {
            var selected = rec && rec.subjectId === s.id ? ' selected' : '';
            return '<option value="' + escapeHtml(s.id) + '"' + selected + '>' + escapeHtml(s.name) + '</option>';
          })
        ).join('');
      }
      subjectFieldHtml = '<label class="field wide"><span>المادة (اختياري)</span><select id="curriculumItemSubject">' + curriculumSubjectOptions + '</select></label>';
    }

    bodyHtml = '<div class="form-grid">' +
      '<label class="field wide"><span>الاسم</span><input id="curriculumItemName" value="' + (rec ? escapeHtml(rec.name) : '') + '" placeholder="اسم ال' + label + '"></label>' +
      stagesFieldHtml +
      subjectFieldHtml +
      '<label class="field wide"><span>الوصف (اختياري)</span><textarea id="curriculumItemDescription" rows="3">' + (rec ? escapeHtml(rec.description || '') : '') + '</textarea></label>' +
      '</div>' +
      '<div class="warning-note" id="curriculumItemError" hidden><i data-icon="triangle-alert"></i><span></span></div>';
  }

  var footerHtml = '<button class="secondary-button" type="button" onclick="closeActionModal()">إلغاء</button>' +
    '<button class="primary-button" id="curriculumItemSaveBtn" type="button"><i data-icon="save"></i>حفظ</button>';

  openActionModal(rec ? ('تعديل ' + label) : ('إضافة ' + label), 'إدارة المواد', bodyHtml, footerHtml);

  if (entity === 'subjects' || entity === 'curricula' || entity === 'matnCatalog' || entity === 'madhabs') {
    var stagesGroup = document.getElementById('curriculumStagesGroup');
    if (stagesGroup) stagesGroup.addEventListener('click', function (e) {
      var btn = e.target.closest('.staff-perm-btn');
      if (!btn) return;
      btn.classList.toggle('active');
      if (entity === 'matnCatalog') {
        var activeStages = [];
        document.querySelectorAll('#curriculumStagesGroup .staff-perm-btn.active').forEach(function (b) { activeStages.push(b.getAttribute('data-stage')); });
        var subjectSel = document.getElementById('curriculumItemSubject');
        if (subjectSel) subjectSel.innerHTML = matnSubjectOptionsHtml_(activeStages, subjectSel.value);
      }
    });
  }

  var saveBtn = document.getElementById('curriculumItemSaveBtn');
  if (saveBtn) saveBtn.addEventListener('click', saveCurriculumItemModal);
}

function saveCurriculumItemModal() {
  var entity = curriculumModalEntity_;
  var id = curriculumModalId_;
  var errBox = document.getElementById('curriculumItemError');
  var saveBtn = document.getElementById('curriculumItemSaveBtn');
  var item = { id: id };

  if (entity === 'awrad') {
    var matn = document.getElementById('curriculumItemMatn').value.trim();
    var levelVal = document.getElementById('curriculumItemLevel').value;
    if (!matn) { errBox.hidden = false; errBox.querySelector('span').textContent = 'اسم الكتاب / المتن مطلوب'; return; }
    if (levelVal === '') { errBox.hidden = false; errBox.querySelector('span').textContent = 'يرجى اختيار المرحلة'; return; }
    item.matn = matn;
    item.level = parseInt(levelVal, 10);
    item.werd = document.getElementById('curriculumItemWerd').value.trim();
    item.start = document.getElementById('curriculumItemStart').value.trim();
    item.end = document.getElementById('curriculumItemEnd').value.trim();
    item.subjectId = document.getElementById('curriculumItemSubject').value;
  } else {
    var name = document.getElementById('curriculumItemName').value.trim();
    if (!name) { errBox.hidden = false; errBox.querySelector('span').textContent = 'الاسم مطلوب'; return; }
    item.name = name;
    item.description = document.getElementById('curriculumItemDescription').value.trim();
    if (entity === 'subjects' || entity === 'curricula' || entity === 'matnCatalog' || entity === 'madhabs') {
      var activeStages = [];
      document.querySelectorAll('#curriculumStagesGroup .staff-perm-btn.active').forEach(function (btn) { activeStages.push(btn.getAttribute('data-stage')); });
      item.level = activeStages.join(',');
    }
    if (entity === 'curricula' || entity === 'matnCatalog') {
      var subjectSel = document.getElementById('curriculumItemSubject');
      item.subjectId = subjectSel ? subjectSel.value : '';
    }
  }

  if (errBox) errBox.hidden = true;
  if (saveBtn) { saveBtn.disabled = true; saveBtn.innerHTML = '<i data-icon="save"></i>جارٍ الحفظ...'; refreshIcons(); }

  google.script.run.withSuccessHandler(function (res) {
    if (!res || res.error) {
      if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = '<i data-icon="save"></i>حفظ'; refreshIcons(); }
      if (errBox) { errBox.hidden = false; errBox.querySelector('span').textContent = (res && res.message) || 'تعذّر الحفظ'; }
      return;
    }
    closeActionModal();
    alertMSG(id ? ('تم تحديث ' + CURRICULUM_LABELS_[entity] + ' بنجاح') : ('تمت إضافة ' + CURRICULUM_LABELS_[entity] + ' بنجاح'), 'success');
    // تحديث هذا التبويب فقط (لا الأربعة معًا) — بلا setRouteLoading فلا تظهر الصفحة وكأنها
    // أُعيد تحميلها بالكامل. الجلب من الخادم (لا تحديث محلي متفائل) عمدًا: بعض الحقول (مثل
    // id بشيت matns) قد تُعاد حسابتها آليًا (ArrayFormula)، فالقيمة الموثوقة من الخادم دائمًا.
    refreshCurriculumEntity(entity, true);
  }).withFailureHandler(function (err) {
    if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = '<i data-icon="save"></i>حفظ'; refreshIcons(); }
    if (errBox) { errBox.hidden = false; errBox.querySelector('span').textContent = 'تعذّر الحفظ: ' + err; }
  })[CURRICULUM_SAVE_FN_[entity]](getCurrentUserCpr(), item);
}

function deleteCurriculumItemConfirm(entity, id) {
  var rec = (curriculumData_[entity] || []).find(function (r) { return String(r.id) === String(id); });
  if (!rec) return;
  var label = CURRICULUM_LABELS_[entity];
  var displayName = entity === 'awrad' ? rec.matn : rec.name;

  Swal.fire({
    title: 'حذف ' + label,
    html: 'هل أنت متأكد من حذف <strong>' + escapeHtml(displayName) + '</strong> نهائيًا؟ لا يمكن التراجع عن هذا الإجراء.',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#dc3545',
    confirmButtonText: 'حذف نهائيًا',
    cancelButtonText: 'إلغاء'
  }).then(function (result) {
    if (!result.isConfirmed) return;
    google.script.run.withSuccessHandler(function (res) {
      if (!res || res.error) { alertMSG((res && res.message) || 'تعذّر الحذف', 'error'); return; }
      alertMSG('تم الحذف بنجاح', 'success');
      refreshCurriculumEntity(entity, true);
    }).withFailureHandler(function (err) {
      alertMSG('تعذّر الحذف: ' + err, 'error');
    })[CURRICULUM_DELETE_FN_[entity]](getCurrentUserCpr(), id);
  });
}

/* ==========================================================================
   صفحة "إدارة المراحل" — منتقي للمراحل الأربع الثابتة ومحرّر واسع لمرحلة واحدة في كل مرة.
   يضم التسجيل والمدة والقوالب والحقيبة وشروط الاجتياز، مع تتبّع التغييرات غير المحفوظة.
   مفتاح كل مرحلة يعمل **إضافة** لمفتاح "فتح باب التسجيل" العام بلوحة المعلومات (كلاهما لازم
   مفتوحان معًا حتى يُقبَل طلب انضمام فعليًا — راجع requestStageJoin بdataPost.js).
   ========================================================================== */
var stagesData_ = [];
var stageCriteriaData_ = [];

function loadStagesView() {
  var seedBtn = document.getElementById('seedCardTemplatesBtn');
  if (seedBtn && !seedBtn.dataset.bound) {
    seedBtn.dataset.bound = '1';
    seedBtn.addEventListener('click', function () {
      seedBtn.disabled = true; seedBtn.innerHTML = '<i data-icon="download"></i>جارٍ الاستيراد...'; refreshIcons();
      google.script.run.withSuccessHandler(function (msg) {
        seedBtn.disabled = false; seedBtn.innerHTML = '<i data-icon="download"></i>استيراد القوالب القديمة'; refreshIcons();
        alertMSG(msg || 'تم النقل', 'success');
        loadStagesView();
      }).withFailureHandler(function (err) {
        seedBtn.disabled = false; seedBtn.innerHTML = '<i data-icon="download"></i>استيراد القوالب القديمة'; refreshIcons();
        alertMSG('تعذّر النقل: ' + err, 'error');
      }).seedExistingCardTemplateIds();
    });
  }

  var loaded = { stages: false, criteria: false };
  function tryRender() { if (loaded.stages && loaded.criteria) renderStagesGrid(); }

  google.script.run.withSuccessHandler(function (stages) {
    stagesData_ = Array.isArray(stages) ? stages : []; loaded.stages = true; tryRender();
  }).withFailureHandler(function (err) {
    console.error('تعذّر تحميل قائمة المراحل', err);
    var grid = document.getElementById('stagesGrid');
    if (grid) grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--danger)">تعذّر تحميل بيانات المراحل</div>';
    loaded.stages = true; tryRender();
  }).getStagesList();

  google.script.run.withSuccessHandler(function (criteria) {
    stageCriteriaData_ = Array.isArray(criteria) ? criteria : []; loaded.criteria = true; tryRender();
  }).withFailureHandler(function (err) {
    console.error('تعذّر تحميل شروط الاجتياز', err);
    stageCriteriaData_ = []; loaded.criteria = true; tryRender();
  }).getStageCriteriaList();
}

var stagesActiveIndex_ = null;

function stageToneClass_(stageIndex) {
  var n = +stageIndex;
  return n >= 0 && n <= 3 ? 's' + n : 's0';
}

function stageDateValue_(value) {
  return value ? String(value).split('T')[0] : '';
}

function stageTodayValue_() {
  var d = new Date();
  var pad = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function formatStageDate_(value) {
  if (!value) return '';
  var parts = String(value).split('-');
  if (parts.length !== 3) return value;
  var date = new Date(+parts[0], +parts[1] - 1, +parts[2]);
  try { return date.toLocaleDateString('ar-BH', { day: 'numeric', month: 'short', year: 'numeric' }); }
  catch (e) { return value; }
}

function stagePeriodMeta_(startValue, endValue) {
  var start = stageDateValue_(startValue);
  var end = stageDateValue_(endValue);
  var today = stageTodayValue_();
  if (!start) return {
    short: 'بلا موعد بعد',
    long: 'حدّد تاريخ بداية الدورة ليبدأ النظام في احتساب حضور طلاب المرحلة.',
    invalid: false
  };
  if (end && end < start) return {
    short: 'راجع التواريخ',
    long: 'تاريخ نهاية الدورة يسبق تاريخ البداية. صحّح المدة قبل الحفظ.',
    invalid: true
  };
  var duration = '';
  if (end) {
    var a = start.split('-'), b = end.split('-');
    var days = Math.round((new Date(+b[0], +b[1] - 1, +b[2]) - new Date(+a[0], +a[1] - 1, +a[2])) / 86400000) + 1;
    duration = days > 0 ? ' • ' + days + ' يومًا' : '';
  }
  if (start > today) return {
    short: 'تبدأ ' + formatStageDate_(start),
    long: 'تبدأ الدورة في ' + formatStageDate_(start) + (end ? ' وتنتهي في ' + formatStageDate_(end) : '') + duration + '.',
    invalid: false
  };
  if (end && end < today) return {
    short: 'انتهت ' + formatStageDate_(end),
    long: 'امتدت الدورة من ' + formatStageDate_(start) + ' حتى ' + formatStageDate_(end) + duration + '.',
    invalid: false
  };
  return {
    short: end ? 'جارية حتى ' + formatStageDate_(end) : 'الدورة جارية',
    long: 'الدورة جارية منذ ' + formatStageDate_(start) + (end ? ' وحتى ' + formatStageDate_(end) : ' دون تاريخ نهاية محدّد') + duration + '.',
    invalid: false
  };
}

function stageCriterionMeta_(key) {
  var map = {
    attendance: { icon: 'calendar-check', hint: 'الحد الأدنى للحضور' },
    examPassRate: { icon: 'clipboard-check', hint: 'الحد الأدنى لاجتياز الاختبارات' },
    recitationRate: { icon: 'book-open-check', hint: 'الحد الأدنى لتسميع الأوراد' }

  return map[key] || { icon: 'circle-check', hint: 'الحد الأدنى المطلوب' };

function stageTemplateDocumentUrl_(value, resourceType) {
  var raw = String(value || '').trim();
  if (!raw) return '';
  if (/^https:\/\//i.test(raw)) return raw;
  var idMatch = raw.match(/[-\w]{20,}/);
  if (!idMatch) return '';
  if (resourceType === 'folder') return 'https://drive.google.com/drive/folders/' + encodeURIComponent(idMatch[0]);
  return 'https://docs.google.com/document/d/' + encodeURIComponent(idMatch[0]) + '/edit';
}

function normalizeStageTemplateId_(value, resourceType) {
  var raw = String(value || '').trim();
  if (!raw) return '';
  var idMatch = raw.match(/[-\w]{20,}/);
  if (!idMatch) return null;
  if (resourceType === 'folder') return 'https://drive.google.com/drive/folders/' + idMatch[0];
  return idMatch[0];
}

function setStageTemplateEditMode_(control, editing) {
  if (!control) return;
  var input = control.querySelector('.stage-template-input');
  var button = control.querySelector('.stage-template-action');
  control.classList.toggle('is-editing', !!editing);
  if (input) input.readOnly = !editing;
  if (button) {
    button.dataset.mode = editing ? 'save' : 'edit';
    button.title = editing ? 'حفظ' : 'تعديل';
    button.setAttribute('aria-label', (editing ? 'حفظ ' : 'تعديل ') + (control.closest('.stage-template-field').querySelector('.stage-field-label').textContent || 'القالب').trim());
    button.innerHTML = editing ? '<i data-icon="save"></i><span>حفظ</span>' : '<i data-icon="pencil"></i><span>تعديل</span>';
  }
  refreshIcons();
  if (editing && input) {
    window.setTimeout(function () { input.focus(); input.select(); }, 0);
  }
}

function saveStageTemplateControl_(card, field, control) {
  var input = control.querySelector('.stage-template-input');
  var button = control.querySelector('.stage-template-action');
  var resourceType = field.getAttribute('data-resource-type') || 'document';
  var resourceLabel = resourceType === 'folder' ? 'رابط الحقيبة' : 'القالب';
  var normalized = normalizeStageTemplateId_(input.value, resourceType);
  if (normalized === null) {
    alertMSG(resourceType === 'folder' ? 'أدخل رابط مجلد Google Drive أو معرّفًا صالحًا' : 'أدخل رابط Google Doc أو معرّف ملف صالحًا', 'error');
    input.focus();
    return;
  }
  if (normalized === String(input.dataset.savedValue || '')) {
    input.value = normalized;
    setStageTemplateEditMode_(control, false);
    return;
  }

  control.classList.add('is-saving');
  button.disabled = true;
  button.innerHTML = '<i data-icon="loader-circle"></i><span>جارٍ الحفظ</span>';
  refreshIcons();
  google.script.run.withSuccessHandler(function (res) {
    control.classList.remove('is-saving');
    button.disabled = false;
    if (!res || res.error || !res.ok) {
      button.innerHTML = '<i data-icon="save"></i><span>حفظ</span>';
      refreshIcons();
      alertMSG((res && res.message) || ('تعذّر حفظ ' + resourceLabel), 'error');
      input.focus();
      return;
    }
    var savedValue = String(res.value || '');
    input.value = savedValue;
    input.dataset.savedValue = savedValue;
    setStageTemplateEditMode_(control, false);
    alertMSG('تم حفظ ' + resourceLabel + ' بنجاح', 'success');
  }).withFailureHandler(function (err) {
    control.classList.remove('is-saving');
    button.disabled = false;
    button.innerHTML = '<i data-icon="save"></i><span>حفظ</span>';
    refreshIcons();
    alertMSG('تعذّر حفظ ' + resourceLabel + ': ' + err, 'error');
    input.focus();
  }).saveStageTemplateField(getCurrentUserCpr(), card.getAttribute('data-stage-card'), field.getAttribute('data-template-field'), input.value.trim());
}

function setupStageTemplateControls_(card) {
  card.querySelectorAll('.stage-template-field').forEach(function (field) {
    var control = field.querySelector('.stage-template-control');
    var input = field.querySelector('.stage-template-input');
    var button = field.querySelector('.stage-template-action');
    input.addEventListener('click', function () {
      if (!input.readOnly) return;
      var resourceType = field.getAttribute('data-resource-type') || 'document';
      var url = stageTemplateDocumentUrl_(input.value, resourceType);
      if (!url) { alertMSG(resourceType === 'folder' ? 'لا يوجد رابط حقيبة محفوظ لفتحه' : 'لا يوجد معرّف قالب محفوظ لفتحه', 'warning'); return; }
      window.open(url, '_blank', 'noopener,noreferrer');
    });
    input.addEventListener('keydown', function (event) {
      if (!input.readOnly && event.key === 'Escape') {
        input.value = input.dataset.savedValue || '';
        setStageTemplateEditMode_(control, false);
        event.preventDefault();
        return;
      }
      if (input.readOnly && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        input.click();
      }
    });
    button.addEventListener('click', function () {
      if (button.dataset.mode === 'save') saveStageTemplateControl_(card, field, control);
      else setStageTemplateEditMode_(control, true);
    });
  });
}

function syncStageCardUi_(card) {

  if (toggleText) toggleText.textContent = toggle.checked ? 'التسجيل مفتوح' : 'التسجيل مغلق';
  if (toggleHint) toggleHint.textContent = toggle.checked ? 'يعمل مع بوابة التسجيل العامة' : 'لن تُقبل طلبات جديدة لهذه المرحلة';

  card.querySelectorAll('.stage-criterion-row').forEach(function (row) {
    row.classList.toggle('is-mandatory', row.querySelector('.criterionMandatory').checked);
  });

  var period = stagePeriodMeta_(card.querySelector('.stageStartDate').value, card.querySelector('.stageEndDate').value);
  var periodEl = card.querySelector('.stage-period-summary span');
  if (periodEl) periodEl.textContent = period.long;
  var tab = document.querySelector('[data-stage-tab="' + idx + '"]');
  if (tab) {
    var status = tab.querySelector('.stage-tab-status');
    if (status) { status.textContent = toggle.checked ? 'التسجيل مفتوح' : 'التسجيل مغلق'; status.classList.toggle('open', toggle.checked); }
    var date = tab.querySelector('.stage-tab-date');
    if (date) date.textContent = period.short;
  }
  syncStageOverview_();
}

function updateStageDirtyState_(card) {
  var dirty = stageCardStateSignature_(card) !== card.dataset.initialState;
  var saving = card.dataset.saving === '1';
  card.classList.toggle('is-dirty', dirty);
  var tab = document.querySelector('[data-stage-tab="' + card.getAttribute('data-stage-card') + '"]');
  if (tab) tab.classList.toggle('has-changes', dirty);
  var state = card.querySelector('.stage-save-state');
  if (state && !saving) {
    state.querySelector('b').textContent = dirty ? 'توجد تغييرات غير محفوظة' : 'كل الإعدادات محفوظة';
    state.querySelector('small').textContent = dirty ? 'احفظ إعدادات هذه المرحلة قبل المغادرة.' : 'لا توجد تغييرات غير محفوظة لهذه المرحلة.';
  }
  var btn = card.querySelector('.stageSaveBtn');
  if (btn && !saving) btn.disabled = !dirty;
}

function activateStageEditor_(stageIndex) {
  var grid = document.getElementById('stagesGrid');
  if (!grid) return;
  stagesActiveIndex_ = String(stageIndex);
  grid.querySelectorAll('[data-stage-tab]').forEach(function (tab) {
    var active = tab.getAttribute('data-stage-tab') === stagesActiveIndex_;
    tab.classList.toggle('active', active);
    tab.setAttribute('aria-selected', String(active));
    tab.setAttribute('tabindex', active ? '0' : '-1');
  });
  grid.querySelectorAll('[data-stage-card]').forEach(function (card) {
    var active = card.getAttribute('data-stage-card') === stagesActiveIndex_;
    card.hidden = !active;
    card.classList.toggle('active', active);
  });
}

function renderStagesGrid() {
  var grid = document.getElementById('stagesGrid');
  if (!grid) return;
  if (!stagesData_.length) {
    grid.innerHTML = '<div class="stage-empty-state" role="alert"><i data-icon="triangle-alert"></i><strong>تعذّر العثور على بيانات المراحل</strong><span>أعد فتح الصفحة أو تحقق من الاتصال.</span></div>';
    refreshIcons();
    return;
  }
  grid.innerHTML = stageOverviewHtml_() + '<div class="stage-tabs" role="tablist" aria-label="اختر المرحلة">' + stagesData_.map(stageTabHtml_).join('') + '</div>' +
    '<div class="stage-editors">' + stagesData_.map(stageCardHtml_).join('') + '</div>';
  refreshIcons();

  grid.querySelectorAll('[data-stage-tab]').forEach(function (tab) {
    tab.addEventListener('click', function () { activateStageEditor_(tab.getAttribute('data-stage-tab')); });
    tab.addEventListener('keydown', function (event) {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      var tabs = Array.from(grid.querySelectorAll('[data-stage-tab]'));
      var current = tabs.indexOf(tab);
      var offset = event.key === 'ArrowLeft' ? 1 : -1;
      var next = tabs[(current + offset + tabs.length) % tabs.length];
      event.preventDefault();
      activateStageEditor_(next.getAttribute('data-stage-tab'));
      next.focus();
    });
  });

  grid.querySelectorAll('[data-stage-card]').forEach(function (card) {
    card.dataset.initialState = stageCardStateSignature_(card);
    card.querySelectorAll('input').forEach(function (input) {
      if (input.classList.contains('stage-template-input')) return;
      input.addEventListener('input', function () { syncStageCardUi_(card); updateStageDirtyState_(card); });
      input.addEventListener('change', function () { syncStageCardUi_(card); updateStageDirtyState_(card); });
    });
    setupStageTemplateControls_(card);
    syncStageCardUi_(card);
    updateStageDirtyState_(card);
  });

  var knownActive = stagesData_.some(function (s) { return String(s.stageIndex) === String(stagesActiveIndex_); });
  activateStageEditor_(knownActive ? stagesActiveIndex_ : stagesData_[0].stageIndex);

  grid.querySelectorAll('.stageSaveBtn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var card = btn.closest('[data-stage-card]');
      var stageIndex = card.getAttribute('data-stage-card');
      var unfinishedTemplate = card.querySelector('.stage-template-control.is-editing, .stage-template-control.is-saving');
      if (unfinishedTemplate) {
        alertMSG('أكمل حفظ حقل المورد المفتوح أولًا', 'warning');
        var unfinishedInput = unfinishedTemplate.querySelector('.stage-template-input');
        if (unfinishedInput) unfinishedInput.focus();
        return;
      }
      var startInput = card.querySelector('.stageStartDate');
      var endInput = card.querySelector('.stageEndDate');
      if (startInput.value && endInput.value && endInput.value < startInput.value) {
        alertMSG('تاريخ نهاية الدورة يجب أن يكون بعد تاريخ البداية', 'error');
        endInput.focus();
        return;
      }
      var invalidThreshold = Array.from(card.querySelectorAll('.criterionThreshold')).find(function (input) {
        var value = Number(input.value);
        return !Number.isFinite(value) || value < 0 || value > 100;
      });
      if (invalidThreshold) {
        alertMSG('نسبة الاجتياز يجب أن تكون بين 0 و100', 'error');
        invalidThreshold.focus();
        return;
      }

      var item = {
        registrationOpen: card.querySelector('.stageRegToggle').checked,
        courseStartDate: startInput.value,
        courseEndDate: endInput.value,
        cardTemplateId: card.querySelector('.stageCardTemplate').dataset.savedValue || '',
        certTemplateId: card.querySelector('.stageCertTemplate').dataset.savedValue || '',
        bagLink: card.querySelector('.stageBagLink').dataset.savedValue || '',
        hoursPerAttendance: card.querySelector('.stageHoursPerAttendance').value
      };
      var criteriaRows = Array.from(card.querySelectorAll('.stage-criterion-row')).map(function (row) {
        var considerAllExamsEl = row.querySelector('.criterionConsiderAllExams');
        var considerMadhabEl = row.querySelector('.criterionConsiderMadhab');
        return {
          criterionKey: row.getAttribute('data-criterion-key'),
          threshold: row.querySelector('.criterionThreshold').value,
          isMandatory: row.querySelector('.criterionMandatory').checked,
          considerAllExams: considerAllExamsEl ? considerAllExamsEl.checked : undefined,
          considerMadhab: considerMadhabEl ? considerMadhabEl.checked : undefined
        };
      });

      card.dataset.saving = '1';
      btn.disabled = true; btn.innerHTML = '<i data-icon="save"></i>جارٍ الحفظ...';
      var saveState = card.querySelector('.stage-save-state');
      if (saveState) { saveState.querySelector('b').textContent = 'جارٍ حفظ الإعدادات'; saveState.querySelector('small').textContent = 'لا تغلق الصفحة حتى يكتمل الحفظ.'; }
      refreshIcons();
      var userCpr = getCurrentUserCpr();
      var pending = 1 + criteriaRows.length;
      var hadError = false;
      var firstError = '';
      function tryDone(res) {
        if (res && res.error) { hadError = true; if (!firstError && res.message) firstError = res.message; }
        pending--;
        if (pending > 0) return;
        card.dataset.saving = '0';
        btn.innerHTML = '<i data-icon="save"></i>حفظ إعدادات المرحلة'; refreshIcons();
        if (hadError) {
          updateStageDirtyState_(card);
          alertMSG(firstError || 'تعذّر حفظ بعض الإعدادات', 'error');
          return;
        }
        card.dataset.initialState = stageCardStateSignature_(card);
        updateStageDirtyState_(card);
        alertMSG('تم حفظ إعدادات المرحلة بنجاح', 'success');
        loadStagesView();
      }

      google.script.run.withSuccessHandler(tryDone).withFailureHandler(function (err) {
        console.error('تعذّر حفظ إعدادات المرحلة', err); tryDone({ error: true });
      }).saveStageSettings(userCpr, stageIndex, item);

      criteriaRows.forEach(function (c) {
        google.script.run.withSuccessHandler(tryDone).withFailureHandler(function (err) {
          console.error('تعذّر حفظ معيار الاجتياز', err); tryDone({ error: true });
        }).saveStageCriterion(userCpr, stageIndex, c.criterionKey, c);
      });
    });
  });
}

/* ==========================================================================
   صفحة "إدارة القوالب" — شهادات الاختبارات (+أعمال الطلاب) وكروت التهنئة. قوالب بطاقة
   الطالب/شهادة الاجتياز ضمن "إدارة المراحل" بدل هنا (مرتبطة بمرحلة بعينها). راجع مناقشات.md
   "إدارة القوالب" للسياق الكامل.
   ========================================================================== */
var templatesControlsBound_ = false;
var examCertsData_ = [];
var greetingsData_ = [];
var templatesModalMode_ = ''; // 'examCert' | 'greeting'
var templatesModalOriginalName_ = ''; // شهادات الاختبارات: المفتاح الأصلي (name) قبل التعديل
var templatesModalId_ = ''; // كروت التهنئة: id الصف عند التعديل
var templatesAllExams_ = []; // كل الاختبارات الحقيقية (من شيت rules عبر getExams) — لقائمة "اسم الاختبار" المنسدلة ولعمود "المرحلة" بالجدول
var examCertsStageFilter_ = 'all';

function loadTemplatesView() {
  if (!templatesControlsBound_) { templatesControlsBound_ = true; setupTemplatesControls_(); }

  google.script.run.withSuccessHandler(function (list) {
    examCertsData_ = Array.isArray(list) ? list : [];
    renderExamCertsTable_();
  }).withFailureHandler(function (err) {
    console.error('تعذّر تحميل قوالب شهادات الاختبارات', err);
    var tb = document.getElementById('examCertsRows');
    if (tb) tb.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--danger)">تعذّر التحميل</td></tr>';
  }).getCertificateTemplatesList();

  google.script.run.withSuccessHandler(function (list) {
    greetingsData_ = Array.isArray(list) ? list : [];
    renderGreetingsTable_();
  }).withFailureHandler(function (err) {
    console.error('تعذّر تحميل قوالب كروت التهنئة', err);
    var tb = document.getElementById('greetingsRows');
    if (tb) tb.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--danger)">تعذّر التحميل</td></tr>';
  }).getGreetingTemplatesList();

  google.script.run.withSuccessHandler(function (exams) {
    templatesAllExams_ = Array.isArray(exams) ? exams : [];
    renderExamCertsTable_();
  }).withFailureHandler(function (err) {
    console.error('تعذّر تحميل قائمة الاختبارات', err);
  }).getExams(null, null);
}

// اسم شهادة أعمال الطلاب مخزَّن فعليًا بلاحقة "-أعمال الطلاب" فوق اسم الاختبار نفسه (نفس
// الشيت/الآلية، راجع generatWrksCertificate بdataPost.js) — نفصلهما هنا لعرض/تحرير أنظف.
var TEMPLATE_WRKS_SUFFIX_ = '-أعمال الطلاب';
function templateExamLevel_(examName) {
  var baseName = examName.endsWith(TEMPLATE_WRKS_SUFFIX_) ? examName.slice(0, -TEMPLATE_WRKS_SUFFIX_.length) : examName;
  var match = templatesAllExams_.find(function (e) { return e.exam === baseName; });
  return match ? match.level : null;
}

function setupTemplatesControls_() {
  var tabGroup = document.getElementById('templatesTabGroup');
  if (tabGroup) tabGroup.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-tab]');
    if (!btn) return;
    tabGroup.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    var tab = btn.getAttribute('data-tab');
    document.getElementById('templatesExamCertsPanel').hidden = tab !== 'examCerts';
    document.getElementById('templatesGreetingsPanel').hidden = tab !== 'greetings';
  });

  var examSearch = document.getElementById('examCertsSearchInput');
  if (examSearch) examSearch.addEventListener('input', renderExamCertsTable_);
  var greetSearch = document.getElementById('greetingsSearchInput');
  if (greetSearch) greetSearch.addEventListener('input', renderGreetingsTable_);

  var examStageGroup = document.getElementById('examCertsStageFilterGroup');
  if (examStageGroup) examStageGroup.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    examStageGroup.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    examCertsStageFilter_ = btn.getAttribute('data-filter');
    renderExamCertsTable_();
  });

  var addExamCertBtn = document.getElementById('addExamCertBtn');
  if (addExamCertBtn) addExamCertBtn.addEventListener('click', function () { openTemplateModal_('examCert', null); });
  var addGreetingBtn = document.getElementById('addGreetingBtn');
  if (addGreetingBtn) addGreetingBtn.addEventListener('click', function () { openTemplateModal_('greeting', null); });

  var examRows = document.getElementById('examCertsRows');
  if (examRows) examRows.addEventListener('click', function (e) {
    var editBtn = e.target.closest('.template-edit');
    if (editBtn) { openTemplateModal_('examCert', editBtn.getAttribute('data-name')); return; }
    var delBtn = e.target.closest('.template-delete');
    if (delBtn) { deleteExamCertConfirm_(delBtn.getAttribute('data-name')); return; }
  });

  var greetRows = document.getElementById('greetingsRows');
  if (greetRows) greetRows.addEventListener('click', function (e) {
    var editBtn = e.target.closest('.template-edit');
    if (editBtn) { openTemplateModal_('greeting', editBtn.getAttribute('data-id')); return; }
    var delBtn = e.target.closest('.template-delete');
    if (delBtn) { deleteGreetingConfirm_(delBtn.getAttribute('data-id')); return; }
  });
}

function updateExamCertsStageCounts_() {
  var setText = function (id, n) { var el = document.getElementById(id); if (el) el.textContent = n; };
  setText('examCertsStageCount-all', examCertsData_.length);
  [0, 1, 2, 3].forEach(function (idx) {
    setText('examCertsStageCount-' + idx, examCertsData_.filter(function (r) { return +templateExamLevel_(r.name) === idx; }).length);
  });
}

function renderExamCertsTable_() {
  var tbody = document.getElementById('examCertsRows');
  if (!tbody) return;
  updateExamCertsStageCounts_();
  var q = (document.getElementById('examCertsSearchInput').value || '').trim().toLowerCase();
  var rows = examCertsData_.filter(function (r) { return !q || String(r.name || '').toLowerCase().indexOf(q) !== -1; });
  if (examCertsStageFilter_ !== 'all') {
    rows = rows.filter(function (r) { return String(templateExamLevel_(r.name)) === examCertsStageFilter_; });
  }
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--muted)">لا توجد قوالب مطابقة</td></tr>'; return; }
  tbody.innerHTML = rows.map(function (r) {
    var lvl = templateExamLevel_(r.name);
    var stageHtml = (lvl !== null && lvl !== undefined) ? stageBadgeHtml(+lvl) : '<span style="color:#b7bec5">—</span>';
    return '<tr><td>' + escapeHtml(r.name) + '</td><td>' + stageHtml + '</td><td dir="ltr" style="text-align:left;">' + escapeHtml(r.templateId) + '</td>' +
      '<td><div style="display:flex;gap:6px;justify-content:flex-end;">' +
      '<button class="icon-button template-edit" type="button" data-name="' + escapeHtml(r.name) + '" title="تعديل"><i data-icon="pencil"></i></button>' +
      '<button class="icon-button danger template-delete" type="button" data-name="' + escapeHtml(r.name) + '" title="حذف"><i data-icon="trash-2"></i></button>' +
      '</div></td></tr>';
  }).join('');
  refreshIcons();
}

function renderGreetingsTable_() {
  var tbody = document.getElementById('greetingsRows');
  if (!tbody) return;
  var q = (document.getElementById('greetingsSearchInput').value || '').trim().toLowerCase();
  var rows = greetingsData_.filter(function (r) { return !q || String(r.name || '').toLowerCase().indexOf(q) !== -1; });
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--muted)">لا توجد قوالب مطابقة</td></tr>'; return; }
  tbody.innerHTML = rows.map(function (r) {
    return '<tr><td>' + escapeHtml(r.name) + '</td><td dir="ltr" style="text-align:left;">' + escapeHtml(r.templateId) + '</td>' +
      '<td>' + (r.isActive ? '<span style="color:var(--green,#1a9e5c);font-weight:600;">مفعَّل</span>' : '<span style="color:#b7bec5">—</span>') + '</td>' +
      '<td><div style="display:flex;gap:6px;justify-content:flex-end;">' +
      '<button class="icon-button template-edit" type="button" data-id="' + escapeHtml(r.id) + '" title="تعديل"><i data-icon="pencil"></i></button>' +
      '<button class="icon-button danger template-delete" type="button" data-id="' + escapeHtml(r.id) + '" title="حذف"><i data-icon="trash-2"></i></button>' +
      '</div></td></tr>';
  }).join('');
  refreshIcons();
}

// مُعمَّمة (idPrefix مختلف لكل معاينة) لأن المودال يحتاج معاينتين منفصلتين: معاينة القالب
// المصدر قبل تقرير نسخه، ومعاينة القالب النهائي اللي هيُحفَظ فعليًا.
function templateItemPreviewHtml_(idPrefix, label) {
  return '<div class="field wide" id="' + idPrefix + 'Wrap" hidden>' +
    '<span>' + label + ' <a id="' + idPrefix + 'OpenLink" href="#" target="_blank" rel="noopener" style="margin-right:10px;">فتح في تبويب جديد ↗</a></span>' +
    '<iframe id="' + idPrefix + 'Frame" src="" class="template-preview-frame"></iframe>' +
    '</div>';
}

// يربط معاينة/فتح قالب بأي حقل (input أو select) يحمل معرّفه — idPrefix يحدّد أي معاينة
// (templateItemPreview للقالب النهائي، templateItemSourcePreview لقالب النسخ قبل تأكيده).
function bindTemplatePreview_(sourceEl, idPrefix, eventName) {
  var wrap = document.getElementById(idPrefix + 'Wrap');
  var frame = document.getElementById(idPrefix + 'Frame');
  var link = document.getElementById(idPrefix + 'OpenLink');
  if (!sourceEl || !wrap) return;
  function update() {
    var id = sourceEl.value.trim();
    if (!id) { wrap.hidden = true; return; }
    wrap.hidden = false;
    frame.src = 'https://docs.google.com/document/d/' + encodeURIComponent(id) + '/preview';
    link.href = 'https://docs.google.com/document/d/' + encodeURIComponent(id) + '/edit';
  }
  sourceEl.addEventListener(eventName, update);
  update();
}

function openTemplateModal_(mode, key) {
  templatesModalMode_ = mode;
  var bodyHtml, title;
  if (mode === 'examCert') {
    var rec = key ? examCertsData_.find(function (r) { return r.name === key; }) : null;
    templatesModalOriginalName_ = key || '';
    var isWrks = rec ? rec.name.endsWith(TEMPLATE_WRKS_SUFFIX_) : false;
    var baseName = rec ? (isWrks ? rec.name.slice(0, -TEMPLATE_WRKS_SUFFIX_.length) : rec.name) : '';
    title = rec ? 'تعديل قالب شهادة اختبار' : 'إضافة قالب شهادة اختبار';

    var examOptions = '<option value="">اختر الاختبار...</option>' + templatesAllExams_.map(function (e) {
      var selected = e.exam === baseName ? ' selected' : '';
      return '<option value="' + escapeHtml(e.exam) + '"' + selected + '>' + escapeHtml(e.exam) + ' — ' + escapeHtml(getLevelName(e.level)) + '</option>';
    }).join('');

    // نفس فلتر المرحلة المطبَّق على الجدول الرئيسي حاليًا (لو مفعَّل) — بطلب المستخدم صراحةً.
    var copySourceCandidates = examCertsData_.filter(function (r) {
      if (!r.templateId) return false;
      if (examCertsStageFilter_ === 'all') return true;
      return String(templateExamLevel_(r.name)) === examCertsStageFilter_;
    });
    var copySourceOptions = '<option value="">اختر قالبًا...</option>' + copySourceCandidates.map(function (r) {
      return '<option value="' + escapeHtml(r.templateId) + '">' + escapeHtml(r.name) + '</option>';
    }).join('');

    bodyHtml = '<div class="form-grid">' +
      '<label class="field wide"><span>الاختبار</span><select id="templateItemExamSelect">' + examOptions + '</select></label>' +
      '<label class="checkbox-field wide"><input type="checkbox" id="templateItemIsWrks"' + (isWrks ? ' checked' : '') + '><span>قالب شهادة "أعمال الطلاب" لهذا الاختبار (لا شهادة الاختبار العادية)</span></label>' +
      '<label class="checkbox-field wide"><input type="checkbox" id="templateItemCopyMode"><span>إنشاء نسخة جديدة من قالب موجود (بدل البدء من الصفر)</span></label>' +
      '<div class="template-copy-box" id="templateItemCopyBox" hidden>' +
      '<label class="field wide"><span>انسخ من' + (examCertsStageFilter_ !== 'all' ? ' (مرحلة ' + escapeHtml(getLevelName(+examCertsStageFilter_)) + ' فقط، حسب فلتر الجدول الحالي)' : '') + '</span><select id="templateItemCopySource">' + copySourceOptions + '</select></label>' +
      templateItemPreviewHtml_('templateItemSourcePreview', 'معاينة القالب المصدر') +
      '<button class="secondary-button" id="templateItemDoCopyBtn" type="button" disabled><i data-icon="copy"></i>نسخ هذا القالب</button>' +
      '</div>' +
      '<label class="field wide"><span>معرّف قالب الشهادة (Google Doc)</span><input id="templateItemTemplateId" dir="ltr" value="' + (rec ? escapeHtml(rec.templateId) : '') + '" placeholder="أدخله يدويًا، أو استخدم النسخ من قالب موجود أعلاه"></label>' +
      templateItemPreviewHtml_('templateItemPreview', 'معاينة القالب') +
      '</div><div class="warning-note" id="templateItemError" hidden><i data-icon="triangle-alert"></i><span></span></div>';
  } else {
    var g = key ? greetingsData_.find(function (r) { return r.id === key; }) : null;
    templatesModalId_ = key || '';
    title = g ? 'تعديل قالب تهنئة' : 'إضافة قالب تهنئة';
    bodyHtml = '<div class="form-grid">' +
      '<label class="field wide"><span>اسم المناسبة</span><input id="templateItemName" value="' + (g ? escapeHtml(g.name) : '') + '" placeholder="مثال: عيد الفطر 1447 هـ"></label>' +
      '<label class="field wide"><span>معرّف قالب العرض التقديمي (Google Slides)</span><input id="templateItemTemplateId" dir="ltr" value="' + (g ? escapeHtml(g.templateId) : '') + '"></label>' +
      '<label class="field wide"><span>موضوع البريد الإلكتروني</span><input id="templateItemSubject" value="' + (g ? escapeHtml(g.subject || '') : '') + '"></label>' +
      '<label class="field wide"><span>نص التهنئة</span><textarea id="templateItemBody" rows="5">' + (g ? escapeHtml(g.body || '') : '') + '</textarea></label>' +
      '<label class="checkbox-field wide"><input type="checkbox" id="templateItemActive"' + (g && g.isActive ? ' checked' : '') + '><span>هذا هو القالب المفعَّل حاليًا (يُستخدَم فعليًا عند إصدار كرت تهنئة)</span></label>' +
      '</div><div class="warning-note" id="templateItemError" hidden><i data-icon="triangle-alert"></i><span></span></div>';
  }

  var footerHtml = '<button class="secondary-button" type="button" onclick="closeActionModal()">إلغاء</button>' +
    '<button class="primary-button" id="templateItemSaveBtn" type="button"><i data-icon="save"></i>حفظ</button>';
  openActionModal(title, 'إدارة القوالب', bodyHtml, footerHtml);

  if (mode === 'examCert') {
    var templateIdInput = document.getElementById('templateItemTemplateId');
    bindTemplatePreview_(templateIdInput, 'templateItemPreview', 'input');

    var copyModeCb = document.getElementById('templateItemCopyMode');
    var copyBox = document.getElementById('templateItemCopyBox');
    var copySourceSelect = document.getElementById('templateItemCopySource');
    var doCopyBtn = document.getElementById('templateItemDoCopyBtn');
    if (copyModeCb) copyModeCb.addEventListener('change', function () {
      copyBox.hidden = !copyModeCb.checked;
    });

    // اختيار قالب من "انسخ من" يعرض معاينته فقط — لا نسخ فعلي إلا بضغط "نسخ هذا القالب"
    // صراحةً، بطلب المستخدم ("خلي المستخدم يشوفه الأول... وبعدين يقرر ينسخ أو لا").
    if (copySourceSelect) {
      bindTemplatePreview_(copySourceSelect, 'templateItemSourcePreview', 'change');
      copySourceSelect.addEventListener('change', function () {
        doCopyBtn.disabled = !copySourceSelect.value;
      });
    }

    if (doCopyBtn) doCopyBtn.addEventListener('click', function () {
      var sourceId = copySourceSelect.value;
      if (!sourceId) return;
      var examSelect = document.getElementById('templateItemExamSelect');
      var examName = examSelect && examSelect.value;
      if (!examName) { alertMSG('يرجى اختيار الاختبار أولًا', 'warning'); return; }
      var stageLevel = templateExamLevel_(examName);
      var newName = examName + ' - ' + (stageLevel !== null ? getLevelName(+stageLevel) : '');

      // نفتح نافذة فارغة فورًا (بنفس لحظة نقرة المستخدم) لتفادي حظر المتصفح للنوافذ المنبثقة —
      // المتصفحات تحظر window.open() لو حصل بعد عملية غير متزامنة (نداء الخادم هنا)، لا لو حصل
      // مباشرة برد فعل نقرة حقيقية. نوجّهها لرابط النسخة الفعلي بعد اكتمال النسخ.
      var newWindow = window.open('', '_blank');
      doCopyBtn.disabled = true; doCopyBtn.innerHTML = '<i data-icon="copy"></i>جارٍ إنشاء نسخة...'; refreshIcons();

      google.script.run.withSuccessHandler(function (res) {
        doCopyBtn.disabled = false; doCopyBtn.innerHTML = '<i data-icon="copy"></i>نسخ هذا القالب'; refreshIcons();
        if (!res || res.error) {
          if (newWindow) newWindow.close();
          alertMSG((res && res.message) || 'تعذّر نسخ القالب', 'error');
          return;
        }
        templateIdInput.value = res.templateId;
        templateIdInput.dispatchEvent(new Event('input'));
        if (newWindow) newWindow.location.href = res.url; else window.open(res.url, '_blank');
        alertMSG('تم إنشاء نسخة جديدة من القالب — عدّل عليها بالتبويب الجديد ثم احفظ هنا', 'success');
      }).withFailureHandler(function (err) {
        doCopyBtn.disabled = false; doCopyBtn.innerHTML = '<i data-icon="copy"></i>نسخ هذا القالب'; refreshIcons();
        if (newWindow) newWindow.close();
        alertMSG('تعذّر نسخ القالب: ' + err, 'error');
      }).duplicateCertificateTemplateDoc(getCurrentUserCpr(), sourceId, newName);
    });
  }

  var saveBtn = document.getElementById('templateItemSaveBtn');
  if (saveBtn) saveBtn.addEventListener('click', saveTemplateModal_);
}

function saveTemplateModal_() {
  var errBox = document.getElementById('templateItemError');
  var saveBtn = document.getElementById('templateItemSaveBtn');
  var isExamCert = templatesModalMode_ === 'examCert';
  var name;
  if (isExamCert) {
    var examName = document.getElementById('templateItemExamSelect').value;
    if (!examName) { errBox.hidden = false; errBox.querySelector('span').textContent = 'يرجى اختيار الاختبار'; return; }
    name = document.getElementById('templateItemIsWrks').checked ? examName + TEMPLATE_WRKS_SUFFIX_ : examName;
  } else {
    name = document.getElementById('templateItemName').value.trim();
    if (!name) { errBox.hidden = false; errBox.querySelector('span').textContent = 'الاسم مطلوب'; return; }
  }
  var templateId = document.getElementById('templateItemTemplateId').value.trim();
  if (!templateId) { errBox.hidden = false; errBox.querySelector('span').textContent = 'معرّف القالب مطلوب'; return; }

  errBox.hidden = true;
  saveBtn.disabled = true; saveBtn.innerHTML = '<i data-icon="save"></i>جارٍ الحفظ...'; refreshIcons();

  function done(res) {
    if (!res || res.error) {
      saveBtn.disabled = false; saveBtn.innerHTML = '<i data-icon="save"></i>حفظ'; refreshIcons();
      errBox.hidden = false; errBox.querySelector('span').textContent = (res && res.message) || 'تعذّر الحفظ';
      return;
    }
    closeActionModal();
    alertMSG('تم الحفظ بنجاح', 'success');
    loadTemplatesView();
  }
  function fail(err) {
    saveBtn.disabled = false; saveBtn.innerHTML = '<i data-icon="save"></i>حفظ'; refreshIcons();
    errBox.hidden = false; errBox.querySelector('span').textContent = 'تعذّر الحفظ: ' + err;
  }

  if (isExamCert) {
    google.script.run.withSuccessHandler(done).withFailureHandler(fail)
      .saveCertificateTemplate(getCurrentUserCpr(), templatesModalOriginalName_, { name: name, templateId: templateId });
  } else {
    var item = {
      id: templatesModalId_,
      name: name,
      templateId: templateId,
      subject: document.getElementById('templateItemSubject').value.trim(),
      body: document.getElementById('templateItemBody').value.trim(),
      isActive: document.getElementById('templateItemActive').checked
    };
    google.script.run.withSuccessHandler(done).withFailureHandler(fail)
      .saveGreetingTemplate(getCurrentUserCpr(), item);
  }
}

/* ==========================================================================
   صفحة "مرشّحو الاجتياز" — كل طلاب أي مرحلة نشطين بها حاليًا (لا "المرشّحون" المستوفون فقط —
   بطلب المستخدم صراحةً "يعرض جميع الطلاب")، بتقدّمهم بكل معيار اجتياز وحالتهم النهائية. تحديد
   الطالب (للإصدار الجماعي) مقصور على "مجتاز" فقط — checkbox الصف مُعطَّل تمامًا لغير المجتازين.
   اعتماد الإدارة يدوي دائمًا؛ بلا أي إصدار تلقائي، بنفس روح "طلبات التسجيل" الموجودة أصلًا.
   نفس نمط جدول "قوائم الطلاب" بالضبط (بحث/فرز/ترقيم صفحات + فلاتر مقطوعة)، بعمودَي الجنسية/
   الهاتف مستبعَدين (غير مفيدين هنا) لصالح أعمدة المعايير + الحالة.
   ========================================================================== */
var graduationCandidatesControlsBound_ = false;
var graduationCandidatesData_ = [];
var graduationCandidatesStageFilter_ = 'all';
var graduationCandidatesGenderFilter_ = 'all';
var graduationCandidatesPage_ = 1;
var graduationCandidatesPageSize_ = 50; // رقم، أو 'all' لعرض كل النتائج بلا ترقيم صفحات
var graduationCandidatesSortField_ = 'name';
var graduationCandidatesSortDir_ = 'asc';
// تحديد الطلاب لإصدار شهاداتهم (cpr → true) — مُخزَّن مستقلًا عن الصفحة/الفلتر المعروضَين حاليًا
// كي يبقى التحديد قائمًا عبر التنقل بين الصفحات، وكي يعمل "تحديد الكل" على كل النتائج المطابقة
// للفلاتر الحالية دفعة واحدة، لا فقط الصفوف المعروضة فعليًا بالصفحة الحالية.
var graduationCandidatesSelected_ = {};
var GRAD_CRITERIA_KEYS_ = ['attendance', 'examPassRate', 'recitationRate'];

// مفتاح مركَّب (cpr + المرحلة) لا cpr وحده — طالب واحد قد يظهر الآن بأكثر من صف مستقل (مرحلته
// الحالية + مرحلة سابقة "done" عالقة دون شهادة، راجع getGraduationCandidates)، فلزم تمييز أي
// صف مُحدَّد بالضبط بدل الخلط بينها عند التحديد.
function gradCandSelectionKey(cpr, stageIndex) {
  return cpr + '|' + stageIndex;
}
// 'mandatoryAvg' عمود محسوب (متوسط نسب المعايير الإلزامية فقط)، لا معيارًا خامًا من الخادم —
// يُعامَل رقميًا بالترتيب أسوة بأعمدة GRAD_CRITERIA_KEYS_، راجع getGraduationCandidateMandatoryAverage.
var GRAD_NUMERIC_SORT_FIELDS_ = GRAD_CRITERIA_KEYS_.concat(['mandatoryAvg']);

function loadGraduationCandidatesView() {
  if (!graduationCandidatesControlsBound_) {
    graduationCandidatesControlsBound_ = true;
    setupGraduationCandidatesControls_();
  }

  setRouteLoading('graduationCandidates', true);
  google.script.run.withSuccessHandler(function (candidates) {
    graduationCandidatesData_ = Array.isArray(candidates) ? candidates : [];
    graduationCandidatesPage_ = 1;
    graduationCandidatesSelected_ = {};
    renderGraduationCandidatesTable_();
    setRouteLoading('graduationCandidates', false);
  }).withFailureHandler(function (err) {
    console.error('تعذّر تحميل بيانات الطلاب', err);
    var tb = document.getElementById('graduationCandidatesRows');
    if (tb) tb.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--danger)">تعذّر تحميل القائمة</td></tr>';
    setRouteLoading('graduationCandidates', false);
  }).getGraduationCandidates(getCurrentUserCpr());

  // تُجلَب بالتوازي (لا تؤخّر ظهور الجدول) لتكون جاهزة فور ضغط أي رقم نسبة — راجع
  // ensureStudentDetailMapsLoaded_ أعلاه.
  ensureStudentDetailMapsLoaded_(function () {});
}

function setupGraduationCandidatesControls_() {
  var refreshBtn = document.getElementById('refreshGraduationCandidatesBtn');
  if (refreshBtn) refreshBtn.addEventListener('click', loadGraduationCandidatesView);

  var stageGroup = document.getElementById('gradCandStageFilterGroup');
  if (stageGroup) stageGroup.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    stageGroup.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    graduationCandidatesStageFilter_ = btn.getAttribute('data-filter');
    graduationCandidatesPage_ = 1;
    renderGraduationCandidatesTable_();
  });

  var genderGroup = document.getElementById('gradCandGenderFilterGroup');
  if (genderGroup) genderGroup.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    genderGroup.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    graduationCandidatesGenderFilter_ = btn.getAttribute('data-filter');
    graduationCandidatesPage_ = 1;
    renderGraduationCandidatesTable_();
  });

  var searchInp = document.getElementById('gradCandSearchInput');
  if (searchInp) searchInp.addEventListener('input', function () { graduationCandidatesPage_ = 1; renderGraduationCandidatesTable_(); });

  // نسختان من عناصر التحكم (أعلى الجدول وأسفله) تبقيان متزامنتين دومًا — أي تغيير من إحداهما
  // يُحدِّث الحالة المشتركة ويُعيد رسم الجدول، الذي بدوره يُحدِّث قيمة كلا العنصرين معًا.
  ['gradCand-page-size', 'gradCand-page-size-top'].forEach(function (id) {
    var sel = document.getElementById(id);
    if (!sel) return;
    sel.value = String(graduationCandidatesPageSize_);
    sel.addEventListener('change', function () {
      graduationCandidatesPageSize_ = sel.value === 'all' ? 'all' : (parseInt(sel.value, 10) || 50);
      graduationCandidatesPage_ = 1;
      renderGraduationCandidatesTable_();
    });
  });

  var table = document.getElementById('graduationCandidatesTable');
  if (table) table.querySelectorAll('th[data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      var field = th.getAttribute('data-sort');
      if (graduationCandidatesSortField_ === field) {
        graduationCandidatesSortDir_ = graduationCandidatesSortDir_ === 'asc' ? 'desc' : 'asc';
      } else {
        graduationCandidatesSortField_ = field;
        // أعمدة النسب (حضور/نجاح/تسميع): الأعلى أولًا عند أول ضغطة على العمود، بخلاف عمود
        // الاسم النصّي الذي يبدأ أبجديًا تصاعديًا — بحسب طلب "ترتيب الطلاب بحسب أعلاهم درجات".
        graduationCandidatesSortDir_ = GRAD_NUMERIC_SORT_FIELDS_.indexOf(field) !== -1 ? 'desc' : 'asc';
      }
      updateSortIndicator('graduationCandidatesTable', graduationCandidatesSortField_, graduationCandidatesSortDir_);
      graduationCandidatesPage_ = 1;
      renderGraduationCandidatesTable_();
    });
  });

  // "تحديد الكل": يشمل كل من اجتاز ولم تصدر شهادته من كل النتائج المطابقة للفلاتر الحالية —
  // عبر كل صفحات الجدول، لا الصفوف المعروضة فعليًا بالصفحة الحالية وحدها.
  var selectAllCb = document.getElementById('gradCandSelectAll');
  if (selectAllCb) selectAllCb.addEventListener('change', function () {
    var checkNow = selectAllCb.checked;
    getFilteredGraduationCandidates_().forEach(function (c) {
      if (!c.meetsAllMandatory || c.certificateIssued) return;
      var key = gradCandSelectionKey(c.cpr, c.stageIndex);
      if (checkNow) graduationCandidatesSelected_[key] = true;
      else delete graduationCandidatesSelected_[key];
    });
    document.querySelectorAll('#graduationCandidatesRows .gradCandCheck:not(:disabled)').forEach(function (cb) {
      cb.checked = !!graduationCandidatesSelected_[gradCandSelectionKey(cb.getAttribute('data-cpr'), cb.getAttribute('data-stage'))];
    });
    updateIssueSelectedCertsBtnState_();
  });

  var issueBtn = document.getElementById('issueSelectedCertsBtn');
  if (issueBtn) issueBtn.addEventListener('click', issueSelectedStageCertificates_);

  var exportBtn = document.getElementById('exportGraduationCandidatesBtn');
  if (exportBtn) exportBtn.addEventListener('click', exportGraduationCandidatesToExcel);
}

function updateGraduationCandidatesStageCounts_() {
  var setText = function (id, n) { var el = document.getElementById(id); if (el) el.textContent = n; };
  setText('gradCandStageCount-all', graduationCandidatesData_.length);
  [0, 1, 2, 3].forEach(function (idx) {
    setText('gradCandStageCount-' + idx, graduationCandidatesData_.filter(function (s) { return +s.stageIndex === idx; }).length);
  });
}

function getFilteredGraduationCandidates_() {
  var rows = graduationCandidatesData_.slice();
  if (graduationCandidatesStageFilter_ !== 'all') rows = rows.filter(function (s) { return String(s.stageIndex) === graduationCandidatesStageFilter_; });
  if (graduationCandidatesGenderFilter_ !== 'all') rows = rows.filter(function (s) { return s.gender === graduationCandidatesGenderFilter_; });
  var q = (document.getElementById('gradCandSearchInput').value || '').trim().toLowerCase();
  if (q) rows = rows.filter(function (s) { return String(s.name || '').toLowerCase().indexOf(q) !== -1; });

  var field = graduationCandidatesSortField_, dir = graduationCandidatesSortDir_ === 'desc' ? -1 : 1;
  if (GRAD_NUMERIC_SORT_FIELDS_.indexOf(field) !== -1) {
    // ترتيب رقمي (نسبة معيار مفرد، أو متوسط المعايير الإلزامية) لا أبجديًا — من لا نسبة/متوسط
    // له يبقى دومًا بآخر الترتيب بصرف النظر عن الاتجاه، بدل أن يتصدَّر القائمة زورًا عند التصاعدي.
    var getValue = field === 'mandatoryAvg' ? getGraduationCandidateMandatoryAverage : function (c) { return getGraduationCandidateCriterionPercent(c, field); };
    rows.sort(function (a, b) {
      var pa = getValue(a), pb = getValue(b);
      if (pa === null && pb === null) return 0;
      if (pa === null) return 1;
      if (pb === null) return -1;
      return (pa - pb) * dir;
    });
  } else {
    rows.sort(function (a, b) { return String(a[field] || '').localeCompare(String(b[field] || ''), 'ar') * dir; });
  }
  return rows;
}

function getGraduationCandidateCriterionPercent(candidate, key) {
  var crit = (candidate.criteria || []).find(function (x) { return x.criterionKey === key; });
  return crit && typeof crit.percent === 'number' ? crit.percent : null;
}

// متوسط نسب المعايير الإلزامية فقط لهذا الطالب (تُستبعَد المعايير غير الإلزامية، ومن لا نسبة له
// بعد بين المعايير الإلزامية أيضًا كي لا يُخفِض المتوسط زورًا قبل توفّر بياناته). null لو لم يكن
// هناك أي معيار إلزامي بنسبة معروفة بعد.
function getGraduationCandidateMandatoryAverage(candidate) {
  var percents = (candidate.criteria || [])
    .filter(function (c) { return c.isMandatory && typeof c.percent === 'number'; })
    .map(function (c) { return c.percent; });
  if (!percents.length) return null;
  var sum = percents.reduce(function (a, b) { return a + b; }, 0);
  return Math.round((sum / percents.length) * 10) / 10;
}

function graduationMandatoryAverageCellHtml(candidate) {
  var avg = getGraduationCandidateMandatoryAverage(candidate);
  var text = typeof avg === 'number' ? (avg + '%') : '—';
  return '<td><strong>' + text + '</strong></td>';
}

// تصدير كل النتائج المطابقة للفلاتر الحالية (مرحلة/جنس/بحث) — لا صفحة الجدول المعروضة حاليًا
// فقط — إلى ملف Excel، عبر محرك التصدير الموحَّد exportRowsToExcel (export-js.html).
function exportGraduationCandidatesToExcel() {
  var rows = getFilteredGraduationCandidates_();
  if (!rows.length) { alertMSG('لا يوجد بيانات لتصديرها', 'warning'); return; }

  var excelRows = rows.map(function (c) {
    var row = { 'الطالب': c.name, 'الرقم الشخصي': c.cpr, 'المرحلة': getLevelName(c.stageIndex) };
    GRAD_CRITERIA_KEYS_.forEach(function (k) {
      var percent = getGraduationCandidateCriterionPercent(c, k);
      var crit = (c.criteria || []).find(function (x) { return x.criterionKey === k; });
      var label = (crit && crit.label) || k;
      row[label] = typeof percent === 'number' ? (percent + '%') : '—';
    });
    var avg = getGraduationCandidateMandatoryAverage(c);
    row['متوسط النسب الإلزامية'] = typeof avg === 'number' ? (avg + '%') : '—';
    row['الحالة'] = c.meetsAllMandatory ? (c.certificateIssued ? 'مجتاز (صدرت الشهادة)' : 'مجتاز') : 'غير مجتاز';
    // خلية رابط قابلة للنقر تفتح محادثة واتساب مباشرة مع الطالب (exportRowsToExcel تدعم
    // {text, link} كقيمة عمود خصيصًا لهذا). بلا رابط لو تعذّر تحديد رقم دولي صالح من phone.
    var waNumber = toInternationalWhatsAppNumber(c.phone);
    row['واتساب'] = waNumber ? { text: '💬 واتساب', link: 'https://wa.me/' + waNumber } : '—';
    return row;
  });

  exportRowsToExcel({ title: 'مرشّحو الاجتياز', rows: excelRows, filename: 'مرشحو_الاجتياز' });
}

// كل معيار مرتبط بنفس نافذة التفاصيل التي يفتحها الرقم المقابل من "قوائم الطلاب" (بطلب
// المستخدم صراحةً "عاوز كل رقم يؤدي نفس المهمة من صفحة الطلاب") — openAttendDetails/
// openExamDetails/openRecitDetails (كلها بهذا الملف)، وتعتمد على allStudentsData/
// studentsAttendByCpr/studentsAnswersByCpr/studentsRecitByCpr المُحمَّلة عبر
// ensureStudentDetailMapsLoaded_ أعلاه.
var GRAD_CRITERION_DETAIL_FN_ = { attendance: 'openAttendDetails', examPassRate: 'openExamDetails', recitationRate: 'openRecitDetails' };

function graduationCriterionCellHtml_(candidate, key) {
  var c = (candidate.criteria || []).find(function (x) { return x.criterionKey === key; });
  var fn = GRAD_CRITERION_DETAIL_FN_[key];
  var cprAttr = escapeHtml(String(candidate.cpr));
  // typeof === 'number' بدل === null فقط: يحمي من أي قيمة غير رقمية تصل من الخادم (null أو
  // undefined بسبب إسقاط صامت بقناة google.script.run) بعرض شرطة بدل "undefined%".
  var hasPercent = c && typeof c.percent === 'number';
  var color = hasPercent ? (c.met ? 'var(--green, #1a9e5c)' : 'var(--danger, #dc3545)') : '#b7bec5';
  var text = hasPercent ? (c.percent + '%') : '—';
  return '<td><button class="text-button" type="button" style="color:' + color + ';font-weight:600;" onclick="' + fn + '(\'' + cprAttr + '\')">' + text + '</button>' + (c && c.isMandatory ? ' <small>(إلزامي)</small>' : '') + '</td>';
}

function renderGraduationCandidatesTable_() {
  var tbody = document.getElementById('graduationCandidatesRows');
  if (!tbody) return;
  updateGraduationCandidatesStageCounts_();

  var fullData = getFilteredGraduationCandidates_();
  ['gradCand-visible-count', 'gradCand-visible-count-top'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.textContent = fullData.length;
  });

  // 'all' = بلا ترقيم صفحات (صفحة واحدة تضم كل النتائج) — نمرّر حجم صفحة فعّال لدالة الترقيم
  // العامة بدل النص 'all' مباشرة، لأنها تفترض رقمًا لحساب عدد الصفحات.
  var pageSizeIsAll = graduationCandidatesPageSize_ === 'all';
  var effectivePageSize = pageSizeIsAll ? Math.max(fullData.length, 1) : graduationCandidatesPageSize_;

  ['gradCandPagination', 'gradCandPaginationTop'].forEach(function (containerId) {
    renderPagination(containerId, fullData.length, effectivePageSize, graduationCandidatesPage_, function (page) {
      graduationCandidatesPage_ = page; renderGraduationCandidatesTable_();
    });
  });

  if (!fullData.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--muted)">لا يوجد طلاب مطابقون</td></tr>';
    updateIssueSelectedCertsBtnState_();
    updateGradCandSelectAllHeaderState();
    return;
  }

  var totalPages = pageSizeIsAll ? 1 : Math.max(1, Math.ceil(fullData.length / graduationCandidatesPageSize_));
  if (graduationCandidatesPage_ > totalPages) graduationCandidatesPage_ = totalPages;
  var pageRows = pageSizeIsAll ? fullData : fullData.slice((graduationCandidatesPage_ - 1) * graduationCandidatesPageSize_, graduationCandidatesPage_ * graduationCandidatesPageSize_);

  tbody.innerHTML = pageRows.map(function (c) {
    var canSelect = c.meetsAllMandatory && !c.certificateIssued;
    var isChecked = canSelect && !!graduationCandidatesSelected_[gradCandSelectionKey(c.cpr, c.stageIndex)];
    var statusHtml = c.meetsAllMandatory
      ? '<span style="color:var(--green,#1a9e5c);font-weight:600;">مجتاز' + (c.certificateIssued ? ' <small>(صدرت الشهادة)</small>' : '') + '</span>'
      : '<span style="color:var(--muted);">غير مجتاز</span>';
    return '<tr>' +
      '<td><input type="checkbox" class="gradCandCheck" data-cpr="' + escapeHtml(c.cpr) + '" data-stage="' + c.stageIndex + '"' + (canSelect ? '' : ' disabled') + (isChecked ? ' checked' : '') + '></td>' +
      '<td>' + personCellHtml(c.name, c.cpr, null, c.avatarUrl) + '</td>' +
      '<td>' + stageBadgeHtml(c.stageIndex) + '</td>' +
      GRAD_CRITERIA_KEYS_.map(function (k) { return graduationCriterionCellHtml_(c, k); }).join('') +
      graduationMandatoryAverageCellHtml(c) +
      '<td>' + statusHtml + '</td>' +
      '</tr>';
  }).join('');
  refreshIcons();

  tbody.querySelectorAll('.gradCandCheck').forEach(function (cb) {
    cb.addEventListener('change', function () {
      var key = gradCandSelectionKey(cb.getAttribute('data-cpr'), cb.getAttribute('data-stage'));
      if (cb.checked) graduationCandidatesSelected_[key] = true;
      else delete graduationCandidatesSelected_[key];
      updateIssueSelectedCertsBtnState_();
      updateGradCandSelectAllHeaderState();
    });
  });
  updateIssueSelectedCertsBtnState_();
  updateGradCandSelectAllHeaderState();
}

// نسبة المحدَّدين فعليًا (عبر كل الصفحات) من كل الصفوف القابلة للتحديد ضمن الفلاتر الحالية.

function updateStageCertProgress_(done, total, title, detail) {

function stageCertResultHtml_(stats, whatsAppResult) {
  var rows = [
    { icon: 'circle-check', label: 'شهادات جديدة', value: stats.issued, tone: 'success' },
    { icon: 'rotate-ccw', label: 'موجودة مسبقًا', value: stats.alreadyIssued, tone: '' }
  ];
  if (stats.sendEmail) rows.push({ icon: 'mail-check', label: 'إيميلات أُرسلت', value: stats.emailSent, tone: stats.emailSkipped ? 'warning' : 'success', note: stats.emailSkipped ? (stats.emailSkipped + ' لم تُرسل') : '' });
  if (stats.sendWhats) rows.push({ icon: 'message-circle', label: 'رسائل واتساب مجدولة', value: whatsAppResult && whatsAppResult.ok ? (+whatsAppResult.total || 0) : 0, tone: !stats.issued ? '' : (whatsAppResult && whatsAppResult.ok ? 'success' : 'warning'), note: !stats.issued ? 'لا توجد شهادات جديدة للإشعار' : (whatsAppResult && whatsAppResult.skipped && whatsAppResult.skipped.length ? (whatsAppResult.skipped.length + ' بلا رقم صالح') : '') });
  if (stats.failed.length) rows.push({ icon: 'triangle-alert', label: 'تعذّر إصدارها', value: stats.failed.length, tone: 'danger' });

  var failedHtml = stats.failed.length ? '<div class="stage-cert-result-errors"><b>تفاصيل الحالات غير المكتملة</b>' + stats.failed.map(function (item) {
    return '<span><strong>' + escapeHtml(item.name) + '</strong><small>' + escapeHtml(item.reason) + '</small></span>';
  }).join('') + '</div>' : '';
  var whatsappError = stats.sendWhats && whatsAppResult && !whatsAppResult.ok
    ? '<div class="stage-cert-result-warning"><i data-icon="triangle-alert"></i><span>تعذّرت جدولة واتساب: ' + escapeHtml(whatsAppResult.reason || 'خطأ غير معروف') + '</span></div>' : '';

  return '<div class="stage-cert-result" dir="rtl"><div class="stage-cert-result-grid">' + rows.map(function (row) {
    return '<span class="' + row.tone + '"><i data-icon="' + row.icon + '"></i><small>' + row.label + '</small><b>' + row.value + '</b>' + (row.note ? '<em>' + row.note + '</em>' : '') + '</span>';
  }).join('') + '</div>' + whatsappError + failedHtml + '</div>';
}

function issueSelectedStageCertificates_() {
  // التحديد قد يشمل طلابًا من صفحات أخرى؛ المصدر الموثوق هنا هو حالة التحديد العامة لا DOM الصفحة.
  var checked = graduationCandidatesData_.filter(function (c) { return graduationCandidatesSelected_[gradCandSelectionKey(c.cpr, c.stageIndex)]; });
  if (!checked.length) return;

  var issueBtn = document.getElementById('issueSelectedCertsBtn');
  if (issueBtn) {
    issueBtn.disabled = true;
    issueBtn.innerHTML = '<i data-icon="loader-circle"></i>جاري تحميل قالب الرسالة...';
    refreshIcons();
  }
  google.script.run.withSuccessHandler(function (res) {
    updateIssueSelectedCertsBtnState_();
    if (!res || res.error || !res.ok) {
      alertMSG((res && res.message) || 'تعذّر تحميل قالب شهادة اجتياز المرحلة', 'error');
      return;
    }
    openStageCertificateIssueModal_(checked, res.body);
  }).withFailureHandler(function (err) {
    updateIssueSelectedCertsBtnState_();
    alertMSG('تعذّر تحميل قالب شهادة اجتياز المرحلة: ' + String(err && err.message || err), 'error');
  }).getStageCertificateMessageTemplate(getCurrentUserCpr());
}

function openStageCertificateIssueModal_(checked, templateBody) {
  Swal.fire({
    title: 'إصدار شهادات الاجتياز',
    width: 680,
    customClass: { popup: 'stage-cert-issue-popup', confirmButton: 'stage-cert-confirm', cancelButton: 'stage-cert-cancel' },
    html: stageCertIssueModalHtml_(checked, templateBody),
    focusConfirm: false,
    showCancelButton: true,
    buttonsStyling: false,
    confirmButtonText: checked.length === 1 ? 'إصدار الشهادة' : 'إصدار ' + checked.length + ' شهادات',
    cancelButtonText: 'رجوع',
    didOpen: function () {
      refreshIcons();
      var popup = Swal.getPopup();
      var msgField = popup.querySelector('#certNotifyMessageField');
      var messageInput = popup.querySelector('#certNotifyMessageText');
      var messageCount = popup.querySelector('#certNotifyMessageCount');
      var radios = popup.querySelectorAll('input[name="certNotifyChannel"]');
      function sync() {
        var selected = popup.querySelector('input[name="certNotifyChannel"]:checked');
        msgField.hidden = !selected || selected.value === 'none';
        messageCount.textContent = messageInput.value.length + ' حرف';
      }
      radios.forEach(function (radio) { radio.addEventListener('change', sync); });
      messageInput.addEventListener('input', sync);
      popup.querySelectorAll('[data-cert-token]').forEach(function (button) {
        button.addEventListener('click', function () {
          var token = button.getAttribute('data-cert-token');
          var start = messageInput.selectionStart == null ? messageInput.value.length : messageInput.selectionStart;
          var end = messageInput.selectionEnd == null ? start : messageInput.selectionEnd;
          messageInput.setRangeText(token, start, end, 'end');
          messageInput.dispatchEvent(new Event('input', { bubbles: true }));
          messageInput.focus();
        });
      });
      sync();
    },
    preConfirm: function () {
      var popup = Swal.getPopup();
      var selected = popup.querySelector('input[name="certNotifyChannel"]:checked');
      var messageInput = popup.querySelector('#certNotifyMessageText');
      var channel = selected ? selected.value : 'none';
      var message = messageInput.value.trim();
      if (channel !== 'none' && !message) {
        popup.querySelector('#certNotifyMessageField').hidden = false;
        Swal.showValidationMessage('اكتب الرسالة المرافقة قبل اختيار الإرسال');
        messageInput.focus();
        return false;
      }
      return { channel: channel, message: message };
    }
  }).then(function (result) {
    if (!result.isConfirmed) return;
    var channel = result.value.channel;
    var message = result.value.message;
    var sendEmail = channel === 'email' || channel === 'both';
    var sendWhats = channel === 'whatsapp' || channel === 'both';
    var userCpr = getCurrentUserCpr();
    var issueBtn = document.getElementById('issueSelectedCertsBtn');
    var total = checked.length;
    var whatsappItems = [];
    var stats = { issued: 0, alreadyIssued: 0, failed: [], emailSent: 0, emailSkipped: 0, sendEmail: sendEmail, sendWhats: sendWhats };
    if (issueBtn) issueBtn.disabled = true;
    openStageCertProgressModal_(total);

    function finishUp(whatsAppResult) {
      var hasWarnings = stats.failed.length || stats.emailSkipped || (sendWhats && whatsAppResult && !whatsAppResult.ok) || (whatsAppResult && whatsAppResult.skipped && whatsAppResult.skipped.length);
      graduationCandidatesSelected_ = {};
      updateIssueSelectedCertsBtnState_();
      Swal.fire({
        icon: hasWarnings ? 'warning' : 'success',
        title: hasWarnings ? 'اكتملت العملية مع ملاحظات' : 'تم إصدار الشهادات',
        width: 620,
        customClass: { popup: 'stage-cert-result-popup', confirmButton: 'stage-cert-confirm' },
        buttonsStyling: false,
        confirmButtonText: 'تم',
        html: stageCertResultHtml_(stats, whatsAppResult),
        didOpen: function () { refreshIcons(); }
      });
      loadGraduationCandidatesView();
    }

    function processNext(i) {
      if (i >= checked.length) {
        updateStageCertProgress_(total, total, sendWhats && whatsappItems.length ? 'جاري جدولة رسائل واتساب...' : 'اكتمل إصدار الشهادات', sendWhats && whatsappItems.length ? 'سيبدأ الإرسال تدريجيًا عبر طابور الرسائل.' : 'نجهّز ملخص العملية.');
        if (sendWhats && whatsappItems.length) {
          google.script.run.withSuccessHandler(function (res) { finishUp(res); })
            .withFailureHandler(function (err) { finishUp({ ok: false, reason: String(err && err.message || err || 'فشل الاتصال بالخادم') }); })
            .scheduleStageCertWhatsAppNotify(userCpr, whatsappItems, message);
        } else {
          finishUp(null);
        }
        return;
      }

      var c = checked[i];
      updateStageCertProgress_(i, total, 'إصدار شهادة ' + c.name, getLevelName(c.stageIndex) + ' — الشهادة ' + (i + 1) + ' من ' + total);
      if (issueBtn) issueBtn.innerHTML = '<i data-icon="award"></i>جارٍ الإصدار... (' + (i + 1) + '/' + total + ')';
      refreshIcons();
      var notify = sendEmail ? { email: true, messageTemplate: message } : null;
      google.script.run.withSuccessHandler(function (res) {
        if (!res || res.error) {
          stats.failed.push({ name: c.name, reason: (res && res.message) || 'تعذّر إصدار الشهادة' });
        } else if (res.alreadyIssued) {
          stats.alreadyIssued++;
        } else {
          stats.issued++;
          if (sendEmail) {
            if (res.emailSent) stats.emailSent++;
            else stats.emailSkipped++;
          }
          if (sendWhats) whatsappItems.push({ cpr: c.cpr, stageIndex: c.stageIndex, link: res.url });
        }
        processNext(i + 1);
      }).withFailureHandler(function (err) {
        stats.failed.push({ name: c.name, reason: String(err && err.message || err || 'فشل الاتصال بالخادم') });
        processNext(i + 1);
      }).issueStageCertificate(userCpr, c.cpr, c.stageIndex, notify);
    }
    processNext(0);
  });
}
