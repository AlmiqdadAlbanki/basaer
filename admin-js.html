}

function renderFcmRecipientsTable_() {
  var tb = document.getElementById('fcmRecipientsRows');
  if (!tb) return;
  var rows = getFilteredFcmRecipients_();
  var selectAllCb = document.getElementById('fcmSelectAll');
  if (selectAllCb) selectAllCb.checked = false;

  var filteredEl = document.getElementById('fcmFilteredCount');
  if (filteredEl) filteredEl.textContent = rows.length;
  var notActivatedEl = document.getElementById('fcmNotActivatedCount');
  // "لم يفعّلوا الإشعارات" هنا تعني: من قائمة الطلاب المطابقين لنفس فلتر المرحلة/الجنس، كم ليس
  // بينهم أصلًا (fcmData_ مقتصرة على المفعّلين فقط) — تقدير بالمقارنة مع إجمالي الطلاب بنفس
  // المرحلة لو توفّر، وإلا تُترك صفرًا (لا مبالغة بادّعاء رقم غير مؤكَّد).
  if (notActivatedEl) notActivatedEl.textContent = '—';

  if (!rows.length) {
    tb.innerHTML = '<tr class="message-table-state"><td colspan="3"><span class="message-state compact"><i data-icon="search"></i><strong>لا يوجد مستلمون مطابقون</strong><small>غيّر الفلاتر، أو لم يفعّل أي طالب الإشعارات بعد ضمن هذا النطاق.</small></span></td></tr>';
    tb.dataset.rowsJson = '[]';
    updateFcmSelectedCount_();
    refreshIcons();
    return;
  }

  tb.innerHTML = rows.map(function (r, i) {
    return '<tr>' +
      '<td data-label="تحديد"><input type="checkbox" class="fcm-check" data-idx="' + i + '" aria-label="تحديد ' + escapeHtml(r.name || 'المستلم') + '"></td>' +
      '<td data-label="الاسم"><strong>' + escapeHtml(r.name || '—') + '</strong></td>' +
      '<td data-label="الحالة"><span class="message-status-badge sent"><i data-icon="bell"></i> مُفعَّل</span></td>' +
    '</tr>';
  }).join('');

  tb.dataset.rowsJson = JSON.stringify(rows);
  tb.querySelectorAll('.fcm-check').forEach(function (cb) { cb.addEventListener('change', updateFcmSelectedCount_); });
  updateFcmSelectedCount_();
  refreshIcons();
}

function getSelectedFcmRecipients_() {
  var tb = document.getElementById('fcmRecipientsRows');
  if (!tb || !tb.dataset.rowsJson) return [];
  var rows = JSON.parse(tb.dataset.rowsJson);
  var checkedIdx = Array.from(document.querySelectorAll('#fcmRecipientsRows .fcm-check:checked')).map(function (cb) { return +cb.getAttribute('data-idx'); });
  return checkedIdx.map(function (i) { return rows[i]; }).filter(Boolean);
}

function updateFcmSelectedCount_() {
  var count = getSelectedFcmRecipients_().length;
  var el = document.getElementById('fcmSelectedCount');
  if (el) el.textContent = count;
  var checks = Array.from(document.querySelectorAll('#fcmRecipientsRows .fcm-check'));
  var selectAll = document.getElementById('fcmSelectAll');
  if (selectAll) {
    selectAll.checked = checks.length > 0 && checks.every(function (cb) { return cb.checked; });
    selectAll.indeterminate = checks.some(function (cb) { return cb.checked; }) && !selectAll.checked;
  }
  updateFcmSendState_();
  updateFcmEstimate_();
}

function updateFcmCharacterCount_() {
  var input = document.getElementById('fcmBodyText');
  var counter = document.getElementById('fcmCharacterCount');
  if (counter) counter.textContent = String(input ? input.value.length : 0) + ' حرف';
  updateFcmSendState_();
}

function updateFcmSendState_() {
  var sendBtn = document.getElementById('fcmSendBtn');
  if (!sendBtn) return;
  var title = (document.getElementById('fcmTitleInput') || {}).value || '';
  var body = (document.getElementById('fcmBodyText') || {}).value || '';
  sendBtn.disabled = getSelectedFcmRecipients_().length === 0 || !title.trim() || !body.trim();
}

function updateFcmEstimate_() {
  var count = getSelectedFcmRecipients_().length;
  var estEl = document.getElementById('fcmEstimate');
  if (!estEl) return;
  if (!count) { estEl.innerHTML = ''; return; }

  var perMsg = Math.max(2, parseInt(document.getElementById('fcmPerMessageDelay').value, 10) || 2);
  var batchSize = Math.max(1, parseInt(document.getElementById('fcmBatchSize').value, 10) || 1);
  var betweenBatches = Math.max(0, parseInt(document.getElementById('fcmBetweenBatches').value, 10) || 0);

  var batches = Math.ceil(count / batchSize);
  var totalSeconds = Math.max(0, (count - batches) * perMsg + Math.max(0, batches - 1) * betweenBatches);

  estEl.innerHTML = '<i data-icon="triangle-alert"></i>الوقت التقديري لإتمام الإرسال لـ' + count + (count === 1 ? ' مستلم' : ' مستلمًا') +
    ': ' + formatEstimateDuration_(totalSeconds) + ' (تقريبي غير مضمون بدقة — يعتمد على استجابة FCM ودقّة مُشغِّلات جوجل الزمنية)';
  refreshIcons();
}

function sendFcmBroadcastNow_() {
  var selected = getSelectedFcmRecipients_();
  if (!selected.length) return;

  var title = document.getElementById('fcmTitleInput').value.trim();
  var body = document.getElementById('fcmBodyText').value.trim();
  if (!title) { alertMSG('عنوان الإشعار مطلوب', 'error'); return; }
  if (!body) { alertMSG('نص الإشعار مطلوب', 'error'); return; }

  var batchSize = Math.max(1, parseInt(document.getElementById('fcmBatchSize').value, 10) || 1);
  var perMessageDelaySec = Math.max(2, parseInt(document.getElementById('fcmPerMessageDelay').value, 10) || 2);
  var betweenBatchesSec = Math.max(0, parseInt(document.getElementById('fcmBetweenBatches').value, 10) || 0);
  var scheduleMode = document.getElementById('fcmScheduleMode').value;
  var scheduledAt = '';
  if (scheduleMode === 'later') {
    var raw = document.getElementById('fcmScheduleAt').value;
    if (!raw) { alertMSG('يرجى تحديد موعد الإرسال المستقبلي', 'error'); return; }
    scheduledAt = new Date(raw).toISOString();
  }

  var recipients = selected.map(function (r) { return { name: r.name, cpr: r.cpr }; });

  Swal.fire({
    title: 'تأكيد الإرسال',
    html: 'سيتم إرسال هذا الإشعار إلى <strong>' + selected.length + '</strong> طالب' + (document.getElementById('fcmEstimate').textContent ? '<br><small>' + escapeHtml(document.getElementById('fcmEstimate').textContent) + '</small>' : '') + '. هل أنت متأكد؟',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: scheduleMode === 'later' ? 'جدولة' : 'إرسال',
    cancelButtonText: 'إلغاء'
  }).then(function (result) {
    if (!result.isConfirmed) return;
    var sendBtn = document.getElementById('fcmSendBtn');
    sendBtn.disabled = true;
    google.script.run.withSuccessHandler(function (res) {
      sendBtn.disabled = false;
      if (!res || res.ok === false || res.error) { alertMSG((res && (res.reason || res.message)) || 'تعذّر بدء الإرسال', 'error'); return; }
      alertMSG(scheduleMode === 'later' ? 'تمت جدولة الحملة بنجاح' : 'بدأ إرسال الإشعارات في الخلفية', 'success');
      document.getElementById('fcmTitleInput').value = '';
      document.getElementById('fcmBodyText').value = '';
      updateFcmCharacterCount_();
      updateFcmSendState_();
      updateFcmEstimate_();
      refreshFCMQueueGlobalBanner_();
    }).withFailureHandler(function (err) {
      sendBtn.disabled = false;
      alertMSG('تعذّر بدء الإرسال: ' + err, 'error');
    }).prepareAndScheduleFcmBroadcast(getCurrentUserCpr(), {
      recipients: recipients,
      title: title,
      body: body,
      batchSize: batchSize,
      perMessageDelaySec: perMessageDelaySec,
      betweenBatchesSec: betweenBatchesSec,
      scheduledAt: scheduledAt
    });
  });
}

/* ---------- تبويب: حالة الإرسال (تفصيل كامل داخل الصفحة — راجع الشريط العابر لكل الصفحات
   أسفل الملف لملخّص مضغوط ظاهر من أي صفحة إدارية) — أصبح يدعم قناتين (واتساب/إشعارات) عبر
   messagesStatusChannel_، بنفس عرض الحالة تمامًا لكلتيهما. ---------- */
var messagesStatusChannel_ = 'whatsapp';

function setupMessagesStatusChannelControls_() {
  var group = document.getElementById('messagesStatusChannelGroup');
  if (!group) return;
  group.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-status-channel]');
    if (!btn) return;
    group.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    messagesStatusChannel_ = btn.getAttribute('data-status-channel');
    loadMessagesStatusTab_();
  });
}

function loadMessagesStatusTab_() {
  var panel = document.getElementById('messagesStatusPanel');
  if (panel) {
    panel.innerHTML = '<div class="message-state"><i data-icon="loader-circle"></i><strong>جاري تحميل حالة الإرسال...</strong></div>';
    refreshIcons();
  }
  var onError = function () {
    if (panel) {
      panel.innerHTML = '<div class="message-state error"><i data-icon="triangle-alert"></i><strong>تعذّر تحميل حالة الإرسال</strong><small>أعد المحاولة بعد التحقق من الاتصال.</small></div>';
      refreshIcons();
    }
  };
  if (messagesStatusChannel_ === 'fcm') {
    google.script.run.withSuccessHandler(renderFCMStatusTab_).withFailureHandler(onError).getFCMQueueStatus();
    return;
  }
  // قناة واتساب: فونتي وMeta طابوران مستقلان تمامًا (2026-09-16) — نجلب حالتيهما وقائمتَي
  // طابور الحملات المنتظرة لكليهما بنداءين متوازيين، ونعرض بطاقتين جنبًا إلى جنب دومًا معًا،
  // بلا حاجة لمفتاح تبديل بينهما (كلاهما قد يعملان بالتوازي فعليًا).
  var statuses = null, queues = null;
  var tryRender = function () { if (statuses && queues) renderMessagesStatusTab_(statuses, queues); };
  google.script.run.withSuccessHandler(function (both) { statuses = both; tryRender(); }).withFailureHandler(onError).getWPQueueStatusBoth();
  google.script.run.withSuccessHandler(function (both) { queues = both; tryRender(); }).withFailureHandler(function () { queues = { fonnte: [], meta: [] }; tryRender(); }).getWPCampaignQueueListBoth();
}

function renderFCMStatusTab_(st) {
  var panel = document.getElementById('messagesStatusPanel');
  if (!panel) return;
  if (!st || st.status === 'idle') {
    panel.innerHTML = '<div class="message-state"><i data-icon="send"></i><strong>لا توجد حملة إرسال حاليًا</strong><small>عند إنشاء حملة جديدة سيظهر تقدّمها وتفاصيلها هنا.</small><button class="primary-button" type="button" onclick="activateMessagesTab_(\'notifications\')"><i data-icon="plus"></i>إنشاء حملة</button></div>';
    refreshIcons();
    return;
  }
  panel.innerHTML = renderWPProviderCardHtml_('fcm', st, []);
  refreshIcons();
}

// فونتي وMeta بطاقتان مستقلتان دومًا معًا — كل بطاقة بحالة حملتها الخاصة (لو وُجدت) وطابور
// انتظارها الخاص، بلا أي تأثير متبادل بينهما. راجع مناقشات.md "فصل طابور الحملات بالمزوّد".
function renderMessagesStatusTab_(statuses, queues) {
  var panel = document.getElementById('messagesStatusPanel');
  if (!panel) return;
  var fonnteHtml = renderWPProviderCardHtml_('fonnte', statuses.fonnte, queues.fonnte || []);
  var metaHtml = renderWPProviderCardHtml_('meta', statuses.meta, queues.meta || []);
  panel.innerHTML = '<div class="message-provider-cards" style="display:flex;flex-direction:column;gap:18px;">' + fonnteHtml + metaHtml + '</div>';
  refreshIcons();
}

// يبني بطاقة حالة حملة واحدة (فونتي/Meta/FCM) — دالة مشتركة بدل تكرار نفس الـHTML ثلاث مرات.
function renderWPProviderCardHtml_(provider, st, queueList) {
  var providerLabel = provider === 'meta' ? 'Meta الرسمي' : provider === 'fcm' ? 'إشعارات FCM' : 'Fonnte';
  var queueListHtml = renderWPCampaignQueueListHtml_(provider, queueList);
  if (!st || st.status === 'idle') {
    return '<div class="message-campaign-summary"><div class="message-campaign-head"><div class="message-campaign-identity">' +
      '<span class="message-campaign-icon"><i data-icon="send"></i></span><div><h3>' + escapeHtml(providerLabel) + '</h3>' +
      '<div class="message-campaign-meta"><span class="message-status-badge">لا توجد حملة حاليًا</span></div></div></div></div></div>' + queueListHtml;
  }

  var statusLabel = { scheduled: 'مجدولة', running: 'جارية', stopped: 'مُتوقَّفة/مُلغاة', done: 'مكتملة' }[st.status] || st.status;
  var statusClass = { scheduled: 'scheduled', running: 'running', stopped: 'stopped', done: 'done' }[st.status] || 'running';
  var sent = Number(st.sent) || 0;
  var failed = Number(st.failed) || 0;
  var total = Number(st.total) || 0;
  var remaining = Number(st.remaining) || 0;
  var processed = sent + failed;
  var pct = total > 0 ? Math.min(100, Math.round((processed / total) * 100)) : 0;
  var title = providerLabel + ' — ' + (st.status === 'scheduled' ? 'حملة بانتظار موعد الإرسال' : st.status === 'running' ? 'حملة قيد الإرسال' : st.status === 'done' ? 'اكتملت حملة الإرسال' : 'توقفت حملة الإرسال');
  var campaignDate = st.status === 'scheduled' ? st.scheduledAt : (st.finishedAt || st.startedAt);
  var campaignDateLabel = st.status === 'scheduled' ? 'موعد البدء: ' : ((st.status === 'done' || st.status === 'stopped') ? 'وقت الانتهاء: ' : 'بدأت: ');
  var stopFn = provider === 'fcm' ? 'stopMessagesCampaign_(\'fcm\')' : ('stopMessagesCampaign_(\'' + provider + '\')');
  var html = '<div class="message-campaign-summary">' +
    '<div class="message-campaign-head">' +
      '<div class="message-campaign-identity"><span class="message-campaign-icon"><i data-icon="activity"></i></span><div><h3>' + title + '</h3>' +
        '<div class="message-campaign-meta">' +
          (st.sentBy ? '<span><i data-icon="user-round"></i>بدأها ' + escapeHtml(st.sentBy) + '</span>' : '') +
          (campaignDate ? '<span><i data-icon="calendar-clock"></i>' + campaignDateLabel + escapeHtml(formatDateAr(campaignDate)) + '</span>' : '') +
          '<span class="message-status-badge ' + statusClass + '">' + escapeHtml(statusLabel) + '</span>' +
        '</div></div></div>';
  if (st.status === 'running' || st.status === 'scheduled') {
    html += '<button class="danger-button" type="button" onclick="' + stopFn + '"><i data-icon="x"></i>' + (st.status === 'scheduled' ? 'إلغاء الجدولة' : 'إيقاف الحملة') + '</button>';
  }
  html += '</div>';
  // isStale: الحالة "جارية" لكن بلا أي نبضة حديثة — دليل على توقّف صامت لسلسلة الجدولة (راجع
  // processWPQueueTickCore_ بـwpQueue.js). زر "استئناف" يعيد تشغيل التشغيلة التالية فورًا بدل
  // انتظار Trigger قد لا يكون موجودًا أصلًا. غير مدعوم حاليًا لقناة FCM (بنية حالة منفصلة).
  if (st.status === 'running' && st.isStale && provider !== 'fcm') {
    html += '<div class="warning-note" style="margin:12px 0;"><i data-icon="triangle-alert"></i><span>' +
      'الحملة متوقّفة فعليًا رغم ظهورها "جارية" — لا تقدّم منذ فترة طويلة' + (st.lastError ? (' (آخر خطأ: ' + escapeHtml(st.lastError) + ')') : '') +
      '.</span><button class="secondary-button" type="button" onclick="resumeMessagesCampaign_(\'' + provider + '\', this)" style="margin-inline-start:8px;"><i data-icon="refresh-cw"></i>استئناف الآن</button></div>';
  }
  html += '' +
    '<div class="message-campaign-progress"><div><span>' + (st.status === 'scheduled' ? 'ستبدأ الحملة تلقائيًا في الموعد المحدد' : 'نسبة معالجة المستلمين') + '</span><strong>' + pct + '%</strong></div>' +
      '<div class="message-progress-track"><i class="message-progress-fill" style="width:' + pct + '%"></i></div>' +
    '</div>' +
    '<div class="message-campaign-stats">' +
      '<div class="message-campaign-stat"><small>إجمالي المستلمين</small><strong>' + total + '</strong></div>' +
      '<div class="message-campaign-stat sent"><small>أُرسلت بنجاح</small><strong>' + sent + '</strong></div>' +
      '<div class="message-campaign-stat failed"><small>تعذّر إرسالها</small><strong>' + failed + '</strong></div>' +
      '<div class="message-campaign-stat"><small>متبقٍّ</small><strong>' + remaining + '</strong></div>' +
    '</div>' +
    '<div class="message-campaign-config">' +
      (st.batchSize ? '<span><i data-icon="inbox"></i>حجم الدفعة: ' + Number(st.batchSize) + '</span>' : '') +
      (st.provider === 'meta' && st.metaTemplateName ? '<span><i data-icon="copy"></i>القالب: <b dir="ltr">' + escapeHtml(st.metaTemplateName) + '</b></span>' : '') +
      '<span><i data-icon="timer"></i>بين الرسائل: ' + (Number(st.perMessageDelaySec) || 60) + ' ثانية</span>' +
      '<span><i data-icon="calendar-clock"></i>بين الدفعات: ' + (Number(st.betweenBatchesSec) || 0) + ' ثانية</span>' +
    '</div></div>';

  if (st.failedList && st.failedList.length) {
    html += '<div class="message-campaign-failures"><h4>رسائل تعذّر إرسالها</h4><div class="responsive-table"><table><thead><tr><th>الاسم</th><th>الهاتف/المعرّف</th><th>السبب</th></tr></thead><tbody>' +
      st.failedList.map(function (f) { return '<tr><td data-label="الاسم">' + escapeHtml(f.name || '—') + '</td><td data-label="الهاتف/المعرّف" dir="ltr"><span class="message-target-code">' + escapeHtml(f.target || '—') + '</span></td><td data-label="السبب">' + escapeHtml(f.reason || '—') + '</td></tr>'; }).join('') +
      '</tbody></table></div></div>';
  }

  return html + queueListHtml;
}

// قائمة الحملات المنتظرة بطابور مزوّد بعينه (لا شيء يُعرَض لقناة FCM أو لو الطابور فارغ). كل
// حملة منتظرة تظهر بترتيبها ضمن طابور هذا المزوّد + عدد مستلميها + زر إلغاء.
function renderWPCampaignQueueListHtml_(provider, queueList) {
  if (provider === 'fcm' || !queueList || !queueList.length) return '';
  return '<div class="message-campaign-queue-list" style="margin-top:16px;">' +
    '<h4 style="margin:0 0 10px;">حملات ' + (provider === 'meta' ? 'Meta' : 'Fonnte') + ' بانتظار الدور (' + queueList.length + ')</h4>' +
    queueList.map(function (q) {
      return '<div class="message-campaign-summary" style="margin-bottom:8px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;">' +
        '<div><strong>#' + q.position + '</strong> — ' + escapeHtml(q.label || 'حملة رسائل') + ' <small style="color:var(--muted);">(' + q.total + ' مستلم)</small></div>' +
        '<button class="danger-button" type="button" onclick="cancelQueuedWPCampaign_(\'' + q.queueId + '\', this)"><i data-icon="x"></i>إلغاء</button>' +
        '</div>';
    }).join('') +
    '</div>';
}

function cancelQueuedWPCampaign_(queueId, btn) {
  Swal.fire({ title: 'تأكيد', text: 'هل تريد إلغاء هذه الحملة المنتظرة بالطابور؟', icon: 'warning', showCancelButton: true, confirmButtonText: 'نعم', cancelButtonText: 'تراجع' }).then(function (result) {
    if (!result.isConfirmed) return;
    if (btn) btn.disabled = true;
    google.script.run.withSuccessHandler(function (res) {
      if (res && res.ok) { alertMSG('تم إلغاء الحملة من الطابور', 'success'); loadMessagesStatusTab_(); }
      else { if (btn) btn.disabled = false; alertMSG((res && res.reason) || 'تعذّر الإلغاء', 'error'); }
    }).withFailureHandler(function (err) { if (btn) btn.disabled = false; alertMSG('تعذّر الإلغاء: ' + err, 'error'); }).cancelQueuedWPCampaign(queueId);
  });
}

// provider: 'fonnte'|'meta'|'fcm' — كل بطاقة بزر إيقاف خاص بمزوّدها وحده، لا يؤثر على المزوّد الآخر.
function stopMessagesCampaign_(provider) {
  Swal.fire({ title: 'تأكيد', text: 'هل تريد إيقاف/إلغاء هذه الحملة؟', icon: 'warning', showCancelButton: true, confirmButtonText: 'نعم', cancelButtonText: 'تراجع' }).then(function (result) {
    if (!result.isConfirmed) return;
    var runner = google.script.run.withSuccessHandler(function () {
      alertMSG('تم الإيقاف', 'success');
      loadMessagesStatusTab_();
      refreshWPQueueGlobalBanner_();
      refreshFCMQueueGlobalBanner_();
    }).withFailureHandler(function (err) { alertMSG('تعذّر الإيقاف: ' + err, 'error'); });
    if (provider === 'fcm') runner.stopFCMQueueSend();
    else runner.stopWPQueueSend(provider);
  });
}

// استئناف حملة مزوّد بعينه توقّفت صامتة (راجع isStale أعلاه) — resumeWPQueueSend (wpQueue.js)
// يستدعي تشغيلة هذا المزوّد مباشرة، آمن حتى لو لم تكن الحملة عالقة فعليًا.
// btn: زر "استئناف الآن" نفسه — يُعطَّل فورًا مع مؤشر تحميل واضح أثناء الطلب، لأن الرد أحيانًا
// يتأخر قليلًا (نفس نمط submitBtn بـmanualAttendSubmitBtn أعلاه) فقد يضغطه المستخدم أكثر من
// مرة ظنًّا أن الضغطة الأولى لم تُسجَّل، مما يستدعي resumeWPQueueSend عدة مرات بلا داعٍ (آمن
// فعليًا بفضل القفل الداخلي، لكن بلا فائدة ويُربك المستخدم).
function resumeMessagesCampaign_(provider, btn) {
  var defaultHtml = btn ? btn.innerHTML : '';
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارٍ الاستئناف...';
  }
  google.script.run.withSuccessHandler(function (res) {
    if (btn) { btn.disabled = false; btn.innerHTML = defaultHtml; }
    if (res && res.ok) alertMSG('تم استئناف الحملة', 'success'); else alertMSG((res && res.reason) || 'تعذّر الاستئناف', 'error');
    loadMessagesStatusTab_();
    refreshWPQueueGlobalBanner_();
  }).withFailureHandler(function (err) {
    if (btn) { btn.disabled = false; btn.innerHTML = defaultHtml; }
    alertMSG('تعذّر الاستئناف: ' + err, 'error');
  }).resumeWPQueueSend(provider);
}

/* ---------- تبويب: سجل الإرسال ---------- */
var messageLogData_ = [];
var messageLogDeliveryPollTimer_ = null;
var MESSAGE_LOG_TYPE_LABELS_ = {
  stageCertificate: 'شهادة اجتياز مرحلة', stageCert: 'شهادة اجتياز مرحلة', examCertificate: 'شهادة اختبار', greetingCard: 'كارت تهنئة', examDisconnect: 'انقطاع اتصال',
  examReadinessAlert: 'تنبيه جاهزية', broadcast: 'رسالة جماعية', connectionTest: 'اختبار اتصال',
  fcmBroadcast: 'إشعار جماعي'
};

function loadMessageLogTab_() {
  var tb = document.getElementById('messageLogRows');
  if (tb) {
    tb.innerHTML = '<tr class="message-table-state"><td colspan="8"><span class="message-state compact"><i data-icon="loader-circle"></i><strong>جاري تحميل السجل...</strong></span></td></tr>';
    refreshIcons();
  }
  google.script.run.withSuccessHandler(function (list) {
    messageLogData_ = Array.isArray(list) ? list : [];
    renderMessageLogTable_();
    loadMetaMessageDeliveryStatuses_();
  }).withFailureHandler(function () {
    if (tb) {
      tb.innerHTML = '<tr class="message-table-state"><td colspan="8"><span class="message-state compact error"><i data-icon="triangle-alert"></i><strong>تعذّر تحميل سجل الإرسال</strong></span></td></tr>';
      refreshIcons();
    }
  }).getMessageLogList(200);
}

// يجلب حالات Meta اللاحقة من Firebase بواسطة wamid المخزن في externalMessageId. سجل Apps Script
// يبقى مصدر بيانات الحملة/المستلم، وFirestore مصدر حقيقة التسليم فقط. نحدّث كل 20 ثانية ما دام
// تبويب السجل مفتوحًا كي تظهر delivered/read/failed من دون إعادة تحميل الصفحة.
function loadMetaMessageDeliveryStatuses_() {
  if (messageLogDeliveryPollTimer_) {
    clearTimeout(messageLogDeliveryPollTimer_);
    messageLogDeliveryPollTimer_ = null;
  }
  if (messagesActiveTab_ !== 'log') return;

  var messageIds = Array.from(new Set(messageLogData_.filter(function (r) {
    return r && r.provider === 'meta' && r.externalMessageId;
  }).map(function (r) { return String(r.externalMessageId); })));
  if (!messageIds.length) return;

  try {
    if (!firebase.auth().currentUser) throw new Error('جلسة Firebase غير متاحة');
    var getStatuses = firebase.app().functions('europe-west1').httpsCallable('getMetaDeliveryStatuses');
    getStatuses({ messageIds: messageIds.slice(0, 200) }).then(function (result) {
      var list = result && result.data && Array.isArray(result.data.statuses) ? result.data.statuses : [];
      var byId = {};
      list.forEach(function (item) { if (item && item.externalMessageId) byId[item.externalMessageId] = item; });
      messageLogData_.forEach(function (row) {
        var status = row && byId[row.externalMessageId];
        if (!status) return;
        row.deliveryStatus = status.status || '';
        row.deliveryStatusAt = status.statusAt || '';
        row.deliveryError = status.error || '';
      });
      renderMessageLogTable_();
      if (messagesActiveTab_ === 'log') {
        messageLogDeliveryPollTimer_ = setTimeout(loadMetaMessageDeliveryStatuses_, 20000);
      }
    }).catch(function (err) {
      console.warn('تعذّر تحديث حالات تسليم Meta', err);
      if (messagesActiveTab_ === 'log') {

function renderMessageLogTable_() {
  var tb = document.getElementById('messageLogRows');
  if (!tb) return;
  var searchInp = document.getElementById('messageLogSearchInput');
  var q = searchInp ? (searchInp.value || '').trim().toLowerCase() : '';
  var rows = messageLogData_;
  if (q) rows = rows.filter(function (r) {
    return String(r.recipientName || '').toLowerCase().indexOf(q) !== -1 || String(r.recipientTarget || '').toLowerCase().indexOf(q) !== -1;
  });

  if (!rows.length) {
    tb.innerHTML = '<tr class="message-table-state"><td colspan="8"><span class="message-state"><i data-icon="history"></i><strong>' + (q ? 'لا توجد نتائج مطابقة' : 'لا توجد رسائل مسجّلة بعد') + '</strong><small>' + (q ? 'جرّب البحث باسم أو رقم هاتف مختلف.' : 'ستظهر الرسائل التلقائية والجماعية هنا بعد إرسالها.') + '</small></span></td></tr>';
    refreshIcons();
    return;
  }

  tb.innerHTML = rows.map(function (r) {
    var isSent = r.status === 'sent';
    // channel: عمود أُضيف لاحقًا (fcmQueue.js) — صفوف قديمة بلا قيمة تُعامَل كواتساب افتراضيًا.
    var isFcm = r.channel === 'fcm';
    var isMeta = !isFcm && r.provider === 'meta';
    var providerTitle = r.externalMessageId ? ' title="معرّف الرسالة: ' + escapeHtml(r.externalMessageId) + '"' : '';
    var channelBadge = isFcm ? '<span class="message-status-badge running"><i data-icon="bell"></i> إشعار</span>' : '<span class="message-status-badge sent"' + providerTitle + '><i class="fab fa-whatsapp"></i> ' + (isMeta ? 'واتساب · Meta' : 'واتساب · Fonnte') + '</span>';
    var metaStatus = isMeta ? (r.deliveryStatus || (isSent ? 'accepted' : 'failed')) : '';
    var metaStatusMeta = {
      accepted: { label: 'قُبل الطلب', cls: 'scheduled' },
      sent: { label: 'وصل لخوادم واتساب', cls: 'running' },
      delivered: { label: 'وصل للمستلم', cls: 'sent' },
      read: { label: 'قُرئت', cls: 'sent' },
      failed: { label: 'فشلت', cls: 'failed' },
      deleted: { label: 'حُذفت', cls: 'stopped' }
    };
    var displayStatus = isMeta ? (metaStatusMeta[metaStatus] || metaStatusMeta.accepted) : null;
    var statusTitle = isMeta && r.deliveryStatusAt
      ? ' title="آخر تحديث من Meta: ' + escapeHtml(formatDateAr(r.deliveryStatusAt)) + '"'
      : '';
    var statusHtml = isMeta
      ? '<span class="message-status-badge ' + displayStatus.cls + '"' + statusTitle + '>' + displayStatus.label + '</span>'
      : '<span class="message-status-badge ' + (isSent ? 'sent' : 'failed') + '">' + (isSent ? 'أُرسلت' : 'فشلت') + '</span>';
    var displayReason = isMeta ? (r.deliveryError || r.reason || '—') : (r.reason || '—');
    return '<tr>' +
      '<td data-label="التاريخ">' + escapeHtml(formatDateAr(r.sentAt)) + '</td>' +
      '<td data-label="القناة">' + channelBadge + '</td>' +
      '<td data-label="المُرسِل">' + escapeHtml(r.sentBy || 'تلقائي') + '</td>' +
      '<td data-label="المستلم"><strong>' + escapeHtml(r.recipientName || '—') + '</strong></td>' +
      '<td data-label="الهاتف/المعرّف" dir="ltr"><span class="message-target-code">' + escapeHtml(r.recipientTarget || '—') + '</span></td>' +
      '<td data-label="النوع"><span class="message-log-type">' + escapeHtml(MESSAGE_LOG_TYPE_LABELS_[r.templateKey] || r.templateKey || '—') + '</span></td>' +
      '<td data-label="الحالة">' + statusHtml + '</td>' +
      '<td data-label="السبب">' + escapeHtml(displayReason) + '</td>' +
    '</tr>';
  }).join('');
  refreshIcons();
}

}

function setupQueueGlobalBannerToggle_(banner, label) {
  var toggle = banner ? banner.querySelector('.queue-global-toggle') : null;
  if (!toggle) return;
  toggle.addEventListener('click', function () {
    var willExpand = banner.classList.contains('is-collapsed');
    banner.classList.toggle('is-collapsed', !willExpand);
    toggle.setAttribute('aria-expanded', String(willExpand));
    toggle.setAttribute('aria-label', (willExpand ? 'طي متابعة ' : 'عرض متابعة ') + label);
    updateQueueGlobalBannerPositions_();
  });
}

function collapseQueueGlobalBanner_(banner, label) {
  if (!banner) return;
  banner.classList.add('is-collapsed');
  var toggle = banner.querySelector('.queue-global-toggle');
  if (toggle) {
    toggle.setAttribute('aria-expanded', 'false');
    toggle.setAttribute('aria-label', 'عرض متابعة ' + label);
  }
}

// يرتّب شرائط متابعة Fonnte وMeta وFCM الظاهرة رأسيًا حسب ارتفاع كل شريط فعلي؛ وبذلك لا تتراكب
// عند عمل الطابورين (أو القنوات الثلاث) معًا، ويتكيّف الموضع تلقائيًا مع الطي/الفتح والهاتف.
function updateQueueGlobalBannerPositions_() {
  var banners = [
    document.getElementById('wpQueueGlobalBanner'),
    document.getElementById('wpQueueMetaGlobalBanner'),
    document.getElementById('fcmQueueGlobalBanner')
  ];
  var nextTop = null;
  banners.forEach(function (banner) {
    if (!banner) return;
    if (banner.hidden) {
      banner.style.top = '';
      return;
    }
    if (nextTop === null) {
      // أول شريط ظاهر يستعيد موضع CSS الافتراضي (14px، أو 8px على الهاتف).
      banner.style.top = '';
      nextTop = (parseFloat(window.getComputedStyle(banner).top) || 0) + banner.offsetHeight + 8;
      return;
    }
    banner.style.top = nextTop + 'px';
    nextTop += banner.offsetHeight + 8;
  });
}

function refreshWPQueueGlobalBanner_() {
  google.script.run.withSuccessHandler(renderWPQueueGlobalBanner_).withFailureHandler(function () {}).getWPQueueStatus('fonnte');
}

function renderWPQueueGlobalBanner_(st) {
  var banner = document.getElementById('wpQueueGlobalBanner');
  if (!banner) return;
  if (!st || st.status === 'idle' || st.status === 'stopped' || st.status === 'done') {
    banner.hidden = true;
    banner.classList.remove('is-running', 'is-scheduled');
    collapseQueueGlobalBanner_(banner, 'حملة الرسائل');
    updateQueueGlobalBannerPositions_();
    return;
  }
  banner.hidden = false;
  banner.classList.toggle('is-running', st.status === 'running');
  banner.classList.toggle('is-scheduled', st.status === 'scheduled');

  var countEl = document.getElementById('wpQueueBannerCount');
  var titleEl = document.getElementById('wpQueueBannerTitle');
  var subEl = document.getElementById('wpQueueBannerSub');
  var fillEl = document.getElementById('wpQueueBannerFill');

  if (st.status === 'scheduled') {
    if (countEl) countEl.textContent = st.total + ' مستلم';
    if (titleEl) titleEl.textContent = 'حملة رسائل مجدولة';
    if (subEl) subEl.textContent = 'ستبدأ تلقائيًا عند حلول الموعد المحدَّد.';
    if (fillEl) fillEl.style.width = '0%';
    updateQueueGlobalBannerPositions_();
    return;
  }

  var processed = st.sent + st.failed;
  var pct = st.total > 0 ? Math.round((processed / st.total) * 100) : 0;
  if (countEl) countEl.textContent = processed + ' / ' + st.total;
  if (titleEl) titleEl.textContent = 'جارٍ إرسال حملة رسائل...';
  if (subEl) subEl.textContent = st.sentBy ? ('بدأها ' + st.sentBy + (st.failed ? '، تعذّر الإرسال لـ' + st.failed : '')) : 'يرجى الانتظار حتى الاكتمال.';
  if (fillEl) fillEl.style.width = pct + '%';
  updateQueueGlobalBannerPositions_();
}

   واجهة كاملة تفاعلية مطابقة للمرجع (قائمة + محرر نماذج/أسئلة/اختيارات كامل)،
   لكن بلا أي اتصال بالخادم إطلاقًا — كل شيء في مصفوفة جلسة محلية (examsData_)
   تُفرَّغ عند تحديث الصفحة. لا أعمدة/جداول بيانات جديدة، لا صلاحيات جديدة —
   هذا مؤجَّل عمدًا لمناقشة نطاق منفصلة قبل بناء البنية الخلفية الحقيقية
   (rules/questions sheets، saveExam/saveQuestion/... إلخ، حسب مناقشات.md).
   شارة تنبيه دائمة أعلى الصفحة توضّح للمستخدم أن هذا تجريبي وغير محفوظ.
   ========================================================================== */
var examsData_ = []; // من getExamManagementData() — قائمة الاختبارات الحقيقية (شيت rules)
var examsIdCounter_ = 1;
// لمعرّفات محلية مؤقتة أثناء التحرير فقط (أسئلة/اختيارات لسه ما اتحفظتش على الخادم) —
// تُستبدل بمعرّف الخادم الحقيقي (UUID) فور نجاح أول حفظ لها.
function examsNextId() { return examsIdCounter_++; }
var examsCurrentExamId_ = null, examsCurrentModelId_ = null, examsCurrentQuestionId_ = null;
var examsStatusFilter_ = 'all', examsStageFilter_ = 'all', examsSearchQuery_ = '';
var examsSortField_ = null, examsSortDir_ = 'asc';

// آخر إحصائية استبانات عُرضت بمودال "إحصائية الاستبانات" — يقرأها زر التصدير بتذييل نفس
// المودال (exportSurveyStatsReport) بدل إعادة الطلب من الخادم من جديد عند التصدير.
var lastSurveyStats_ = null, lastSurveyStatsExam_ = null;

// cpr المدير الحالي — يُرسَل مع كل استدعاء كتابة لإدارة الاختبارات ليتحقق الخادم من صلاحيته
// فعليًا (وليس فقط إخفاء الأزرار بالواجهة)، حسب مناقشات.md.
function getCurrentUserCpr() {
  return (typeof userData !== 'undefined' && userData && userData[0] && userData[0].cpr) ? userData[0].cpr : null;
}
function currentUserIsExamAdmin() {
  return !!(typeof userData !== 'undefined' && userData && userData[0] && userData[0].manage);
}

function loadExamsView() {
  setRouteLoading('exams', true);
  setupExamsControls();
  var createBtn = document.getElementById('createExamBtn');
  if (createBtn) createBtn.hidden = !currentUserIsExamAdmin();
  initSelfIssueCertToggle();
  google.script.run.withSuccessHandler(function (rows) {
    examsData_ = (Array.isArray(rows) ? rows : []).map(function (r) { r.stage = r.level; return r; });
    renderExamsTable();
    updateExamsMetrics();
    renderExamReadinessAlerts();
    setRouteLoading('exams', false);
  }).withFailureHandler(function (err) {
    console.error('تعذّر تحميل قائمة الاختبارات من شيت rules', err);
    examsData_ = [];
    renderExamsTable();
    updateExamsMetrics();
    renderExamReadinessAlerts();
    setRouteLoading('exams', false);
  }).getExamManagementData();
}

function renderExamReadinessAlerts() {
  var wrap = document.getElementById('examReadinessAlerts');
  if (!wrap) return;
  var warnings = [];
  examsData_.forEach(function (exam) {
    if (exam.archived || exam.status === 'closed') return;
    (exam.readinessDetails || []).forEach(function (d) {
      if (!d.ready) warnings.push({ exam: exam, branch: d.branch });
    });
  });
  wrap.hidden = warnings.length === 0;
  if (!warnings.length) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = '<div class="warning-note" style="margin:0;"><i data-icon="triangle-alert"></i><span><strong>اختبارات مجدولة بلا نموذج معتمد</strong><br>' +
    warnings.map(function (w) {
      var scope = w.exam.name === 'الفقه' ? (' — ' + w.branch) : '';
      return escapeHtml(w.exam.name + scope + ' / ' + getLevelName(w.exam.level));
    }).join('<br>') + '</span></div>';
  refreshIcons();
}

// مفتاح "إصدار الطالب شهادته بنفسه" أعلى صفحة إدارة الاختبارات — نفس نمط initRegistrationToggle
// حرفيًا (js.html)، لكن exam_admin فقط (تحقّق خادمي داخل setSelfIssueCertStatus نفسها أيضًا،
// لا الاكتفاء بإخفاء العنصر هنا). question_editor لا يرى المفتاح إطلاقًا.
function updateSelfIssueCertToggleLabel(isOpen) {
  var label = document.getElementById('selfIssueCertToggleText');
  if (label) label.textContent = isOpen ? 'إصدار الشهادة الذاتي مفتوح' : 'إصدار الشهادة الذاتي مغلق';
}

function initSelfIssueCertToggle() {
  var toggle = document.getElementById('selfIssueCertToggle');
  if (!toggle) return;
  var wrap = toggle.closest('.registration-switch');
  if (wrap) wrap.hidden = !currentUserIsExamAdmin();
  if (toggle.dataset.bound) return;
  toggle.dataset.bound = '1';

  google.script.run.withSuccessHandler(function (dr) {
    toggle.checked = !!(dr && dr.selfIssueCertEnabled);
    updateSelfIssueCertToggleLabel(toggle.checked);
  }).getMainStatus();

  toggle.addEventListener('change', function () {
    var next = toggle.checked;
    toggle.disabled = true;
    google.script.run.withSuccessHandler(function (res) {
      toggle.disabled = false;
      if (!res || res.error) { toggle.checked = !next; alertMSG((res && res.message) || 'تعذّر تحديث الحالة', 'error'); return; }
      updateSelfIssueCertToggleLabel(next);
      alertMSG(next ? 'تم فتح إصدار الشهادة الذاتي للطلاب' : 'تم إغلاق إصدار الشهادة الذاتي', 'success');
    }).withFailureHandler(function (err) {
      toggle.disabled = false;
      toggle.checked = !next;
      alertMSG('تعذّر تحديث حالة إصدار الشهادة الذاتي: ' + err, 'error');
    }).setSelfIssueCertStatus(getCurrentUserCpr(), next);
  });
}

// كل الحقول أدناه محسوبة أصلًا على الخادم (status بتوقيت Asia/Bahrain، questionCount/
// readiness/modelCount من شيت questions الفعلي) — تُقرأ مباشرة بدل إعادة حسابها هنا.
function computeExamStatus(exam) { return exam.status; }
function countExamQuestions(exam) { return exam.questionCount; }
function isQuestionComplete(q) {
  if (!q || !String(q.text || '').trim()) return false;
  var opts = q.options || [];
  var filled = opts.filter(function (o) { return !!String(o.text || '').trim(); });
  if (filled.length < 2) return false;
  var correct = opts.filter(function (o) { return !!o.correct; });
  return correct.length === 1 && !!String(correct[0].text || '').trim();
}
function computeExamReadiness(exam) { return exam.readiness; }
function examFormsCount(exam) { return exam.modelCount; }

function updateExamsMetrics() {
  var open = 0, scheduled = 0, draft = 0, bank = 0;
  examsData_.forEach(function (exam) {
    var status = computeExamStatus(exam);
    if (status === 'archived') return; // بنك الأسئلة يمثّل الاختبارات الفعّالة فقط، لا المؤرشفة
    if (status === 'open') open++; else if (status === 'scheduled') scheduled++; else if (status === 'draft') draft++;
    bank += countExamQuestions(exam);
  });
  var setText = function (id, v) { var el = document.getElementById(id); if (el) el.textContent = v; };
  setText('examMetricOpen', open);
  setText('examMetricScheduled', scheduled);
  setText('examMetricDraft', draft);
  setText('examMetricBank', bank);
}

/* ==========================================================================
   بطاقات "نتائج الاختبارات حسب المرحلة" + مودال تفاصيل كل مرحلة — بيانات
   حقيقية من شيت answers (بخلاف بقية صفحة الاختبارات المؤقتة أعلاه)، بنفس
   فكرة مودال "تفاصيل التسميع" في صفحة المتعاونين: عمود لكل اختبار حقيقي في
   هذه المرحلة، وقيمة كل خلية هي تقييم الطالب (rate) في هذا الاختبار.
   ========================================================================== */
var examLevelNames_ = ['المرحلة التأهيلية', 'المرحلة التأسيسية', 'المرحلة التأصيلية', 'المرحلة التحصيلية'];
var examLevelModalCache_ = null;
var examLevelModalSortField_ = 'name';
var examLevelModalSortDir_ = 'asc';
var examLevelModalCurrent_ = null;
var examLevelModalSearchQuery_ = '';

function openExamLevelModal(level) {

// يبني قائمة الصفوف مرتَّبة بحسب حالة الترتيب الحالية — يُستخدَم من العرض والتصدير معًا
// حتى يطابق ملف Excel المُصدَّر تمامًا ما هو ظاهر على الشاشة (بنفس فكرة دالة التسميع).
function computeExamLevelModalRows() {
  var exams = (examLevelModalCache_ && examLevelModalCache_.exams) || [];
  var students = (examLevelModalCache_ && examLevelModalCache_.students) || [];
  var field = examLevelModalSortField_, dir = examLevelModalSortDir_;

  // المجموع = عدد اختبارات هذه المرحلة التي اجتازها الطالب (تقديرها غير "راسب").
  // متوسط الدرجات = مجموع درجات الاختبارات التي خاضها الطالب ÷ إجمالي عدد اختبارات هذه
  // المرحلة كلها (وليس فقط عدد الاختبارات التي خاضها) — فالاختبار الذي لم يخضه يُحسب بصفر.
  var rows = students.map(function (s) {
    var total = 0, resultSum = 0;
    exams.forEach(function (ex) {
      var score = s.scores && s.scores[ex];
      if (score && score.rate !== 'راسب') total++;
      if (score && score.result !== '' && score.result !== undefined && score.result !== null) resultSum += (+score.result || 0);
    });
    var avg = exams.length > 0 ? resultSum / exams.length : 0;
    return { cpr: s.cpr, name: s.name, scores: s.scores, total: total, avg: avg };
  });

  rows.sort(function (a, b) {
    if (field === 'name') {
      var an = a.name || '', bn = b.name || '';
      return dir === 'desc' ? bn.localeCompare(an, 'ar') : an.localeCompare(bn, 'ar');
    }
    if (field === 'total') {
      return dir === 'desc' ? b.total - a.total : a.total - b.total;
    }
    if (field === 'avg') {
      return dir === 'desc' ? b.avg - a.avg : a.avg - b.avg;
    }
    var va = (a.scores && a.scores[field] && a.scores[field].rate) || '';
    var vb = (b.scores && b.scores[field] && b.scores[field].rate) || '';
    return dir === 'desc' ? String(vb).localeCompare(String(va), 'ar') : String(va).localeCompare(String(vb), 'ar');
  });

  if (examLevelModalSearchQuery_) {
    var q = examLevelModalSearchQuery_.toLowerCase();
    rows = rows.filter(function (r) { return String(r.name || '').toLowerCase().indexOf(q) !== -1; });
  }

  return { exams: exams, rows: rows };
}

function renderExamLevelModalTable() {
  var body = document.getElementById('examLevelModalBody');
  if (!body || !examLevelModalCache_) return;

  var computed = computeExamLevelModalRows();
  var exams = computed.exams, rows = computed.rows;

  var theadCols = '<th style="width:36px;">#</th><th data-sort="name">اسم الطالب</th>' +
    exams.map(function (ex) { return '<th data-sort="' + escapeHtml(ex) + '">' + escapeHtml(ex) + '</th>'; }).join('') +
    '<th data-sort="total">المجموع</th><th data-sort="avg">متوسط الدرجات</th>';

  // خلية التقدير (rate) تظهر دائمًا كشارة ملوّنة (أخضر فاتح للناجح، وردي لـ"راسب")، والدرجة
  // (result) تظهر عند المرور بالماوس (title) أو عند النقر/اللمس من الهاتف (alertMSG).
  var tbodyRows = rows.map(function (r, idx) {
    return '<tr><td>' + (idx + 1) + '</td><td>' + escapeHtml(r.name) + '</td>' +
      exams.map(function (ex) {
        var score = r.scores && r.scores[ex];
        if (!score) return '<td><span style="color:#b7bec5">—</span></td>';
        var isFail = score.rate === 'راسب';
        var resultText = (score.result === '' || score.result === undefined || score.result === null) ? 'غير متوفرة' : score.result;
        return '<td><button type="button" class="soft-badge exam-grade-pill ' + (isFail ? 'pink' : 'green') + '" title="الدرجة: ' + escapeHtml(resultText) + '" data-student="' + escapeHtml(r.name) + '" data-exam="' + escapeHtml(ex) + '" data-result="' + escapeHtml(resultText) + '">' + escapeHtml(score.rate) + '</button></td>';
      }).join('') + '<td><strong>' + r.total + '</strong></td><td><strong>' + (exams.length > 0 ? (Math.round(r.avg * 10) / 10) : '—') + '</strong></td></tr>';
  }).join('');

  var emptyMsg = examLevelModalSearchQuery_ ? 'لا يوجد طالب مطابق للبحث' : 'لا توجد نتائج اختبارات لهذه المرحلة بعد';
  body.innerHTML =
    '<div class="responsive-table"><table id="examLevelModalTable"><thead><tr>' + theadCols + '</tr></thead><tbody>' +
    (rows.length ? tbodyRows : '<tr><td colspan="' + (exams.length + 4) + '" style="text-align:center;padding:20px;">' + emptyMsg + '</td></tr>') +
    '</tbody></table></div>';

  updateSortIndicator('examLevelModalTable', examLevelModalSortField_, examLevelModalSortDir_);

  var table = document.getElementById('examLevelModalTable');
  if (table) table.querySelectorAll('th[data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      var key = th.getAttribute('data-sort');
      if (examLevelModalSortField_ === key) examLevelModalSortDir_ = examLevelModalSortDir_ === 'asc' ? 'desc' : 'asc';
      else { examLevelModalSortField_ = key; examLevelModalSortDir_ = key === 'name' ? 'asc' : 'desc'; }
      renderExamLevelModalTable();
    });
  });
  if (table) table.querySelectorAll('.exam-grade-pill').forEach(function (btn) {
    btn.addEventListener('click', function () {
      alertMSG(btn.dataset.student + ' — ' + btn.dataset.exam + ' — الدرجة: ' + btn.dataset.result, 'info');
    });
  });
}

function exportExamLevelModalToExcel() {
  if (!examLevelModalCache_) { alertMSG('لا توجد بيانات لتصديرها بعد', 'warning'); return; }
  var computed = computeExamLevelModalRows();
  var exams = computed.exams, rows = computed.rows;
  if (rows.length === 0) { alertMSG('لا توجد نتائج لهذه المرحلة', 'warning'); return; }

  var headers = ['#', 'اسم الطالب'].concat(exams, ['المجموع', 'متوسط الدرجات']);
  var dataRows = rows.map(function (r, idx) {
    return [idx + 1, r.name].concat(exams.map(function (ex) {
      var score = r.scores && r.scores[ex];
      if (!score) return '';
      var hasResult = !(score.result === '' || score.result === undefined || score.result === null);
      return score.rate + (hasResult ? ' (' + score.result + ')' : '');
    }), [r.total, exams.length > 0 ? (Math.round(r.avg * 10) / 10) : '']);
  });

  var levelName = examLevelNames_[examLevelModalCurrent_] || '';
  exportReportExcel({ headers: headers, rows: dataRows }, 'نتائج اختبارات ' + levelName, 'نتائج_اختبارات_' + levelName + '.xls');
}

// قائمة إجراءات صف اختبار واحد: نفس أزرار <button> بلا تكرار، تُعرَض كقائمة منسدلة (⋮) على
// الشاشات الكبيرة أو أيقونات موزّعة بالتساوي (space-between) على الهاتف — التبديل بينهما
// بـCSS فقط حسب عرض الشاشة (admin-css.html: .exam-actions-menu/.exam-actions-list). خاصة
// بجدول "إدارة الاختبارات" فقط، لا تمسّ .table-actions العامة في بقية جداول المشروع.
function examActionsMenuHtml(buttons, examId) {
  var itemsHtml = buttons.map(function (b) {
    return '<button class="' + b.cls + '" data-id="' + examId + '"' + (b.extraAttrs || '') + ' type="button" title="' + escapeHtml(b.label) + '"><i data-icon="' + b.icon + '"></i><span class="action-label">' + escapeHtml(b.label) + '</span></button>';
  }).join('');
  return '<div class="exam-actions-menu">' +
    '<button class="icon-button exam-actions-toggle" type="button" title="خيارات" aria-haspopup="true" aria-expanded="false"><i data-icon="ellipsis-vertical"></i></button>' +
    '<div class="exam-actions-list">' + itemsHtml + '</div>' +
    '</div>';
}

function renderExamsTable() {
  var tbody = document.getElementById('examRows');
  if (!tbody) return;
  var labels = { open: 'متاح الآن', scheduled: 'مجدول', closed: 'منتهٍ', draft: 'مسودة', archived: 'مؤرشف' };
  var q = (examsSearchQuery_ || '').trim().toLowerCase();
  var isAdmin = currentUserIsExamAdmin();
  var list = examsData_.filter(function (exam) {
    var status = computeExamStatus(exam);
    // تبويب "الكل" لا يشمل المؤرشفة عمدًا (نفس منطق سلة المحذوفات في أي نظام) — تظهر
    // فقط تحت تبويبها الخاص data-exam-status="archived"، وليست ضمن أي حالة تاريخ أخرى.
    if (examsStatusFilter_ === 'all') { if (status === 'archived') return false; }
    else if (status !== examsStatusFilter_) return false;
    if (examsStageFilter_ !== 'all' && exam.stage !== +examsStageFilter_) return false;
    if (q && exam.name.toLowerCase().indexOf(q) === -1) return false;
    return true;
  });

  if (examsSortField_) {
    var field = examsSortField_, dir = examsSortDir_;
    list.sort(function (a, b) {
      var va, vb;
      if (field === 'name') { va = a.name || ''; vb = b.name || ''; return dir === 'desc' ? vb.localeCompare(va, 'ar') : va.localeCompare(vb, 'ar'); }
      if (field === 'status') { va = labels[computeExamStatus(a)] || ''; vb = labels[computeExamStatus(b)] || ''; return dir === 'desc' ? vb.localeCompare(va, 'ar') : va.localeCompare(vb, 'ar'); }
      if (field === 'startDate') { va = (a.startDate || '') + (a.startTime || ''); vb = (b.startDate || '') + (b.startTime || ''); return dir === 'desc' ? vb.localeCompare(va) : va.localeCompare(vb); }
      if (field === 'questionCount') { va = countExamQuestions(a); vb = countExamQuestions(b); return dir === 'desc' ? vb - va : va - vb; }
      if (field === 'readiness') { va = computeExamReadiness(a); vb = computeExamReadiness(b); return dir === 'desc' ? vb - va : va - vb; }
      // stage / duration
      va = +a[field] || 0; vb = +b[field] || 0;
      return dir === 'desc' ? vb - va : va - vb;
    });
  }

  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--muted)">' +
      (examsData_.length === 0 ? (isAdmin ? 'لا توجد اختبارات بعد — استخدم زر "إنشاء اختبار" لبدء أول اختبار' : 'لا توجد اختبارات بعد') : 'لا توجد اختبارات مطابقة') + '</td></tr>';
    return;
  }

  tbody.innerHTML = list.map(function (exam) {
    var status = computeExamStatus(exam);
    var readiness = computeExamReadiness(exam);
    var qCount = countExamQuestions(exam);
    var formsCount = examFormsCount(exam);
    var periodHtml = exam.startDate
      ? '<strong>' + escapeHtml(exam.startDate) + (exam.startTime ? ' ' + escapeHtml(exam.startTime) : '') + '</strong><br><small>حتى ' + escapeHtml(exam.endDate || '—') + (exam.endTime ? ' ' + escapeHtml(exam.endTime) : '') + '</small>'
      : '<span style="color:#b7bec5">لم تُحدَّد بعد</span>';
    // exam_admin (إدارة=true) يشوف كل الأزرار (قائمة منسدلة على الشاشات الكبيرة، أيقونات
    // موزّعة بالتساوي على الهاتف — examActionsMenuHtml). question_editor (اختبار=true بلا
    // إدارة) يشوف زر "إدارة الأسئلة" فقط بشكله البسيط الأصلي — زر واحد لا يحتاج قائمة.
    // الخادم يتحقق من نفس القيد في كل دالة كتابة بصرف النظر عن الأزرار الظاهرة هنا.
    var actionsHtml;
    if (!isAdmin) {
      actionsHtml = '<div class="table-actions"><button class="icon-button exam-questions" data-id="' + exam.id + '" type="button" title="إدارة الأسئلة"><i data-icon="list-plus"></i></button></div>';
    } else if (status === 'archived') {
      // اختبار مؤرشف: أسئلة/استبانات (استعراض فقط) + استعادة — بلا تعديل/نسخ/إعادة محاولة/حذف،
      // فلا معنى لها على عنصر مؤرشَف قبل إعادته لدائرة الاستخدام.
      actionsHtml = examActionsMenuHtml([
        { cls: 'exam-questions', icon: 'list-plus', label: 'إدارة الأسئلة' },
        { cls: 'exam-survey-stats', icon: 'square-poll-vertical', label: 'إحصائية الاستبانات' },
        { cls: 'exam-restore', icon: 'refresh-cw', label: 'استعادة الاختبار' }
      ], exam.id);
    } else {
      // إعادة المحاولة بعد الرسوب: سويتش سريع لكل اختبار يحل محل مهلة الـ24 ساعة الثابتة
      // القديمة (submitAnswerData/getQuestions بdataGet.js/dataPost.js تقرأ retakeOpen مباشرة).
      actionsHtml = examActionsMenuHtml([
        { cls: 'exam-questions', icon: 'list-plus', label: 'إدارة الأسئلة' },
        { cls: 'exam-edit', icon: 'pencil', label: 'تعديل' },
        { cls: 'exam-duplicate', icon: 'copy', label: 'نسخ' },
        { cls: 'exam-retake-toggle', icon: exam.retakeOpen ? 'lock-open' : 'lock', label: exam.retakeOpen ? 'إغلاق إعادة المحاولة' : 'فتح إعادة المحاولة', extraAttrs: ' data-open="' + (exam.retakeOpen ? '1' : '0') + '"' },
        { cls: 'exam-survey-stats', icon: 'square-poll-vertical', label: 'إحصائية الاستبانات' },
        { cls: 'exam-delete', icon: 'trash-2', label: 'حذف' }
      ], exam.id);
    }
    return '<tr><td><div class="person-cell"><span class="metric-icon red"><i data-icon="clipboard-list"></i></span><span><strong>' + escapeHtml(exam.name) + '</strong><small>' + formsCount + ' نموذج</small></span></div></td>' +
      '<td data-label="المرحلة">' + (exam.stage !== null && exam.stage !== undefined ? stageBadgeHtml(exam.stage) : '<span style="color:#b7bec5">—</span>') + '</td>' +
      '<td data-label="فترة الإتاحة">' + periodHtml + '</td>' +
      '<td data-label="المدة">' + exam.duration + ' دقيقة</td>' +
      '<td data-label="النماذج والأسئلة"><strong>' + formsCount + ' نموذج</strong><br><small>' + qCount + ' سؤالًا</small></td>' +
      '<td data-label="الجاهزية"><div class="progress-cell"><span><b>الجاهزية</b><strong>' + readiness + '%</strong></span><div><i style="width:' + readiness + '%"></i></div></div></td>' +
      '<td data-label="الحالة"><span class="state-badge ' + status + '">' + labels[status] + '</span></td>' +
      '<td>' + actionsHtml + '</td></tr>';
  }).join('');
  updateSortIndicator('examTable', examsSortField_, examsSortDir_);
  refreshIcons();
}

// طلب المستخدم صراحةً: إنشاء/تعديل اختبار يبدأ باختيار المرحلة (أزرار مقطوعة .segmented، بنفس
// شكل فلاتر المرحلة بكل مكان آخر بلوحة الإدارة)، ثم قائمة "المادة" (من شيت subjects القائم
// أصلًا، مُفلترة على مواد هذه المرحلة فقط)، ثم قائمة "المقرر" (شيت curricula، مُفلترة على مقررات
// هذه المادة فقط) — واسم الاختبار = اسم المقرر المختار، لا نص حر. يشمل هذا التسلسل الإنشاء
// والتعديل معًا الآن (بطلب المستخدم صراحةً: "حتى القديم أيضا، المفروض كل الاسماء السابقة
// متطابقة"). **احتياط لم يُطلَب لكنه ضروري لسلامة البيانات**: لو اختبار قائم اسمه لا يطابق أي
// مقرر حالي فعليًا (بعكس المتوقَّع)، النموذج يسقط تلقائيًا لحقل اسم حرّ + قائمة مرحلة بسيطة بدل
// إجباره على قائمة قد تُفقِد اسمه الأصلي بصمت — راجع findCurriculumMatchForExam_ أدناه.
function subjectsForStage_(stageIndex) {
  var stageName = getLevelName(stageIndex);
  return curriculumData_.subjects.filter(function (s) {
    return String(s.level || '').split(',').map(function (x) { return x.trim(); }).indexOf(stageName) !== -1;
  });
}
// المقرر يجب أن يوافق المادة **والمرحلة معًا** (قيد ثانٍ فوق قيد المادة — بطلب صريح من
// المستخدم)، لا المادة وحدها: مقرر تابع لمادة تخص عدة مراحل قد لا يخص هو نفسه كل هذه المراحل
// (لكل مقرر عمود level خاص به منفصل عن level المادة، راجع openCurriculumItemModal أعلاه).
function curriculaForSubject_(subjectId, stageIndex) {
  var stageName = getLevelName(stageIndex);
  return curriculumData_.curricula.filter(function (c) {
    if (c.subjectId !== subjectId) return false;
    return String(c.level || '').split(',').map(function (x) { return x.trim(); }).indexOf(stageName) !== -1;
  });
}

// يبحث عن مقرر بنفس اسم الاختبار الحالي (للتعديل) ليُحدَّد سلفًا بالقوائم — يُفضَّل مقررًا يخص هو
// نفسه (لا مادته فقط) مرحلة الاختبار، ويسقط لأول مقرر مطابق بالاسم بصرف النظر عن مرحلته لو لم
// يوجد. يُرجع null لو لا يوجد أي مقرر بنفس الاسم إطلاقًا (حالة استثنائية، راجع الاحتياط بالتعليق
// أعلى renderExamModalBody_).
function findCurriculumMatchForExam_(exam) {
  var matches = curriculumData_.curricula.filter(function (c) { return c.name === exam.name; });
  if (!matches.length) return null;
  var stageName = getLevelName(exam.stage);
  for (var i = 0; i < matches.length; i++) {
    var curriculumLevels = String(matches[i].level || '').split(',').map(function (x) { return x.trim(); });
    if (curriculumLevels.indexOf(stageName) !== -1) {
      var subject = curriculumData_.subjects.find(function (s) { return s.id === matches[i].subjectId; });
      if (subject) return { curriculum: matches[i], subject: subject };
    }
  }
  var fallbackSubject = curriculumData_.subjects.find(function (s) { return s.id === matches[0].subjectId; });
  return fallbackSubject ? { curriculum: matches[0], subject: fallbackSubject } : null;
}

function examModal(exam) {
  // بيانات المواد/المقررات تُجلَب هنا عند الحاجة لو لم تكن محمَّلة بالفعل (الإداري لم يزر "إدارة
  // المواد" بهذه الجلسة)، بنفس نمط ensureStudentDetailMapsLoaded_ المُتَّبع بمكان آخر بالمشروع.
  if (curriculumData_.subjects.length && curriculumData_.curricula.length) {
    renderExamModalBody_(exam);
    return;
  }
  var pending = 2;
  function tryDone() { pending--; if (pending <= 0) renderExamModalBody_(exam); }
  google.script.run.withSuccessHandler(function (rows) { curriculumData_.subjects = Array.isArray(rows) ? rows : []; tryDone(); })
    .withFailureHandler(function () { curriculumData_.subjects = []; tryDone(); }).getSubjectsList();
  google.script.run.withSuccessHandler(function (rows) { curriculumData_.curricula = Array.isArray(rows) ? rows : []; tryDone(); })
    .withFailureHandler(function () { curriculumData_.curricula = []; tryDone(); }).getCurriculaList();
}

function renderExamModalBody_(exam) {
  var matchInfo = exam ? findCurriculumMatchForExam_(exam) : null;
  var usePicker = !exam || !!matchInfo;

  var nameFieldHtml;
  if (usePicker) {
    var preStage = exam ? exam.stage : null;
    var stageButtonsHtml = [0, 1, 2, 3].map(function (i) {
      return '<button type="button" data-stage="' + i + '"' + (preStage === i ? ' class="active"' : '') + '>' + getLevelName(i) + '</button>';
    }).join('');

    var subjectOptionsHtml = '<option value="">اختر المادة</option>';
    var subjectDisabled = ' disabled';
    if (preStage !== null) {
      subjectDisabled = '';
      subjectOptionsHtml += subjectsForStage_(preStage).map(function (s) {
        return '<option value="' + escapeHtml(s.id) + '"' + (matchInfo && matchInfo.subject.id === s.id ? ' selected' : '') + '>' + escapeHtml(s.name) + '</option>';
      }).join('');
    } else {
      subjectOptionsHtml = '<option value="">اختر المرحلة أولًا</option>';
    }

    var curriculumOptionsHtml = '<option value="">اختر المادة أولًا</option>';
    var curriculumDisabled = ' disabled';
    if (matchInfo) {
      curriculumDisabled = '';
      curriculumOptionsHtml = '<option value="">اختر المقرر</option>' + curriculaForSubject_(matchInfo.subject.id, preStage).map(function (c) {
        return '<option value="' + escapeHtml(c.name) + '"' + (c.name === exam.name ? ' selected' : '') + '>' + escapeHtml(c.name) + '</option>';
      }).join('');
    }

    nameFieldHtml =
      '<label class="field wide"><span>المرحلة</span><div class="segmented" id="examFormStageGroup">' + stageButtonsHtml + '</div></label>' +
      '<label class="field wide"><span>المادة</span><select id="examFormSubject"' + subjectDisabled + '>' + subjectOptionsHtml + '</select></label>' +
      '<label class="field wide"><span>اسم الاختبار (المقرر)</span><select id="examFormCurriculumName"' + curriculumDisabled + '>' + curriculumOptionsHtml + '</select></label>';
  } else {
    // احتياط: اختبار قائم بلا أي مقرر مطابق لاسمه — يبقى بحقل حرّ بدل إفساد اسمه الأصلي بصمت.
    var stageOptions = [0, 1, 2, 3].map(function (i) {
      return '<option value="' + i + '"' + (exam.stage === i ? ' selected' : '') + '>' + getLevelName(i) + '</option>';
    }).join('');
    nameFieldHtml =
      '<div class="warning-note" style="grid-column:1/-1;"><i data-icon="triangle-alert"></i><span>تعذّر إيجاد مقرر مطابق لاسم هذا الاختبار — عُرض بحقل نص حرّ حفاظًا على اسمه الأصلي.</span></div>' +
      '<label class="field wide"><span>اسم الاختبار</span><input id="examFormName" value="' + escapeHtml(exam.name) + '" placeholder="مثال: الوسائل المفيدة للحياة السعيدة"></label>' +
      '<label class="field wide"><span>المرحلة</span><select id="examFormStage"><option value="">اختر المرحلة</option>' + stageOptions + '</select></label>';
  }

  var bodyHtml = '<div class="form-grid">' +
    nameFieldHtml +
    '<label class="field"><span>تاريخ البداية</span><input id="examFormStartDate" type="date" value="' + (exam && exam.startDate ? exam.startDate : '') + '"></label>' +
    '<label class="field"><span>وقت البداية</span><input id="examFormStartTime" type="time" value="' + (exam && exam.startTime ? exam.startTime : '') + '"></label>' +
    '<label class="field"><span>تاريخ النهاية</span><input id="examFormEndDate" type="date" value="' + (exam && exam.endDate ? exam.endDate : '') + '"></label>' +
    '<label class="field"><span>وقت النهاية</span><input id="examFormEndTime" type="time" value="' + (exam && exam.endTime ? exam.endTime : '') + '"></label>' +
    '<label class="field wide"><span>مدة الاختبار بالدقائق</span><input id="examFormDuration" type="number" min="5" max="240" value="' + (exam ? exam.duration : 30) + '"></label>' +
    '<label class="field wide" style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;">' +
      '<input type="checkbox" id="examFormShowAnswerReview" style="margin-top:3px;width:16px;height:16px;accent-color:var(--primary);flex:0 0 auto;"' + (!exam || exam.showAnswerReview ? ' checked' : '') + '>' +
      '<span><strong style="display:block;font-size:calc(11px + var(--font-adjust));">إظهار مراجعة الإجابات بعد التسليم</strong><small style="display:block;margin-top:2px;color:var(--muted);font-size:calc(9px + var(--font-adjust));">مفعّلة (الوضع الافتراضي): يرى الطالب كل سؤال مع الإجابة الصحيحة بعد التسليم. إن أُغلقت، يرى درجته فقط بلا أي تفصيل عن الأسئلة.</small></span>' +
    '</label>' +
    '</div>';
  var footerHtml = '<button class="secondary-button" type="button" onclick="closeActionModal()">إلغاء</button>' +
    '<button class="secondary-button" id="examFormSaveBtn" type="button">حفظ</button>' +
    '<button class="primary-button" id="examFormSaveAndQuestionsBtn" type="button">حفظ وإضافة الأسئلة<i data-icon="arrow-left"></i></button>';
  openActionModal(exam ? 'تعديل الاختبار' : 'إنشاء اختبار', 'إدارة الاختبارات', bodyHtml, footerHtml);

  // يبدأ بمرحلة الاختبار الحالية لو كان تعديلًا بقائمة مطابقة (preStage)، أو بلا شيء لاختبار جديد.
  var selectedStage_ = usePicker && exam ? preStage : null;

  if (usePicker) {
    var stageGroup = document.getElementById('examFormStageGroup');
    var subjectSel = document.getElementById('examFormSubject');
    var curriculumSel = document.getElementById('examFormCurriculumName');

    stageGroup.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-stage]');
      if (!btn) return;
      stageGroup.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
      selectedStage_ = parseInt(btn.getAttribute('data-stage'), 10);

      var subjects = subjectsForStage_(selectedStage_);
      subjectSel.disabled = false;
      subjectSel.innerHTML = '<option value="">اختر المادة</option>' + subjects.map(function (s) {
        return '<option value="' + escapeHtml(s.id) + '">' + escapeHtml(s.name) + '</option>';
      }).join('');
      curriculumSel.disabled = true;
      curriculumSel.innerHTML = '<option value="">اختر المادة أولًا</option>';
    });

    subjectSel.addEventListener('change', function () {
      var subjectId = subjectSel.value;
      if (!subjectId) { curriculumSel.disabled = true; curriculumSel.innerHTML = '<option value="">اختر المادة أولًا</option>'; return; }
      var curricula = curriculaForSubject_(subjectId, selectedStage_);
      curriculumSel.disabled = false;
      curriculumSel.innerHTML = '<option value="">اختر المقرر</option>' + curricula.map(function (c) {
        return '<option value="' + escapeHtml(c.name) + '">' + escapeHtml(c.name) + '</option>';
      }).join('');
    });
  }

  function collectFormData() {
    var name, level;
    if (usePicker) {
      name = document.getElementById('examFormCurriculumName').value;
      if (selectedStage_ === null) { alertMSG('يرجى اختيار المرحلة', 'error'); return null; }
      if (!document.getElementById('examFormSubject').value) { alertMSG('يرجى اختيار المادة', 'error'); return null; }
      if (!name) { alertMSG('يرجى اختيار المقرر (اسم الاختبار)', 'error'); return null; }
      level = selectedStage_;
    } else {
      name = (document.getElementById('examFormName').value || '').trim();
      if (!name) { alertMSG('يرجى إدخال اسم الاختبار', 'error'); return null; }
      var stageVal = document.getElementById('examFormStage').value;
      if (stageVal === '') { alertMSG('يرجى اختيار المرحلة', 'error'); return null; }
      level = parseInt(stageVal, 10);
    }
    var startDate = document.getElementById('examFormStartDate').value;
    var endDate = document.getElementById('examFormEndDate').value;
    if (!startDate || !endDate) { alertMSG('يرجى تحديد تاريخ البداية والنهاية', 'error'); return null; }
    return {
      id: exam ? exam.id : null,
      name: name,
      level: level,
      startDate: startDate,
      startTime: document.getElementById('examFormStartTime').value,
      endDate: endDate,
      endTime: document.getElementById('examFormEndTime').value,
      duration: parseInt(document.getElementById('examFormDuration').value, 10) || 30,
      showAnswerReview: !!document.getElementById('examFormShowAnswerReview').checked
    };
  }

  // حفظ حقيقي بشيت rules (saveExam بالخادم) — الزران يُعطَّلان أثناء الطلب لمنع تكرار
  // الضغط، ويُعاد تفعيلهما بعد اكتمال الطلب فعليًا (نجاحًا أو فشلًا)، حسب مناقشات.md.
  function submitExam(openEditorAfter) {
    var data = collectFormData();
    if (!data) return;
    var saveBtn = document.getElementById('examFormSaveBtn');
    var saveAndQBtn = document.getElementById('examFormSaveAndQuestionsBtn');
    [saveBtn, saveAndQBtn].forEach(function (b) { if (b) b.disabled = true; });

    google.script.run.withSuccessHandler(function (res) {
      [saveBtn, saveAndQBtn].forEach(function (b) { if (b) b.disabled = false; });
      if (!res || res.error) { alertMSG((res && res.message) || 'تعذّر حفظ الاختبار', 'error'); return; }
      closeActionModal();
      alertMSG('تم حفظ الاختبار بنجاح', 'success');
      loadExamsView();
      if (openEditorAfter) openExamEditor(res.id);
    }).withFailureHandler(function (err) {
      [saveBtn, saveAndQBtn].forEach(function (b) { if (b) b.disabled = false; });
      alertMSG('تعذّر حفظ الاختبار: ' + err, 'error');
    }).saveExam(getCurrentUserCpr(), data);
  }

  var saveBtn = document.getElementById('examFormSaveBtn');
  if (saveBtn) saveBtn.addEventListener('click', function () { submitExam(false); });
  var saveAndQBtn = document.getElementById('examFormSaveAndQuestionsBtn');
  if (saveAndQBtn) saveAndQBtn.addEventListener('click', function () { submitExam(true); });
  refreshIcons();
}

var examEditorState_ = null; // الاختبار المفتوح حاليًا بالمحرر: {id, name, stage, models:[...]} — من getExamEditorData
var examEditorModelCounter_ = 1; // رقم النموذج التالي عند إضافة "نموذج جديد" محليًا

function getCurrentExamModel() {
  if (!examEditorState_) return { exam: null, model: null };
  var model = examEditorState_.models.find(function (m) { return m.id === examsCurrentModelId_; }) || examEditorState_.models[0];
  return { exam: examEditorState_, model: model };
}

// يجيب بيانات الأسئلة الحقيقية من الخادم (getExamEditorData) بدل الافتراض إنها محمَّلة
// مسبقًا محليًا — التعديل نفسه (كتابة نص، إضافة اختيار...) يبقى محليًا فوريًا كما كان،
// ولا يُكتب على الشيت إلا عند نقاط الحفظ الفعلية (حفظ السؤال/حفظ والتالي).
// اختبار "الفقه" حالة خاصة: يتفرّع لثلاثة مذاهب منفصلة تمامًا كل واحد بأسئلته ونماذجه
// المستقلة (راجع مناقشات.md "حل مشكلة اختبار الفقه"). `mazhab` يُمرَّر فقط بعد اختياره —
// بدونه، الخادم يعيد `needsMazhab` فتُعرَض شاشة اختيار المذهب بدل المحرر مباشرة.
function openExamEditor(examId, mazhab) {
  activateAdminRoute('exam-editor', { skipLoad: true });
  var form = document.getElementById('examQuestionForm');
  if (form) form.innerHTML = '<div class="empty-state"><i data-icon="loader-circle"></i><h3>جاري تحميل الأسئلة...</h3></div>';
  google.script.run.withSuccessHandler(function (data) {
    if (!data || data.error) {
      alertMSG((data && data.message) || 'تعذّر تحميل بيانات الاختبار', 'error');
      activateAdminRoute('exams');
      return;
    }
    examsCurrentExamId_ = examId;
    if (data.needsMazhab) { renderMazhabPicker(examId, data); return; }
    if (!data.models || data.models.length === 0) data.models = [{ id: '1', name: 'نموذج 1', status: 'draft', questions: [] }];
    examEditorState_ = data;
    examEditorModelCounter_ = data.models.reduce(function (mx, m) { return Math.max(mx, +m.id || 0); }, 0) + 1;
    examsCurrentModelId_ = data.models[0].id;
    examsCurrentQuestionId_ = data.models[0].questions.length ? data.models[0].questions[0].id : null;
    renderExamEditor();
  }).withFailureHandler(function (err) {
    alertMSG('تعذّر تحميل بيانات الاختبار: ' + err, 'error');
    activateAdminRoute('exams');
  }).getExamEditorData(examId, getCurrentUserCpr(), mazhab || null);
}

// شاشة اختيار المذهب لاختبار "الفقه" — تُعرَض داخل نفس تخطيط المحرر (بدل جدول النماذج/الأسئلة
// العادي) لحين اختيار المستخدم أحد المذاهب الثلاثة، فتُعاد openExamEditor بالمذهب المختار.
function renderMazhabPicker(examId, data) {
  var nameEl = document.getElementById('editorExamName'); if (nameEl) nameEl.textContent = data.name;
  var stageEl = document.getElementById('editorExamStage'); if (stageEl) stageEl.textContent = (data.stage !== null && data.stage !== undefined) ? getLevelName(data.stage) : 'بلا مرحلة محدَّدة';
  var metaEl = document.getElementById('editorExamMeta'); if (metaEl) metaEl.textContent = 'اختر المذهب لعرض/تعديل أسئلته';
  var mazhabTabsEl = document.getElementById('examMazhabTabs'); if (mazhabTabsEl) { mazhabTabsEl.hidden = true; mazhabTabsEl.innerHTML = ''; }
  var tabsEl = document.getElementById('examModelTabs'); if (tabsEl) tabsEl.innerHTML = '';
  var navEl = document.getElementById('questionNav'); if (navEl) navEl.innerHTML = '';
  var summaryEl = document.getElementById('examQuestionsSummary'); if (summaryEl) summaryEl.textContent = '';
  ['examSummaryTotal', 'examSummaryDone', 'examSummaryPending'].forEach(function (id) { var el = document.getElementById(id); if (el) el.textContent = '0'; });
  var readinessBar = document.getElementById('examSummaryReadinessBar'); if (readinessBar) readinessBar.style.width = '0%';
  var readinessLabel = document.getElementById('examSummaryReadiness'); if (readinessLabel) readinessLabel.textContent = '0%';

  var form = document.getElementById('examQuestionForm');
  if (form) {
    form.innerHTML = '<div class="empty-state"><i data-icon="list-plus"></i><h3>اختبار "الفقه" يتفرّع لثلاثة مذاهب</h3>' +
      '<p>لكل مذهب أسئلته ونماذجه المستقلة تمامًا. اختر المذهب المطلوب تعديله:</p>' +
      '<div class="mazhab-picker">' + data.mazhabOptions.map(function (m) {
        return '<button class="secondary-button" type="button" data-pick-mazhab="' + escapeHtml(m) + '">' + escapeHtml(m) + '</button>';
      }).join('') + '</div></div>';
    var picker = form.querySelector('.mazhab-picker');
    if (picker) picker.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-pick-mazhab]');
      if (!btn) return;
      openExamEditor(examId, btn.getAttribute('data-pick-mazhab'));
    });
  }
  refreshIcons();
}

function renderExamMazhabTabs() {
  var exam = examEditorState_;
  var wrap = document.getElementById('examMazhabTabs');
  if (!wrap) return;
  if (!exam || !exam.mazhab) { wrap.hidden = true; wrap.innerHTML = ''; return; }
  wrap.hidden = false;
  wrap.innerHTML = '<span class="mazhab-tabs-label">المذهب</span>' + (exam.mazhabOptions || []).map(function (m) {
    return '<button class="' + (m === exam.mazhab ? 'active' : '') + '" type="button" data-mazhab="' + escapeHtml(m) + '">' + escapeHtml(m) + '</button>';
  }).join('');
}

function renderExamEditor() {
  var exam = examEditorState_;
  if (!exam) return;
  var nameEl = document.getElementById('editorExamName'); if (nameEl) nameEl.textContent = exam.mazhab ? (exam.name + ' — ' + exam.mazhab) : exam.name;
  var stageEl = document.getElementById('editorExamStage'); if (stageEl) stageEl.textContent = (exam.stage !== null && exam.stage !== undefined) ? getLevelName(exam.stage) : 'بلا مرحلة محدَّدة';
  var metaEl = document.getElementById('editorExamMeta');
  if (metaEl) {
    metaEl.textContent = exam.startDate
      ? (exam.startDate + ' ' + (exam.startTime || '') + ' – ' + (exam.endDate || '') + ' ' + (exam.endTime || '') + ' · ' + (exam.duration || '—') + ' دقيقة')
      : 'محرر أسئلة الاختبار';
  }
  renderExamMazhabTabs();
  renderExamModelTabs();
  renderExamQuestionNav();
  renderExamQuestionForm();
  renderExamSummary();
}

function renderExamModelTabs() {
  var exam = examEditorState_;
  var wrap = document.getElementById('examModelTabs');
  if (!wrap || !exam) return;
  wrap.innerHTML = exam.models.map(function (m) {
    var approved = m.status === 'approved';
    return '<button class="' + (m.id === examsCurrentModelId_ ? 'active' : '') + '" type="button" data-model-id="' + m.id + '">' + escapeHtml(m.name) + ' <b>' + m.questions.length + '</b> <small>' + (approved ? 'معتمد' : 'مسودة') + '</small></button>';
  }).join('') + '<button type="button" id="examAddModelBtn"><i data-icon="plus"></i>نموذج جديد</button>';
  refreshIcons();
}

function renderExamQuestionNav() {
  var ctx = getCurrentExamModel();
  var nav = document.getElementById('questionNav');
  if (!nav || !ctx.model) return;
  var doneCount = ctx.model.questions.filter(isQuestionComplete).length;
  var summaryEl = document.getElementById('examQuestionsSummary');

  setText('examSummaryTotal', total);

    approvalBtn.classList.toggle('primary-button', !approved);
