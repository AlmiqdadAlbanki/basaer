/* ============================================================
   نظام التنبيهات المنبثقة الموحّد (Toast) — نفس تصميم بوابة الطالب
   الجديدة، لكن من أعلى الصفحة. يُستخدم في كل المشروع عبر alertMSG()
   بدل نافذة SweetAlert2 المركزية القديمة.
   ============================================================ */
.gToast {
  position: fixed;
  z-index: 20000;
  top: 18px;
  left: 50%;
  transform: translateX(-50%) translateY(-14px);
  max-width: min(420px, calc(100vw - 32px));
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 12px 18px;
  border-radius: 8px;
  color: #fff;
  background: #23282f;
  box-shadow: 0 12px 32px rgba(25,31,38,0.22);
  opacity: 0;
  pointer-events: none;
  transition: opacity 180ms ease, transform 180ms ease;
  font-family: "IBM Plex Sans Arabic", "Rubik", Tahoma, Arial, sans-serif;
  font-size: 13px;
  line-height: 1.6;
  text-align: right;
}
.gToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.gToast > i { flex: 0 0 auto; font-size: 17px; line-height: 1; }
.gToast > span { min-width: 0; }
.gToast.gToast-success > i { color: #71d5ab; }
.gToast.gToast-error > i { color: #ef8783; }
.gToast.gToast-warning > i { color: #f5c453; }
.gToast.gToast-info > i { color: #7ec1f5; }
@media (max-width: 640px) {
  .gToast { left: 16px; right: 16px; transform: translateY(-14px); max-width: none; }
  .gToast.show { transform: translateY(0); }
}
