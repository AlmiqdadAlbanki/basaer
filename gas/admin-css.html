<style>
:root {
  --primary: #b5262c;
  --primary-dark: #8d1d22;
  --primary-soft: #fff1f2;
  --ink: #20252d;
  --muted: #667180;
  --soft: #f5f7f9;
  --surface: #ffffff;
  --line: #e2e7eb;
  --line-strong: #d5dce2;
  --green: #24875a;
  --green-soft: #eaf7f0;
  --gold: #a77d52;
  --gold-soft: #f7f1ea;
  --blue: #325969;
  --blue-soft: #eaf1f4;
  --olive: #7b7364;
  --danger: #c6373e;
  --sidebar: 252px;
  --topbar: 68px;
  --shadow: 0 4px 14px rgba(25, 35, 44, .06);
  --radius: 8px;
  --font-adjust: 0px;
}

body[data-font-size="small"] { --font-adjust: 2px; }
body[data-font-size="medium"] { --font-adjust: 3px; }
body[data-font-size="large"] { --font-adjust: 5px; }

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-width: 320px;
  color: var(--ink);
  background: var(--soft);
  font-family: "IBM Plex Sans Arabic", Arial, sans-serif;
  font-size: calc(14px + var(--font-adjust));
  letter-spacing: 0;
}

button, input, textarea, select { font: inherit; }
button { letter-spacing: 0; }
button, a, select { -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid rgba(181, 38, 44, .16); outline-offset: 2px; }

[hidden] { display: none !important; }

.sidebar {
  position: fixed;
  inset: 0 0 0 auto;
  z-index: 40;
  width: var(--sidebar);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 18px 14px 14px;
  color: #fff;
  background: #2f2f2f;
  border-left: 0;
}

.brand-wrap {
  height: 74px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 8px 17px;
  border-bottom: 1px solid rgba(255, 255, 255, .12);
}

.brand-wrap img { width: 132px; height: 52px; object-fit: contain; object-position: right center; }
.brand-wrap .icon-button { color: #f0f0f0; }
.sidebar-close { display: none !important; }

.main-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 0; scrollbar-width: thin; scrollbar-color: #575757 transparent; }
.nav-caption { display: block; margin: 13px 12px 7px; color: #929292; font-size: calc(11px + var(--font-adjust)); font-weight: 500; }

.nav-link {
  width: 100%;
  min-height: 42px;
  display: grid;
  grid-template-columns: 20px 1fr auto;
  align-items: center;
  gap: 10px;
  margin: 2px 0;
  padding: 8px 11px;
  border: 0;
  border-radius: 7px;
  color: #f0f0f0;
  background: transparent;
  cursor: pointer;
  text-align: right;
  transition: background .18s ease, color .18s ease;
}

.nav-link i { width: 18px; height: 18px; color: #c8c8c8; }
.nav-link span { min-width: 0; }
.nav-link:hover { color: #fff; background: rgba(255, 255, 255, .06); }
.nav-link:hover i { color: #fff; }
.nav-link.active { color: #fff; background: #a52029; font-weight: 600; }
.nav-link.active i { color: #fff; }
.nav-link.active::after { display: none; }
.nav-link { position: relative; }
.nav-count { min-width: 23px; height: 20px; display: grid !important; place-items: center !important; border-radius: 10px; color: #fff; background: #8d1d22; font-size: calc(11px + var(--font-adjust)); }
.nav-link.active .nav-count { background: rgba(255, 255, 255, .17); }

.sidebar-status { min-height: 62px; margin: 8px 0 12px; padding: 11px; border: 1px solid rgba(255, 255, 255, .14); border-radius: var(--radius); background: rgba(255, 255, 255, .025); }
.sidebar-status .live-content { display: flex; align-items: flex-start; gap: 9px; }
.sidebar-status strong, .sidebar-status small { display: block; }
.sidebar-status strong { color: #fff; font-size: calc(11px + var(--font-adjust)); }
.sidebar-status small { margin-top: 3px; color: #aaa; font-size: calc(10px + var(--font-adjust)); }
.status-dot { width: 8px; height: 8px; flex: 0 0 8px; display: inline-block; border-radius: 50%; background: #c69a61; box-shadow: 0 0 0 4px rgba(198, 154, 97, .12); }

.sidebar-user { min-height: 55px; display: grid; grid-template-columns: 36px 1fr 32px; align-items: center; gap: 9px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, .12); }
.sidebar-user strong, .sidebar-user small { display: block; }
.sidebar-user strong { color: #fff; font-size: calc(12px + var(--font-adjust)); }
.sidebar-user small { margin-top: 2px; color: #aaa; font-size: calc(10px + var(--font-adjust)); }
.sidebar-user .avatar { color: var(--primary-dark); background: #fff0f1; }
.sidebar-user .icon-button { border-color: rgba(255, 255, 255, .15); color: #eee; }
.sidebar-user .icon-button:hover { border-color: rgba(255, 255, 255, .28); color: #fff; background: rgba(255, 255, 255, .06); }

.sidebar .skeleton-overlay { background: #2f2f2f; }
.sidebar .skeleton-line, .sidebar .skeleton-circle, .sidebar .skeleton-block { background: #484848; }

.avatar { width: 36px; height: 36px; display: grid !important; place-items: center !important; flex: 0 0 36px; border-radius: 50%; color: #fff; background: var(--primary-dark); font-weight: 700; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.avatar.small { width: 32px; height: 32px; flex-basis: 32px; font-size: calc(11px + var(--font-adjust)); }
.avatar.gold { background: var(--gold); }
.avatar.blue { background: var(--blue); }
.avatar.olive { background: var(--olive); }

.app-shell { min-height: 100dvh; margin-right: var(--sidebar); }

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  height: var(--topbar);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 0 28px;
  background: rgba(255, 255, 255, .96);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
}

.topbar-start, .topbar-actions, .heading-actions, .toolbar-filters { display: flex; align-items: center; gap: 9px; }
.breadcrumb { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: calc(12px + var(--font-adjust)); }
.breadcrumb i { width: 14px; }
.breadcrumb strong { color: var(--ink); }
.mobile-menu { display: none !important; }

.global-search { width: min(320px, 29vw); height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: #f8fafb; }
.global-search i, .table-search i { width: 17px; color: #8d98a4; }
.global-search input, .table-search input { min-width: 0; flex: 1; border: 0; outline: 0; color: var(--ink); background: transparent; }
.global-search kbd { padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; color: #99a1aa; background: #fff; font-family: inherit; font-size: calc(10px + var(--font-adjust)); }

.icon-button { width: 34px; height: 34px; display: inline-grid !important; place-items: center !important; flex: 0 0 34px; padding: 0; border: 1px solid transparent; border-radius: 7px; color: #616d7a; background: transparent; cursor: pointer; }
.icon-button:hover { border-color: var(--line); color: var(--primary); background: #fff; }
.icon-button i { width: 18px; height: 18px; }
.icon-button.danger { color: var(--danger); }
.icon-button.excel { color: var(--green); }
.icon-button.excel:hover { border-color: #8bc4a8; color: var(--green); background: var(--green-soft); }
.qr-button { border-color: #edd7d8; color: var(--primary); background: var(--primary-soft); }
.notification-button { position: relative; }
.notification-button span { position: absolute; top: 6px; left: 7px; width: 7px; height: 7px; border: 2px solid #fff; border-radius: 50%; background: var(--primary); }

.user-button { min-width: 150px; display: grid; grid-template-columns: 34px 1fr 16px; align-items: center; gap: 8px; padding: 3px 5px; border: 0; color: var(--ink); background: transparent; cursor: pointer; text-align: right; }
.user-button .avatar { width: 34px; height: 34px; font-size: calc(11px + var(--font-adjust)); }
.user-button strong, .user-button small { display: block; }
.user-button strong { font-size: calc(11px + var(--font-adjust)); }
.user-button small { color: var(--muted); font-size: calc(9px + var(--font-adjust)); }
.user-button i { width: 15px; color: var(--muted); }
.user-menu { position: absolute; top: 58px; left: 28px; z-index: 50; width: 190px; padding: 6px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; box-shadow: 0 14px 34px rgba(27, 36, 43, .14); }
.user-menu button { width: 100%; display: flex; align-items: center; gap: 9px; padding: 9px; border: 0; border-radius: 6px; color: #4c5865; background: transparent; cursor: pointer; text-align: right; }
.user-menu button:hover { background: var(--soft); }
.user-menu i { width: 16px; }

.font-control { position: relative; }
.font-size-menu { position: absolute; top: 44px; left: 0; z-index: 55; width: 228px; padding: 8px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; box-shadow: 0 14px 34px rgba(27, 36, 43, .14); }
.font-size-menu header { display: flex; align-items: center; gap: 9px; padding: 7px 6px 11px; border-bottom: 1px solid var(--line); }
.font-size-menu header > i { width: 28px; height: 28px; display: grid !important; place-items: center !important; border-radius: 6px; color: var(--primary); background: var(--primary-soft); }
.font-size-menu header strong, .font-size-menu header small { display: block; }
.font-size-menu header strong { font-size: calc(11px + var(--font-adjust)); }
.font-size-menu header small { margin-top: 2px; color: var(--muted); font-size: calc(9px + var(--font-adjust)); }
.font-size-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding-top: 8px; }
.font-size-options button { min-height: 59px; display: grid !important; place-items: center !important; align-content: center; gap: 2px; padding: 5px; border: 1px solid var(--line); border-radius: 6px; color: #64707c; background: #fff; cursor: pointer; }
.font-size-options button:hover { border-color: #d1afb2; color: var(--primary-dark); }
.font-size-options button.active { border-color: var(--primary); color: var(--primary-dark); background: var(--primary-soft); }
.font-size-options button b { font-family: "Readex Pro", sans-serif; font-size: calc(15px + var(--font-adjust)); }
.font-size-options button:first-child b { font-size: calc(12px + var(--font-adjust)); }
.font-size-options button:last-child b { font-size: calc(19px + var(--font-adjust)); }
.font-size-options button span { font-size: calc(9px + var(--font-adjust)); }

/* Font Awesome is the single icon system for the admin UI. */
/* قاعدة عامة: توسيط كل أيقونة أفقيًا داخل عنصرها دائمًا — [data-icon] يبقى كسمة على العنصر حتى
   بعد أن يستبدل refreshIcons() الـ class بكلاسات Font Awesome الفعلية، فتُطبَّق هذه القاعدة على
   كل أيقونة في كل صفحة (حالية أو مستقبلية) تلقائيًا دون الحاجة لإضافة text-align:center يدويًا
   لكل حاوية أيقونة ملوّنة جديدة (مشكلة عدم توسيط الأيقونة داخل المربعات الملوّنة). */
[data-icon] { text-align: center !important; }

.nav-link > i { width: 18px; text-align: center; color: #c8c8c8; font-size: calc(16px + var(--font-adjust)); }
.nav-link:hover > i, .nav-link.active > i { color: #fff; }
.icon-button > i { width: 18px; text-align: center; font-size: calc(16px + var(--font-adjust)); }
.breadcrumb > i, .user-button > i { width: 14px; text-align: center; }
.global-search > i, .table-search > i { width: 17px; color: #8d98a4; text-align: center; }
.primary-button > i, .secondary-button > i, .danger-button > i, .whatsapp-button > i, .text-button > i { width: 16px; text-align: center; }
.metric-icon > i { font-size: calc(18px + var(--font-adjust)); }
.metric .delta > i { width: 12px; font-size: calc(11px + var(--font-adjust)); }
.quick-actions button > i:first-child { width: 34px; height: 34px; display: grid !important; place-items: center !important; padding: 8px; border-radius: 7px; color: var(--primary); background: var(--primary-soft); }
.quick-actions button > i:last-child { width: 16px; color: #a1a9b1; text-align: center; }
.state-badge > i, .saved-state > i, .warning-note > i, .question-form > footer > span > i { width: 15px; text-align: center; }
.queue-icon > i { font-size: calc(18px + var(--font-adjust)); }
.qr-frame > i { color: #c2c9cf; font-size: calc(76px + var(--font-adjust)); }
.toast > i { width: 18px; text-align: center; }

.main-content { width: min(1560px, 100%); margin: 0 auto; padding: 26px 28px 18px; }
.page-view { display: none; animation: page-in .22s ease; }
.page-view.active { display: block; }
@keyframes page-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.page-heading { min-height: 72px; display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 22px; text-align: right; }
.page-heading h1, .editor-heading h1 { margin: 2px 0 3px; font-family: "Readex Pro", "IBM Plex Sans Arabic", sans-serif; font-size: calc(25px + var(--font-adjust)); line-height: 1.45; text-align: right; }
.page-heading p, .editor-heading p { margin: 0; color: var(--muted); font-size: calc(13px + var(--font-adjust)); text-align: right; }
.eyebrow { color: var(--primary); font-size: calc(11px + var(--font-adjust)); font-weight: 600; text-align: right; }
.editor-heading { text-align: right; }

.primary-button, .secondary-button, .danger-button, .whatsapp-button { min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 7px 13px; border-radius: 7px; cursor: pointer; font-weight: 600; }
.primary-button { border: 1px solid var(--primary); color: #fff; background: var(--primary); }
.primary-button:hover { background: var(--primary-dark); }
.secondary-button { border: 1px solid var(--line-strong); color: #46525e; background: #fff; }
.secondary-button:hover { border-color: #bdc6ce; color: var(--primary-dark); }
.danger-button { border: 1px solid var(--danger); color: #fff; background: var(--danger); }
.whatsapp-button { border: 1px solid #1d8e5e; color: #fff; background: #1d8e5e; }
.primary-button:disabled, .secondary-button:disabled { opacity: .48; cursor: not-allowed; }
.primary-button i, .secondary-button i, .whatsapp-button i { width: 16px; height: 16px; }
.full { width: 100%; }

.registration-switch { min-height: 38px; display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border: 1px solid #cce4d7; border-radius: 7px; color: var(--green); background: #f4fbf7; cursor: pointer; white-space: nowrap; font-size: calc(10px + var(--font-adjust)); }
.registration-switch input { position: absolute; opacity: 0; pointer-events: none; }
.registration-switch span { width: 30px; height: 18px; position: relative; border-radius: 10px; background: #aeb8c0; transition: background .18s ease; }
.registration-switch span::after { content: ""; position: absolute; top: 3px; right: 3px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .18s ease; }
.registration-switch input:checked + span { background: var(--green); }
.registration-switch input:checked + span::after { transform: translateX(-12px); }
.registration-switch input:not(:checked) ~ b { color: #687480; }

.metrics-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }

/* ========================================================================
   إدارة المحاضرات وإدارة المواد — مساحة أكاديمية موحّدة: ملخصات واضحة، منتقي محتوى
   بصري، وأدوات جدول ثابتة دون تغيير آليات البيانات أو المودالات.
   ======================================================================== */
.academic-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.academic-metric { position: relative; min-height: 94px; padding: 15px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; box-shadow: var(--shadow); }
.academic-metric::after { content: ""; position: absolute; top: 0; right: 0; width: 3px; height: 100%; background: var(--metric-accent, var(--primary)); opacity: .75; }
.academic-metric:nth-child(2) { --metric-accent: #9b6d42; }
.academic-metric:nth-child(3) { --metric-accent: var(--blue); }
.academic-metric:nth-child(4) { --metric-accent: var(--green); }
.academic-metric .live-content { display: flex; align-items: center; gap: 11px; }
.academic-metric-icon { width: 38px; height: 38px; display: grid; place-items: center; flex: 0 0 38px; border-radius: 8px; color: var(--primary); background: var(--primary-soft); }
.academic-metric-icon.red { color: var(--primary); background: var(--primary-soft); }
.academic-metric-icon.gold { color: #8d653e; background: var(--gold-soft); }
.academic-metric-icon.blue { color: var(--blue); background: var(--blue-soft); }
.academic-metric-icon.green { color: var(--green); background: var(--green-soft); }
.academic-metric-icon i { font-size: calc(15px + var(--font-adjust)); }
.academic-metric .live-content > div > small, .academic-metric .live-content > div > strong, .academic-metric .live-content > div > span { display: block; }
.academic-metric .live-content > div > small { color: var(--muted); font-size: calc(9px + var(--font-adjust)); font-weight: 600; }
.academic-metric .live-content > div > strong { margin: 2px 0; font-family: "Readex Pro", sans-serif; font-size: calc(21px + var(--font-adjust)); }
.academic-metric .live-content > div > span { color: #89939c; font-size: calc(8px + var(--font-adjust)); }

.academic-data-panel { min-height: 420px; }
.academic-panel-header { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 13px 16px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, #fff, #fcfdfd); }
.academic-panel-header > div:first-child { min-width: 0; display: flex; align-items: center; gap: 10px; }
.academic-panel-header > div:first-child > span:last-child { min-width: 0; }
.academic-panel-header strong, .academic-panel-header small { display: block; }
.academic-panel-header strong { color: var(--ink); font-size: calc(13px + var(--font-adjust)); }
.academic-panel-header small { margin-top: 2px; color: var(--muted); font-size: calc(9px + var(--font-adjust)); }
.academic-panel-icon { width: 36px; height: 36px; display: grid; place-items: center; flex: 0 0 36px; border-radius: 8px; color: var(--primary); background: var(--primary-soft); }
.academic-panel-icon.red { color: var(--primary); background: var(--primary-soft); }
.academic-panel-icon.blue { color: var(--blue); background: var(--blue-soft); }
.academic-panel-icon.gold { color: #8d653e; background: var(--gold-soft); }
.academic-panel-icon.green { color: var(--green); background: var(--green-soft); }
.academic-panel-icon.olive { color: var(--olive); background: rgba(123, 115, 100, .12); }
.academic-panel-icon.purple { color: #6f4f9b; background: rgba(111, 79, 155, .12); }
.academic-panel-icon i { font-size: calc(14px + var(--font-adjust)); }
.academic-panel-actions { display: flex; align-items: center; gap: 8px; }
.academic-panel-actions .icon-button { border-color: var(--line); background: #fff; }
.academic-result-badge { min-height: 28px; display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 14px; color: #697581; background: #eef2f4; white-space: nowrap; font-size: calc(9px + var(--font-adjust)); }
.academic-result-badge b { color: var(--ink); font-family: "Readex Pro", sans-serif; }

.academic-table-tools { min-height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--line); background: #fbfcfd; }
.academic-table-tools-wrap { flex-wrap: wrap; }
.academic-search { width: min(330px, 34vw); height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: 7px; background: #fff; transition: border-color .18s ease, box-shadow .18s ease; }
.academic-search:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(181, 38, 44, .08); }
.academic-search i { width: 16px; color: #8c97a2; }
.academic-search input { min-width: 0; flex: 1; border: 0; outline: 0; color: var(--ink); background: transparent; }
.academic-filter-tabs { min-width: 0; display: flex; align-items: center; gap: 4px; padding: 3px; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; scrollbar-width: thin; }
.academic-filter-tabs button { min-height: 32px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 5px 9px; border: 0; border-radius: 6px; color: #67737e; background: transparent; cursor: pointer; white-space: nowrap; font-size: calc(9px + var(--font-adjust)); font-weight: 600; transition: color .18s ease, background .18s ease; }
.academic-filter-tabs button:hover { color: var(--primary-dark); background: #fff6f7; }
.academic-filter-tabs button.active { color: var(--primary-dark); background: var(--primary-soft); }
.academic-filter-tabs button b { min-width: 19px; padding: 1px 5px; border-radius: 9px; color: #6c7782; background: #edf0f2; font-size: calc(8px + var(--font-adjust)); }
.academic-filter-tabs button.active b { color: #fff; background: var(--primary); }
.academic-filter-tabs.compact button { padding-inline: 8px; }
.academic-filter-dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; }
.academic-filter-dot.s0 { background: #a77d52; }
.academic-filter-dot.s1 { background: #325969; }
.academic-filter-dot.s2 { background: #7b7364; }
.academic-filter-dot.s3 { background: #8a4b3b; }
.academic-table-wrap { max-height: 65vh; overflow: auto; }
.academic-table-wrap thead th { position: sticky; top: 0; z-index: 5; background: #f8fafb; }

.stage-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }

/* رؤوس جداول صفحة "إدارة المواد" ثابتة (sticky). ملاحظة CSS مهمة: position:sticky بالرأس لا
   يعمل مع تمرير الصفحة نفسها طالما الحاوية الأب (.responsive-table) عندها overflow-x:auto —
   هي مَن تصبح حاوية التمرير الفعلية حسب المواصفة (لا نافذة المتصفح)، وبما أنها لا تُمرَّر رأسيًا
   من تلقاء نفسها (ارتفاعها = ارتفاع محتواها)، يفشل الالتصاق بصمت. الحل: نمنحها ارتفاعًا محدودًا
   وoverflow-y:auto صراحة لتصبح هي سياق التمرير الرأسي الحقيقي الذي يلتصق الرأس بأعلاه (top:0). */
#curriculumSubjectsPanel .responsive-table, #curriculumCurriculaPanel .responsive-table,
#curriculumMadhabsPanel .responsive-table, #curriculumAwradPanel .responsive-table {
  max-height: 65vh;
  overflow-y: auto;
}

/* دوران أيقونة زر "تحديث" أثناء إعادة جلب بيانات جدول واحد فقط (بلا تحميل الصفحة كلها) */
@keyframes icon-spin { to { transform: rotate(360deg); } }
.icon-button.spinning i { animation: icon-spin .7s linear infinite; }
.secondary-button.spinning i { animation: icon-spin .7s linear infinite; }
#subjectsTable thead th, #curriculaTable thead th, #madhabsTable thead th, #awradTable thead th {

/* تجميد أول عمودين (الرقم، الاسم) في جدول تفاصيل التسميع أثناء التمرير الأفقي بين أعمدة
   المتون — يمينًا في RTL، أي بداية الصف. عرض العمود الأول ثابت (36px) عبر style مضمَّن، فيُبنى
   إزاحة العمود الثاني على نفس القيمة. */
#dictationStatsTable th:nth-child(1), #dictationStatsTable td:nth-child(1),
#dictationStatsTable th:nth-child(2), #dictationStatsTable td:nth-child(2) {

  z-index: 2;
}
#dictationStatsTable td:nth-child(2) { min-width: 140px; }
#dictationStatsTable th:nth-child(1), #dictationStatsTable th:nth-child(2) { background: #fafbfc; z-index: 3; }
#dictationStatsTable th:nth-child(1), #dictationStatsTable td:nth-child(1) { right: 0; }
#dictationStatsTable th:nth-child(2), #dictationStatsTable td:nth-child(2) { right: 36px; box-shadow: -4px 0 6px -4px rgba(0,0,0,.15); }
#dictationStatsTable tbody tr:hover td:nth-child(1), #dictationStatsTable tbody tr:hover td:nth-child(2) { background: #fffafb; }

/* تجميد أول عمودين (الرقم، اسم الطالب) في جدول نتائج الاختبارات حسب المرحلة، بنفس فكرة
   جدول تفاصيل التسميع أعلاه — أثناء التمرير الأفقي بين أعمدة الاختبارات. */
#examLevelModalTable th:nth-child(1), #examLevelModalTable td:nth-child(1),

/* قائمة إجراءات صف اختبار واحد (renderExamsTable/examActionsMenuHtml بadmin-js.html): قائمة
   منسدلة (⋮) على الشاشات الكبيرة، أيقونات موزّعة بالتساوي (space-between) على الهاتف — نفس
   عناصر <button> بلا تكرار، والتبديل بينهما بهذا الـCSS فقط. خاصة بجدول إدارة الاختبارات،
   لا تمسّ .table-actions العامة في بقية جداول المشروع. */

  .exam-actions-list .action-label { display: none; }

/* مودال "إحصائية الاستبانات" (openExamSurveyStatsModal بadmin-js.html) — بطاقة لكل سؤال

   كل قسم يتحول من رمادي إلى أحمر عند اكتمال مرحلته، والمرحلة الجارية تنبض حركيًا. */
.pdfai-elapsed { align-self: flex-start; margin-top: 2px; padding: 4px 10px; border-radius: 20px; color: var(--muted); background: #f0f2f4; font-variant-numeric: tabular-nums; font-size: calc(11px + var(--font-adjust)); font-weight: 700; }

/* Every live data surface receives its own loading overlay. */
[data-live] { position: relative; }
[data-live].is-loading { overflow: hidden; }
[data-live].is-loading > .live-content { visibility: hidden; }
.skeleton-overlay { display: none; position: absolute; inset: 0; z-index: 5; padding: 16px; background: #fff; }
[data-live].is-loading > .skeleton-overlay { display: grid; }
.skeleton-line, .skeleton-circle, .skeleton-block {
  position: relative;
  overflow: hidden;
  background: #e8ecef;
}
.skeleton-line::after, .skeleton-circle::after, .skeleton-block::after {
  content: "";
  position: absolute;
  inset: 0;
  transform: translateX(100%);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.72), transparent);
  animation: shimmer 1.15s infinite;
}
@keyframes shimmer { to { transform: translateX(-100%); } }
.skeleton-line { height: 9px; border-radius: 4px; }.skeleton-line.w40 { width: 40%; }.skeleton-line.w55 { width: 55%; }.skeleton-line.w70 { width: 70%; }.skeleton-line.w85 { width: 85%; }.skeleton-line.tall { height: 19px; }
.skeleton-circle { width: 38px; height: 38px; border-radius: 50%; }.skeleton-block { border-radius: 6px; }
.skeleton-stat { grid-template-columns: 40px 1fr; align-items: start; gap: 13px; }.skeleton-stat > div { display: grid; gap: 9px; padding-top: 2px; }
.skeleton-compact { grid-template-columns: 34px 1fr; align-items: center; gap: 11px; }.skeleton-compact > div { display: grid; gap: 8px; }
.skeleton-chart { grid-template-rows: 14px 1fr; gap: 19px; }.skeleton-chart .skeleton-bars { display: flex; align-items: end; gap: 10px; padding: 14px 20px 0; }.skeleton-chart .skeleton-bars i { flex: 1; min-height: 45px; border-radius: 4px 4px 0 0; background: #e8ecef; animation: skeleton-pulse 1.2s ease-in-out infinite alternate; }.skeleton-chart .skeleton-bars i:nth-child(2) { height: 75%; animation-delay: .12s; }.skeleton-chart .skeleton-bars i:nth-child(3) { height: 50%; animation-delay: .24s; }.skeleton-chart .skeleton-bars i:nth-child(4) { height: 90%; animation-delay: .36s; }.skeleton-chart .skeleton-bars i:nth-child(5) { height: 65%; animation-delay: .48s; }
@keyframes skeleton-pulse { from { opacity: .55; } to { opacity: 1; } }
.skeleton-table { grid-template-rows: 38px repeat(5, 1fr); gap: 1px; padding: 0; }.skeleton-table .skeleton-row { display: grid; grid-template-columns: 1.2fr .8fr .75fr .65fr; align-items: center; gap: 18px; padding: 10px 17px; border-bottom: 1px solid #edf0f2; }.skeleton-table .skeleton-row:first-child { background: #fafbfc; }.skeleton-list { grid-template-rows: repeat(6, 1fr); gap: 1px; padding: 0; }.skeleton-list .skeleton-row { display: grid; grid-template-columns: 34px 1fr 45px; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #edf0f2; }

/* ========================================================================
   مواءمة المودالات الإدارية القديمة (Bootstrap) بصريًا مع تصميم لوحة الإدارة
   الجديد — تعديل المظهر فقط عبر CSS دون المساس بآلية الفتح/الإغلاق
   (data-bs-toggle/dismiss) القائمة، تفاديًا لمخاطرة إعادة ربط 8 مودالات مختلفة
   من الصفر. المودالات المشمولة: certManage, stWorksMan،
   attendDetailsModal, recitDetailsModal, examDetailsModal (adminDashboard.html)،
   وwpProgressModal (Main.html، تُستخدَم أيضًا من صفحة الرسائل). #qrReader كان هنا سابقًا؛
   أُزيل بالكامل بعد نقل قراءة QR لصفحة مستقلة خارج Apps Script. staffModal أصبح الآن
   مودالًا ديناميكيًا عبر openActionModal() (انظر admin-js.html) فلم يعد يحتاج مواءمة هنا.
   ======================================================================== */
#certManage .modal-content, #stWorksMan .modal-content,
#attendDetailsModal .modal-content, #recitDetailsModal .modal-content, #examDetailsModal .modal-content,
#wpProgressModal .modal-content {
  border: 0; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 50px rgba(20,25,30,.18);
  font-family: "IBM Plex Sans Arabic", Arial, sans-serif; color: var(--ink);
}

#certManage .modal-header, #stWorksMan .modal-header,
#wpProgressModal .modal-header {
  padding: 16px 22px; border-bottom: 1px solid var(--line); background: var(--primary-soft);
}
#certManage .modal-title, #stWorksMan .modal-title,
#wpProgressModal .modal-title { color: var(--primary-dark) !important; font-weight: 700; }

/* الهيدرز ذات اللون الدلالي (أخضر=حضور، أزرق=أوراد، أحمر=اختبارات) تُبقي تمييزها بين الأنواع،
   لكن بألوان التصميم الجديد الهادئة (تينت فاتح) بدل ألوان Bootstrap الصريحة الداكنة */
#attendDetailsModal .modal-header.bg-success { background: var(--green-soft) !important; color: var(--green) !important; }
#recitDetailsModal .modal-header.bg-primary { background: var(--blue-soft) !important; color: var(--blue) !important; }
#examDetailsModal .modal-header.bg-danger { background: var(--primary-soft) !important; color: var(--primary-dark) !important; }
#attendDetailsModal .modal-header.bg-success .modal-title,
#recitDetailsModal .modal-header.bg-primary .modal-title,
#examDetailsModal .modal-header.bg-danger .modal-title { color: inherit !important; }
#attendDetailsModal .modal-header.bg-success .btn-close,
#recitDetailsModal .modal-header.bg-primary .btn-close,
#examDetailsModal .modal-header.bg-danger .btn-close,
#attendDetailsModal .modal-header.bg-success .btn-light,
#recitDetailsModal .modal-header.bg-primary .btn-light,
#examDetailsModal .modal-header.bg-danger .btn-light { filter: none; background: #fff; color: var(--ink); border: 1px solid var(--line); }

#certManage .modal-body, #stWorksMan .modal-body,
#attendDetailsModal .modal-body, #recitDetailsModal .modal-body, #examDetailsModal .modal-body,
#wpProgressModal .modal-body { padding: 20px 22px; }

#certManage .modal-footer, #stWorksMan .modal-footer,
#attendDetailsModal .modal-footer, #recitDetailsModal .modal-footer, #examDetailsModal .modal-footer,
#wpProgressModal .modal-footer {
  padding: 14px 22px; border-top: 1px solid var(--line); background: #fff; gap: 8px;
}

/* عناصر النماذج (تُطابق .field input/select في بقية لوحة الإدارة) */
#certManage .form-label, #stWorksMan .form-label,
#certManage label.small, #stWorksMan label.small {
  color: #4c5864; font-weight: 600; font-size: calc(11px + var(--font-adjust)); text-transform: none;
}
#certManage .form-control, #stWorksMan .form-control,
#certManage .form-select, #stWorksMan .form-select {
  border: 1px solid var(--line-strong); border-radius: 7px; color: var(--ink); background: #fff;
}
#certManage .form-control:focus, #stWorksMan .form-control:focus,
#certManage .form-select:focus, #stWorksMan .form-select:focus {
  border-color: var(--primary); box-shadow: 0 0 0 3px rgba(181,38,44,.12);
}

/* أزرار Bootstrap العامة داخل هذه المودالات فقط ← مظهر .primary-button/.secondary-button/.danger-button */
#certManage .btn-danger, #stWorksMan .btn-danger {
  border: 1px solid var(--primary); border-radius: 7px; color: #fff; background: var(--primary); font-weight: 600;
}
#certManage .btn-danger:hover, #stWorksMan .btn-danger:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
#attendDetailsModal .btn-outline-secondary, #recitDetailsModal .btn-outline-secondary, #examDetailsModal .btn-outline-secondary {
  border: 1px solid var(--line-strong); border-radius: 7px; color: #46525e; background: #fff; font-weight: 600;
}
#attendDetailsModal .btn-outline-secondary:hover, #recitDetailsModal .btn-outline-secondary:hover, #examDetailsModal .btn-outline-secondary:hover {
  border-color: #bdc6ce; color: var(--primary-dark); background: #fff;
}
#attendDetailsModal #addAttendDayBtn { background: #fff; }
#attendDetailsModal #addAttendDayBtn i { color: var(--green) !important; }

/* ========================================================================
   صفحة طلبات التسجيل (newStuReg.html) — تستخدم مكوّنات لوحة الإدارة نفسها مع تنظيم أوضح
   للفلاتر والإجراءات، وتبقى صالحة كذلك عند فتحها من لوحة الموظف المستقلة.
   ======================================================================== */
#newStuRegPage { padding: 0; text-align: right; }
#app > #newStuRegPage { width: min(1400px, 100%); margin: 16px auto; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.regBackRow { display: flex; justify-content: flex-start; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.regBackBtn { min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: 7px; color: #46525e; background: #fff; cursor: pointer; font-weight: 600; }
.regBackBtn:hover { border-color: #bdc6ce; color: var(--primary-dark); }
.regBackBtn i { width: 16px; }

.reg-table-toolbar { display: grid; grid-template-columns: minmax(390px, 1.5fr) repeat(2, minmax(180px, .72fr)) minmax(230px, .9fr); align-items: end; gap: 12px; background: #fff; }
.reg-filter-unit { min-width: 0; display: grid; gap: 6px; }
.reg-filter-label { color: #596572; font-size: calc(9px + var(--font-adjust)); font-weight: 600; }
.reg-table-toolbar .segmented { width: 100%; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
.reg-table-toolbar .segmented button { flex: 1 0 auto; }
.reg-search-filter .table-search { width: 100%; max-width: none; background: #fff; }

/* شريط أدوات "قوائم الطلاب": فلتر مرحلة + فلتر نمط دراسة + بحث، بنفس وحدة الفلتر (تسمية فوق
   الأزرار) المستخدمة في طلبات التسجيل. يلتفّ على أكثر من سطر بدل تجاوز العرض. */
.students-page-tabs {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;
  margin-bottom: 22px; padding: 7px; border: 1px solid var(--line); border-radius: 12px;
  background: #fff; box-shadow: var(--shadow);
}
.students-page-tabs button {
  min-width: 0; min-height: 62px; display: flex; align-items: center; gap: 10px;
  padding: 10px 13px; border: 1px solid transparent; border-radius: 9px;
  color: var(--muted); background: transparent; text-align: right; cursor: pointer;
  transition: color .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
}
.students-page-tabs button:hover { color: var(--primary-dark); background: #fff8f8; }
.students-page-tabs button.active { color: var(--primary-dark); border-color: #edcfd1; background: var(--primary-soft); box-shadow: 0 3px 10px rgba(181,38,44,.06); }
.students-page-tabs button > svg { width: 20px; height: 20px; flex: 0 0 20px; }
.students-page-tabs button > span { min-width: 0; }
.students-page-tabs strong, .students-page-tabs small { display: block; }
.students-page-tabs strong { font-size: calc(12px + var(--font-adjust)); }
.students-page-tabs small { margin-top: 2px; color: var(--muted); font-size: calc(9.5px + var(--font-adjust)); font-weight: 400; }
.students-page-tabs button.active small { color: #8d5559; }

.students-table-toolbar { flex-wrap: wrap; justify-content: flex-start; gap: 12px 15px; }
.students-table-toolbar .students-search-unit { margin-inline-start: auto; }
.students-mode-badge { margin-inline-start: 0; }
.passed-stage-actions { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.passed-stage-actions .secondary-button { min-height: 34px; padding: 6px 10px; }
.passed-stage-detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.passed-stage-detail-card { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); }
.passed-stage-detail-card small, .passed-stage-detail-card strong { display: block; }
.passed-stage-detail-card small { color: var(--muted); font-size: calc(10px + var(--font-adjust)); }
.passed-stage-detail-card strong { margin-top: 4px; font-size: calc(15px + var(--font-adjust)); }
.passed-stage-detail-card.met strong { color: var(--green); }
.passed-stage-detail-card.not-met strong { color: var(--danger); }
.passed-stage-detail-summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; padding: 13px; border-radius: 11px; background: var(--green-soft); }
.passed-stage-detail-summary > span { display: flex; align-items: center; gap: 9px; }
.passed-stage-detail-summary svg { width: 20px; color: var(--green); }
@media (max-width: 760px) {
  .students-table-toolbar .students-search-unit { margin-inline-start: 0; }
  .students-page-tabs { display: flex; overflow-x: auto; scrollbar-width: thin; }
  .students-page-tabs button { flex: 0 0 210px; }
}
@media (max-width: 620px) {
  .students-page-tabs { margin-bottom: 17px; }
  .students-page-tabs button { flex-basis: 160px; min-height: 52px; }
  .students-page-tabs small { display: none; }
  .passed-stage-detail-grid { grid-template-columns: 1fr; }
}
#usersTable { min-width: 880px; }
#usersTable .reg-select-col { width: 40px; }
#usersTable tbody tr { transition: background .15s ease, box-shadow .15s ease; }
#usersTable tbody tr.is-selected { background: #fff5f6; box-shadow: inset -3px 0 var(--primary); }
.reg-person-copy { min-width: 0; }
.reg-person-name { min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.reg-person-name .soft-badge { margin-inline-start: 0; }
.regPastCell { display: block; max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: help; }
.reg-results-summary { color: #4f5b67; font-size: calc(10px + var(--font-adjust)); font-weight: 600; }
.reg-selected-count, #regVisibleCount { min-width: 20px; min-height: 19px; display: inline-grid; place-items: center; padding: 1px 6px; border-radius: 10px; line-height: 1; }
.reg-selected-count { color: var(--primary); background: #fff; }
#acceptSelectedBtn:disabled .reg-selected-count { color: #7f8993; background: #f0f2f4; }
#regVisibleCount { color: var(--primary-dark); background: var(--primary-soft); }
.reg-bulk-bar { min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; border-top: 1px solid var(--line); background: #fafbfc; }
.reg-bulk-bar strong, .reg-bulk-bar span { display: block; }
.reg-bulk-bar strong { color: var(--ink); font-size: calc(11px + var(--font-adjust)); }
.reg-bulk-bar span { margin-top: 2px; color: var(--muted); font-size: calc(9px + var(--font-adjust)); }
.reg-bulk-bar .secondary-button { flex: 0 0 auto; }
.reg-empty-state { min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; padding: 45px 20px !important; color: var(--muted); text-align: center; }
.reg-empty-state i { width: 40px; height: 40px; color: #c8ccd1; font-size: 34px; }
.reg-empty-state h3 { margin: 3px 0 0; color: var(--ink); font-size: calc(15px + var(--font-adjust)); }
.reg-empty-state p { margin: 0; max-width: 420px; font-size: calc(10px + var(--font-adjust)); }

.newStuModalContent { overflow: hidden; border: 0; border-radius: 12px; color: var(--ink); box-shadow: 0 20px 50px rgba(20,25,30,.18); font-family: "IBM Plex Sans Arabic", Arial, sans-serif; }
.newStuModalHeader { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 20px; border-bottom: 1px solid var(--line); background: #fff; }
.newStuModalHeader .modal-title { margin: 2px 0 0; color: var(--ink) !important; font-family: "Readex Pro", "IBM Plex Sans Arabic", sans-serif; font-size: calc(18px + var(--font-adjust)); font-weight: 600; }
.newStuModalBody { padding: 18px 20px; background: #fff; }
.newStuProfileSummary { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding: 13px; border: 1px solid var(--line); border-radius: var(--radius); background: #fafbfc; }
.newStuProfileSummary .avatar { width: 48px; height: 48px; flex-basis: 48px; }
.newStuProfileSummary > div:nth-child(2) { min-width: 0; }
.newStuProfileSummary strong, .newStuProfileSummary small { display: block; }
.newStuProfileSummary strong { overflow: hidden; color: var(--ink); text-overflow: ellipsis; white-space: nowrap; }
.newStuProfileSummary small { margin-top: 3px; color: var(--muted); font-size: calc(10px + var(--font-adjust)); }
.newStuSummaryBadges { display: flex; align-items: center; gap: 5px; margin-inline-start: auto; }
.newStuReviewNote { display: flex; align-items: flex-start; gap: 7px; margin: 0 0 16px; padding: 9px 11px; border-radius: 7px; color: #51636b; background: var(--blue-soft); font-size: calc(9px + var(--font-adjust)); line-height: 1.7; }
.newStuReviewNote i { width: 15px; margin-top: 3px; color: var(--blue); }
.newStuSectionHeading { display: flex; align-items: center; gap: 9px; margin-top: 2px; padding-bottom: 8px; border-bottom: 1px solid var(--line); color: var(--ink); font-size: calc(12px + var(--font-adjust)); font-weight: 700; }
.newStuSectionHeading::before { content: ""; width: 4px; height: 18px; border-radius: 2px; background: var(--primary); }
.newStuLabel { display: block; margin-bottom: 6px; color: #4c5864 !important; font-size: calc(10px + var(--font-adjust)); font-weight: 600; }
.newStuControl { width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 7px; outline: 0; color: var(--ink); background: #f8fafb; font-size: calc(11px + var(--font-adjust)); text-align: right; }
.newStuControl[readonly], .newStuControl[aria-readonly="true"] { color: #4f5b67; background: #f8fafb; }
select.newStuControl[aria-readonly="true"] { pointer-events: none; }
#newStuModal #timeBox, #newStuModal #cprBox, #newStuModal #mailBox, #newStuModal #phone { direction: ltr; text-align: left; }
.newStuTextarea { height: 92px; padding: 10px 12px; resize: none; line-height: 1.75; }
.newStuModalFooter { justify-content: flex-end !important; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: #fafbfc; }

@media (max-width: 1350px) {
  .reg-table-toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .reg-stage-filter { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
  .reg-table-toolbar { grid-template-columns: 1fr; }
  .reg-stage-filter { grid-column: auto; }
  #usersTable { min-width: 0; }
  #usersTable tbody td:first-child:not([colspan]) { display: flex; justify-content: flex-end; }
  .regPastCell { max-width: 100%; }
  .reg-bulk-bar { align-items: stretch; flex-direction: column; }
  .reg-bulk-bar .secondary-button { width: 100%; }
  .newStuProfileSummary { align-items: flex-start; flex-wrap: wrap; }
  .newStuSummaryBadges { width: 100%; margin-inline-start: 60px; }
  .newStuModalFooter { flex-wrap: wrap; }
  .newStuModalFooter button { flex: 1 1 130px; }
}

/* مؤشر بصري لحالة الترتيب برؤوس أعمدة الجداول (data-sort) — موحَّد لكل الجداول: طلبات
   التسجيل، الطلاب، المتعاونون، الحضور، الرسائل، الشهادات. كانت رؤوس الأعمدة قابلة للنقر
   فعليًا (الترتيب يعمل) لكن دون أي مؤشر بصري يوضّح ذلك أو يوضّح الحقل/الاتجاه الحاليين. */
th[data-sort] { cursor: pointer; user-select: none; }
th[data-sort]:hover { color: var(--primary); }
th[data-sort]::after { content: '↕'; display: inline-block; margin-inline-end: 4px; font-size: 10px; color: #c3cad1; vertical-align: middle; }
th[data-sort].sort-asc::after { content: '↑'; color: var(--primary); font-weight: 700; }
th[data-sort].sort-desc::after { content: '↓'; color: var(--primary); font-weight: 700; }

/* مواءمة تقويم flatpickr (التقويم المقيَّد بأيام الحضور) مع ألوان تصميم لوحة الإدارة الجديدة */
.flatpickr-calendar { font-family: inherit; box-shadow: 0 10px 30px rgba(0,0,0,.12); border-radius: 12px; }
.flatpickr-day.selected, .flatpickr-day.selected:hover { background: var(--primary); border-color: var(--primary); }
.flatpickr-day:hover { background: var(--primary-soft); }
.flatpickr-day.today { border-color: var(--primary); }
.flatpickr-months .flatpickr-month, .flatpickr-current-month input.cur-year, .flatpickr-weekdays { background: var(--primary-soft); }
.flatpickr-current-month .flatpickr-monthDropdown-months, .flatpickr-current-month input.cur-year { color: var(--primary); font-weight: 600; }
span.flatpickr-weekday { color: var(--primary); }
.flatpickr-months .flatpickr-prev-month:hover svg, .flatpickr-months .flatpickr-next-month:hover svg { fill: var(--primary); }

/* ============================================================
   شريط "دفعة قبول جارية" — ثابت (fixed) على كل صفحات لوحة الإدارة (مُحقَن مرة واحدة بالجافاسكربت
   في document.body عبر initAcceptBatchBanner، admin-js.html)، مرئي لكل الموظفين طالما توجد دفعة
   قبول جارية من أي أحد (استطلاع دوري لـgetAcceptBatchStatus)، بدل مودال محلي لا يراه إلا من بدأها.
   يحل محل مودال #loadingModal/#studentsList القديم بصفحة طلبات التسجيل. ============================================================ */
.accept-batch-banner {
  position: fixed; top: 14px; right: 50%; transform: translateX(50%);
  z-index: 500; width: min(460px, calc(100% - 24px));
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px 18px;
}
.accept-batch-banner[hidden] { display: none; }
.accept-batch-banner-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.accept-batch-banner-count {
  flex: 0 0 auto; padding: 4px 11px; border-radius: 6px; background: var(--soft); color: var(--ink);
  font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.accept-batch-banner-text { flex: 1; min-width: 0; }
.accept-batch-banner-text strong { display: block; font-size: 13.5px; color: var(--ink); }
.accept-batch-banner-text small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.accept-batch-banner-track { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.accept-batch-banner-fill { height: 100%; width: 0%; background: var(--primary); border-radius: inherit; transition: width .3s ease; }

/* شريطا متابعة حملات واتساب والإشعارات: مطويان افتراضيًا إلى أيقونة واحدة حتى لا يحجبا
   محتوى الصفحة. تبقى الأيقونة داخل البطاقة عند فتحها، ولذلك يعمل الزر نفسه للفتح والطي. */
.queue-global-banner {
  display: flex; align-items: center; gap: 11px; padding: 11px 13px;
  transition: width .2s ease, height .2s ease, padding .2s ease, border-radius .2s ease, top .2s ease;
  overflow: visible;
}
.queue-global-banner.is-collapsed {
  width: 50px; height: 50px; padding: 5px; border-radius: 50%;
}
.queue-global-toggle {
  position: relative; width: 40px; height: 40px; display: grid; place-items: center; flex: 0 0 40px;
  padding: 0; border: 0; border-radius: 50%; color: #687580; background: #eef1f3;
  cursor: pointer; transition: color .18s ease, background .18s ease, box-shadow .18s ease, transform .18s ease;
}
.queue-global-toggle:hover { transform: translateY(-1px); }
.queue-global-toggle:focus-visible { outline: 3px solid rgba(181, 38, 44, .2); outline-offset: 2px; }
.queue-global-toggle i { width: 18px; font-size: calc(16px + var(--font-adjust)); }
.queue-global-toggle::after {
  content: ""; position: absolute; inset: -4px; border: 2px solid transparent; border-radius: 50%; pointer-events: none;
}
.queue-global-banner.is-running .queue-global-toggle { color: #fff; background: var(--primary); box-shadow: 0 5px 14px rgba(181, 38, 44, .28); }
.queue-global-banner.is-running.is-collapsed .queue-global-toggle::after { border-color: rgba(181, 38, 44, .35); animation: queue-icon-pulse 1.6s ease-out infinite; }
.queue-global-banner.is-scheduled .queue-global-toggle { color: #76562f; background: var(--gold-soft); box-shadow: 0 5px 14px rgba(138, 102, 63, .17); }
.queue-global-content { min-width: 0; flex: 1; }
.queue-global-banner.is-collapsed .queue-global-content { display: none; }
.queue-global-banner .accept-batch-banner-head { margin-bottom: 8px; }
.queue-global-banner .accept-batch-banner-count { padding: 4px 9px; }
.queue-global-banner .accept-batch-banner-track { height: 5px; }
@keyframes queue-icon-pulse {
  0% { opacity: .8; transform: scale(.9); }
  75%, 100% { opacity: 0; transform: scale(1.35); }
}

@media (max-width: 620px) {
  .accept-batch-banner { top: 8px; width: calc(100% - 16px); padding: 11px 14px; }
  .queue-global-banner.is-collapsed { width: 48px; height: 48px; padding: 4px; }
  .queue-global-banner:not(.is-collapsed) { padding: 10px; }
  .queue-global-banner:not(.is-collapsed) .queue-global-toggle { width: 36px; height: 36px; flex-basis: 36px; }
