function empPfSetFieldValue(form, name, val){
  var field = form.elements.namedItem(name);
  if(field) field.value = val || '';
}

function empPfValidateField(field){
  var wrap = field.closest('.sp-input-wrap');
  if(!wrap) return field.checkValidity();
  var valid = field.checkValidity();
  wrap.classList.toggle('sp-invalid', !valid);
  var formField = field.closest('.sp-form-field');
  var message = formField ? formField.querySelector('.sp-field-message') : null;
  if(message && !valid){
    message.classList.add('error');
    message.textContent = field.validity.patternMismatch ? 'يرجى إدخال 8 أرقام صحيحة' : 'هذا الحقل مطلوب';
  }else if(message){
    message.classList.remove('error');
  }
  return valid;
}

function initEmpProfileTab(){
  var form = document.getElementById('empProfileForm');
  if(!form) return;

  var saveButton = document.getElementById('empSaveButton');
  var discardButton = document.getElementById('empDiscardButton');
  var saveState = document.getElementById('empPfSaveState');
  var unsavedIndicator = document.getElementById('empUnsavedIndicator');
  var avatarInput = document.getElementById('empPfAvatarInput');
  var avatarPreview = document.getElementById('empPfAvatarPreview');
  var initialState = '';

  pfInitPhoneCountrySelect(document.getElementById('empPhoneCountrySelect'), document.getElementById('empPhone'));
  applyDobAgeLimit(document.getElementById('empDob'));

  function activateTab(tabName){
    document.querySelectorAll('.sp-settings-tab[data-emp-tab]').forEach(function(button){
      button.classList.toggle('active', button.dataset.empTab === tabName);
    });
    document.querySelectorAll('.sp-settings-panel[data-emp-panel]').forEach(function(panel){
      var active = panel.dataset.empPanel === tabName;
      panel.hidden = !active;
      panel.classList.toggle('active', active);
    });
  }
  document.querySelectorAll('.sp-settings-tab[data-emp-tab]').forEach(function(button){
    button.addEventListener('click', function(){ activateTab(button.dataset.empTab); });
  });

  function serializeForm(){
    var data = {};
    new FormData(form).forEach(function(value, key){ data[key] = value; });
    return JSON.stringify(data);
  }

  function markDirty(){
    var dirty = serializeForm() !== initialState || !!empPfPendingAvatarBase64_;
    if(saveButton) saveButton.disabled = !dirty;
    if(discardButton) discardButton.disabled = !dirty;
    if(saveState){
      saveState.classList.toggle('dirty', dirty);
      saveState.querySelector('strong').textContent = dirty ? 'لديك تغييرات غير محفوظة' : 'جميع التغييرات محفوظة';
    }
    if(unsavedIndicator){
      unsavedIndicator.classList.toggle('dirty', dirty);
      unsavedIndicator.querySelector('strong').textContent = dirty ? 'تغييرات تنتظر الحفظ' : 'لا توجد تغييرات غير محفوظة';
    }
  }

  function syncDisplayName(){
    var fullNameEl = document.getElementById('empFullName');
    var fullName = (fullNameEl && fullNameEl.value.trim()) || '—';
    var displayEl = document.getElementById('empPfDisplayName');
    if(displayEl) displayEl.textContent = fullName;
  }

  function updateCompletion(){
    var required = ['fullName','dob','gender','nationality','email','phone'];
    var filled = required.filter(function(name){
      var field = form.elements.namedItem(name);
      return field && String(field.value).trim();
    }).length;
    var hasAvatar = avatarPreview && avatarPreview.src && avatarPreview.src.indexOf('id=1BifdUAOo6594jxvnkxOUiwXonhetUPpm') === -1;
    var percent = Math.round((filled / required.length) * 90) + (hasAvatar ? 10 : 0);
    percent = Math.min(percent, 100);
    var pctEl = document.getElementById('empPfCompletionPercent');
    var barEl = document.getElementById('empPfCompletionBar');
    var hintEl = document.getElementById('empPfCompletionHint');
    if(pctEl) pctEl.textContent = percent + '%';
    if(barEl) barEl.style.width = percent + '%';
    if(hintEl) hintEl.textContent = percent === 100 ? 'ملفك مكتمل وجاهز' : 'أضف صورة شخصية وتاريخ ميلاد';
  }

  form.addEventListener('input', function(event){
    if(event.target.matches('input, select')) empPfValidateField(event.target);
    if(event.target.id === 'empFullName') syncDisplayName();
    updateCompletion();
    markDirty();
  });
  form.addEventListener('change', function(){ updateCompletion(); markDirty(); });

  if(avatarInput && avatarPreview){
    avatarInput.addEventListener('change', function(){
      var file = avatarInput.files && avatarInput.files[0];
      if(!file) return;
      if(!/^image\/(png|jpe?g)$/.test(file.type)){
        alertMSG('صيغة الصورة غير مدعومة، يرجى اختيار png أو jpg', 'error');
        avatarInput.value = '';
        return;
      }
      if(file.size > 3 * 1024 * 1024){
        alertMSG('حجم الصورة يجب ألا يتجاوز 3 ميجابايت', 'error');
        avatarInput.value = '';
        return;
      }
      var reader = new FileReader();
      reader.onload = function(event){
        var dataUrl = event.target.result;
        avatarPreview.src = dataUrl;
        empPfPendingAvatarBase64_ = dataUrl.split(',')[1];
        empPfPendingAvatarMime_ = file.type;
        updateCompletion();
        markDirty();
      };
      reader.readAsDataURL(file);
    });
  }

  document.querySelectorAll('[data-emp-toggle-password]').forEach(function(button){
    button.addEventListener('click', function(){
      var input = document.getElementById(button.dataset.empTogglePassword);
      var showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      button.setAttribute('aria-label', showing ? 'إظهار كلمة المرور' : 'إخفاء كلمة المرور');
      button.innerHTML = '<i class="bi ' + (showing ? 'bi-eye' : 'bi-eye-slash') + '"></i>';
    });
  });

  var currentPasswordEl = document.getElementById('empCurrentPassword');
  var newPassword = document.getElementById('empNewPassword');
  var confirmPassword = document.getElementById('empConfirmPassword');
  var strength = form.querySelector('.sp-password-strength');
  var strengthText = document.getElementById('empPasswordStrengthText');
  var matchText = document.getElementById('empPasswordMatch');

  if(newPassword){
    newPassword.addEventListener('input', function(){
      var value = newPassword.value;
      var score = 0;
      if(value.length >= 8) score++;
      if(/[A-Zأ-ي]/.test(value) && /[a-zأ-ي]/.test(value)) score++;
      if(/\d/.test(value)) score++;
      if(/[^A-Za-z0-9أ-ي]/.test(value)) score++;
      strength.className = 'sp-password-strength ' + (['','weak','medium','good','strong'][score] || '');
      strengthText.textContent = ['لم تُدخل كلمة مرور','ضعيفة','متوسطة','جيدة','قوية'][score];
    });
  }
  if(confirmPassword){
    confirmPassword.addEventListener('input', function(){
      if(!confirmPassword.value){
        matchText.textContent = '';
        matchText.classList.remove('error');
        return;
      }
      var matches = newPassword.value === confirmPassword.value;
      matchText.textContent = matches ? 'كلمتا المرور متطابقتان' : 'كلمتا المرور غير متطابقتين';
      matchText.classList.toggle('error', !matches);
    });
  }

  function resetPasswordFields(){
    ['empCurrentPassword','empNewPassword','empConfirmPassword'].forEach(function(id){ var el = document.getElementById(id); if(el) el.value = ''; });
    if(strength) strength.className = 'sp-password-strength';
    if(strengthText) strengthText.textContent = 'لم تُدخل كلمة مرور';
    if(matchText){ matchText.textContent = ''; matchText.classList.remove('error'); }
  }

  form.addEventListener('submit', async function(event){
    event.preventDefault();
    var fields = Array.prototype.slice.call(form.querySelectorAll('input[required], select[required]'));
    var allValid = fields.map(empPfValidateField).every(Boolean);
    if(newPassword.value && newPassword.value !== confirmPassword.value){
      activateTab('security');
      alertMSG('يرجى التأكد من تطابق كلمتي المرور', 'error');
      return;
    }
    if(!allValid){
      var invalid = fields.find(function(field){ return !field.checkValidity(); });
      var panel = invalid.closest('.sp-settings-panel');
      activateTab(panel.dataset.empPanel);
      setTimeout(function(){ invalid.focus(); }, 250);
      alertMSG('يرجى مراجعة الحقول المطلوبة', 'error');
      return;
    }

    saveButton.disabled = true;
    loadingStart();
    try{
      if(empPfPendingAvatarBase64_){
        var avatarResult = await new Promise(function(resolve, reject){
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).uploadProfileAvatar(empPfCpr_, empPfPendingAvatarBase64_, empPfPendingAvatarMime_);
        });
        if(!avatarResult || !avatarResult.ok) throw new Error((avatarResult && avatarResult.message) || 'تعذّر رفع الصورة');
        empPfPendingAvatarBase64_ = null;
        empPfPendingAvatarMime_ = null;
      }

      var payload = {
        name: form.elements.namedItem('fullName').value,
        dob: form.elements.namedItem('dob').value,
        gender: form.elements.namedItem('gender').value,
        nationality: form.elements.namedItem('nationality').value,
        phone: pfComposePhoneValue(document.getElementById('empPhoneCountrySelect'), document.getElementById('empPhone'))
      };
      var saveResult = await new Promise(function(resolve, reject){
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).saveProfileData(empPfCpr_, payload);
      });
      if(!saveResult || !saveResult.ok) throw new Error((saveResult && saveResult.message) || 'تعذّر حفظ البيانات');

      if(newPassword.value){
        var pwResult = await new Promise(function(resolve, reject){
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).changePassword(empPfCpr_, currentPasswordEl.value, newPassword.value);
        });
        if(!pwResult || !pwResult.ok) throw new Error((pwResult && pwResult.message) || 'تعذّر تغيير كلمة المرور');
        empPfApplySecurityStatus(true);
      }

      resetPasswordFields();

function initEmpProfileEmailVerification(){
  var email = document.getElementById('empEmail');
  var methodInput = document.getElementById('empEmailVerificationMethod');
  var verifiedInput = document.getElementById('empEmailVerifiedState');
  var status = document.getElementById('empEmailStatus');
  var providerPanel = document.getElementById('empProviderEmailPanel');
  var manualPanel = document.getElementById('empManualEmailPanel');
  var providerIcon = document.getElementById('empProviderConnectedIcon');
  var providerLabel = document.getElementById('empProviderLabel');
  var providerEmailText = document.getElementById('empProviderEmailText');
  var switchAccount = document.getElementById('empSwitchProviderAccount');
  var sendCode = document.getElementById('empSendEmailCode');
  var codeArea = document.getElementById('empVerificationCodeArea');
  var codeInput = document.getElementById('empEmailVerificationCode');
  var verifyCode = document.getElementById('empVerifyEmailCode');
  var resendCode = document.getElementById('empResendEmailCode');
  var emailMessage = document.getElementById('empEmailMessage');
  var codeHint = document.getElementById('empCodeHint');
  var countdownTimer;
  if(!email || !methodInput) return;

  function notifyChange(){
    methodInput.dispatchEvent(new Event('change', { bubbles: true }));
  }

  function setStatus(state, label){
    status.className = 'sp-email-status ' + state;
    var icon = state === 'verified' ? 'bi-patch-check-fill' : state === 'pending' ? 'bi-clock' : 'bi-exclamation-circle';
    status.innerHTML = '<i class="bi ' + icon + '"></i><b>' + label + '</b>';
    verifiedInput.value = state === 'verified' ? 'true' : 'false';
    empPfApplyEmailStatus(state === 'verified');
  }

  var EMP_PF_PROVIDER_MARKS_ = {
    google: { cls: 'sp-google-mark', text: 'G', label: 'حساب Google المرتبط' },
    yahoo: { cls: 'sp-yahoo-mark', text: 'Y!', label: 'حساب Yahoo المرتبط' }
  };
  function renderProvider(method){
    if(method === 'microsoft'){
      providerIcon.className = 'sp-provider-connected-icon sp-microsoft-mark';
      providerIcon.innerHTML = '<i></i><i></i><i></i><i></i>';
      providerLabel.textContent = 'حساب Microsoft المرتبط';
    }else{
      var mark = EMP_PF_PROVIDER_MARKS_[method] || EMP_PF_PROVIDER_MARKS_.google;
      providerIcon.className = 'sp-provider-connected-icon ' + mark.cls;
      providerIcon.textContent = mark.text;
      providerLabel.textContent = mark.label;
    }
    providerEmailText.textContent = email.value;
  }

  function selectMethod(method, options){
    var config = options || {};
    document.querySelectorAll('[data-emp-email-method]').forEach(function(button){
      var active = button.dataset.empEmailMethod === method;
      button.classList.toggle('active', active);
      button.setAttribute('aria-selected', String(active));
    });

    methodInput.value = method;
    var manual = method === 'manual';
    providerPanel.hidden = manual;
    manualPanel.hidden = !manual;

    if(manual){
      if(!config.keepVerification) setStatus('unverified', 'غير متحقق');
      if(verifiedInput.value === 'true') setStatus('verified', 'تم التحقق يدويًا');
    }else if(config.linkedEmail){
      renderProvider(method);
      var verifiedLabels = { google: 'موثّق عبر Google', yahoo: 'موثّق عبر Yahoo', microsoft: 'موثّق عبر Microsoft' };
      setStatus('verified', verifiedLabels[method] || verifiedLabels.google);
      codeArea.hidden = true;
      codeInput.value = '';
    }
  }

  function startLinkFlow(method, btn){
    if(typeof startOAuthRelay !== 'function'){
      alertMSG('تعذّر فتح نافذة الربط، يرجى إعادة تحميل الصفحة والمحاولة مجددًا', 'error');
      return;
    }
    startOAuthRelay(method, btn, null, function(verifiedEmail){
      loadingStart();
      google.script.run.withSuccessHandler(function(result){
        loadingEnd();
        if(!result || !result.ok){
          alertMSG((result && result.message) || 'تعذّر ربط الحساب', 'error');
          return;
        }
        email.value = result.email;
        selectMethod(method, { linkedEmail: true });
        notifyChange();
        alertMSG('تم ربط البريد والتحقق منه بنجاح', 'success');
      }).withFailureHandler(function(err){
        loadingEnd();
        alertMSG('تعذّر ربط الحساب: ' + err, 'error');
      }).linkVerifiedEmailToProfile(empPfCpr_, verifiedEmail);
    });
  }

  function startCountdown(seconds){
    clearInterval(countdownTimer);
    seconds = seconds || 75;
    resendCode.disabled = true;
    resendCode.innerHTML = 'إعادة الإرسال بعد <b id="empCodeCountdown">' + seconds + '</b> ثانية';
    var liveCountdown = resendCode.querySelector('b');
    countdownTimer = setInterval(function(){
      seconds -= 1;
      liveCountdown.textContent = seconds;
      if(seconds <= 0){
        clearInterval(countdownTimer);
        resendCode.disabled = false;
        resendCode.textContent = 'إعادة إرسال الرمز';
      }
    }, 1000);
  }

  function sendVerificationCode(){
    if(!email.checkValidity()){
      email.closest('.sp-input-wrap').classList.add('sp-invalid');
      emailMessage.classList.add('error');
      emailMessage.textContent = 'يرجى كتابة بريد إلكتروني صحيح';
      email.focus();
      return;
    }
    email.closest('.sp-input-wrap').classList.remove('sp-invalid');
    emailMessage.classList.remove('error');

    sendCode.disabled = true;
    google.script.run.withSuccessHandler(function(result){
      sendCode.disabled = false;
      if(!result || !result.ok){
        if(result && result.cooldown){
          alertMSG('يرجى الانتظار قليلًا قبل طلب رمز جديد', 'warning');
          codeArea.hidden = false;
          startCountdown(result.retryAfterSeconds);
          return;
        }
        alertMSG((result && result.message) || 'تعذّر إرسال رمز التحقق', 'error');
        return;
      }
      emailMessage.textContent = 'تم إرسال الرمز إلى ' + email.value;
      codeArea.hidden = false;
      codeInput.value = '';
      setStatus('pending', 'بانتظار الرمز');
      startCountdown(result.cooldownSeconds);
      notifyChange();
      codeInput.focus();
      alertMSG('تم إرسال رمز التحقق إلى بريدك الإلكتروني', 'success');
    }).withFailureHandler(function(err){
      sendCode.disabled = false;
      alertMSG('تعذّر إرسال رمز التحقق: ' + err, 'error');
    }).requestRegistrationOtp(empPfCpr_, email.value);
  }

  if(!email.dataset.pfWired){
    email.dataset.pfWired = '1';

    document.querySelectorAll('[data-emp-email-method]').forEach(function(button){
      button.addEventListener('click', function(){
        var method = button.dataset.empEmailMethod;
        if(method === 'manual'){
          selectMethod('manual');
          notifyChange();
        }else{
          startLinkFlow(method, button);
        }
      });
    });

    if(switchAccount){
      switchAccount.addEventListener('click', function(){
        startLinkFlow(methodInput.value, switchAccount);
      });
    }

    if(sendCode) sendCode.addEventListener('click', sendVerificationCode);
    if(resendCode) resendCode.addEventListener('click', sendVerificationCode);

    if(codeInput){
      codeInput.addEventListener('input', function(){
        codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6);
        codeHint.classList.remove('error');
        codeHint.textContent = 'أدخل الرمز المرسَل إلى بريدك';
      });
    }

    if(verifyCode){
      verifyCode.addEventListener('click', function(){
        if(codeInput.value.length !== 6){
          codeHint.classList.add('error');
          codeHint.textContent = 'يرجى إدخال الرمز المكوّن من 6 أرقام';
          codeInput.focus();
          return;
        }
        verifyCode.disabled = true;
        google.script.run.withSuccessHandler(function(result){
          verifyCode.disabled = false;
          if(!result || !result.ok){
            codeHint.classList.add('error');
            codeHint.textContent = (result && result.message) || 'الرمز غير صحيح';
            codeInput.closest('.sp-input-wrap').classList.add('sp-invalid');
            codeInput.focus();
            return;
          }
          clearInterval(countdownTimer);
          codeInput.closest('.sp-input-wrap').classList.remove('sp-invalid');
          codeHint.classList.remove('error');
          codeHint.textContent = 'تم التحقق من البريد بنجاح';
          email.value = result.email;
          setStatus('verified', 'تم التحقق يدويًا');
          notifyChange();
          alertMSG('تم تفعيل بريدك الإلكتروني بنجاح', 'success');
        }).withFailureHandler(function(err){
          verifyCode.disabled = false;
          alertMSG('تعذّر التحقق من الرمز: ' + err, 'error');
        }).confirmProfileEmail(empPfCpr_, codeInput.value);
      });
    }

    email.addEventListener('input', function(){
      if(methodInput.value !== 'manual') return;
      codeArea.hidden = true;
      codeInput.value = '';
      setStatus('unverified', 'غير متحقق');
      emailMessage.classList.remove('error');
      emailMessage.textContent = 'سنرسل رمز تحقق مكوّنًا من 6 أرقام';
    });
  }

  var initialMethod = methodInput.value || 'manual';
  selectMethod(initialMethod, {
    silent: true,
    keepVerification: verifiedInput.value === 'true'
  });
}

function toggleUserMenu(e) {
  // 1. إيقاف الحدث تماماً حتى لا يصل للـ document ويغلق القائمة فوراً
  if(e) {
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation(); // هذه هي الضربة القاضية للمشكلة
  }

  var menu = document.getElementById('pages');
  var btn = document.getElementById('userList');

  if (!menu) return;

  // 2. التبديل المنطقي
  // نستخدم getComputedStyle للتأكد من الحالة الحقيقية للعنصر
  var isVisible = window.getComputedStyle(menu).display === 'block';

  if (isVisible) {
    menu.style.display = 'none';
    menu.classList.remove('show');
    if(btn) btn.classList.remove('show');
  } else {
    menu.style.display = 'block';
    menu.classList.add('show');
    if(btn) btn.classList.add('show');
    
    // 3. تثبيت المكان (مهم جداً)
    menu.style.position = 'absolute';
    menu.style.top = '100%';
    menu.style.left = '0'; // أو right: 0 حسب الرغبة
    menu.style.zIndex = '10000';
    menu.style.direction = 'rtl';
  }
}

// كود الإغلاق عند الضغط في الخارج
// (تأكد أن هذا الكود موجود مرة واحدة فقط في المشروع)
function closeUserMenu (e) {
  var menu = document.getElementById('pagesMenu');
  var btn = document.getElementById('userList');
  
  // إذا كانت القائمة مفتوحة، والضغطة لم تكن على الزر ولا على القائمة نفسها
  if (menu && menu.style.display === 'block') {
    if (btn && !btn.contains(e.target) && !menu.contains(e.target)) {
      menu.style.display = 'none';
      menu.classList.remove('show');
      if(btn) btn.classList.remove('show');
    }
  }
}

function setQuestionsData(){
  spExamBindStaticEvents();
  loadingStart();
  google.script.run.withSuccessHandler(function(res){
    if(res && res.blocked){
      loadingEnd();
      // حالة خاصة: تعرض زرًّا ينقل الطالب فعليًا لتبويب اختيار المذهب بدل تنبيه نصّي وحده — كان
      // مقرَّرًا سابقًا ولم يُنفَّذ، بطلب المستخدم صراحةً. نستدعي نفس آلية التنقّل القائمة أصلًا
      // (نقرة حقيقية على #mazhabNav) بدل بناء منطق تنقّل موازٍ.
      if(res.reason === 'missing-madhab'){
        Swal.fire({
          title: 'يلزم اختيار مذهبك الفقهي أولًا',
          text: 'لم تختر مذهبك الفقهي بعد، ولا يمكن بدء اختبار الفقه قبل ذلك.',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'اختيار المذهب الآن',
          cancelButtonText: 'إلغاء'
        }).then(function(result){
          if(result.isConfirmed){
            var mazhabNavEl = document.getElementById('mazhabNav');
            if(mazhabNavEl) mazhabNavEl.click();
          }
        });
        return;
      }
      var blockedMsgs = {
        'retake-closed': 'لقد رسبت في هذا الاختبار، وإعادة المحاولة مغلقة حاليًا — راجع الإدارة',
        'already-recorded': 'سبق تسجيل نتيجة ناجحة لك في هذا الاختبار',
        'time-expired': 'انتهى وقت جلستك السابقة وتم تصحيح الإجابات المحفوظة',
        'exam-closed': 'الاختبار غير متاح في الوقت الحالي',
        'wrong-level': 'هذا الاختبار لا يخص مرحلتك النشطة الحالية',
        'no-approved-model': 'لا يوجد حاليًا نموذج أسئلة معتمد يناسب هذا الاختبار — تم تنبيه الإدارة',
        'busy': 'النظام مشغول للحظات، يرجى المحاولة مرة أخرى'
      };
      alertMSG(blockedMsgs[res.reason] || 'تعذّر بدء الاختبار حاليًا — راجع الإدارة', 'info');
      // كانت الصفحة تبقى عالقة بحالتها الافتراضية (شرطات "—" و"جارٍ التحميل" بلا توقف) عند
      // الحظر — الطالب يرى توستًا عابرًا فقط بلا أي مخرج فعلي من صفحة معطَّلة. الرجوع للوحة
      // الطالب فورًا (نفس مسار "الرئيسية") يضمن عدم بقائه على صفحة اختبار ميتة لا يمكنه فعل شيء
      // بها. راجع مناقشات.md.
      loadStudent();
      return;
    }
    questions = (res && res.questions ? res.questions : []).slice();
    examSessionId = res ? res.sessionId : null;
    examServerSavedAnswers_ = res && Array.isArray(res.savedAnswers) ? res.savedAnswers : [];
    if(res && res.branch) branch = res.branch;
    if(res && res.level !== undefined) currentLevel = res.level;
    examEndTime = res ? res.endTime : null;
    examStartTime = res ? res.startTime : null;
    if(res && res.endTime && res.startTime) md = Math.max(1, Math.round((res.endTime - res.startTime) / 60000));
    if(res && res.resumed) alertMSG('تم استكمال جلستك السابقة بنفس الأسئلة والإجابات المحفوظة، والعدّاد لم يتوقف.', 'info');
    setExamBody();
  }).withFailureHandler(function(err){
    loadingEnd();
    alertMSG('تعذّر تحميل أسئلة الاختبار، يرجى إعادة المحاولة', 'error');
  }).getQuestions(studentData[0].cpr, currentExamId);
}

// ربط أحداث العناصر الثابتة بالصفحة (لا تعتمد على وصول الأسئلة) — مرة واحدة فقط لكل تحميل للصفحة
function spExamBindStaticEvents(){
  document.getElementById('spExamSubmitBtn')?.addEventListener('click', function(){
    if(document.getElementById('setAnswer').dataset.submitted) return; // بعد التسليم يتولى onclick الجديد (رجوع) وحده مسؤولية الزر
    spExamOpenSubmitDialog();
  });
  document.getElementById('spExamFirstUnanswered')?.addEventListener('click', function(){
    for(var i=0; i<questions.length; i++){
      var checks = document.getElementsByName('myanswer'+(i+1));
      if(!Array.prototype.some.call(checks, function(r){ return r.checked; })){
        spExamJumpTo(i);
        return;
      }
    }
    alertMSG('أجبت عن جميع الأسئلة. يمكنك مراجعتها قبل التسليم.', 'success');
  });
  document.getElementById('spExamModalConfirm')?.addEventListener('click', function(){ submitAnswers(false); });
  document.getElementById('spExamModalCancel')?.addEventListener('click', spExamCloseModal);
  document.getElementById('spExamModalClose')?.addEventListener('click', spExamCloseModal);
  document.getElementById('spExamModal')?.addEventListener('click', function(event){
    if(event.target.id === 'spExamModal') spExamCloseModal();
  });
  if(!spExamKeydownBound_){
    document.addEventListener('keydown', function(event){
      var modal = document.getElementById('spExamModal');
      if(event.key === 'Escape' && modal && !modal.hidden) spExamCloseModal();
    });
    spExamKeydownBound_ = true;
  }
}

function setExamBody(){
  var examContainer = document.getElementById('examDiv');
  var mapContainer = document.getElementById('spExamQuestionMap');
  var emptyState = document.getElementById('examEmptyState');
  var overview = document.getElementById('spExamOverview');
  var quesTemp = document.getElementById('quesCardTemp').content;
  var radiosTemp = document.getElementById('radiosTemp').content;

  // رأس الصفحة/المقدمة — تُملأ من البيانات الحقيقية فور وصولها (بلا بيانات وهمية كالمرجع الأصلي)
  var levelNames = ['المرحلة التأهيلية','المرحلة التأسيسية','المرحلة التأصيلية','المرحلة التحصيلية'];
  var stu = studentData[0];
  document.getElementById('spExamLevelLabel').textContent = levelNames[currentLevel] || '';
  document.getElementById('spExamNameLabel').textContent = branch;
  document.getElementById('spExamTitle').textContent = branch;
  document.getElementById('spExamStudentName').textContent = stu.name;
  document.getElementById('spExamStudentInitial').textContent = (stu.name || '').trim().charAt(0);
  document.getElementById('spExamFactCount').textContent = questions.length + ' ' + (questions.length === 1 ? 'سؤال' : 'أسئلة');
  document.getElementById('spExamFactDuration').textContent = md + ' دقيقة';
  document.getElementById('spExamTotalCount').textContent = questions.length;

  examContainer.innerHTML = '';
  if(mapContainer) mapContainer.innerHTML = '';
  examReviewSet_ = new Set();

  if(questions.length > 0){
    if(emptyState) emptyState.classList.add('d-none');

    questions.forEach(function(e,index){
      var quesCard = quesTemp.cloneNode(true);
      var article = quesCard.querySelector('.sp-exam-question-card');
      var numB = quesCard.querySelector('.sp-exam-question-number b');
      var numText = quesCard.querySelector('.sp-exam-question-number-text');
      var quesTitle = quesCard.querySelector('.quesTitle');
      var reviewBtn = quesCard.querySelector('.sp-exam-review-btn');
      var answerDiv = quesCard.querySelector('.answerDiv');

      article.id = 'spExamQuestion-' + (index+1);
      article.dataset.question = index;
      numB.textContent = index+1;
      numText.textContent = 'السؤال ' + (index+1) + ' من ' + questions.length;
      quesTitle.textContent = e.question;
      reviewBtn.dataset.review = index;

      e.answers.forEach(function(r,ind){
        if(r !== ''){
          var answer = radiosTemp.cloneNode(true);
          var checkBox = answer.querySelector('input');
          var checkLbl = answer.querySelector('span');
          checkBox.name = 'myanswer'+(index+1);
          checkBox.id = 'checkBox'+(index+1)+'-'+(ind+1);
          checkLbl.textContent = r;
          checkBox.value = r;
          answerDiv.appendChild(answer);
        }
      })

      examContainer.appendChild(quesCard);

      var mapBtn = document.createElement('button');
      mapBtn.type = 'button';
      mapBtn.dataset.jump = index;
      mapBtn.setAttribute('aria-label', 'الانتقال إلى السؤال ' + (index+1));
      mapBtn.textContent = index+1;
      if(mapContainer) mapContainer.appendChild(mapBtn);
    })

    if(!examContainer.dataset.eventsWired){
      examContainer.addEventListener('change', function(event){
        if(!event.target.matches('input[type="radio"]')) return;
        var card = event.target.closest('.sp-exam-question-card');
        if(card) card.classList.remove('needs-answer');
        var alertEl = document.getElementById('spExamValidationAlert');
        if(alertEl) alertEl.hidden = true;
        saveExamAutosave();
        spExamUpdateProgress();
      });
      examContainer.addEventListener('click', function(event){
        var reviewBtn = event.target.closest('.sp-exam-review-btn');
        if(!reviewBtn) return;
        var index = Number(reviewBtn.dataset.review);
        if(examReviewSet_.has(index)) examReviewSet_.delete(index); else examReviewSet_.add(index);
        var active = examReviewSet_.has(index);
        reviewBtn.classList.toggle('active', active);
        reviewBtn.setAttribute('aria-pressed', String(active));
        reviewBtn.querySelector('i').className = active ? 'bi bi-bookmark-fill' : 'bi bi-bookmark';
        spExamUpdateMap();
      });
      examContainer.dataset.eventsWired = '1';
    }

    if(mapContainer && !mapContainer.dataset.wired){
      mapContainer.addEventListener('click', function(event){
        var btn = event.target.closest('[data-jump]');
        if(!btn) return;
        spExamJumpTo(Number(btn.dataset.jump));
      });
      mapContainer.dataset.wired = '1';
    }

    restoreExamAutosave();
    spExamUpdateProgress();

    if(spExamObserver_) spExamObserver_.disconnect();
    spExamObserver_ = new IntersectionObserver(function(entries){
      var visible = entries.filter(function(en){ return en.isIntersecting; })
        .sort(function(a,b){ return b.intersectionRatio - a.intersectionRatio; })[0];
      if(!visible) return;
      document.querySelectorAll('#spExamQuestionMap [data-jump]').forEach(function(b){ b.classList.remove('current'); });
      var current = document.querySelector('#spExamQuestionMap [data-jump="' + visible.target.dataset.question + '"]');
      if(current){
        current.classList.add('current');
        spExamCenterMapButton(current);
      }
    }, { rootMargin: '-25% 0px -55% 0px', threshold: [0.1, 0.4] });
    document.querySelectorAll('.sp-exam-question-card').forEach(function(card){ spExamObserver_.observe(card); });

    if(!examBeforeUnloadBound_){
      window.addEventListener('beforeunload', examBeforeUnload);
      examBeforeUnloadBound_ = true;
    }

    startExamTimer(examEndTime);
    startExamHeartbeat_();
  }else{
    if(emptyState) emptyState.classList.remove('d-none');
    var submitBtnEl = document.getElementById('spExamSubmitBtn');
    if(submitBtnEl) submitBtnEl.disabled = true;
    var completionEl = document.getElementById('spExamCompletionCopy');
    if(completionEl) completionEl.textContent = 'لا توجد أسئلة';
  }

  if(overview) overview.classList.remove('sp-exam-loading');
  loadingEnd();
}

function spExamUpdateProgress(){
  var total = questions.length;
  var answered = 0;
  for(var i=0; i<total; i++){
    var checks = document.getElementsByName('myanswer'+(i+1));
    if(Array.prototype.some.call(checks, function(r){ return r.checked; })) answered++;
  }
  var percent = total > 0 ? Math.round((answered/total)*100) : 0;
  var answeredEl = document.getElementById('spExamAnsweredCount');
  var progressBar = document.getElementById('spExamProgressBar');
  var completionEl = document.getElementById('spExamCompletionCopy');
  if(answeredEl) answeredEl.textContent = answered;
  if(progressBar) progressBar.style.width = percent + '%';
  if(completionEl){
    completionEl.textContent = answered === 0 ? 'لم تبدأ الإجابة بعد'
      : answered === total ? 'اكتملت الإجابات، راجعها ثم سلّم'
      : 'تبقّى ' + (total-answered) + ' ' + ((total-answered) === 1 ? 'سؤال' : 'أسئلة');
  }
  spExamUpdateMap();
}

function spExamUpdateMap(){
  document.querySelectorAll('#spExamQuestionMap [data-jump]').forEach(function(btn){
    var index = Number(btn.dataset.jump);
    var checks = document.getElementsByName('myanswer'+(index+1));
    var answered = Array.prototype.some.call(checks, function(r){ return r.checked; });
    btn.classList.toggle('answered', answered && !examReviewSet_.has(index));
    btn.classList.toggle('review', examReviewSet_.has(index));
  });
}

function spExamJumpTo(index){
  var card = document.getElementById('spExamQuestion-' + (index+1));
  if(!card) return;
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  card.setAttribute('tabindex', '-1');
  card.focus({ preventScroll: true });
  setTimeout(function(){ card.removeAttribute('tabindex'); }, 800);

  var mapBtn = document.querySelector('#spExamQuestionMap [data-jump="' + index + '"]');
  if(mapBtn) spExamCenterMapButton(mapBtn);
}

// يُوسِّط رقم السؤال الحالي أفقيًا داخل شريط خريطة الأسئلة (مهم خصوصًا على الجوال، حيث الشريط
// سطر واحد قابل للسحب يمينًا/يسارًا لا شبكة متعددة الأسطر) — بلا أثر على تخطيط سطح المكتب (الشريط

// حفظ/استرجاع إجابات الاختبار محليًا (localStorage) لتفادي فقدانها لو أُعيد تحميل الصفحة أو
// أُغلقت بالخطأ أثناء الاختبار — الوقت والأسئلة نفسها محفوظة فعليًا على الخادم (جلسة CacheService
// بـgetQuestions/submitAnswerData)، فإعادة التحميل لن تُصفّر الوقت ولن تُبدّل النموذج، لكن
// الإجابات المُختارة كانت (قبل هذا التعديل) موجودة بالمتصفح فقط فتُفقد لو حصل تحديث للصفحة.

function examAutosaveKey(){
  return 'examAutosave_' + studentData[0].cpr + '_' + (currentExamId || branch) + '_' + currentLevel;
}

function collectExamAnswerEntries_(){
  var entries = [];
  var titles = document.getElementsByClassName('quesTitle');
  for(var i=0; i<titles.length; i++){
    var selected = '', checks = document.getElementsByName('myanswer' + (i + 1));
    for(var c=0; c<checks.length; c++) if(checks[c].checked) selected = checks[c].value;
    entries.push(titles[i].textContent + '%' + selected);
  }
  return entries;
}

function pushExamProgress_(){
  if(!examSessionId || !studentData || !studentData[0]) return;
  google.script.run.withSuccessHandler(function(res){
    if(res && res.reason === 'time-expired' && res.result && res.result.ok) handleSubmitResult(res.result);
  }).withFailureHandler(function(){ /* الحفظ المحلي يبقى شبكة أمان عند انقطاع الاتصال */ })
    .saveExamSessionProgress(studentData[0].cpr, examSessionId, collectExamAnswerEntries_());
}

function startExamHeartbeat_(){
  if(examHeartbeatInterval_) clearInterval(examHeartbeatInterval_);
  pushExamProgress_();
  examHeartbeatInterval_ = setInterval(pushExamProgress_, 30000);
}

function stopExamHeartbeat_(){
  if(examHeartbeatInterval_){ clearInterval(examHeartbeatInterval_); examHeartbeatInterval_ = null; }
  if(examProgressSaveTimer_){ clearTimeout(examProgressSaveTimer_); examProgressSaveTimer_ = null; }
}

function saveExamAutosave(){
  try{
    var answers = {};
    document.querySelectorAll('#examDiv input[type="radio"]:checked').forEach(function(r){ answers[r.name] = r.value; });
    localStorage.setItem(examAutosaveKey(), JSON.stringify({ answers: answers, ts: Date.now() }));
  }catch(err){}
  if(examProgressSaveTimer_) clearTimeout(examProgressSaveTimer_);
  examProgressSaveTimer_ = setTimeout(pushExamProgress_, 800);
}

function restoreExamAutosave(){
  function applyEntries(entries){
    (entries || []).forEach(function(entry, idx){
      var sep = String(entry).indexOf('%');
      if(sep < 0) return;
      var question = String(entry).substring(0, sep), answer = String(entry).substring(sep + 1);
      if(!answer || !questions[idx] || String(questions[idx].question) !== question) return;
      var inputs = document.getElementsByName('myanswer' + (idx + 1));
      for(var i=0; i<inputs.length; i++) if(inputs[i].value === answer){ inputs[i].checked = true; break; }
    });
  }
  try{
    applyEntries(examServerSavedAnswers_);
    var raw = localStorage.getItem(examAutosaveKey());
    if(!raw) return;
    var saved = JSON.parse(raw).answers || {};
    Object.keys(saved).forEach(function(name){
      var inputs = document.getElementsByName(name);
      for(var i=0; i<inputs.length; i++){
        if(inputs[i].value === saved[name]){ inputs[i].checked = true; break; }
      }
    });
  }catch(err){}
}

function clearExamAutosave(){
  try{ localStorage.removeItem(examAutosaveKey()); }catch(err){}
}

function examBeforeUnload(e){
  e.preventDefault();
  e.returnValue = '';
}

// forced=true: تسليم قسري عند انتهاء الوقت — يُرسل ما أُجيب عليه فعليًا، ويُعامل أي سؤال بلا إجابة
// كخطأ، بلا تحقق تفاعلي ولا نافذة تأكيد (بخلاف التسليم اليدوي العادي عبر نافذة التأكيد الذي يتحقق
// أولًا من اكتمال الإجابات، ويهزّ بطاقة أول سؤال ناقص + يُظهر تنبيهًا مطابقًا لتصميم المرجع).
function submitAnswers(forced){
  var formEl = document.getElementById('setAnswer');
  if(formEl && formEl.dataset.submitted) return; // يمنع إرسالًا مضاعفًا (تسليم يدوي + تلقائي بنفس اللحظة)

  var answerTitles = document.getElementsByClassName('quesTitle');
  if(answerTitles.length === 0) return;

  if(!forced){
    for(var i=0; i<answerTitles.length; i++){
      var iChecks = document.getElementsByName('myanswer' + (i+1));
      var iAnswered = Array.prototype.some.call(iChecks, function(r){ return r.checked; });
      if(!iAnswered){
        spExamCloseModal();
        var alertEl = document.getElementById('spExamValidationAlert');
        alertEl.hidden = false;
        alertEl.querySelector('span').textContent = 'لم تُجب عن السؤال ' + (i+1) + '. أكمل جميع الإجابات قبل التسليم.';
        var card = document.getElementById('spExamQuestion-' + (i+1));
        if(card) card.classList.add('needs-answer');
        spExamJumpTo(i);
        return;
      }
    }
  }

  spExamCloseModal();
  loadingStart();

  var data = collectExamAnswerEntries_();

  if(formEl) formEl.dataset.submitted = '1';

  google.script.run.withSuccessHandler(handleSubmitResult)
  .withFailureHandler(function(err){
    if(formEl) delete formEl.dataset.submitted; // يسمح بمحاولة تسليم أخرى بعد فشل الاتصال
    loadingEnd();
    alertMSG('تعذّر إرسال إجاباتك، يرجى المحاولة مرة أخرى', 'error');
  }).submitAnswerData(studentData[0].cpr, data, examSessionId);
}

///////////////////////////////////////////////////////////////////////////
// معالجة استجابة الخادم بعد التسليم — التصحيح والدرجة كلاهما محسوبان على الخادم بالكامل
// (submitAnswerData)، فهذه الدالة للعرض فقط ولا تُعيد حساب أي شيء.
function handleSubmitResult(res){
  loadingEnd();

  if (!res || !res.ok) {
    var reasonMsgs = {
      'already-recorded': 'سبق تسجيل نتيجتك في هذا الاختبار',
      'time-expired': 'انتهى الوقت المسموح لهذا الاختبار قبل إرسال إجاباتك',
      'no-session': 'تعذّر التحقق من جلسة الاختبار، يرجى إعادة المحاولة من البداية',
      'retake-closed': 'لقد رسبت في هذا الاختبار، وإعادة المحاولة مغلقة حاليًا — راجع الإدارة'
    };
    var msg = (res && reasonMsgs[res.reason]) || 'تعذّر تسجيل إجابتك';
    var formEl = document.getElementById('setAnswer');
    if(formEl) delete formEl.dataset.submitted;
    alertMSG(msg, 'info');
    return;
  }

  stopExamHeartbeat_();

  // كشف النتيجة (تصحيح الأسئلة + مودال الدرجة) يبقى وراء استبيان ما بعد الاختبار الإلزامي
  // (survey-js.html) — لا يُستدعى إلا من داخل done، بعد تسليم الاستبيان فعليًا.
  function revealExamResult(){
    // مراجعة الإجابات (تظليل الصحيح بالأخضر وتمييز الخطأ) بتحكم إداري صريح لكل اختبار
    // (showAnswerReview بشيت rules) — لو false فres.results أصلًا وصل فارغًا من الخادم (لا
    // إجابة صحيحة تُرسَل للعميل إطلاقًا في هذه الحالة)، فلا داعي/فائدة لاستدعاء renderExamResults.
    if(res.showReview) renderExamResults(res);
    clearExamAutosave();
    if(examBeforeUnloadBound_){
      window.removeEventListener('beforeunload', examBeforeUnload);
      examBeforeUnloadBound_ = false;
    }
    if(spExamObserver_){ spExamObserver_.disconnect(); spExamObserver_ = null; }
    if(spExamTimerInterval_){ clearInterval(spExamTimerInterval_); spExamTimerInterval_ = null; } // تسليم ناجح قبل انتهاء الوقت: يوقف العدّاد بدل تركه يعمل بالخلفية بلا فائدة بعد ظهور النتيجة

    var submitBtn = document.getElementById('spExamSubmitBtn');
    if(submitBtn){
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="bi bi-arrow-right"></i><span>العودة إلى بوابة الطالب</span>';
      submitBtn.onclick = function(){ loadStartData(); };
    }

    spExamShowResultModal(res);
  }

  showPostExamSurveyGate(branch, currentLevel, revealExamResult);
}

function spExamShowResultModal(res){
  document.getElementById('spExamConfirmTitle').textContent = 'نتيجتك ' + res.degree + '%';
  document.getElementById('spExamConfirmMessage').textContent = res.showReview
    ? ('أجبت إجابة صحيحة عن ' + res.correctCount + ' من ' + res.totalCount + ' أسئلة. يمكنك مراجعة التصحيح الآن.')
    : ('أجبت إجابة صحيحة عن ' + res.correctCount + ' من ' + res.totalCount + ' أسئلة.');
  document.getElementById('spExamDialogKicker').textContent = 'تم تسجيل الإجابات';
  var iconEl = document.getElementById('spExamDialogIcon');
  if(iconEl) iconEl.className = 'bi bi-award';
  document.getElementById('spExamDialogSummary').innerHTML =
    '<span>النتيجة<strong>' + res.degree + '%</strong></span>' +
    '<span>الإجابات الصحيحة<strong>' + res.correctCount + ' من ' + res.totalCount + '</strong></span>';
  // مراجعة الإجابات (سؤالًا سؤالًا مع الإجابة الصحيحة) بتحكم إداري صريح — showAnswerReview
  // بشيت rules (submitAnswerData). لو مغلقة: نفس الزر لكن يُغلق المودال فقط، بلا مراجعة إطلاقًا.
  document.getElementById('spExamDialogActions').innerHTML = res.showReview
    ? '<button class="sp-exam-primary-btn" type="button" id="spExamReviewBtn"><i class="bi bi-eye"></i>مراجعة الإجابات</button>'
    : '<button class="sp-exam-primary-btn" type="button" id="spExamReviewBtn"><i class="bi bi-check2"></i>حسنًا</button>';
  document.getElementById('spExamModal').hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('spExamReviewBtn').addEventListener('click', spExamCloseModal);
}

function renderExamResults(res) {
  const results = res.results || [];
  const resultMap = {};
  results.forEach(function(r){ resultMap[r.question] = r; });

  const answerTitles = document.getElementsByClassName('quesTitle');

  for (let i = 0; i < answerTitles.length; i++) {
    const quesText = answerTitles[i].textContent.trim();
    const result = resultMap[quesText];
    if (!result) continue;

    const checks = document.getElementsByName('myanswer' + (i + 1));
    checks.forEach(ch => ch.disabled = true);

    for (let c = 0; c < checks.length; c++) {
      const lbl = checks[c].closest('label') || checks[c].parentElement;
      lbl.classList.remove('sp-exam-correct-answer', 'sp-exam-wrong-answer');

      if (checks[c].value.toString() === result.trueAnswer.toString()) {
        lbl.classList.add('sp-exam-correct-answer');
      }
      if (checks[c].checked && !result.correct) {
        lbl.classList.add('sp-exam-wrong-answer');
      }
    }

    const card = answerTitles[i].closest('.sp-exam-question-card');
    if(card) card.classList.add(result.correct ? 'correct' : 'wrong');
    const resultNote = document.createElement('div');
    if (result.correct) {
      resultNote.className = 'sp-exam-question-result correct';
      resultNote.innerHTML = `<i class="bi bi-check-circle-fill"></i>إجابة صحيحة`;
    } else {
      resultNote.className = 'sp-exam-question-result wrong';
      resultNote.innerHTML = `<i class="bi bi-x-circle-fill"></i>إجابة غير صحيحة، وقد ظهرت الإجابة الصحيحة باللون الأخضر`;
    }
    if (card) card.appendChild(resultNote);
  }

  spExamUpdateMap();
}

function submitNewReg(form){
  // كل محتوى الدالة داخل try/catch عمدًا: أي خطأ غير متوقع (عنصر مفقود من الصفحة، خطأ برمجي...)
  // كان قبل ذلك يُسكِت الدالة بالكامل دون أي رد فعل يظهر للطالب — بالضبط ما وُصِف بأنه "لا يحدث

function submitNewRegInner(form){

  if (regSubmitInFlight_) return; // منع الإرسال المتكرر عند الضغط أكثر من مرة

  var residencyEl = document.querySelector('input[name="residency"]:checked');
  var isRemote = !!residencyEl && residencyEl.value === 'abroad';

  data.isRemote = isRemote;
  // داخل البحرين: اسم المنطقة الناتج من البحث بالمجمع (كما كان). خارج البحرين: اسم الدولة
  // المختارة، تُخزَّن في نفس عمود المنطقة مباشرةً — لا عنوان حر تفصيلي إضافي.
  data.area = isRemote ? document.querySelector('#residencyCountry').value : document.querySelector('#area').value;

  // كان هذا الشرط يُرجِع بصمت تمامًا بلا أي رسالة عند فشل التحقق (لو نسي الطالب حقلًا أو
  // كتبه بصيغة غير صحيحة) — فيبدو للطالب أن الضغط على "تسجيل" لم يفعل شيئًا. الآن نُبرِز الحقل
  // نفسه (فقاعة المتصفح الأصلية) مع رسالة توضيحية عامة أيضًا، لضمان ظهور رد فعل واضح دائمًا.
  if (!form.checkValidity()) {
    form.reportValidity();

    return;
  }
  if (!mailCheck) {
    // نافذة SweetAlert لا توست هنا تحديدًا: طالب جديد يسجّل بياناته لأول مرة ولم يتحقق من بريده
    // بعد — أهم رسالة في نموذج التسجيل كله (بدونها لا يُحفظ التسجيل إطلاقًا)، فتستحق نافذة
    // تحجب الشاشة حتى يقرأها، لا توستًا قد يفوته. صف أزرار "تحقّق سريع" يُبرَز بالأحمر أيضًا
    // ليرشد الطالب لمكان الإجراء المطلوب تحديدًا، ويعود لطبيعته فور نجاح التحقق (راجع

    return;
  }

  const submitBtn = form.querySelector('button[type="submit"]');

  data.mail = document.querySelector('#mailBox').value;
  // false فقط لو تعذّر إرسال رمز التحقق بسبب امتلاء حصة البريد اليومية، فنؤجّل التحقق الفعلي
  // إلى أول تسجيل دخول للطالب بدل منعه من إكمال التسجيل الآن
  data.emailVerified = !mailVerifiedDeferred;
  // رقم دولي كامل (كود الدولة + الرقم المحلي)، بصرف النظر عن الإقامة — راجع code.js

  // بمؤشر تحميل بلا أي تفسير)، نُعيد الحالة ونُخبر الطالب صراحةً بدل الصمت غير المحدود.
  var regSubmitWatchdog_ = setTimeout(function(){

// countDownEndTime: طابع زمني مطلق (ms) قادم من الخادم (جلسة الاختبار)، لا وقت نسبي محلي — بحيث
// لا يتأثر العدّ التنازلي بساعة جهاز الطالب. الخادم نفسه (submitAnswerData) يرفض أي تسليم بعد هذا
// الوقت (بهامش سماح بسيط)، فالعدّاد هنا للعرض فقط وليس الحارس الفعلي للموعد النهائي.
// countDownEndTime: طابع زمني مطلق (ms) قادم من الخادم (جلسة الاختبار)، لا وقت نسبي محلي — بحيث لا
// يتأثر العدّ التنازلي بساعة جهاز الطالب. الخادم نفسه (submitAnswerData) يرفض أي تسليم بعد هذا
// الوقت (بهامش سماح بسيط)، فالعدّاد هنا للعرض فقط وليس الحارس الفعلي للموعد النهائي. يحدّث كلًا من
// الحلقة الدائرية (سطح المكتب) والعدّاد النصي (الجوال) معًا، ويُحوّل لون الحلقة للأصفر عند تبقّي
// 5 دقائق فأقل (مطابقًا لتصميم المرجع)، ويُسلِّم تلقائيًا عند الوصول للصفر.
function startExamTimer(countDownEndTime){
  var ringEl = document.getElementById('spExamTimerRing');
  var valueEl = document.getElementById('spExamTimerValue');
  var mobileEl = document.getElementById('spExamMobileTimer');
  var countDownDate = countDownEndTime || (Date.now() + (hd*60+md)*60*1000);
  // المدة الكلية للحلقة الدائرية تُحسب من بداية الجلسة الفعلية (examStartTime القادمة من الخادم)
  // لا من لحظة استدعاء هذه الدالة — وإلا لو أعاد الطالب تحميل الصفحة منتصف الاختبار، ستُحسب المدة
  // الكلية كأنها بدأت الآن فتظهر الحلقة ممتلئة 100% رغم مرور وقت فعلي من الجلسة الحقيقية.
  var totalMs = Math.max(1, countDownDate - (examStartTime || Date.now()));

  if(spExamTimerInterval_) clearInterval(spExamTimerInterval_);
  spExamTimerInterval_ = setInterval(function() {
    var now = Date.now();
    var distance = countDownDate - now;
    var seconds = Math.max(0, Math.ceil(distance/1000));
    var text = spExamFormatTime(seconds);

    if(valueEl) valueEl.textContent = text;
    if(mobileEl) mobileEl.textContent = text;

    var percent = Math.max(0, Math.min(100, (distance/totalMs)*100));
    if(ringEl){
      ringEl.style.setProperty('--sp-exam-timer-progress', percent + '%');
      if(distance <= 5*60*1000) ringEl.style.setProperty('--sp-exam-timer-accent', '#c57a16');
    }

    if (distance <= 0) {
      clearInterval(spExamTimerInterval_);
      var formEl = document.getElementById('setAnswer');
      if(formEl && !formEl.dataset.submitted){
        alertMSG('انتهى وقت الاختبار، يتم إرسال إجاباتك تلقائيًا الآن', 'warning');
        submitAnswers(true);
      }
    }
  }, 1000);
}

function spExamFormatTime(seconds){
  var m = Math.floor(seconds/60).toString().padStart(2,'0');
  var s = (seconds%60).toString().padStart(2,'0');
  return m + ':' + s;
}

    }
    
    // عرض الملفات
    function displayFiles() {
        fileList.innerHTML = '';
        selectedFiles.forEach((file, index) => {
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            
            const icon = getFileIcon(file.name);
            const size = formatFileSize(file.size);
            
            fileItem.innerHTML = `
                <i class="${icon} file-icon"></i>
                <div class="file-info">
                    <div class="file-name">${file.name}</div>
                    <div class="file-size">${size}</div>
                    <div class="progress" style="display: none;">
                        <div class="progress-bar" role="progressbar" style="width: 0%"></div>
                    </div>
                </div>
                <i class="fas fa-times file-remove" onclick="removeFile(${index})"></i>
            `;
            
            fileList.appendChild(fileItem);
        });
    }
    
    // إزالة ملف
    function removeFile(index) {
        selectedFiles.splice(index, 1);
        displayFiles();
        uploadBtn.disabled = selectedFiles.length === 0;
    }
    
    // رفع الملفات
    uploadBtn.addEventListener('click', async () => {
        if (selectedFiles.length === 0) return;

          // الحد الأقصى بالميجابايت
          const MAX_MB = 50;
          const MAX_BYTES = MAX_MB * 1024 * 1024;

          // التحقق من الحجم
          for (let f of selectedFiles) {
              if (f.size > MAX_BYTES) {
                  showStatus(`⚠️ حجم الملف أكبر من ${MAX_MB}MB`, "error");
                  return;
              }
          }

        uploadBtn.disabled = true;
        uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> جاري الرفع...';

        try {
            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                const fileItem = fileList.children[i];
                const progressBar = fileItem.querySelector('.progress');
                const progressBarFill = progressBar.querySelector('.progress-bar');

                progressBar.style.display = 'block';
                progressBarFill.style.width = "0%";
                progressBarFill.textContent = "0%";

                const folderId = getDriveId(studentData[0].folderUrl);
                const fileName = `stWork-${studentData[0].cpr}`;

                const uploadedFile = await uploadLargeFileToDrive(file, fileName, folderId, progressBarFill);

                // سجل الملف في الشيت
                google.script.run.submitStWRK(
                    fileName,
                    document.querySelector("#stWRKsel").value,
                    uploadedFile.id
                );
            }

            showStatus("تم الرفع بنجاح!", "success");

            setTimeout(() => {
              hideModal('uploadModal');
                //bootstrap.Modal.getInstance(document.getElementById('uploadModal')).hide();
                resetModal();
            }, 2000);

        } catch (err) {
            console.error(err);
            showStatus("حدث خطأ أثناء رفع الملفات.", "error");
        }

        uploadBtn.disabled = false;
        uploadBtn.innerHTML = "رفع";
    });
    
    // عرض حالة الرفع
    function showStatus(message, type) {
        uploadStatus.textContent = message;
        uploadStatus.className = `upload-status ${type}`;
        uploadStatus.style.display = 'block';
    }
    
    // إعادة تعيين المودال
    function resetModal() {
        selectedFiles = [];
        fileList.innerHTML = '';
        fileInput.value = '';
        uploadBtn.disabled = true;
        uploadBtn.innerHTML = 'رفع';
        uploadStatus.style.display = 'none';
    }
    
    // الحصول على أيقونة الملف
    function getFileIcon(filename) {
        const extension = filename.split('.').pop().toLowerCase();
        const iconMap = {
            'pdf': 'fas fa-file-pdf',
            'doc': 'fas fa-file-word',
            'docx': 'fas fa-file-word',
            'xls': 'fas fa-file-excel',
            'xlsx': 'fas fa-file-excel',
            'ppt': 'fas fa-file-powerpoint',
            'pptx': 'fas fa-file-powerpoint',
            'jpg': 'fas fa-file-image',
            'jpeg': 'fas fa-file-image',
            'png': 'fas fa-file-image',
            'gif': 'fas fa-file-image',
            'zip': 'fas fa-file-archive',
            'rar': 'fas fa-file-archive',
            'mp4': 'fas fa-file-video',
            'avi': 'fas fa-file-video',
            'mp3': 'fas fa-file-audio',
            'wav': 'fas fa-file-audio'
        };
        return iconMap[extension] || 'fas fa-file';
    }
    
    // تنسيق حجم الملف
    function formatFileSize(bytes) {
        if (bytes === 0) return '0 بايت';
        const k = 1024;
        const sizes = ['بايت', 'كيلوبايت', 'ميجابايت', 'جيجابايت'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }
///////////////////////////////////////////////////////////////////////////////////////
// دالة عامة ترفع أي ملف (صورة أو غيرها)
async function uploadLargeFileToDrive(file, fileName, folderId, progressBarFill) {
    // SECURITY-FINDINGS #1: this used to upload straight to the Google Drive
    // resumable API using the owner's OAuth token fetched via getOAuthToken(),
    // which exposed that token to every student. It now posts the file to our
    // server, which stores it. Resolves with { id, name, url } (callers use .id).
    const idToken = await firebase.auth().currentUser.getIdToken();
    const formData = new FormData();
    formData.append("file", file, file.name);
    formData.append("fileName", fileName);
    formData.append("folderId", folderId);

    return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/api/upload/student-work");
        xhr.setRequestHeader("Authorization", "Bearer " + idToken);
        xhr.upload.onprogress = (e) => {
            if (!e.lengthComputable) return;
            const progress = Math.min(99, Math.round((e.loaded / e.total) * 100));
            progressBarFill.style.width = progress + "%";
            progressBarFill.textContent = progress + "%";
        };
        xhr.onload = () => {
            let json = null;
            try { json = JSON.parse(xhr.responseText); } catch (_) {}
            if (xhr.status >= 200 && xhr.status < 300 && json && json.ok) {
                progressBarFill.style.width = "100%";
                progressBarFill.textContent = "100%";
                resolve({ id: json.id, name: json.name, url: json.url });
            } else {
                reject(new Error((json && json.message) || ("Upload failed (" + xhr.status + ")")));
            }
        };
        xhr.onerror = () => reject(new Error("Upload failed (network)"));
        xhr.send(formData);
    });
}



</script>
