<script>
// فتح ملف صادر (بطاقة/شهادة): يسأل الخادم أولًا هل الملف متاح لأي شخص لديه الرابط، فإن لم يكن
// يمنحه الصلاحية (ensureIssuedFileViewable بـdataPost.js) ثم يفتحه. تُفتح نافذة فارغة فورًا داخل
// حدث النقر نفسه لأن المتصفحات تحظر window.open() بعد نداء غير متزامن، ثم يُوجَّه عنوانها بعد ردّ
// الخادم. أي فشل بالفحص لا يمنع الفتح — يُفتح الرابط كما هو، كما كان قبل هذه الآلية تمامًا.
// الروابط (<a>) تُفعَّل لها بإضافة data-issued-file، والأزرار بنداء openIssuedFile مباشرة.
var checkedIssuedFiles = {};
function openIssuedFile(url){
  if(!url) return;
  if(checkedIssuedFiles[url]){ window.open(url, '_blank'); return; }

  var win = window.open('', '_blank');
  if(win){
    try {
      win.opener = null;
      win.document.write('<p dir="rtl" style="font-family:sans-serif;text-align:center;margin-top:20vh">جارٍ فتح الملف…</p>');
    } catch(err) {}
  }
  var openNow = function(){
    if(win){ win.location.href = url; } else { window.open(url, '_blank'); }
  };
  google.script.run
    .withSuccessHandler(function(res){
      if(res && res.ok) checkedIssuedFiles[url] = true;
      openNow();
    })
    .withFailureHandler(openNow)
    .ensureIssuedFileViewable(url);
}
document.addEventListener('click', function(e){
  var link = e.target.closest ? e.target.closest('a[data-issued-file]') : null;
  if(!link || !link.getAttribute('href')) return;
  e.preventDefault();
  openIssuedFile(link.getAttribute('href'));
});

// طالب "سابق" = له ارتباط فعلي بمرحلة أخرى غير المرحلة المعلّقة حاليًا (active أو done) —
// أي أنه منتسب فعلاً وطلب الالتحاق بمرحلة إضافية. غير ذلك يُعتبر طالبًا "جديدًا" بالكامل.
function isReturningReg(r){
  return r.class0 === 'active' || r.class0 === 'done' ||
         r.class1 === 'active' || r.class1 === 'done' ||
         r.class2 === 'active' || r.class2 === 'done' ||
         r.class3 === 'active' || r.class3 === 'done';
}

// طالب سجّل دون اختيار أي مرحلة على الإطلاق (class0..class3 كلها فارغة) — يظهر في تبويب "الكل"
// فقط بصفحة طلبات التسجيل، مع مُحدِّد مرحلة يدوي بدل شارة مرحلة ثابتة، راجع setNewRegStudentsRow
function isStagelessReg(r){
  return !r.class0 && !r.class1 && !r.class2 && !r.class3;
}

// يحدّث بادج العدد على كل تبويب من تبويبات "طلبات التسجيل الجديدة" الأربعة
function updateRegTabBadges(){
  if(typeof newStuRegData === 'undefined' || !Array.isArray(newStuRegData)) return;
  // ملاحظة: classN === true تعني وحدها "طلب معلّق لهذه المرحلة تحديدًا"، بصرف النظر عن cardUrl
  // (الذي يعكس قبولًا سابقًا في مرحلة أخرى قد يملكها الطالب فعلاً) — فحص cardUrl == '' هنا كان
  // يُخفي طلاب منتسبين حاليًا لمرحلة ويرغبون بالالتحاق بمرحلة أخرى، فأُزيل.
  var counts = {
    regBadge00: newStuRegData.filter(function(r){ return r.class0 === true; }).length,
    regBadge01: newStuRegData.filter(function(r){ return r.class1 === true; }).length,
    regBadge02: newStuRegData.filter(function(r){ return r.class2 === true; }).length,
    regBadge03: newStuRegData.filter(function(r){ return r.class3 === true; }).length
  };
  // بادجات فلتر "طلاب جدد / طلاب سابقون" — من إجمالي الطلبات المعلّقة كافة (بصرف النظر عن
  // المرحلة المختارة حاليًا في تبويبات المرحلة)، بنفس نمط بقية البادجات. تشمل أيضًا من سجّل دون
  // اختيار أي مرحلة (isStagelessReg) — يظهرون فقط في تبويب "الكل"، راجع setNewRegStudentsRow
  var pendingAll = newStuRegData.filter(function(r){
    return r.class0 === true || r.class1 === true || r.class2 === true || r.class3 === true || isStagelessReg(r);
  });
  counts.regBadgeAll = pendingAll.length;
  counts.regBadgeTypeAll = pendingAll.length;
  counts.regBadgeTypeReturning = pendingAll.filter(isReturningReg).length;
  counts.regBadgeTypeNew = pendingAll.length - counts.regBadgeTypeReturning;

  // بادجات فلتر "حضوري / عن بُعد" — بنفس نطاق الطلبات المعلّقة كافة أعلاه
  counts.regBadgeModeAll = pendingAll.length;
  counts.regBadgeModeRemote = pendingAll.filter(function(r){ return r.isRemote; }).length;
  counts.regBadgeModeOnsite = pendingAll.length - counts.regBadgeModeRemote;
  Object.keys(counts).forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.textContent = counts[id];
  });
  if(typeof updateRegMetricCards === 'function') updateRegMetricCards();
}

// يُحدِّث حالة تفعيل/تعطيل زر "قبول المحدد" (في adminDashboard.html) بحسب وجود أي مربع اختيار
// محدَّد ضمن الصفوف المعروضة حاليًا — يُستدعى بعد كل تغيير على مربعات الاختيار وبعد كل إعادة رسم
function updateAcceptSelectedState(){
  var checks = Array.from(document.querySelectorAll('#usersContainer .registration-check'));
  var checked = checks.filter(function(cb){ return cb.checked; });
  checks.forEach(function(cb){
    var row = cb.closest('.userRow');
    if(row) row.classList.toggle('is-selected', cb.checked);
  });
  var btn = document.getElementById('acceptSelectedBtn');
  if(btn){
    btn.disabled = checked.length === 0;
    btn.setAttribute('aria-label', checked.length > 0 ? ('قبول الطلبات المحددة وعددها ' + checked.length) : 'لم يتم تحديد أي طلب');
  }
  var countEl = document.getElementById('regSelectedCount');
  if(countEl) countEl.textContent = checked.length;
  var selectAll = document.getElementById('regSelectAll');
  if(selectAll){
    selectAll.checked = checks.length > 0 && checked.length === checks.length;
    selectAll.indeterminate = checked.length > 0 && checked.length < checks.length;
  }
}

// يوضّح نطاق النتائج والإجراء الجماعي بدقة: القبول الجماعي يطال الصفوف الظاهرة في الصفحة الحالية فقط.

  var summary = document.getElementById('regResultsSummary');
  if(summary){
    summary.textContent = totalItems > 0
      ? ('عرض ' + (startIdx + 1) + '–' + (startIdx + visibleItems) + ' من أصل ' + totalItems + ' طلب')
      : 'لا توجد نتائج مطابقة';
  }
  var visibleCount = document.getElementById('regVisibleCount');
  if(visibleCount) visibleCount.textContent = visibleItems;
  var acceptVisible = document.getElementById('acceptAllNewStu');
  if(acceptVisible){
    acceptVisible.disabled = visibleItems === 0;
    acceptVisible.setAttribute('aria-label', visibleItems > 0 ? ('قبول الطلبات الظاهرة وعددها ' + visibleItems) : 'لا توجد طلبات ظاهرة للقبول');
  }
}

// إعداد أدوات الترتيب وحجم الصفحة والفلترة والبحث لجدول "طلبات التسجيل الجديدة" (مرة واحدة لكل تحميل للصفحة)
function setupRegPagingControls(){

  if(selectAllCb && !selectAllCb.dataset.bound){
    selectAllCb.dataset.bound = '1';
    selectAllCb.addEventListener('change', function(){
      document.querySelectorAll('#usersContainer .registration-check').forEach(function(cb){ cb.checked = selectAllCb.checked; });
      updateAcceptSelectedState();
    });
  }

  var usersContainerEl = document.getElementById('usersContainer');
  if(usersContainerEl && !usersContainerEl.dataset.checkBound){
    usersContainerEl.dataset.checkBound = '1';
    usersContainerEl.addEventListener('change', function(e){
      if(e.target.classList.contains('registration-check')) updateAcceptSelectedState();
    });
  }
  if(typeof setupRegistrationsGradeFix === 'function') setupRegistrationsGradeFix();

  var filterGroup = document.getElementById('regFilterGroup');
  if(filterGroup && !filterGroup.dataset.bound){
    filterGroup.dataset.bound = '1';
    filterGroup.addEventListener('click', function(e){
      var btn = e.target.closest('button[data-filter]');
      if(!btn) return;
      filterGroup.querySelectorAll('button').forEach(function(b){
        var active = b === btn;
        b.classList.toggle('active', active);
        b.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      setNewRegStudentsRow(btn.getAttribute('data-filter'));
    });
  }

  var typeGroup = document.getElementById('regStudentTypeGroup');
  if(typeGroup && !typeGroup.dataset.bound){
    typeGroup.dataset.bound = '1';
    if(['all','new','returning'].indexOf(regStudentTypeFilter_) === -1) regStudentTypeFilter_ = 'all';
    typeGroup.querySelectorAll('button[data-type-filter]').forEach(function(b){
      var active = b.getAttribute('data-type-filter') === regStudentTypeFilter_;
      b.classList.toggle('active', active);
      b.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    typeGroup.addEventListener('click', function(e){
      var btn = e.target.closest('button[data-type-filter]');
      if(!btn) return;
      typeGroup.querySelectorAll('button').forEach(function(b){
        var active = b === btn;
        b.classList.toggle('active', active);
        b.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      regStudentTypeFilter_ = btn.getAttribute('data-type-filter');
      regCurrentPage = 1;
      setNewRegStudentsRow(regKind);
    });
  }

  var studyModeGroup = document.getElementById('regStudyModeGroup');
  if(studyModeGroup && !studyModeGroup.dataset.bound){
    studyModeGroup.dataset.bound = '1';
    if(['all','onsite','remote'].indexOf(regStudyModeFilter_) === -1) regStudyModeFilter_ = 'all';
    studyModeGroup.querySelectorAll('button[data-mode-filter]').forEach(function(b){
      var active = b.getAttribute('data-mode-filter') === regStudyModeFilter_;
      b.classList.toggle('active', active);
      b.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    studyModeGroup.addEventListener('click', function(e){
      var btn = e.target.closest('button[data-mode-filter]');
      if(!btn) return;
      studyModeGroup.querySelectorAll('button').forEach(function(b){
        var active = b === btn;
        b.classList.toggle('active', active);
        b.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      regStudyModeFilter_ = btn.getAttribute('data-mode-filter');
      regCurrentPage = 1;
      setNewRegStudentsRow(regKind);
    });
  }

  var searchInp = document.getElementById('regSearchInput');
  if(searchInp && !searchInp.dataset.bound){
    searchInp.dataset.bound = '1';
    searchInp.value = regSearchQuery_;
    searchInp.addEventListener('input', function(){
      regSearchQuery_ = searchInp.value || '';
      regCurrentPage = 1;
      setNewRegStudentsRow(regKind);
    });
  }

  var pageSizeSel = document.getElementById('regPageSize');
  if(pageSizeSel && !pageSizeSel.dataset.bound){
    pageSizeSel.dataset.bound = '1';
    pageSizeSel.value = String(regPageSize);
    pageSizeSel.addEventListener('change', function(){
      regPageSize = parseInt(pageSizeSel.value, 10) || 50;
      regCurrentPage = 1;
      setNewRegStudentsRow(regKind);
    });

  var table = document.getElementById('usersTable');
  if(table && !table.dataset.sortBound){
    table.dataset.sortBound = '1';
    table.querySelectorAll('th[data-sort]').forEach(function(th){
      th.addEventListener('click', function(){
        var field = th.getAttribute('data-sort');
        if(regSortField === field){
          regSortDir = regSortDir === 'asc' ? 'desc' : 'asc';
        }else{
          regSortField = field;
          regSortDir = 'asc';
        }
        if(typeof updateSortIndicator === 'function') updateSortIndicator('usersTable', regSortField, regSortDir);

        setNewRegStudentsRow(regKind);
      });

// يبني خانة اختيار مرحلة يدوية داخل stageCell لطالب سجّل دون تحديد أي مرحلة (isStagelessReg)،
// بدل شارة مرحلة ثابتة. يعتمد على regOpenStagesCache_ (تُجلَب مرة عند تحميل قائمة طلبات
// التسجيل، راجع getNewStuRegData في js.html) لتحديد المراحل المفتوحة فعليًا للتسجيل حاليًا:
// لو كانت هناك مرحلة واحدة مفتوحة فقط تُختار تلقائيًا (تسهيلًا للقبول المباشر)، وإلا يبقى
// الاختيار فارغًا إلزاميًا على الموظف. يُحدِّث rowEl.dataset.grade مباشرة عند كل تغيير.
function renderStagelessStageSelect(stageCell, rowEl){
  var openIndexes = (regOpenStagesCache_ || [])
    .filter(function(s){ return s && s.registrationOpen; })
    .map(function(s){ return +s.stageIndex; });
  var initialGrade = openIndexes.length === 1 ? openIndexes[0] : null;

  var optionsHtml = '<option value="">اختر المرحلة...</option>' + [0,1,2,3].map(function(idx){
    var isOpen = openIndexes.indexOf(idx) !== -1;
    var label = (typeof getLevelName === 'function' ? getLevelName(idx) : idx) + (isOpen ? '' : ' (مغلق)');
    return '<option value="' + idx + '"' + (initialGrade === idx ? ' selected' : '') + (isOpen ? '' : ' disabled') + '>' + label + '</option>';
  }).join('');

  stageCell.innerHTML = '<select class="form-select form-select-sm reg-stage-select">' + optionsHtml + '</select>';

  var selectEl = stageCell.querySelector('select');
  selectEl.addEventListener('change', function(){
    rowEl.dataset.grade = selectEl.value;
  });

  return initialGrade;
}

function setNewRegStudentsRow(kind){
  if(kind !== regLastKind_){
    regCurrentPage = 1;
    regLastKind_ = kind;
  }
  regKind = kind;
  setListEvents();
  updateRegTabBadges();
  setupRegPagingControls();

  var filterGroupEl = document.getElementById('regFilterGroup');
  if(filterGroupEl){
    filterGroupEl.querySelectorAll('button[data-filter]').forEach(function(b){
      var active = b.getAttribute('data-filter') === (kind || 'all');
      b.classList.toggle('active', active);
      b.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
  }

  var rowsContainer = document.getElementById('usersContainer');
  var temp = document.getElementById('usersRow').content;

    rowsContainer.innerHTML = '';

  //////////////////////////////////////////////////////// getGroupsData
  //alert(newStuRegData.length)
  // ملاحظة: grade هنا تبقى للتوافق مع تبويب مرحلة واحدة محدَّدة (تُستخدم كقيمة افتراضية من
  // المُستمِع العام في js.html عند القبول/الرفض). في تبويب "الكل" لا توجد مرحلة واحدة، فتُحسب
  // مرحلة كل صف على حدة وتُخزَّن في data-grade، ويُصحَّحها معترض في admin-js.html قبل أن يصل
  // الحدث لذلك المُستمِع (انظر setupRegistrationsGradeFix).
  // classN === true وحدها كافية لتعريف "طلب معلّق لهذه المرحلة" — بصرف النظر عن cardUrl، الذي قد
  // يكون غير فارغ فعلاً لطالب منتسب حاليًا لمرحلة أخرى ويرغب بالالتحاق بهذه المرحلة الجديدة أيضًا.
  // تبويب "الكل" وحده يشمل أيضًا من سجّل دون اختيار أي مرحلة (isStagelessReg) — تظهر لهم خانة
  // اختيار مرحلة يدويًا بدل شارة ثابتة (راجع rowGrade وstageCell أدناه)، ولا تبويب مرحلة خاص بهم
  // لأن مرحلتهم غير محدَّدة بعد.
  if(kind === 'all' || kind == undefined){
    var data = newStuRegData.filter(r=> r.class0 === true || r.class1 === true || r.class2 === true || r.class3 === true || isStagelessReg(r));
    grade = null;
  }else if(kind === 'reg00'){
    var data = newStuRegData.filter(r=> r.class0 === true);
    grade = 0;
  }else if(kind === 'reg01'){
    var data = newStuRegData.filter(r=> r.class1 === true);
    grade = 1;
  }else if(kind === 'reg02'){
    var data = newStuRegData.filter(r=> r.class2 === true);
    grade = 2;
  }else if(kind === 'reg03'){
    var data = newStuRegData.filter(r=> r.class3 === true);
    grade = 3;
  }

  // فلتر "طلاب جدد / طلاب سابقون"
  if(regStudentTypeFilter_ === 'new'){
    data = data.filter(function(r){ return !isReturningReg(r); });
  }else if(regStudentTypeFilter_ === 'returning'){
    data = data.filter(function(r){ return isReturningReg(r); });
  }

  // فلتر "حضوري / عن بُعد"
  if(regStudyModeFilter_ === 'remote'){
    data = data.filter(function(r){ return r.isRemote; });
  }else if(regStudyModeFilter_ === 'onsite'){
    data = data.filter(function(r){ return !r.isRemote; });
  }

  // البحث بالاسم أو الرقم الشخصي
  var q = (regSearchQuery_ || '').trim().toLowerCase();
  if(q){
    data = data.filter(function(r){
      return String(r.name || '').toLowerCase().indexOf(q) !== -1 ||
             String(r.cpr || '').toLowerCase().indexOf(q) !== -1;
    });
  }

  // الترتيب حسب رأس العمود المختار
  if(regSortField){
    var sField = regSortField, sDir = regSortDir === 'desc' ? -1 : 1;
    data = data.slice().sort(function(a,b){
      return String(a[sField] || '').localeCompare(String(b[sField] || ''), 'ar') * sDir;
    });
  }

  // تقسيم النتائج إلى صفحات (50 على الأقل، وقابلة للزيادة حتى 100)
  var totalItems = data.length;
  var totalPages = Math.max(1, Math.ceil(totalItems / regPageSize));
  if(regCurrentPage > totalPages) regCurrentPage = totalPages;
  var startIdx = (regCurrentPage - 1) * regPageSize;
  var pageData = data.slice(startIdx, startIdx + regPageSize);

  if(typeof renderPagination === 'function'){
    renderPagination('regPagination', totalItems, regPageSize, regCurrentPage, function(page){
      regCurrentPage = page;
      setNewRegStudentsRow(regKind);
    });
  }

  //alert(data.length)
  if(pageData.length < 1 ){
    rowsContainer.innerHTML = '<tr><td colspan="7"><div class="empty-state reg-empty-state"><i data-icon="inbox"></i><h3>لا توجد طلبات مطابقة</h3><p>جرّب تغيير المرحلة أو نوع الطالب أو نمط الدراسة.</p></div></td></tr>';
  }else{
    var renderFragment = document.createDocumentFragment();
    pageData.forEach(function(e,indexOnPage){
      var index = startIdx + indexOnPage;
      var row = temp.cloneNode(true);
      var stRow = row.querySelector('.userRow');
      var name = row.querySelector('.name');
      var cprSub = row.querySelector('.cprSub');
      var avatar = row.querySelector('.regAvatar');
      var remoteBadge = row.querySelector('.remoteBadge');
      var rowCheck = row.querySelector('.registration-check');
      var stageCell = row.querySelector('.stageCell');
      var genderCell = row.querySelector('.genderCell');
      var dateCell = row.querySelector('.dateCell');
      var pastCell = row.querySelector('.pastCell');
      var newStuCard = row.querySelector('.newStuCard');
      var accept = row.querySelector('.acceptNewStu');
      var refuse = row.querySelector('.refuseNewStu');

      // مرحلة هذا الصف تحديدًا (أول علم classN نشط) — تُستخدم بدل grade المشتركة في تبويب "الكل".
      // من سجّل دون اختيار أي مرحلة (isStagelessReg) لا شارة ثابتة له، بل خانة اختيار يدوية
      // (renderStagelessStageSelect) تُحدِّث rowGrade فور اختيار الموظف مرحلة له.
      var rowGrade = e.class0 === true ? 0 : e.class1 === true ? 1 : e.class2 === true ? 2 : e.class3 === true ? 3 : grade;
      var isStageless = isStagelessReg(e);

      name.textContent = e.name;
      if(cprSub) cprSub.textContent = e.cpr;
      if(avatar) avatar.innerHTML = '<img src="' + escapeHtml(e.avatarUrl || DEFAULT_AVATAR_URL_) + '" alt="">';
      if(remoteBadge) remoteBadge.classList.toggle('d-none', !e.isRemote);
      if(rowCheck){
        rowCheck.dataset.cpr = e.cpr;
        rowCheck.setAttribute('aria-label', 'تحديد طلب ' + (e.name || e.cpr));
      }

      if(stageCell){
        if(isStageless){
          rowGrade = renderStagelessStageSelect(stageCell, stRow);
        }else{
          stageCell.innerHTML = (typeof stageBadgeHtml === 'function' && rowGrade !== null) ? stageBadgeHtml(rowGrade) : '—';
        }
      }
      if(genderCell) genderCell.textContent = e.gender || '—';
      if(dateCell) dateCell.textContent = (typeof formatDateAr === 'function') ? formatDateAr(e.time) : (e.time || '—');
      if(pastCell){
        var fullPast = (e.pastStudies || '').trim();
        if(fullPast){
          var pastWords = fullPast.split(/\s+/);
          pastCell.textContent = pastWords.length > 4 ? (pastWords.slice(0,4).join(' ') + ' ...') : fullPast;
          pastCell.setAttribute('title', fullPast);
        }else{
          pastCell.textContent = '—';
          pastCell.removeAttribute('title');
        }
      }

      stRow.dataset.grade = (rowGrade === null || typeof rowGrade === 'undefined') ? '' : rowGrade;

      stRow.id = e.cpr;

      newStuCard.dataset.cpr = e.cpr;
      newStuCard.setAttribute('aria-label', 'عرض تفاصيل طلب ' + (e.name || e.cpr));
      accept.dataset.cpr = e.cpr;
      accept.dataset.name = e.name;
      accept.dataset.mail = e.mail;
      accept.setAttribute('aria-label', 'قبول طلب ' + (e.name || e.cpr));
      refuse.dataset.cpr = e.cpr;
      refuse.dataset.name = e.name;
      refuse.dataset.mail = e.mail;
      refuse.setAttribute('aria-label', 'رفض طلب ' + (e.name || e.cpr));

      renderFragment.appendChild(row);

    })
    rowsContainer.appendChild(renderFragment);
  }

  updateRegResultsMeta(totalItems, startIdx, pageData.length);
  updateAcceptSelectedState();
  if(typeof refreshIcons === 'function') refreshIcons();
  if(typeof setRouteLoading === 'function') setRouteLoading('registrations', false);

  setTimeout(function(){
  },1000)
}

// صفحة "إرسال رسالة" المستقلة — بياناتها وعرضها وترقيمها وترتيبها منفصلة
// بالكامل عن جدول "قائمة الطلاب" وجدول "طلبات التسجيل"
///////////////////////////////////////////////////////////////////////////
var sendMsgData = [], sendMsgKind, sendMsgLastKind_;
var sendMsgPageSize = 50, sendMsgCurrentPage = 1, sendMsgSortField = null, sendMsgSortDir = 'asc';
var sendMsgCurrentFullData_ = [];
var sendMsgGenderFilter_ = 'all';
var sendMsgSearchQuery_ = '';
var SEND_MSG_STAGE_NAMES_ = { reg00: 'التأهيلية', reg01: 'التأسيسية', reg02: 'التأصيلية', reg03: 'التحصيلية' };

function getSendMsgData(){
  if(typeof refreshWPQueueStatus === 'function') refreshWPQueueStatus();
  loadingStart();
  google.script.run.withSuccessHandler(function(dr){
    sendMsgData = dr;
    loadingEnd();
    setSendMsgStudentsRow();
  }).withFailureHandler(function(){
    swal.fire('خطأ','لم يتم تحميل البيانات بشكل صحيح','error');
    loadingEnd();
  }).getPersons();
}

// إن حدّد المستخدم أسماء بعينها بمربعات الاختيار بالجدول (الصفحة الحالية المعروضة فقط، بنفس
// أسلوب مربعات "طلبات التسجيل")، فهذا التحديد اليدوي يَجُبّ فلتر المجموعة (الجميع/ذكور/إناث)
// تمامًا؛ وإلا فالسلوك القديم كما هو: كل طلاب sendMsgCurrentFullData_ المطابقين لفلتر الجنس.
function collectSendMsgRecipients(){
  var checkedCprs = Array.prototype.map.call(
    document.querySelectorAll('#msgRecipientsBody .msg-recipient-check:checked'),
    function(cb){ return cb.getAttribute('data-cpr'); }
  );

  var recipients = [];
  if(checkedCprs.length > 0){
    sendMsgCurrentFullData_.forEach(function(s){
      if(checkedCprs.indexOf(String(s.cpr)) === -1) return;
      var phone = String(s.phone || '').trim();
      if(phone.replace(/\D+/g,'').length >= 8) recipients.push({ name: s.name, phone: phone });
    });
    return recipients;
  }

  sendMsgCurrentFullData_.forEach(function(s){
    var phone = String(s.phone || '').trim();
    var gender = String(s.gender || '').trim();
    var matchesGender = sendMsgGenderFilter_ === 'all' ? gender !== ''
      : sendMsgGenderFilter_ === 'male' ? gender === 'ذكر'
      : gender === 'أنثى';
    if(!matchesGender) return;
    if(phone.replace(/\D+/g,'').length >= 8) recipients.push({ name: s.name, phone: phone });
  });
  return recipients;
}

function updateMsgSendButtonCount(){
  var count = collectSendMsgRecipients().length;
  var btn = document.getElementById('msgSendBtn');
  if(btn) btn.innerHTML = '<i data-icon="message-circle"></i>إرسال إلى ' + count + (count === 1 ? ' طالب' : ' طالبًا');
  if(typeof refreshIcons === 'function') refreshIcons();
}

// ربط أحداث التأليف والتصفية والترتيب وحجم الصفحة والإرسال (مرة واحدة فقط لكل تحميل للصفحة)
function setupSendMsgControls(){
  var msgSelectAllCb = document.getElementById('msgSelectAll');
  if(msgSelectAllCb && !msgSelectAllCb.dataset.bound){
    msgSelectAllCb.dataset.bound = '1';
    msgSelectAllCb.addEventListener('change', function(){
      document.querySelectorAll('#msgRecipientsBody .msg-recipient-check').forEach(function(cb){ cb.checked = msgSelectAllCb.checked; });
      updateMsgSendButtonCount();
    });
  }

  var msgRecipientsBodyEl = document.getElementById('msgRecipientsBody');
  if(msgRecipientsBodyEl && !msgRecipientsBodyEl.dataset.checkBound){
    msgRecipientsBodyEl.dataset.checkBound = '1';
    msgRecipientsBodyEl.addEventListener('change', function(e){
      if(!e.target.classList.contains('msg-recipient-check')) return;
      var allChecks = document.querySelectorAll('#msgRecipientsBody .msg-recipient-check');
      var checkedCount = document.querySelectorAll('#msgRecipientsBody .msg-recipient-check:checked').length;
      if(msgSelectAllCb){
        msgSelectAllCb.checked = allChecks.length > 0 && checkedCount === allChecks.length;
        msgSelectAllCb.indeterminate = checkedCount > 0 && checkedCount < allChecks.length;
      }
      updateMsgSendButtonCount();
    });
  }

  var stageGroup = document.getElementById('msgStageGroup');
  if(stageGroup && !stageGroup.dataset.bound){
    stageGroup.dataset.bound = '1';
    stageGroup.addEventListener('click', function(e){
      var btn = e.target.closest('button[data-stage]');
      if(!btn) return;
      stageGroup.querySelectorAll('button').forEach(function(b){ b.classList.toggle('active', b === btn); });
      setSendMsgStudentsRow(btn.getAttribute('data-stage'));
    });
  }

  var genderGroup = document.getElementById('msgGenderGroup');
  if(genderGroup && !genderGroup.dataset.bound){
    genderGroup.dataset.bound = '1';
    genderGroup.addEventListener('click', function(e){
      var btn = e.target.closest('button[data-gender]');
      if(!btn) return;
      genderGroup.querySelectorAll('button').forEach(function(b){ b.classList.toggle('active', b === btn); });
      sendMsgGenderFilter_ = btn.getAttribute('data-gender');
      updateMsgSendButtonCount();
    });
  }

  var searchInp = document.getElementById('msgSearchInput');
  if(searchInp && !searchInp.dataset.bound){
    searchInp.dataset.bound = '1';
    searchInp.addEventListener('input', function(){
      sendMsgSearchQuery_ = searchInp.value || '';
      sendMsgCurrentPage = 1;
      setSendMsgStudentsRow(sendMsgKind);
    });
  }

  var pageSizeSel = document.getElementById('msgPageSize');
  if(pageSizeSel && !pageSizeSel.dataset.bound){
    pageSizeSel.dataset.bound = '1';
    pageSizeSel.value = String(sendMsgPageSize);
    pageSizeSel.addEventListener('change', function(){
      sendMsgPageSize = parseInt(pageSizeSel.value, 10) || 50;
      sendMsgCurrentPage = 1;
      setSendMsgStudentsRow(sendMsgKind);
    });
  }

  var table = document.getElementById('msgRecipientsTable');
  if(table && !table.dataset.sortBound){
    table.dataset.sortBound = '1';
    table.querySelectorAll('th[data-sort]').forEach(function(th){
      th.addEventListener('click', function(){
        var field = th.getAttribute('data-sort');
        if(sendMsgSortField === field){
          sendMsgSortDir = sendMsgSortDir === 'asc' ? 'desc' : 'asc';
        }else{
          sendMsgSortField = field;
          sendMsgSortDir = 'asc';
        }
        if(typeof updateSortIndicator === 'function') updateSortIndicator('msgRecipientsTable', sendMsgSortField, sendMsgSortDir);
        sendMsgCurrentPage = 1;
        setSendMsgStudentsRow(sendMsgKind);
      });
    });
  }

  var charCountEl = document.getElementById('msgCharCount');
  var textArea = document.getElementById('msgTextArea');
  if(textArea && !textArea.dataset.bound){
    textArea.dataset.bound = '1';
    textArea.addEventListener('input', function(){
      if(charCountEl) charCountEl.textContent = textArea.value.length;
    });
  }

  // زر الإرسال: يستخدم نفس منطق الإرسال الحالي بالضبط (startWPQueueSend + طابور wpQueue.js على
  // الخادم) — فقط بلا المرور بالمودال المنبثق القديم #sendWhatsMsg، لأن نص الرسالة أصبح في
  // الصفحة نفسها مباشرة (مطابقةً للتصميم المرجعي) بدل نافذة منفصلة.
  var sendBtn = document.getElementById('msgSendBtn');
  if(sendBtn && !sendBtn.dataset.bound){
    sendBtn.dataset.bound = '1';
    sendBtn.addEventListener('click', function(){
      var msgText = (textArea ? textArea.value : '').trim();
      if(msgText === ''){ alertMSG('لا يمكن إرسال رسالة فارغة', 'error'); return; }

      var recipients = collectSendMsgRecipients();
      if(recipients.length < 1){ alertMSG('لا يوجد أرقام هواتف صحيحة ضمن هذه المجموعة', 'warning'); return; }

      Swal.fire({
        title: '<i class="bi bi-whatsapp"></i>',
        text: 'هل أنت متأكد من إرسال هذه الرسالة إلى ' + recipients.length + ' طالبًا؟',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#3085d6',
        cancelButtonColor: '#d33',
        confirmButtonText: 'نعم، أودّ الإرسال',
        cancelButtonText: 'لا، شكرًا'
      }).then(function(result){
        if(!result.isConfirmed) return;
        google.script.run.withSuccessHandler(function(res){
          if(res && res.ok){
            if(textArea) textArea.value = '';
            if(charCountEl) charCountEl.textContent = '0';
            Swal.fire('تم البدء', 'بدأ إرسال الرسالة إلى ' + res.total + ' مستلمًا في الخلفية على خادم بصائر. يمكنك إغلاق الصفحة الآن، وستكمل العملية تلقائيًا، ويمكنك متابعة حالتها لاحقًا من هذه الصفحة.', 'success');
            if(typeof refreshWPQueueStatus === 'function') refreshWPQueueStatus();
          }else{
            Swal.fire('تعذّر بدء الإرسال', (res && res.reason) || '', 'error');
          }
        }).withFailureHandler(function(err){
          Swal.fire('خطأ', 'تعذّر الاتصال بالخادم: ' + err, 'error');
        }).startWPQueueSend(recipients, msgText);
      });
    });
  }
}

function setSendMsgStudentsRow(kind){
  if(!kind) kind = 'reg00';
  if(kind !== sendMsgLastKind_){
    sendMsgCurrentPage = 1;
    sendMsgLastKind_ = kind;
  }
  sendMsgKind = kind;
  setupSendMsgControls();

  var data;
  if(kind === 'reg01'){ data = sendMsgData.filter(r=> r.class1 === 'active'); }
  else if(kind === 'reg02'){ data = sendMsgData.filter(r=> r.class2 === 'active'); }
  else if(kind === 'reg03'){ data = sendMsgData.filter(r=> r.class3 === 'active'); }
  else{ data = sendMsgData.filter(r=> r.class0 === 'active'); }

  var countAllEl = document.getElementById('msgCountAll');
  var countMaleEl = document.getElementById('msgCountMale');
  var countFemaleEl = document.getElementById('msgCountFemale');
  if(countAllEl) countAllEl.textContent = data.length;
  if(countMaleEl) countMaleEl.textContent = data.filter(function(s){ return s.gender === 'ذكر'; }).length;
  if(countFemaleEl) countFemaleEl.textContent = data.filter(function(s){ return s.gender === 'أنثى'; }).length;

  var hintEl = document.getElementById('msgRecipientsHint');
  if(hintEl) hintEl.textContent = 'طلاب المرحلة ' + (SEND_MSG_STAGE_NAMES_[kind] || '');

  // القائمة الكاملة لهذه المرحلة (غير المقسّمة لصفحات ولا مُصفّاة بالبحث) تُستخدم عند تحديد
  // المستلمين الفعليين للإرسال — البحث النصي يخصّ العرض في الجدول فقط
  sendMsgCurrentFullData_ = data;

  var q = (sendMsgSearchQuery_ || '').trim().toLowerCase();
  if(q){
    data = data.filter(function(s){
      return String(s.name || '').toLowerCase().indexOf(q) !== -1 || String(s.phone || '').toLowerCase().indexOf(q) !== -1;
    });
  }

  if(sendMsgSortField){
    var sField = sendMsgSortField, sDir = sendMsgSortDir === 'desc' ? -1 : 1;
    data = data.slice().sort(function(a,b){
      return String(a[sField] || '').localeCompare(String(b[sField] || ''), 'ar') * sDir;
    });
  }

  var visEl = document.getElementById('msg-visible-count');
  if(visEl) visEl.textContent = data.length;

  var totalItems = data.length;
  var totalPages = Math.max(1, Math.ceil(totalItems / sendMsgPageSize));
  if(sendMsgCurrentPage > totalPages) sendMsgCurrentPage = totalPages;
  var startIdx = (sendMsgCurrentPage - 1) * sendMsgPageSize;
  var pageData = data.slice(startIdx, startIdx + sendMsgPageSize);

  if(typeof renderPagination === 'function'){
    renderPagination('msgPagination', totalItems, sendMsgPageSize, sendMsgCurrentPage, function(page){
      sendMsgCurrentPage = page;
      setSendMsgStudentsRow(sendMsgKind);
    });
  }

  var tbody = document.getElementById('msgRecipientsBody');
  if(!tbody) { if(typeof setRouteLoading === 'function') setRouteLoading('messages', false); return; }

  if(pageData.length < 1){
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--muted)">لا يوجد طلاب مطابقون</td></tr>';
  }else{
    tbody.innerHTML = pageData.map(function(e, indexOnPage){
      var index = startIdx + indexOnPage;
      var name = (typeof escapeHtml === 'function') ? escapeHtml(e.name) : e.name;
      var phone = (typeof escapeHtml === 'function') ? escapeHtml(e.phone) : e.phone;
      var cprStr = (typeof escapeHtml === 'function') ? escapeHtml(e.cpr) : e.cpr;
      var personCell = (typeof personCellHtml === 'function') ? personCellHtml(e.name, e.phone) : name;
      return '<tr>' +
        '<td><input type="checkbox" class="msg-recipient-check" data-cpr="' + cprStr + '"></td>' +
        '<td data-label="#">' + (index + 1) + '</td>' +
        '<td>' + personCell + '</td>' +
        '<td data-label="الجنس">' + (e.gender ? (typeof escapeHtml === 'function' ? escapeHtml(e.gender) : e.gender) : '—') + '</td>' +
      '</tr>';
    }).join('');
  }

  var msgSelectAllEl = document.getElementById('msgSelectAll');
  if(msgSelectAllEl){ msgSelectAllEl.checked = false; msgSelectAllEl.indeterminate = false; }
  updateMsgSendButtonCount();

  if(typeof refreshIcons === 'function') refreshIcons();
  if(typeof setRouteLoading === 'function') setRouteLoading('messages', false);
}

// الرئيسية داخل bagId) + درج جانبي يعرض محتويات أي مجلد (بلا حد لعمق المجلدات الفرعية عبر

var courseFolderCache_ = {}; // folderId -> items[]، تفادي إعادة جلب نفس المستوى أكثر من مرة بالجلسة
var currentCourseBagId_ = null; // حقيبة المرحلة الحالية، تُستخدم أيضًا كنطاق للبحث الشامل

function loadCourseFolder(bagId){
  var grid = document.getElementById('curriculumGrid');
  var empty = document.getElementById('curriculumEmpty');
  var loading = document.getElementById('curriculumLoading');
  if(!grid) return;

  currentCourseBagId_ = bagId || null;
  courseFolderCache_ = {}; // مستوى/مرحلة جديدة = بيانات مختلفة، لا نُبقي ذاكرة مستوى سابق
  grid.innerHTML = '';
  empty?.classList.add('d-none');
  var summaryEl = document.getElementById('curriculumSummaryText');
  if(summaryEl) summaryEl.textContent = 'جارٍ التحميل...';

  if(!bagId){
    loading?.classList.add('d-none');
    if(empty){ empty.textContent = 'لا يوجد محتوى بعد'; empty.classList.remove('d-none'); }
    if(summaryEl) summaryEl.textContent = '0 مقررات';
    return;
  }

  loading?.classList.remove('d-none');
  google.script.run.withSuccessHandler(function(items){
    loading?.classList.add('d-none');
    if(!items || items.error){
      if(empty){ empty.textContent = 'تعذّر تحميل محتوى المقررات'; empty.classList.remove('d-none'); }
      return;
    }
    courseFolderCache_[bagId] = items;
    renderCurriculumGrid(items);
  }).withFailureHandler(function(err){
    loading?.classList.add('d-none');
    if(empty){ empty.textContent = 'تعذّر تحميل محتوى المقررات: ' + err; empty.classList.remove('d-none'); }
  }).getDriveFolderContents(bagId);
}

var CURRICULUM_ICONS_ = ['fa-book-open','fa-graduation-cap','fa-scroll','fa-feather-pointed','fa-book-quran','fa-layer-group'];

function renderCurriculumGrid(items){
  var grid = document.getElementById('curriculumGrid');
  var empty = document.getElementById('curriculumEmpty');
  var summaryEl = document.getElementById('curriculumSummaryText');
  var countBadge = document.getElementById('curriculumCountBadge');
  if(!grid) return;
  var folders = (items || []).filter(function(it){ return it.isFolder; });

  if(summaryEl){
    var totalItems = folders.reduce(function(sum, f){ return sum + (f.itemCount || 0); }, 0);
    summaryEl.textContent = folders.length + ' مقررات · ' + totalItems + ' مادة تعليمية';
  }
  if(countBadge) countBadge.textContent = folders.length + ' مقررات';

  if(folders.length === 0){
    grid.innerHTML = '';
    if(empty){ empty.textContent = 'لا يوجد محتوى بعد'; empty.classList.remove('d-none'); }
    return;
  }
  empty?.classList.add('d-none');
  grid.innerHTML = folders.map(function(f, i){
    var icon = CURRICULUM_ICONS_[i % CURRICULUM_ICONS_.length];
    return '<article class="curriculum-card" data-folder-id="' + f.id + '" data-folder-name="' + escapeHtml(f.name) + '" data-icon="' + icon + '" data-state="active">' +
        '<div class="course-cover"><i class="fa-solid ' + icon + '"></i><span class="file-count"><i class="fa-solid fa-layer-group"></i>' + (f.itemCount || 0) + ' عنصر</span></div>' +
        '<div class="curriculum-body">' +
          '<div class="course-status-row"><span class="course-category">المقرر ' + (i + 1) + '</span><span class="sp-status-pill warning">قيد الدراسة</span></div>' +
          '<h3>' + escapeHtml(f.name) + '</h3>' +
          '<div class="course-progress-row"><div><span>نسبة الإنجاز</span><strong>0%</strong></div><div class="linear-progress"><span style="width:0%"></span></div></div>' +
          '<div class="card-actions"><button class="sp-btn-secondary open-course" type="button">فتح المقرر<i class="fa-solid fa-arrow-left"></i></button></div>' +
        '</div>' +
      '</article>';
  }).join('');
}

function loadDrawerLevel(folderId, containerEl){
  if(courseFolderCache_[folderId]){
    renderDrawerLevel(courseFolderCache_[folderId], containerEl);
    return;
  }
  google.script.run.withSuccessHandler(function(items){
    if(!items || items.error){
      containerEl.innerHTML = '<p class="text-center text-danger py-3 material-empty">تعذّر تحميل المحتوى</p>';
      return;
    }
    courseFolderCache_[folderId] = items;
    renderDrawerLevel(items, containerEl);
  }).withFailureHandler(function(err){
    containerEl.innerHTML = '<p class="text-center text-danger py-3 material-empty">تعذّر تحميل المحتوى: ' + err + '</p>';
  }).getDriveFolderContents(folderId);
}

function fileIconForMime(mimeType){
  mimeType = mimeType || '';
  if(/^video\//.test(mimeType)) return 'fa-file-video';
  if(/^audio\//.test(mimeType)) return 'fa-file-audio';
  if(/pdf/.test(mimeType)) return 'fa-file-pdf';
  if(/wordprocessingml|msword|document/.test(mimeType)) return 'fa-file-word';
  if(/spreadsheetml|ms-excel/.test(mimeType)) return 'fa-file-excel';
  if(/presentationml|ms-powerpoint/.test(mimeType)) return 'fa-file-powerpoint';
  if(/^image\//.test(mimeType)) return 'fa-file-image';
  if(/zip|compressed/.test(mimeType)) return 'fa-file-zipper';
  return 'fa-file';
}

function renderDrawerLevel(items, containerEl){
  if(!items || items.length === 0){
    containerEl.innerHTML = '<p class="text-center text-secondary py-3 material-empty">لا يوجد محتوى</p>';
    return;
  }
  containerEl.innerHTML = '';
  items.forEach(function(item){
    var wrap = document.createElement('div');
    wrap.className = 'material-item-wrap';
    if(item.isFolder){
      wrap.innerHTML =
        '<button type="button" class="material-item material-folder" data-folder-id="' + item.id + '">' +
          '<span class="material-icon"><i class="fa-solid fa-folder"></i></span>' +
          '<span class="material-name">' + escapeHtml(item.name) + '</span>' +
          '<i class="fa-solid fa-chevron-left material-caret"></i>' +
        '</button>' +
        '<div class="material-sublevel d-none"></div>';
    }else{
      var isMedia = /^(video|audio)\//.test(item.mimeType || '');
      wrap.innerHTML =
        '<button type="button" class="material-item material-file" data-file-id="' + item.id + '" data-media="' + (isMedia?1:0) + '" data-size="' + (item.size||0) + '" data-link="' + escapeHtml(item.webViewLink || '') + '">' +
          '<span class="material-icon"><i class="fa-solid ' + fileIconForMime(item.mimeType) + '"></i></span>' +
          '<span class="material-name">' + escapeHtml(item.name) + '</span>' +
        '</button>';
    }
    containerEl.appendChild(wrap);
  });
}

  if(stu.class0 === 'active' || stu.class1 === 'active' || stu.class2 === 'active' || stu.class3 === 'active' ){ // مقبول في أحد المراحل
    //alert([stu.class1 , stu.class2])

    // نُبقي التنبيه ظاهرًا إن كان لديه طلب جديد قيد المراجعة (مثلاً: طلب انتقال لمرحلة أعلى)،
    // ولا نخفيه إلا إن لم يكن هناك أي طلب قائم بانتظار الرد.
    gradeToInroll === null ? loginAlert.classList.add('d-none') : loginAlert.classList.remove('d-none');
    document.querySelector('.mazhabCard')?.classList.remove('d-none');
    document.querySelector('#spSidebar')?.classList.remove('d-none');

    // إبراز بطاقة المذهب المختار (كانت هذه الفقرة قديمًا تخفي زر "اختيار" الصغير داخل الصف
    // وتضيف شارة نصية للصف نفسه — منطق مبني على بنية .sp-task-item/.sp-task-item-selected
    // التي حلّت محلها شبكة بطاقات .sp-mazhab-card بالكامل. إبقاء الكود القديم كان يُخفي
    // البطاقة كلها (وليس زرًا صغيرًا فقط) لأن البطاقة بأكملها صارت هي عنصر <a> نفسه، ويرمي
    // استثناءً لعدم وجود .sp-task-item إطلاقًا بعد الآن. استُبدل بـrenderMazhabSelection()
    // المُصمَّمة خصيصًا للبنية الجديدة (تبديل كلاس .selected فقط، بلا إخفاء عناصر).
    renderMazhabSelection();
  }

  // قاعدة نهائية: أي طالب لديه طلب قيد المراجعة (سواء كان نشطًا في مرحلة أخرى أو لا)
  // يجب أن تظهر له رسالة "طلبك ... قيد المراجعة" دائمًا، مهما كانت الحالات السابقة.
  if(gradeToInroll !== null){
    loginAlert.innerHTML = 'أهلا بك '+stu.name+ msgCurrent;
    loginAlert.classList.remove('d-none');
  }

  if(stu.past.includes('مشاركة')){

    //loginAlert.classList.add('d-none');
    //document.querySelector('.mazhabCard')?.classList.add('d-none');
    document.querySelector('#spSidebar')?.classList.remove('d-none');

  }

  //document.querySelector('#cardStName').textContent = stu.name;
  //document.querySelector('#viewMail').textContent = stu.mail;
  
  //  getExamsCertiData();
  setAnnounces();

  ///////////////////////////////////////////////////////attendance
  await setAttendData();

  // ننتظر فعليًا اكتمال جلب dectationData (بدل مهلة setTimeout ثابتة كانت أحيانًا
  // تعرض التبويب فارغًا لو تأخر الاتصال، أو تُبقيه فارغًا 5 ثوانٍ رغم جاهزية البيانات أسرع)
  await (dectationDataPromise_ || getDectationDataRef());
  const stuDecData = dectationData.filter(e=> e.stuCpr*1 == stu.cpr*1 && e.level == currentLevel);
  renderStudentDectationTaskList(stuDecData);
  renderStudentMetrics(stu);
}

// دعوة الطالب للتسجيل بالمرحلة التالية — تعميم كامل يحل محل ثلاث آليات منفصلة قديمة (كانت كل
// مرحلة مقفولة على آلية/نص مختلف بالكود مباشرة، وواحدة منهم فقط — التأسيسية — عندها دعوة تلقائية
// أصلًا؛ التحصيلية لم يكن لها أي زر إطلاقًا). الأهلية: currentLevel===null (لا مرحلة نشطة أو
// طلب معلَّق) يُعرَض عليه المرحلة 0، أو نشط بمرحلة N يُعرَض عليه N+1 — بشرط عدم وجود طلب معلَّق
// بالفعل لنفس المرحلة (gradeToInroll)، وأن تكون المرحلة مفتوحة فعليًا (stages.registrationOpen،
// يُتحقَّق منها هنا وأيضًا خادميًا بـrequestStageJoin كحماية مزدوجة). راجع مناقشات.md "نظام
// إدارة المراحل" للسياق الكامل، وLECTURE_STAGE_LABELS_ (admin-js.html، متاحة عالميًا هنا لأن كل
// ملفات JS مُدرَجة معًا بنفس نطاق المتصفح عبر Main.html) لأسماء المراحل.
///////////////////////////////////////////////////////////////////////////////////////////
function maybeOfferStageJoinModal(){
  if(gradeToInroll !== null) return; // له طلب قائم بالفعل بانتظار الرد — لا نعرض عليه خيارًا جديدًا

  // بوّابة عامة (statusData.registration): مفتاح تسجيل عام يسبق أي مرحلة، منفصل عن مفتاح كل
  // مرحلة (registrationOpen) — requestStageJoin خادميًا يتحقق من الاثنين معًا، فلو كانت هذه
  // البوّابة العامة مغلقة يجب معاملة كل المراحل كأنها مغلقة هنا أيضًا (بدل إظهار زر سيفشل عند
  // الضغط عليه لاحقًا برسالة "باب التسجيل مغلق حاليًا" رغم ظهوره متاحًا بالواجهة).
  var registrationGateOpen = !(typeof statusData !== 'undefined' && statusData && !statusData.registration);

  if(currentLevel !== null){
    // مسار الترقّي المعتاد: طالب نشط فعليًا بمرحلة N — يُعرَض عليه فقط الالتحاق بالمرحلة التالية
    // N+1 تحديدًا (تقدّم تسلسلي طبيعي)، لا كل المراحل.
    var nextStage = currentLevel + 1;
    if(nextStage > 3 || !registrationGateOpen) return;
    google.script.run.withSuccessHandler(function(stages){
      var stage = (stages || []).find(function(s){ return +s.stageIndex === nextStage; });
      if(stage && stage.registrationOpen) offerStageJoinConfirm(nextStage);
    }).getStagesList();
    return;
  }

  // طالب لا مرحلة نشطة له حاليًا ولا طلب قائم — إما جديد تمامًا، أو أنهى مرحلة سابقة (class[n]
  // === 'done') ولم يُسجَّل بعد بمرحلة جديدة. يُفحص توفّر التسجيل في كل المراحل الأربع معًا، لا
  // مرحلة واحدة مفترَضة سلفًا — كان الافتراض القديم أن كل طالب جديد يبدأ حصرًا بالتأهيلية
  // (المرحلة 0)، فلم تكن هذه الدالة تفحص إلا تلك المرحلة تحديدًا؛ فإن فتحت الإدارة التسجيل بأي
  // مرحلة أخرى (تأسيسية/تأصيلية/تحصيلية) لفئة معينة من الطلاب، لم يكن يظهر للطالب الجديد أي خيار
  // إطلاقًا رغم توفّر تسجيل فعلي — بلاغ صريح من المستخدم عن هذا الخلل تحديدًا. من أنهى مرحلة
  // سابقة (highestDoneStageIndex) لا يُعرَض عليه إلا مراحل أعلى **صراحةً** منها (لا نفسها ولا
  // أدنى منها) — بطلب صريح إضافي من المستخدم.
  if(!registrationGateOpen){ renderNoActiveStageBanner([]); return; }

  var minEligibleStage = highestDoneStageIndex();
  google.script.run.withSuccessHandler(function(stages){
    var openStages = (stages || []).filter(function(s){
      return s.registrationOpen && (minEligibleStage === null || +s.stageIndex > minEligibleStage);
    });
    renderNoActiveStageBanner(openStages);
  }).getStagesList();
}

// أعلى مرحلة أنهاها الطالب فعليًا (class[n] === 'done')، أو null إن لم ينهِ أي مرحلة بعد — يُستخدَم
// لمنع عرض تسجيل بمرحلة مساوية أو أدنى مما أنهاه بالفعل ضمن maybeOfferStageJoinModal أعلاه.
function highestDoneStageIndex(){
  var stu = studentData && studentData[0];
  if(!stu) return null;
  var classCols = [stu.class0, stu.class1, stu.class2, stu.class3];
  var highest = null;
  classCols.forEach(function(v, idx){
    if(v === 'done' && (highest === null || idx > highest)) highest = idx;
  });
  return highest;
}

// تُخفي محتوى تبويب الرئيسية غير المناسب لطالب لم يُسجَّل بأي مرحلة بعد ولم يُنهِ أي مرحلة سابقًا
// (بطاقة "خطوتك التالية" التجريبية + "رحلتي العلمية" + بطاقات الإحصاءات الأربع) — لا تظهر هذه
// الأجزاء إلا لمن هو نشط فعليًا بمرحلة (currentLevel) أو أنهى مرحلة سابقة على الأقل
// (highestDoneStageIndex). بطلب صريح من المستخدم بعد ملاحظة أن الطالب المستجد كان يرى هذه
// الأجزاء ببيانات لا تخصه (أصفار/بيانات تجريبية) بلا أي فائدة له — يبقى loginAlert وحده ظاهرًا.
function toggleHomeContentForEnrollment(){
  var hasHistory = currentLevel !== null || highestDoneStageIndex() !== null;
  var focusSection = document.querySelector('.sp-focus-layout');
  var metricsSection = document.getElementById('spMetricsGrid');
  if(focusSection) focusSection.classList.toggle('d-none', !hasHistory);
  if(metricsSection) metricsSection.classList.toggle('d-none', !hasHistory);
}

function offerStageJoinConfirm(stageIndex){
  var stageName = LECTURE_STAGE_LABELS_[stageIndex];
  Swal.fire({
    title: 'التسجيل مفتوح حاليًا',
    text: 'التسجيل مفتوح حاليًا لمرحلة ' + stageName + '، هل تودّ التسجيل؟',
    icon: 'info',
    confirmButtonText: 'تسجيل',
    confirmButtonColor: '#df2336',
    showCancelButton: true,
    cancelButtonText: 'لاحقًا'
  }).then(function(result){
    if(!result.isConfirmed) return;
    const cpr = studentData[0].cpr;
    loadingStart();
    google.script.run.withSuccessHandler(function(res){
      loadingEnd();
      if(!res || res.error){ alertMSG((res && res.message) || 'تعذّر تسجيل رغبتك', 'error'); return; }
      alertMSG('تم تسجيل رغبتك بالانضمام إلى مرحلة ' + stageName + '، شكرًا لك', 'success');
    }).withFailureHandler(function(err){
      loadingEnd();
      alertMSG(String(err), 'error');
    }).requestStageJoin(cpr, stageIndex);
  });
}

// شريط التنبيه العلوي لطالب لا مرحلة نشطة له ولا طلب قائم — يعكس التوفّر الفعلي للتسجيل بدل
// رسالة "قيد المراجعة" الثابتة السابقة (كانت تظهر دومًا بصرف النظر عن وجود تسجيل مفتوح فعليًا
// من عدمه، وهو بالضبط ما أبلغ عنه المستخدم). openStages: نتيجة getStagesList مُصفّاة على
// registrationOpen فقط (قد تكون فارغة).
function renderNoActiveStageBanner(openStages){
  var loginAlert = document.querySelector('.loginAlert');
  if(!loginAlert || !statusData || !studentData || !studentData[0]) return;
  var stu = studentData[0];

  if(!openStages || openStages.length === 0){
    loginAlert.innerHTML = 'أهلا بك ' + stu.name + '، لا يوجد حاليًا تسجيل متاح للانضمام، تابعنا عبر <a href="https://www.instagram.com/basaer.bh/" target="_blank">مواقع التواصل</a> ليصلك إعلان فتح التسجيل بإذن الله.';
  }else{
    var buttonsHtml = openStages.map(function(s){
      var idx = +s.stageIndex;
      var name = LECTURE_STAGE_LABELS_[idx];
      return '<button type="button" class="btn btn-sm btn-danger m-1" onclick="offerStageJoinConfirm(' + idx + ')">التسجيل في مرحلة ' + name + '</button>';
    }).join('');
    loginAlert.innerHTML = 'أهلا بك ' + stu.name + '، التسجيل متاح حاليًا للانضمام إلى: ' + buttonsHtml;
  }
  loginAlert.classList.remove('d-none');
}

///////////////////////////////////////////////////////////////////////////////////////////
// تبويب "الاختبارات والشهادات" — سجل حقيقي (allExams: كتالوج الاختبارات، examsForStu: محاولات
// الطالب الفعلية عبر getAnswersData) بتصميم sp- (بطاقة اختبار بارز + قائمة مهام). آلية بدء
// الاختبار محفوظة كما هي بالضبط: تضبط branch/hd/md (متغيرات عامة ضمنية) ثم تستدعي loadIqrar() —
// راجع design-guidelines.md قبل تعديل هذا التدفّق.
///////////////////////////////////////////////////////////////////////////////////////////
function setPastExams(){

  var statsGrid = document.getElementById('examsStatsGrid');
  var rowsContainer = document.getElementById('pastExamsList');
  var emptyEl = document.getElementById('examsEmpty');
  var featuredCard = document.getElementById('examFeaturedCard');

  // تأثير التحميل (shimmer) بدأ عند فتح التبويب (js.html: navLink=='examsNav') — يُزال هنا فقط
  // بعد اكتمال البناء الفعلي للبطاقات، نجاحًا أو فشلًا (لا يُترك عالقًا لو الاختبارات فارغة).
  function stopExamsLoading(){
    if(statsGrid) statsGrid.classList.remove('sp-exam-loading');
    if(rowsContainer) rowsContainer.classList.remove('sp-exam-loading');
  }

  // استبعاد أي صف اختبار بلا اسم (صف فارغ/غير مكتمل بشيت rules) — احتياط إضافي جانب الإصلاح
  // الفعلي بـgetExams() (dataGet.js)، تفاديًا لظهور بطاقة اختبار فارغة بلا اسم بالواجهة
  const namedExams = allExams.filter(f => f.exam && String(f.exam).trim());
  const sortedExams = [...namedExams].sort((a, b) => (b.level === currentLevel) - (a.level === currentLevel));
  const validExams = sortedExams.filter(f => f.level <= currentLevel);

  rowsContainer.innerHTML = '';

  function attemptMatchesExam(x, exam){
    return x && exam && String(x.level) === String(exam.level) &&
      (x.examId ? String(x.examId) === String(exam.id) : x.exam === exam.exam);
  }

  function passedAttemptsFor(exam){
    return examsForStu != 0 ? examsForStu.filter(x => attemptMatchesExam(x, exam) && x.rate != 'راسب') : [];
  }

  // رسب في هذا الاختبار وإعادة المحاولة مغلقة حاليًا (retakeOpen=false بشيت rules، يتحكم بها
  // الإداري من صفحة إدارة الاختبارات) → ممنوع من إعادة المحاولة حتى تُفتح صراحةً
  // (submitAnswerData/getQuestions يفرضان هذا خادميًا على أي حال، لكن هذا يمنع الطالب من خوض
  // اختبار كامل ليُرفَض تسليمه في اللحظة الأخيرة)
  function failedRecentlyFor(exam){
    return examsForStu != 0 ? examsForStu.filter(x => attemptMatchesExam(x, exam) && x.failedRecently) : [];
  }

  // -- بطاقة الاختبار المتاح البارزة: أول اختبار بالمرحلة الحالية متاح ولم يُختبَر (بنجاح) بعد
  //    ولم يُرفَض خلال آخر 24 ساعة --
  var featuredExam = validExams.find(function(e){
    return e.check && e.level === currentLevel && passedAttemptsFor(e).length === 0 && failedRecentlyFor(e).length === 0;
  });
  if(featuredExam){
    featuredCard.classList.remove('d-none');
    document.getElementById('examFeaturedName').textContent = featuredExam.exam + (featuredExam.subject ? ' - ' + featuredExam.subject : '');
    document.getElementById('examFeaturedDuration').textContent = featuredExam.duration;
    var featuredBtn = document.getElementById('examFeaturedStartBtn');
    featuredBtn.dataset.exam = featuredExam.exam;
    featuredBtn.dataset.examId = featuredExam.id;
    featuredBtn.dataset.duration = featuredExam.duration;
    featuredBtn.innerHTML = featuredExam.sessionActive ? '<i class="bi bi-arrow-repeat"></i>استكمال الاختبار' : '<i class="bi bi-play-fill"></i>بدء الاختبار';
  }else{
    featuredCard.classList.add('d-none');
  }

  // -- إحصاءات المرحلة الحالية --
  var passedCount = examsForStu != 0 ? examsForStu.filter(x => x.rate != 'راسب' && x.level == currentLevel).length : 0;
  var scores = examsForStu != 0 ? examsForStu.filter(x => x.level == currentLevel && x.result !== '' && x.result != null && !isNaN(+x.result)).map(x => +x.result) : [];
  var avgScore = scores.length > 0 ? Math.round(scores.reduce((a,b) => a+b, 0) / scores.length) : null;
  document.getElementById('examsPassedStat').textContent = passedCount;
  document.getElementById('examsAvgStat').textContent = avgScore != null ? avgScore + '%' : '—';

  // إجمالي نسبة الاجتياز = اختبارات ناجحة / إجمالي اختبارات المرحلة الحالية المتاحة (بغضّ
  // النظر عن حالة الفتح/الإغلاق الحالية — "المتاحة لمرحلته" أي المقرَّرة عليها، لا المفتوحة الآن فقط)
  var totalForLevel = allExams.filter(e => e.level === currentLevel).length;
  var passRate = totalForLevel > 0 ? Math.round((passedCount / totalForLevel) * 100) : null;
  document.getElementById('examsRateStat').textContent = passRate != null ? passRate + '%' : '—';
  document.getElementById('examsRateSub').textContent = totalForLevel > 0 ? (passedCount + ' من ' + totalForLevel + ' اختبارات') : 'لا توجد اختبارات بعد';

  if(validExams.length === 0){
    emptyEl.classList.remove('d-none');
    stopExamsLoading();
    return;
  }
  emptyEl.classList.add('d-none');

  const hasCurrentExams = validExams.some(e => e.level === currentLevel);
  const hasPastExams = validExams.some(e => e.level < currentLevel);
  const needSeparator = hasCurrentExams && hasPastExams;
  let separatorAdded = false;

  validExams.forEach(function(e){
    if(needSeparator && e.level !== currentLevel && !separatorAdded){
      var divider = document.createElement('div');
      divider.className = 'sp-exam-cards-divider';
      divider.textContent = 'مستويات سابقة';
      rowsContainer.appendChild(divider);
      separatorAdded = true;
    }

    var checkThis = passedAttemptsFor(e);
    var failedRecently = failedRecentlyFor(e);
    var trailingHtml;

    if(checkThis.length > 0){
      var passedAttempt = checkThis[0];
      trailingHtml = '<div style="display:flex;align-items:center;gap:8px;">' +
        '<span class="sp-status-pill success">' + escapeHtmlSp(passedAttempt.rate) + '</span>';
      // أيقونة الشهادة تظهر دائمًا لكل اختبار ناجح — رابط مباشر لو صادرة أصلًا، أو زر إصدار
      // ذاتي فوري (startCertSelfIssue, js.html) لو لسه ما صدرتش، بدل إخفائها بالكامل كما كان
      if(passedAttempt.certificate){
        trailingHtml += '<a class="sp-icon-btn" href="' + escapeHtmlSp(passedAttempt.certificate) + '" target="_blank" data-issued-file title="عرض الشهادة"><i class="bi bi-award"></i></a>';
      }else{
        trailingHtml += '<button type="button" class="sp-icon-btn sp-cert-issue-btn" data-exam="' + escapeHtmlSp(e.exam) + '" data-level="' + e.level + '" title="إصدار الشهادة"><i class="bi bi-award"></i></button>';
      }
      trailingHtml += '</div>';
    }else if(failedRecently.length > 0 && e.check && e.level === currentLevel){
      trailingHtml = '<span class="sp-status-pill warning" title="رسبت في هذا الاختبار، وإعادة المحاولة مغلقة حاليًا"><i class="bi bi-lock-fill"></i>الإعادة مغلقة</span>';
    }else if(e.check && e.level === currentLevel){
      trailingHtml = '<button type="button" class="sp-btn-primary sp-exam-start-btn" data-exam="' + escapeHtmlSp(e.exam) + '" data-exam-id="' + escapeHtmlSp(e.id) + '" data-duration="' + e.duration + '"><i class="bi bi-' + (e.sessionActive ? 'arrow-repeat' : 'play-fill') + '"></i>' + (e.sessionActive ? 'استكمال' : 'ابدأ') + '</button>';
    }else{
      trailingHtml = '<span class="sp-status-pill warning">غير متاح</span>';
    }

    var subtext = e.level === currentLevel ? 'مرحلتك الحالية' : 'مرحلة سابقة';
    if(e.sessionActive) subtext += ' — لديك جلسة نشطة والعدّاد مستمر';
    if(failedRecently.length > 0 && checkThis.length === 0 && e.check && e.level === currentLevel){
      subtext += ' — رسبت في هذا الاختبار، وإعادة المحاولة مغلقة حاليًا';
    }

    var displayName = e.exam + (e.subject ? ' - ' + e.subject : '');
    var card = document.createElement('article');
    card.className = 'sp-panel sp-exam-card';
    card.innerHTML = '<span class="sp-exam-card-icon"><i class="bi bi-clipboard2-check"></i></span>' +
      '<strong>' + escapeHtmlSp(displayName) + '</strong><small>' + subtext + '</small>' +
      '<div class="sp-exam-card-action">' + trailingHtml + '</div>';
    rowsContainer.appendChild(card);
  });

  stopExamsLoading();
}

// إصدار شهادة اجتياز بطلب الطالب نفسه (زر .sp-cert-issue-btn، مُفوَّض بـjs.html) — مودال
// إلزامي أثناء الإنشاء (بلا زر إغلاق، بنفس فلسفة استبيان قبل/بعد الاختبار)، يتحوّل لحالة
// نجاح/خطأ عبر Swal.update() على نفس المودال المفتوح (بلا إغلاق/إعادة فتح). الخادم
// (issueCertificateSelfService بـdataPost.js) يتحقق بنفسه من تفعيل الخدمة إداريًا ومن اجتياز
// الطالب فعليًا — لا تكرار لهذا التحقق هنا.
function startCertSelfIssue(examName, level){
  var certUrl = null;

  Swal.fire({
    title: 'إصدار الشهادة',
    width: 420,
    customClass: { popup: 'certIssueModalPopup' },
    html:
      '<p class="mb-2">جاري إنشاء شهادتك، يرجى الانتظار...</p>' +
      '<div class="cert-issue-progress-track"><div class="cert-issue-progress-fill cert-issue-fake-fill"></div></div>',
    showConfirmButton: false,
    showCancelButton: false,
    allowOutsideClick: false,
    allowEscapeKey: false,
    didOpen: function(){
      google.script.run
        .withSuccessHandler(function(res){
          if(res && res.ok && res.url){
            certUrl = res.url;
            // تحديث الحالة المحلية المخزَّنة فورًا حتى تنعكس البطاقة رابطًا حقيقيًا بلا حاجة
            // لإعادة تحميل الصفحة بالكامل، ثم إعادة رسم شبكة البطاقات بنفس البيانات المحدَّثة
            if(examsForStu && examsForStu != 0){
              var match = examsForStu.find(function(x){ return x.exam === examName && String(x.level) === String(level) && x.rate != 'راسب'; });
              if(match) match.certificate = res.url;
            }
            if(typeof setPastExams === 'function') setPastExams();
            Swal.update({
              html: '<div class="text-center"><i class="bi bi-check-circle-fill cert-issue-status-icon success"></i><p>تم إصدار شهادتك بنجاح.</p></div>',
              showConfirmButton: true,
              confirmButtonText: 'فتح الشهادة',
              confirmButtonColor: '#df2336',
              showCancelButton: true,
              cancelButtonText: 'إغلاق',
              allowOutsideClick: true,
              allowEscapeKey: true
            });
          }else{
            Swal.update({
              html: '<div class="text-center"><i class="bi bi-x-circle-fill cert-issue-status-icon error"></i><p>' + escapeHtmlSp((res && res.message) || 'تعذّر إصدار الشهادة حاليًا') + '</p></div>',
              showConfirmButton: true,
              confirmButtonText: 'إغلاق',
              confirmButtonColor: '#6c757d',
              showCancelButton: false,
              allowOutsideClick: true,
              allowEscapeKey: true
            });
          }
        })
        .withFailureHandler(function(){
          Swal.update({
            html: '<div class="text-center"><i class="bi bi-x-circle-fill cert-issue-status-icon error"></i><p>تعذّر إصدار الشهادة حاليًا، حاول لاحقًا.</p></div>',
            showConfirmButton: true,
            confirmButtonText: 'إغلاق',
            confirmButtonColor: '#6c757d',
            allowOutsideClick: true,
            allowEscapeKey: true
          });
        })
        .issueCertificateSelfService(studentData[0].cpr, studentData[0].name, examName, level);
    }
  }).then(function(result){
    if(result.isConfirmed && certUrl){
      window.open(certUrl, '_blank');
    }
  });
}

// يبني بطاقات المذاهب ديناميكيًا من allMadhabs (إدارة المواد، تبويب "المذاهب" — setMazhabsList)
// مُصفَّاة إلى مذاهب مرحلة الطالب الحالية فقط (level بكل مذهب)، ويُبرز المختار حاليًا
// (studentData[0].mazhab) بحالة "مُختار" بصريًا. يُخفي رابط "المذهب الفقهي" بالقائمة الجانبية
// بالكامل (#mazhabNav) إن لم يوجد أي مذهب يخص مرحلة الطالب — لا صفحة فارغة بلا خيارات. يُقفل
// النقر (كلاس .locked) لو كان الطالب قد اختار بالفعل وallowMazhabChange=false (statusData،
// مفتاح "تغيير المذهب" بتبويب المذاهب — إدارة المواد)؛ اختيار أول مذهب يبقى متاحًا دائمًا مهما
// كانت حالة هذا المفتاح. تُستدعى عند فتح تبويب "المذهب الفقهي" (js.html، معالج
// navLink=='mazhabNav')، فور نجاح أي حفظ/تغيير مذهب، وفور وصول allMadhabs (setMazhabsList).
function renderMazhabSelection(){
  var container = document.querySelector('.mazhabCard');
  var navLink = document.getElementById('mazhabNav');
  if(!container) return;

  var current = (studentData && studentData[0] && studentData[0].mazhab) || '';
  var stageLabel = (typeof LECTURE_STAGE_LABELS_ !== 'undefined' && currentLevel !== null) ? LECTURE_STAGE_LABELS_[currentLevel] : null;

  var matching = (allMadhabs || []).filter(function(m){
    if(!stageLabel) return false;
    var levels = String(m.level || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    return levels.indexOf(stageLabel) !== -1;
  });

  if(navLink) navLink.classList.toggle('d-none', matching.length === 0);
  if(matching.length === 0){ container.innerHTML = ''; return; }

  var locked = !!current && statusData && statusData.allowMazhabChange === false;

  var subtitleEl = document.getElementById('mazhabPageSubtitle');
  if(subtitleEl) subtitleEl.textContent = locked
    ? 'اخترت مذهبك الفقهي، ولا يمكنك تغييره حاليًا.'
    : 'اختر المذهب الفقهي الذي ستدرس عليه طوال مراحلك الدراسية، ويمكنك تغيير اختيارك لاحقًا من هذه الصفحة نفسها.';
  var lockedNoteEl = document.getElementById('mazhabLockedNote');
  if(lockedNoteEl) lockedNoteEl.classList.toggle('d-none', !locked);

  container.innerHTML = matching.map(function(m){
    var isSelected = !!current && m.name === current;
    return '<a class="mazhabBtn sp-mazhab-card' + (isSelected ? ' selected' : '') + (locked ? ' locked' : '') + '">' +
      '<span class="sp-mazhab-card-check"><i class="bi bi-check-circle-fill"></i></span>' +
      '<span class="sp-mazhab-card-icon"><i class="bi bi-signpost-2"></i></span>' +
      '<strong class="mazhab">' + escapeHtmlSp(m.name) + '</strong>' +
      '<small>' + escapeHtmlSp(m.description || '') + '</small>' +
    '</a>';
  }).join('');
}

// يبدأ اختبارًا (من بطاقة "متاح الآن" أو من زر "ابدأ" داخل القائمة) — نفس آلية بدء الاختبار

// خادميًا بالكامل (getQuestions/dataGet.js)، فلا يُوثَق بهذه القيمة لأي منع حقيقي هنا.
function startExamFromBtn(btn){
  currentExamId = btn.dataset.examId;
  branch = btn.dataset.exam;
  hd = 0;
  md = +btn.dataset.duration;
  if(branch == 'الفقه'){
    branch = studentData[0].mazhab;

}

// صفحة المتعاون (emp.html) تستخدم نفس غلاف لوحة الإدارة بالكامل (adminDashboard.html)،
// المنقول أصلًا من مرجع basair-admin-suite: نفس الكلاسات (.sidebar/.app-shell/.topbar/
// .page-view/.quick-actions) ونفس دوال التوجيه المشتركة في admin-js.html. مسارات emp-*
// مسجَّلة هنا داخل نفس ADMIN_ROUTE_TITLES_/ADMIN_ROUTE_LOADERS_ المستخدَمة للوحة الإدارة
// الكاملة (لا تعارض معها: أسماؤها مُسبَّقة بـ"emp-"، والشيفرتان لا تتواجدان معًا في #app
// في نفس اللحظة أبدًا).
function registerEmpRoutes(){
  if(typeof ADMIN_ROUTE_TITLES_ === 'undefined' || ADMIN_ROUTE_TITLES_['emp-home']) return;
  Object.assign(ADMIN_ROUTE_TITLES_, {
    'emp-home': 'الرئيسة',
    'emp-attendreg': 'تسجيل الحضور',
    'emp-dictation': 'التسميع',
    'emp-exams': 'الاختبارات',
    'emp-manage': 'الإدارة',
    'emp-followup': 'متابعة التسميع'
    // 'emp-profile' مُعرَّف مباشرة في ADMIN_ROUTE_TITLES_/ADMIN_ROUTE_LOADERS_ (admin-js.html)
    // ليعمل أيضًا من لوحة الإدارة نفسها (لا تستدعي هذه الدالة إطلاقًا)، وليس هنا فقط.
  });
  Object.assign(ADMIN_ROUTE_LOADERS_, {
    'emp-attendreg': loadEmpAttendRegRoute,
    'emp-dictation': loadEmpDictationRoute,
    'emp-followup': loadEmpFollowUpRoute
  });
}

// تسجيل الحضور أصبح مُدمَجًا داخل نفس الغلاف (page-view عادية) بدل استبدال #app بالكامل
// عبر loadAttendReg()/attend.html، وجدوله أصبح بنفس قالب جداول لوحة الإدارة القابلة للفرز/
// الترقيم (renderStudentsTable وأخواتها في admin-js.html) بدل setStudentsRow() القديمة —
// التي كانت السبب في تكرار الصفوف والترقيم غير الصحيح (كانت تُلحِق كل صف بـ setTimeout
// مُدرَّج، فأي نداء ثانٍ للدالة قبل اكتمال الأول يُبقي مؤقّتات الصفوف القديمة تُضيف صفوفها
// فوق صفوف النداء الجديد)، وكانت تنسى استدعاء refreshIcons() فتظل أيقونات القالب/الواتساب
// غير مرئية دائمًا (بلا كلاس Font Awesome حقيقي).
var attendRegSortField_ = 'name', attendRegSortDir_ = 'asc';
var attendRegPageSize_ = 50, attendRegCurrentPage_ = 1;
var attendRegControlsBound_ = false;

function loadEmpAttendRegRoute(){
  setupAttendRegControls();
  loadingStart();
  google.script.run.withSuccessHandler(function(dr){
    allStuData = Array.isArray(dr) ? dr : [];
    loadingEnd();
    attendRegCurrentPage_ = 1;
    renderAttendRegTable();
    setRouteLoading('emp-attendreg', false);
  }).withFailureHandler(function(){
    allStuData = allStuData || [];
    loadingEnd();
    renderAttendRegTable();
    setRouteLoading('emp-attendreg', false);
  }).getPersons();
}

function setupAttendRegControls(){
  if(attendRegControlsBound_) return;
  attendRegControlsBound_ = true;

  var searchInp = document.getElementById('attendRegSearchInput');
  if(searchInp) searchInp.addEventListener('input', function(){
    attendRegCurrentPage_ = 1;
    renderAttendRegTable();
  });

  var pageSizeSel = document.getElementById('attendRegPageSize');
  if(pageSizeSel){
    pageSizeSel.value = String(attendRegPageSize_);
    pageSizeSel.addEventListener('change', function(){
      attendRegPageSize_ = parseInt(pageSizeSel.value, 10) || 50;
      attendRegCurrentPage_ = 1;
      renderAttendRegTable();
    });
  }

  document.querySelectorAll('#attendRegTable th[data-sort]').forEach(function(th){
    th.addEventListener('click', function(){
      var field = th.getAttribute('data-sort');
      if(attendRegSortField_ === field) attendRegSortDir_ = attendRegSortDir_ === 'asc' ? 'desc' : 'asc';
      else { attendRegSortField_ = field; attendRegSortDir_ = 'asc'; }
      updateSortIndicator('attendRegTable', attendRegSortField_, attendRegSortDir_);
      attendRegCurrentPage_ = 1;
      renderAttendRegTable();
    });
  });

  updateSortIndicator('attendRegTable', attendRegSortField_, attendRegSortDir_);
}

function renderAttendRegTable(){
  var tbody = document.getElementById('attendRegRowsContainer');
  if(!tbody) return;

  var records = Array.isArray(allStuData) ? allStuData.slice() : [];

  var searchInp = document.getElementById('attendRegSearchInput');
  var q = searchInp ? (searchInp.value || '').trim().toLowerCase() : '';
  if(q) records = records.filter(function(e){ return String(e.name || '').toLowerCase().indexOf(q) !== -1; });

  records.sort(function(a, b){
    if(attendRegSortField_ === 'level'){
      var la = getStudentCurrentLevel(a), lb = getStudentCurrentLevel(b);
      var cmp = (la === null ? 99 : la) - (lb === null ? 99 : lb);
      return attendRegSortDir_ === 'desc' ? -cmp : cmp;
    }
    var cmp2 = String(a.name || '').localeCompare(String(b.name || ''), 'ar');
    return attendRegSortDir_ === 'desc' ? -cmp2 : cmp2;
  });

  renderPagination('attendRegPagination', records.length, attendRegPageSize_, attendRegCurrentPage_, function(page){
    attendRegCurrentPage_ = page;
    renderAttendRegTable();
  });

  if(records.length === 0){
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--muted)">لا يوجد طلاب مطابقون</td></tr>';
    return;
  }

  var totalPages = Math.max(1, Math.ceil(records.length / attendRegPageSize_));
  if(attendRegCurrentPage_ > totalPages) attendRegCurrentPage_ = totalPages;
  var startIdx = (attendRegCurrentPage_ - 1) * attendRegPageSize_;
  var pageRecords = records.slice(startIdx, startIdx + attendRegPageSize_);

  tbody.innerHTML = pageRecords.map(function(e, i){
    var lvl = getStudentCurrentLevel(e);
    var cardBtn = e.cardUrl ? '<button type="button" class="icon-button showCard" data-card-url="' + escapeHtml(e.cardUrl) + '" title="عرض بطاقة QR"><i data-icon="scan-qr-code"></i></button>' : '';
    var wpBtn = e.phone ? '<button type="button" class="icon-button wpd" data-phone="' + escapeHtml(e.phone) + '" title="تواصل واتساب"><i data-icon="message-circle"></i></button>' : '';
    return '<tr>' +
      '<td>' + (startIdx + i + 1) + '</td>' +
      '<td>' + escapeHtml(e.name) + '</td>' +
      '<td>' + (lvl !== null ? stageBadgeHtml(lvl) : '<span style="color:#b7bec5">—</span>') + '</td>' +
      '<td><div class="table-actions">' + cardBtn + wpBtn + '</div></td>' +
    '</tr>';
  }).join('');

  refreshIcons();
}

/* ==========================================================================
   متابعة التسميع — صفحة مدمجة (بلا استبدال #app بالكامل)، تحل محل currentStus.html
   القديمة (أصبحت غير مستخدَمة). نفس قالب الجداول القابلة للفرز/الترقيم في بقية المشروع.
   ========================================================================== */
var curStuAllData_ = [];
var curStuStageFilter_ = '0';
var curStuSortField_ = null;
var curStuSortDir_ = 'asc';
var curStuPageSize_ = 50;
var curStuCurrentPage_ = 1;
var curStuControlsBound_ = false;

function loadEmpFollowUpRoute(){
  setupCurStuControls();
  loadingStart();

  var loaded = { persons: false, dec: false };
  function tryRender(){
    if(!loaded.persons || !loaded.dec) return;
    loadingEnd();
    curStuCurrentPage_ = 1;
    renderCurStuTable();
    setRouteLoading('emp-followup', false);
  }

  google.script.run.withSuccessHandler(function(dr){
    curStuAllData_ = Array.isArray(dr) ? dr : [];
    loaded.persons = true; tryRender();
  }).withFailureHandler(function(){
    curStuAllData_ = []; loaded.persons = true; tryRender();
  }).getPersons();

  getDectationDataRef().then(function(){ loaded.dec = true; tryRender(); });
}

function setupCurStuControls(){
  if(curStuControlsBound_) return;
  curStuControlsBound_ = true;

  var stageGroup = document.getElementById('curStuStageGroup');
  if(stageGroup) stageGroup.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-stage]');
    if(!btn) return;
    stageGroup.querySelectorAll('button').forEach(function(b){ b.classList.toggle('active', b === btn); });
    curStuStageFilter_ = btn.getAttribute('data-stage');
    curStuCurrentPage_ = 1;
    renderCurStuTable();
  });

  var pageSizeSel = document.getElementById('curStuPageSize');
  if(pageSizeSel){
    pageSizeSel.value = String(curStuPageSize_);
    pageSizeSel.addEventListener('change', function(){
      curStuPageSize_ = parseInt(pageSizeSel.value, 10) || 50;
      curStuCurrentPage_ = 1;
      renderCurStuTable();
    });
  }

  document.querySelectorAll('#curStuTable th[data-sort]').forEach(function(th){
    th.addEventListener('click', function(){
      var field = th.getAttribute('data-sort');
      if(curStuSortField_ === field) curStuSortDir_ = curStuSortDir_ === 'asc' ? 'desc' : 'asc';
      else { curStuSortField_ = field; curStuSortDir_ = 'asc'; }
      updateSortIndicator('curStuTable', curStuSortField_, curStuSortDir_);
      curStuCurrentPage_ = 1;
      renderCurStuTable();
    });
  });

  updateSortIndicator('curStuTable', curStuSortField_, curStuSortDir_);
}

// نفس منطق الفلترة الأصلي حرفيًا (motonRates بعمود matn محدَّد بالاسم "الأرجوزة المئيّة") —
// لم يُغيَّر عند إعادة التصميم، فقط أُعيد استخدامه هنا وفي مودال السجلات.
function getCurStuDecRecords(cpr){
  var list = Array.isArray(dectationData) ? dectationData : [];
  return list.filter(function(d){ return d.stuCpr*1 == cpr*1 && d.matn == 'الأرجوزة المئيّة'; });
}

// نفس الفلترة/الفرز المعروضين حاليًا بالجدول، بلا تقطيع صفحات — يُستخدَم في العرض والتصدير معًا
// حتى يُصدَّر بالضبط ما يراه المستخدم على الشاشة (نفس مرحلة الفلتر ونفس ترتيب الفرز).
function getCurStuFilteredRecords(){
  var classKey = 'class' + curStuStageFilter_;
  var records = curStuAllData_
    .filter(function(r){ return r[classKey] === 'active'; })
    .map(function(r){
      return { cpr: r.cpr, name: r.name, gender: r.gender, phone: r.phone, decRecords: getCurStuDecRecords(r.cpr) };
    });

  if(curStuSortField_){
    var field = curStuSortField_, dir = curStuSortDir_ === 'desc' ? -1 : 1;
    records.sort(function(a, b){
      if(field === 'decCount') return (a.decRecords.length - b.decRecords.length) * dir;
      return String(a[field] || '').localeCompare(String(b[field] || ''), 'ar') * dir;
    });
  }
  return records;
}

function curStuExportRows(){
  return getCurStuFilteredRecords().map(function(r, i){
    return {
      '#': i + 1,
      'الاسم': r.name || '',
      'الجنس': r.gender || '',
      'الهاتف': r.phone || '',
      'سجلات التسميع': r.decRecords.length
    };
  });
}

function exportCurStuExcel(){
  var stage = LECTURE_STAGE_LABELS_[parseInt(curStuStageFilter_, 10) || 0];
  exportRowsToExcel({ title: 'متابعة التسميع - ' + stage, rows: curStuExportRows(), filename: 'متابعة التسميع - ' + stage });
}

function exportCurStuPDF(){
  var stage = LECTURE_STAGE_LABELS_[parseInt(curStuStageFilter_, 10) || 0];
  var columns = [
    { key: '#', label: '#' },
    { key: 'الاسم', label: 'الاسم' },
    { key: 'الجنس', label: 'الجنس' },
    { key: 'الهاتف', label: 'الهاتف' },
    { key: 'سجلات التسميع', label: 'سجلات التسميع' }
  ];
  exportRowsToPDF({ title: 'متابعة التسميع - ' + stage, subtitle: 'أكاديمية بصائر', columns: columns, rows: curStuExportRows() });
}

function renderCurStuTable(){
  var tbody = document.getElementById('curStuTableBody');
  if(!tbody) return;

  var records = getCurStuFilteredRecords();

  renderPagination('curStuPagination', records.length, curStuPageSize_, curStuCurrentPage_, function(page){
    curStuCurrentPage_ = page; renderCurStuTable();
  });

  if(records.length === 0){
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--muted)">لا يوجد طلاب في هذه المرحلة</td></tr>';
    return;
  }

  var totalPages = Math.max(1, Math.ceil(records.length / curStuPageSize_));
  if(curStuCurrentPage_ > totalPages) curStuCurrentPage_ = totalPages;
  var startIdx = (curStuCurrentPage_ - 1) * curStuPageSize_;
  var pageRecords = records.slice(startIdx, startIdx + curStuPageSize_);

  tbody.innerHTML = pageRecords.map(function(r, i){
    var count = r.decRecords.length;
    // تمييز الأعداد: عدد فيه سجلات = بادچ أخضر قابل للضغط يفتح المودال، صفر = بادچ باهت غير قابل للضغط
    var countHtml = count > 0
      ? '<button type="button" class="soft-badge green" style="border:0;cursor:pointer;" onclick="openCurStuDecModal(\'' + escapeHtml(r.cpr) + '\',\'' + escapeHtml(r.name) + '\')">' + count + ' سجل</button>'
      : '<span class="soft-badge" style="opacity:.55;">0</span>';
    return '<tr>' +
      '<td>' + (startIdx + i + 1) + '</td>' +
      '<td>' + escapeHtml(r.name) + '</td>' +
      '<td>' + escapeHtml(r.gender || '—') + '</td>' +
      '<td dir="ltr">' + escapeHtml(r.phone || '—') + '</td>' +
      '<td>' + countHtml + '</td>' +
    '</tr>';
  }).join('');

  refreshIcons();
}

/* ==========================================================================
   مودال "سجلات التسميع" لطالب واحد — يُفتح من عمود سجلات التسميع أعلاه. جدول قابل للفرز
   بنفس آلية th[data-sort]/updateSortIndicator العامة، والدرجة مُمَيَّزة ببادچ ملوَّن.
   ========================================================================== */
var curStuDecRecords_ = [];
var curStuDecStudentName_ = '';
var curStuDecSortField_ = null;
var curStuDecSortDir_ = 'asc';
var curStuDecSortBound_ = false;

function openCurStuDecModal(cpr, name){
  curStuDecRecords_ = getCurStuDecRecords(cpr);
  curStuDecStudentName_ = name || '';
  var labelEl = document.getElementById('dectationModalLabel');
  if(labelEl) labelEl.textContent = 'سجلات التسميع / ' + name;
  curStuDecSortField_ = null;
  curStuDecSortDir_ = 'asc';

  if(!curStuDecSortBound_){
    curStuDecSortBound_ = true;
    document.querySelectorAll('#curStuDecTable th[data-sort]').forEach(function(th){
      th.addEventListener('click', function(){
        var field = th.getAttribute('data-sort');
        if(curStuDecSortField_ === field) curStuDecSortDir_ = curStuDecSortDir_ === 'asc' ? 'desc' : 'asc';
        else { curStuDecSortField_ = field; curStuDecSortDir_ = 'asc'; }
        updateSortIndicator('curStuDecTable', curStuDecSortField_, curStuDecSortDir_);
        renderCurStuDecTable();
      });
    });
  }

  renderCurStuDecTable();
  showModal('dectationModal');
}

// نفس الفلترة/الفرز المعروضين حاليًا بجدول المودال، بلا تقطيع صفحات — يُستخدَم في العرض والتصدير معًا
function getCurStuDecSortedRecords(){
  var records = curStuDecRecords_.slice();
  if(curStuDecSortField_){
    var field = curStuDecSortField_, dir = curStuDecSortDir_ === 'desc' ? -1 : 1;
    records.sort(function(a, b){
      if(field === 'werd' || field === 'rate') return ((Number(a[field]) || 0) - (Number(b[field]) || 0)) * dir;
      return String(a[field] || '').localeCompare(String(b[field] || ''), 'ar') * dir;
    });
  }
  return records;
}

function curStuDecExportRows(){
  return getCurStuDecSortedRecords().map(function(e, i){
    return {
      '#': i + 1,
      'المتن': e.matn || '',
      'الورد': e.werd || '',
      'الدرجة': (e.rate != null ? e.rate : '') + ' / 4',
      'المُسمّع': e.resp || ''
    };
  });
}

function exportCurStuDecExcel(){
  var title = 'سجلات التسميع - ' + curStuDecStudentName_;
  exportRowsToExcel({ title: title, rows: curStuDecExportRows(), filename: title });
}

function exportCurStuDecPDF(){
  var columns = [
    { key: '#', label: '#' },
    { key: 'المتن', label: 'المتن' },
    { key: 'الورد', label: 'الورد' },
    { key: 'الدرجة', label: 'الدرجة' },
    { key: 'المُسمّع', label: 'المُسمّع' }
  ];
  exportRowsToPDF({ title: 'سجلات التسميع - ' + curStuDecStudentName_, subtitle: 'أكاديمية بصائر', columns: columns, rows: curStuDecExportRows() });
}

function renderCurStuDecTable(){
  var tbody = document.getElementById('curStuDecTableBody');
  if(!tbody) return;

  var records = getCurStuDecSortedRecords();

  if(records.length === 0){
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--muted)">لا توجد سجلات</td></tr>';
    return;
  }

  tbody.innerHTML = records.map(function(e, i){
    var rateBadgeClass = Number(e.rate) >= 3 ? 'green' : 'pink';
    return '<tr>' +
      '<td>' + (i + 1) + '</td>' +
      '<td>' + escapeHtml(e.matn) + '</td>' +
      '<td>' + escapeHtml(e.werd) + '</td>' +
      '<td><span class="soft-badge ' + rateBadgeClass + '">' + escapeHtml(e.rate) + ' / 4</span></td>' +
      '<td>' + escapeHtml(e.resp) + '</td>' +
    '</tr>';
  }).join('');
}

// بمعرّفات عناصر مختلفة (بادئة emp) لتفادي أي تعارض أسماء دوال عامة (كل ملفات
// JS محمَّلة معًا دومًا عبر Main.html حتى لو لم تتزامن صفحتاهما في DOM أبدًا).
// الفروق عن نسخة الطالب مُقرَّرة صراحة في مناقشات.md: بلا حقول مجمع/منطقة/هاتف
// بديل (غير موجودة في بيانات المتعاون)، وبطاقة "معلومات العمل" (الوظيفة +
// الصلاحيات الممنوحة فعليًا) بدل الملخص الأكاديمي. تُقرأ البيانات دومًا عبر
// getMyProfileData(cpr) (وليس userData المحمَّلة أصلًا، لأنها لا تحمل كل الحقول

var empPfInited_ = false;
var empPfApplyServerData_ = null; // تُضبَط مرة واحدة داخل initEmpProfileTab، تُستدعى في كل تحميل بيانات
var empPfCpr_ = '';
var empPfPendingAvatarBase64_ = null;
var empPfPendingAvatarMime_ = null;
var EMP_PERM_LABELS_ = [
  ['registration','تسجيل الحضور'],
  ['dictation','التسميع'],
  ['followUp','متابعة التسميع'],
  ['exam','الاختبارات'],
  ['manage','الإدارة الكاملة']
];

function loadEmpProfileRoute(){
