  function shortDisplayName(fullName){
    var parts = String(fullName == null ? '' : fullName).trim().split(/\s+/).filter(Boolean);
    var n = parts.length;
    if(n === 0) return '';

    function isAbdPair(i){ return parts[i] === 'عبد' && parts[i+1] && parts[i+1].indexOf('ال') === 0; }

    var frontLen = isAbdPair(0) ? 2 : 1;
    var first = parts.slice(0, frontLen).join('');
    if(frontLen >= n) return first;

    var lastLen = (n - 2 >= frontLen && isAbdPair(n - 2)) ? 2 : 1;
    var last = parts.slice(n - lastLen).join('');

    return first === last ? first : (first + ' ' + last);
  }

  // نظير firstNameOnly_ في code.js (الخادم) — الاسم الأول فقط، مع معاملة "عبد"+كلمة تالية
  // تبدأ بـ"ال" كاسم واحد (بمسافة طبيعية، لا دمج مضغوط كـshortDisplayName أعلاه). يُستخدم
  // لمعاينة نص الرسالة الشخصية بالواجهة قبل الإرسال الفعلي — الإرسال نفسه يحدث بالخادم.
  function firstNameOnly(fullName){
    var parts = String(fullName == null ? '' : fullName).trim().split(/\s+/).filter(Boolean);
    if(parts.length === 0) return '';
    var isAbdPair = parts[0] === 'عبد' && parts[1] && parts[1].indexOf('ال') === 0;
    return isAbdPair ? (parts[0] + ' ' + parts[1]) : parts[0];
  }

  // نظير toInternationalWhatsAppNumber في code.js (الخادم) — يبني رقمًا دوليًا كاملًا صالحًا
  // لروابط wa.me من أي قيمة مخزَّنة في عمود phone، قديمة (8 خانات بحرينية بلا كود دولة) أو
  // جديدة (دولية كاملة). راجع code.js للتفاصيل الكاملة؛ يجب إبقاء المنطق مطابقًا هنا وهناك.
  function toInternationalWhatsAppNumber(rawPhone){
    var digits = String(rawPhone == null ? '' : rawPhone).replace(/\D+/g, '');
    if(!digits) return '';
    if(digits.indexOf('00') === 0) digits = digits.substring(2);
    while(digits.charAt(0) === '0' && digits.length > 8) digits = digits.substring(1);
    if(digits.length === 8) digits = '973' + digits;
    return digits;
  }

  function isoToFlag(iso){
    if(!iso || iso.length !== 2) return '🏳️';

      // لحدوث هذا: العودة من "معاينة صفحة طالب/متعاون" (adminPreviewStudentPage/
      // adminPreviewStaffPage تستدعيان loadDashboard() نفسها للعودة)، لكنه ينطبق على أي
      // استدعاء لاحق لـloadDashboard() بعد أول تحميل. إعادة ضبط كل الأعلام هنا يضمن إعادة
      // الربط الصحيح فور فتح أي صفحة إدارية من جديد بعد هذا الاستبدال.

      if (typeof examsControlsBound_ !== 'undefined') examsControlsBound_ = false;

      var attempts = 0;
      var maxAttempts = 100; // <--- زدنا الرقم هنا (كان 20) ليصبر 5 ثوانٍ

// SweetAlert2 المركزية القديمة)، بنفس تصميم بوابة الطالب الجديدة. لم يتغيّر
// توقيع الدالة عمدًا حتى تعمل كل نقاط الاستدعاء الحالية (67 موضعًا) دون تعديل.

var gToastTimer_;
function alertMSG(msg,myIcon){
  var toastEl = document.getElementById('gToast');
  if(!toastEl) return;

  var iconMap = {
    success: 'bi-check-circle-fill',
    error: 'bi-x-circle-fill',
    warning: 'bi-exclamation-triangle-fill',
    info: 'bi-info-circle-fill'
  };
  var kind = iconMap[myIcon] ? myIcon : 'info';

  toastEl.className = 'gToast gToast-' + kind;
  toastEl.querySelector('i').className = 'bi ' + iconMap[kind];
  toastEl.querySelector('span').innerHTML = msg;

  requestAnimationFrame(function(){ toastEl.classList.add('show'); });
  clearTimeout(gToastTimer_);
  gToastTimer_ = setTimeout(function(){
    toastEl.classList.remove('show');
  }, 4000);
}

/////////////////////////////////////////////////////////////////////////////
// قارئ QR الخارجي (website/qr-scan-relay.html على basaerbh.com، خارج Apps Script تمامًا) —
// getUserMedia للكاميرا يفشل دومًا (NotAllowedError) من داخل صفحة Apps Script نفسها، لأنها
// مُغلَّفة داخل iframe لا يملك المطوّر أي تحكم في سياسة أذوناته (قيد موثَّق من جوجل، غير قابل
// للإصلاح من هذا المشروع). نفس فكرة basaer-oauth-relay الموجودة أصلًا (auth-js.html) لتسجيل
// الدخول بجوجل: صفحة مستقلة تُفتح كنافذة منبثقة، وتُرسل النتيجة عبر postMessage بدل استدعاء
// الخادم مباشرة (لا يوجد جسر google.script.run خارج صفحات Apps Script). هنا نستدعي setAttendQr
// كالمعتاد بنفس جلسة الدخول الموثوقة، ثم نُعيد النتيجة لنافذة الماسح لعرضها هناك فورًا — لأن
// المستخدم غالبًا ناظر لنافذة الكاميرا تلك، لا التبويب الأصلي.
/////////////////////////////////////////////////////////////////////////////
var QR_SCAN_RELAY_URL_ = 'https://basaerbh.com/qr-scan-relay';
var qrScanPopup_ = null;
// تغيير معماري: كانت الصفحة الوسيطة (qr-scan-relay.html) تُرسل postMessage لهذا التبويب في كل
// مسح، وهذا التبويب هو من يستدعي setAttendQr فعليًا — أثبت الاستخدام الفعلي على الجوال أن هذا
// غير موثوق إطلاقًا: تبويب لوحة الإدارة يبقى بالخلفية طوال جلسة المسح (المستخدم ناظر لنافذة
// الكاميرا فقط)، ومتصفحات الجوال تُعلّق تنفيذ الجافاسكربت في أي تبويب بالخلفية — فتصل الرسالة
// أحيانًا دون أن يُنفَّذ أي كود مستقبِل لها إطلاقًا (طالب واحد فقط يُسجَّل ثم تتعطل الجلسة).
// الآن: الصفحة الوسيطة تتصل بالخادم مباشرة (fetch إلى doPost)، فهذا التبويب لم يعد ضروريًا
// لإتمام أي تسجيل — فقط لحظة فتح القارئ، حين يُولَّد token قصير الصلاحية (startQrSession، بينما
// هذا التبويب لا يزال نشطًا ومُصادَقًا فعليًا) ويُرفَق مع رابط الصفحة الوسيطة.
function openQrScannerPage() {
  // window.open يجب أن يُستدعى فورًا ضمن حدث الضغط نفسه بلا أي انتظار غير متزامن قبله، وإلا
  // تحجبه متصفحات الجوال كنافذة منبثقة — نفس الدرس المستفاد سابقًا مع نافذة تسجيل الدخول عبر
  // جوجل. لذا نفتح نافذة فارغة فورًا، ثم نُوجِّهها لاحقًا بعد وصول بطاقة الجلسة من الخادم.
  qrScanPopup_ = window.open('', 'basaerQrScan', 'width=480,height=720');
  if (!qrScanPopup_) {
    alertMSG('يرجى السماح بالنوافذ المنبثقة (Pop-ups) لهذا الموقع، ثم إعادة المحاولة', 'error');
    return;
  }
  try { qrScanPopup_.focus(); } catch (e) {}

  google.script.run.withSuccessHandler(function (token) {
    // رابط يحمل طابعًا زمنيًا مختلفًا في كل مرة (cache-busting) فتُجبَر النافذة على إعادة الجلب
    // الفعلي من الخادم بدل أي نسخة مخبَّأة محليًا، بالإضافة لبطاقة الجلسة الجديدة.
    var freshUrl = QR_SCAN_RELAY_URL_ + '?t=' + Date.now() + '&session=' + encodeURIComponent(token);
    try { qrScanPopup_.location.href = freshUrl; } catch (e) {}
  }).withFailureHandler(function (err) {
    try { qrScanPopup_.close(); } catch (e) {}
    alertMSG('تعذّر بدء جلسة قارئ QR: ' + err, 'error');
  }).startQrSession((typeof userData !== 'undefined' && userData && userData[0] && userData[0].name) || '');
}

// يُطبَّق عند تغيير اختيار "مقيم بالبحرين؟ / خارج البحرين؟" في فورم التسجيل — يُظهر/يُخفي
// الحقول ذات الصلة، ويضبط required/disabled عليها حتى لا يمنع HTML5 الإرسالَ بحقل مخفي فارغ.
function applyResidencyChoice(choice){
  var isAbroad = choice === 'abroad';

  var cprWrap = document.getElementById('cprFieldWrap');
  var remoteStudyNote = document.getElementById('remoteStudyNote');
  var blockAreaWrap = document.getElementById('blockAreaWrap');
  var countryWrap = document.getElementById('countryFieldWrap');
  var blockInp = document.getElementById('block');
  var areaInp = document.getElementById('area');
  var countryInp = document.getElementById('residencyCountry');
  var phoneCountrySel = document.getElementById('phoneCountry');
  var phoneCountryBadge = document.getElementById('phoneCountryBadge');

  cprWrap?.classList.toggle('d-none', isAbroad);
  remoteStudyNote?.classList.toggle('d-none', !isAbroad);
  blockAreaWrap?.classList.toggle('d-none', isAbroad);
  countryWrap?.classList.toggle('d-none', !isAbroad);

  if(blockInp){ blockInp.required = !isAbroad; blockInp.disabled = isAbroad; }
  if(areaInp){ areaInp.required = !isAbroad; areaInp.disabled = isAbroad; }
  if(countryInp){
    countryInp.required = isAbroad;
    countryInp.disabled = !isAbroad;
    // افتراضيًا نفس الدولة المختارة في الجنسية (تسهيلًا فقط، يبقى بإمكان الطالب تغييرها).
    if(isAbroad) syncResidencyCountryFromNationality();
  }

  // داخل البحرين: لا داعي لإظهار قائمة اختيار دولة أصلًا (شارة ثابتة 🇧🇭 +973 بدلًا منها).
  // خارج البحرين: القائمة الفعلية تظهر، حرّة الاختيار.
  if(phoneCountrySel){
    phoneCountrySel.classList.toggle('d-none', !isAbroad);
    phoneCountrySel.disabled = !isAbroad;
    if(!isAbroad) phoneCountrySel.value = '973';
  }
  phoneCountryBadge?.classList.toggle('d-none', isAbroad);
  updatePhonePattern();
}

// يضبط "دولة الإقامة" لتطابق "الجنسية" الحالية (لو كانت خانة الجنسية مُختارة بالفعل) — قيمة
// افتراضية فقط، الطالب حرّ في تغييرها بعد ذلك لو دولة إقامته تختلف عن جنسيته.
function syncResidencyCountryFromNationality(){
  var nationalitySel = document.getElementById('nationality');
  var countryInp = document.getElementById('residencyCountry');
  if(!nationalitySel || !countryInp || !nationalitySel.value) return;
  countryInp.value = nationalitySel.value;
}

// طول رقم الهاتف المحلي يختلف من دولة لأخرى؛ 8 أرقام بالضبط للبحرين (كالسابق تمامًا)، ونطاق
// أوسع لباقي الدول بدل رفض أي رقم دولي مشروع لمجرد أنه ليس 8 أرقام.
function updatePhonePattern(){
  var phoneCountrySel = document.getElementById('phoneCountry');
  var phoneInp = document.getElementById('phone');
  if(!phoneInp) return;
  phoneInp.pattern = (phoneCountrySel && phoneCountrySel.value === '973') ? '^[0-9]{8}$' : '^[0-9]{4,14}$';
}

async function setAttendData(){
  //alert(studentData)
  // لوحة الإدارة الجديدة: إن كان جدول الحضور الإداري معروضًا حاليًا فهذا يعني بالتأكيد أننا
  // في سياق إداري (وليس صفحة طالب)، حتى لو تبقّت قيمة قديمة في studentData من استخدام سابق
  // لميزة "معاينة صفحة الطالب" (لا تُصفَّر تلقائيًا عند العودة للوحة الإدارة).
  var isAdminAttendanceTable = !!document.getElementById('attendRowsContainer');
  if(!isAdminAttendanceTable && studentData && studentData.length > 0){
    stuCpr = studentData[0].cpr;
    const stuAttendCard = document.querySelector('#showAttQrCard');
    const homeCardBtn = document.querySelector('#spShowCardBtn');

    if(stuAttendCard){
      studentData[0].cardUrl !== '' ?
      stuAttendCard.setAttribute('href',studentData[0].cardUrl)
     : stuAttendCard.classList.add('d-none');
    }
    if(homeCardBtn){
      studentData[0].cardUrl !== '' ?
      homeCardBtn.setAttribute('href',studentData[0].cardUrl)
     : homeCardBtn.classList.add('d-none');
    }

    // زر "طلب إضافة حضور" يظهر فقط لو الإدارة مفعِّلة الميزة حاليًا (مفتاح "طلبات الحضور"
    // بصفحة الحضور بلوحة الإدارة، نفس فكرة فتح/إغلاق التسجيل).
    var requestAttendBtnEl = document.getElementById('requestAttendBtn');
    if(requestAttendBtnEl){
      google.script.run.withSuccessHandler(function(dr){
        requestAttendBtnEl.classList.toggle('d-none', !(dr && dr.attendanceRequestsOpen));
      }).withFailureHandler(function(){
        requestAttendBtnEl.classList.add('d-none');
      }).getMainStatus();
    }
  }else{
    stuCpr = null;
  }
  google.script.run.withSuccessHandler(function(dr){
    // نستبعد سجلات "طلب" (resp='request') لسه ما اتقبلتش — مش حضور فعلي بعد، فمش المفروض
    // تظهر لا في قائمة الطالب ولا في جدول الإدارة الرئيسي ولا إحصائياته. تُعرَض فقط عبر
    // مودال "طلبات الحضور" المخصَّص (getAttendanceRequests).
    attendData = (Array.isArray(dr) ? dr : []).filter(function(e){ return e.resp !== 'request'; });

    // لوحة الإدارة الجديدة: جدول "سجل الحضور" الفعلي يُرسم من هنا (كان هذا الاستدعاء مفقودًا
    // تمامًا سابقًا فيما عدا مسار الطالب أعلاه — الجدول كان يبقى فارغًا دائمًا لأي زائر إداري).
    if (typeof renderAttendanceAdminTable === 'function' && document.getElementById('attendRowsContainer')) {
      renderAttendanceAdminTable();
    }

    var seen = {};
    var uniqueData = Array.isArray(attendData) ? attendData.filter(function(e) {
      // نحول التاريخ لصيغة يوم/شهر/سنة فقط
      var d = new Date(e.date);
      if (isNaN(d.getTime())) return false;
      var dateStr =  d.getFullYear()+ '-' + (d.getMonth() + 1) + '-' + d.getDate();

      var key = e.cpr + '_' + dateStr;
      if (seen[key]) return false;
      seen[key] = true;

      // نخزن النسخة المنسقة في العنصر نفسه لاستخدامها لاحقًا
      e._formattedDate = dateStr;
      return true;
    }) : [];

    renderStudentAttendanceList(uniqueData);

    loadingEnd();
  }).getAttendance(stuCpr);
}

// تبويب "الحضور والانضباط": يعرض أيام الحضور مباشرة كقائمة (بلا مفتاح/مودال منفصل)،
// بنفس أسلوب قائمة "التسميع والأوراد" (sp-task-list). uniqueData مُصفّاة سلفًا (يوم واحد
// لكل تاريخ) من setAttendData أعلاه.
/////////////////////////////////////////////////////////////////////////////
var attendStagesCache_ = null; // نتيجة getStagesList() مخزَّنة لتفادي تكرار الجلب لكل رسم لهذه القائمة
var attendRenderToken_ = 0; // يمنع رسمًا متأخرًا (بعد وصول المراحل) بقائمة قديمة فوق رسم أحدث منها

function renderStudentAttendanceList(list){
  var container = document.getElementById('spAttendList');
  if(!container) return;

  if(!list.length){
    var countEl0 = document.getElementById('attendCountStat');
    if(countEl0) countEl0.textContent = 0;
    container.innerHTML = '';
    var emptyEl0 = document.getElementById('attendEmpty');
    if(emptyEl0) emptyEl0.classList.remove('d-none');
    return;
  }

  var myToken = ++attendRenderToken_;
  if(attendStagesCache_){
    renderStudentAttendanceListWithStages_(list, attendStagesCache_);
  }else{
    // رسم أولي فوري (يُصفَّى بمرحلته الحالية فقط، بلا فصل الدفعة السابقة بعد لحين وصول
    // courseStartDate)، ثم إعادة رسم فورية بمجرد توفّر بيانات المراحل — لا تأخير محسوس بالظهور.
    renderStudentAttendanceListWithStages_(list, []);
    pfGasCall('getStagesList').then(function(stages){
      attendStagesCache_ = Array.isArray(stages) ? stages : [];
      if(myToken === attendRenderToken_) renderStudentAttendanceListWithStages_(list, attendStagesCache_);
    }).catch(function(){ /* فشل جلب المراحل: تبقى القائمة مُصفّاة بالمرحلة الحالية فقط بلا استبعاد دفعة سابقة */ });
  }
}

// يعرض فقط أيام حضور مرحلة الطالب النشطة حاليًا (currentLevel، مضبوطة عالميًا قبل استدعاء
// setAttendData — راجع funcs-js.html)، وضمنها فقط الدفعة الحالية تحديدًا لو أُعيد الطالب لنفس
// المرحلة أكثر من مرة: أي حضور قبل courseStartDate المسجَّل بـ"إدارة المراحل" لهذه المرحلة يخص
// دفعة سابقة انتهت فيُستبعد، لا عمود جديد أو تعديل بيانات، القيم كلها موجودة أصلًا (level بشيت
// الحضور، courseStartDate بشيت stages). بطلب المستخدم صراحةً بعد معاينة نسخة سابقة كانت تعرض
// المراحل السابقة المنتهية أيضًا (بعنوان منفصل) — تبيّن أن هذا غير مرغوب هنا إطلاقًا، فقط
// "الدورة الحالية". لا مرحلة نشطة له حاليًا (currentLevel فارغة) → تُعرَض كل السجلات كما هي، تفاديًا
// لإخفاء تاريخه الحقيقي بالكامل بلا أي بديل معروض.
function renderStudentAttendanceListWithStages_(list, stages){
  var container = document.getElementById('spAttendList');
  if(!container) return;
  var countEl = document.getElementById('attendCountStat');
  var emptyEl = document.getElementById('attendEmpty');

  var stageByLevel = {};
  (stages || []).forEach(function(s){ stageByLevel[+s.stageIndex] = s; });

  var curLvl = (typeof currentLevel !== 'undefined' && currentLevel !== null) ? +currentLevel : null;
  var filtered = curLvl === null ? list.slice() : list.filter(function(item){
    return item.level !== null && item.level !== undefined && item.level !== '' && +item.level === curLvl;
  });

  if(curLvl !== null){
    var stage = stageByLevel[curLvl];
    if(stage && stage.courseStartDate){
      var start = new Date(stage.courseStartDate);
      if(!isNaN(start.getTime())){
        filtered = filtered.filter(function(item){ return new Date(item.date).getTime() >= start.getTime(); });
      }
    }
  }

  if(countEl) countEl.textContent = filtered.length;

  if(!filtered.length){
    container.innerHTML = '';
    if(emptyEl) emptyEl.classList.remove('d-none');
    return;
  }
  if(emptyEl) emptyEl.classList.add('d-none');

  var sorted = filtered.slice().sort(function(a,b){ return new Date(b.date).getTime() - new Date(a.date).getTime(); });

  container.innerHTML = sorted.map(function(e){
    var d = new Date(e.date);
    var dateStr = !isNaN(d.getTime()) ? d.toLocaleDateString('ar-BH', {weekday:'long', day:'numeric', month:'long', year:'numeric'}) : '';
    var timeStr = !isNaN(d.getTime()) ? d.toLocaleTimeString('ar-BH', {hour:'numeric', minute:'2-digit'}) : '';
    return '<article class="sp-task-item">' +
      '<span class="sp-task-number"><i class="bi bi-check-lg"></i></span>' +
      '<div><strong>' + escapeHtmlSp(dateStr) + '</strong></div>' +
      (timeStr ? '<span class="sp-rating"><i class="bi bi-clock"></i>' + escapeHtmlSp(timeStr) + '</span>' : '') +
    '</article>';
  }).join('');
}

// طلب الطالب إضافة يوم حضور (تاريخ اليوم أو لاحق فقط + سبب إلزامي) — يُسجَّل على الخادم
// بحالة "طلب" (resp = 'request') بانتظار قبول الإدارة، وليس كحضور فعلي مباشرة.

function requestAttendanceFlow(){
  if(!studentData || !studentData.length){ alertMSG('تعذّر التعرّف على بيانات الطالب', 'error'); return; }
  var cpr = studentData[0].cpr;
  var name = studentData[0].name;
  var todayStr = new Date().toISOString().slice(0,10);

  Swal.fire({
    title: 'طلب إضافة حضور',
    html:
      '<label class="form-label text-end d-block">التاريخ:</label>' +
      '<input type="date" id="swal-request-date" class="form-control mb-3" value="' + todayStr + '" max="' + todayStr + '">' +
      '<label class="form-label text-end d-block">سبب الإضافة:</label>' +
      '<textarea id="swal-request-reason" class="form-control" rows="3" placeholder="اذكر سبب طلب إضافة الحضور"></textarea>',
    focusConfirm: false,
    showCancelButton: true,
    confirmButtonColor: '#b5262c',
    confirmButtonText: 'إرسال الطلب',
    cancelButtonText: 'إلغاء',
    preConfirm: function(){
      var date = document.getElementById('swal-request-date').value;
      var reason = document.getElementById('swal-request-reason').value.trim();
      if(!date){ Swal.showValidationMessage('الرجاء اختيار تاريخ'); return false; }
      if(date > todayStr){ Swal.showValidationMessage('لا يمكن اختيار تاريخ مستقبلي'); return false; }
      if(!reason){ Swal.showValidationMessage('الرجاء ذكر سبب الإضافة'); return false; }
      return { date: date, reason: reason };
    }
  }).then(function(result){
    if(!result.isConfirmed) return;

    Swal.fire({ title:'جاري الإرسال...', didOpen: function(){ Swal.showLoading(); }, allowOutsideClick:false });

    google.script.run
      .withSuccessHandler(function(res){
        if(res && res.ok){
          Swal.fire({ icon:'success', title:'تم إرسال الطلب', text:'سيُراجع طلبك من إدارة الأكاديمية قريبًا', timer:2200, showConfirmButton:false });
        }else{
          Swal.fire({ icon:'warning', title:'لم يتم إرسال الطلب', text:(res && res.message) ? res.message : 'حدث خطأ غير معروف' });
        }
      })
      .withFailureHandler(function(err){
        Swal.fire({ icon:'error', title:'فشل', text: String(err && err.message || err) });
      })
      .requestAttendance({ cpr: cpr, name: name, date: result.value.date, reason: result.value.reason });
  });
}

// إضافة يوم حضور يدوي لطالب معيّن (نافذة اختيار تاريخ + استدعاء الخادم)، مُعاد استخدامها من
// أكثر من صفحة (سجل الحضور، وتفاصيل الطالب في لوحة الإدارة). onSuccess(dateStr) اختيارية،

function addManualAttendanceFlow(cpr, name, onSuccess){

  Swal.fire({
    title: 'إضافة يوم حضور',
    html:
      '<div class="text-end mb-2"><strong>' + escapeHtml(name) + '</strong>' +
      ' <span class="text-muted small">(CPR: ' + escapeHtml(cpr) + ')</span></div>' +

    confirmButtonText: 'إضافة',

    preConfirm: function(){
      var v = document.getElementById('swal-attend-date').value;
      if(!v){
        Swal.showValidationMessage('الرجاء اختيار تاريخ');
        return false;
      }
      return v;
    }
  }).then(function(result){
    if(!result.isConfirmed) return;

    var dateStr = result.value;
    var respName = (typeof userData !== 'undefined' && userData && userData[0] && userData[0].name)
                     ? userData[0].name : 'مشرف';

    Swal.fire({ title:'جاري الإضافة...', didOpen: function(){ Swal.showLoading(); }, allowOutsideClick:false });

    google.script.run
      .withSuccessHandler(function(res){
        if(res && res.ok){
          Swal.fire({ icon:'success', title:'تمت الإضافة', timer:1500, showConfirmButton:false });
          if(typeof onSuccess === 'function') onSuccess(dateStr);

      .withFailureHandler(function(err){

      .addManualAttendance({
        cpr: cpr,
        name: name,
        date: dateStr,
        resp: respName
      });
  });
}

// المنسدلة بالشريط العلوي)، تحل محل prepareDashboardPage() الخاصة بلوحة الإدارة
// لأن عناصر id الخاصة بها (#wrapper, #sidebar-wrapper, #menu-toggle) غير موجودة
// في هيكل صفحة الطالب الجديد.

function prepareStudentPortalShell(){
  var portal = document.getElementById('studentPortal');
  var menuBtn = document.getElementById('spMobileMenuBtn');
  var sidebar = document.getElementById('spSidebar');
  var overlay = document.getElementById('spSidebarOverlay');
  var userTrigger = document.getElementById('spUserTrigger');
  var userPopover = document.getElementById('spUserPopover');
  var notifBtn = document.getElementById('spNotifBtn');
  var notifPopover = document.getElementById('spNotifPopover');

  if(menuBtn && !menuBtn.hasAttribute('data-init')){
    menuBtn.setAttribute('data-init','1');
    menuBtn.addEventListener('click', function(e){
      e.preventDefault();
      portal.classList.add('sp-sidebar-open');
    });
  }
  if(overlay && !overlay.hasAttribute('data-init')){
    overlay.setAttribute('data-init','1');
    overlay.addEventListener('click', function(){
      portal.classList.remove('sp-sidebar-open');
    });
  }
  // إغلاق القائمة الجانبية على الهاتف عند اختيار أي تبويب
  if(sidebar && !sidebar.hasAttribute('data-init')){
    sidebar.setAttribute('data-init','1');
    sidebar.querySelectorAll('.sp-nav-item').forEach(function(link){
      link.addEventListener('click', function(){
        portal.classList.remove('sp-sidebar-open');
        var title = link.querySelector('span') ? link.querySelector('span').textContent : '';
        var pageTitle = document.getElementById('spPageTitle');
        if(pageTitle) pageTitle.textContent = title;
      });
    });
  }
  if(userTrigger && !userTrigger.hasAttribute('data-init')){
    userTrigger.setAttribute('data-init','1');
    userTrigger.addEventListener('click', function(e){
      e.stopPropagation();
      if(notifPopover) notifPopover.hidden = true;
      userPopover.hidden = !userPopover.hidden;
    });
    document.addEventListener('click', function(){
      userPopover.hidden = true;
    });
  }
  if(notifBtn && !notifBtn.hasAttribute('data-init')){
    notifBtn.setAttribute('data-init','1');
    notifBtn.addEventListener('click', function(e){
      e.stopPropagation();
      if(userPopover) userPopover.hidden = true;
      notifPopover.hidden = !notifPopover.hidden;
    });
    document.addEventListener('click', function(){
      notifPopover.hidden = true;
    });
  }

  var todayEl = document.getElementById('spTodayDate');
  if(todayEl){
    todayEl.textContent = new Date().toLocaleDateString('ar-BH', { weekday:'long', day:'numeric', month:'long' });
  }

  var journeyDetailsBtn = document.getElementById('spJourneyDetailsBtn');
  if(journeyDetailsBtn && !journeyDetailsBtn.hasAttribute('data-init')){
    journeyDetailsBtn.setAttribute('data-init','1');
    journeyDetailsBtn.addEventListener('click', function(){
      alertMSG('جاري العمل على تجهيز رحلتك', 'info');
    });
  }

  // شريط "وضع معاينة الإدارة" (عند فتح صفحة طالب من لوحة الإدارة عبر
  // adminPreviewStudentPage) — نُخفي زر تسجيل الخروج الحقيقي حتى لا يُسجَّل
  // الموظف نفسه خروجًا من حسابه بالخطأ، ونوفر بدلًا منه زر عودة آمن.
  var previewBar = document.getElementById('spAdminPreviewBar');
  var previewNameEl = document.getElementById('spAdminPreviewName');
  var previewExitBtn = document.getElementById('spAdminPreviewExitBtn');
  if(typeof adminPreviewActive_ !== 'undefined' && adminPreviewActive_){
    portal.classList.add('sp-preview-mode');
    if(previewBar) previewBar.classList.remove('d-none');
    if(previewNameEl && studentData && studentData[0]) previewNameEl.textContent = studentData[0].name;
    document.querySelectorAll('.sp-logout-btn, .sp-user-popover button[onclick="logout()"]').forEach(function(btn){
      btn.classList.add('d-none');
    });
    if(previewExitBtn && !previewExitBtn.hasAttribute('data-init')){
      previewExitBtn.setAttribute('data-init','1');
      previewExitBtn.addEventListener('click', function(){
        adminPreviewActive_ = false;
        loadDashboard();
      });
    }
  }else{
    portal.classList.remove('sp-preview-mode');
    if(previewBar) previewBar.classList.add('d-none');
  }

  // زر "لوحة الإدارة" بقائمة المستخدم — يظهر فقط لو صاحب الحساب الحقيقي (لا وضع معاينة إدارية
  // لطالب آخر) له أيضًا صلاحية إدارية بشيت emp (نفس رقمه الشخصي). راجع مناقشات.md "طالب
  // بصلاحية إدارية". لا تأثير على تسجيل الدخول نفسه — فقط رابط تنقّل لمن له الصلاحية أصلًا.
  var goAdminBtn = document.getElementById('spGoAdminBtn');
  if(goAdminBtn){
    // .d-none لا hidden — .sp-user-popover button{display:flex} (بلا !important) يُبطل سمة
    // [hidden] الافتراضية هنا، بنفس السبب الموثَّق أعلاه لأزرار تسجيل الخروج بوضع المعاينة.
    var isPreview = typeof adminPreviewActive_ !== 'undefined' && adminPreviewActive_;
    if(isPreview || !studentData || !studentData[0] || !studentData[0].cpr){
      goAdminBtn.classList.add('d-none');
    }else if(!goAdminBtn.hasAttribute('data-checked')){
      goAdminBtn.setAttribute('data-checked','1');
      google.script.run.withSuccessHandler(function(perm){
        goAdminBtn.classList.toggle('d-none', !(perm && perm.allowed));
      }).withFailureHandler(function(){ goAdminBtn.classList.add('d-none'); }).hasExamPermission(studentData[0].cpr);
    }
  }
}

// رسم مسار المراحل الدراسية (رحلتي العلمية) في تبويب الرئيسية، اعتمادًا على
// class0..class3 الفعلية لبيانات الطالب (بلا أي بيانات وهمية).
/////////////////////////////////////////////////////////////////////////////
function renderStudentJourney(stu){
  var list = document.getElementById('spStageTimeline');
  var stageSymbol = document.getElementById('spStageSymbol');
  var stageName = document.getElementById('spStageName');
  var footerStageName = document.getElementById('spFooterStageName');
  if(!list) return;

  var stages = [
    { key:'class0', name:'المرحلة التأهيلية', colorClass:'sp-qualification' },
    { key:'class1', name:'المرحلة التأسيسية', colorClass:'sp-foundation' },
    { key:'class2', name:'المرحلة التأصيلية', colorClass:'sp-rooting' },
    { key:'class3', name:'المرحلة التحصيلية', colorClass:'sp-attainment' }
  ];

  list.innerHTML = '';
  stages.forEach(function(s, i){
    var val = stu[s.key];
    var li = document.createElement('li');
    li.dataset.stageIndex = i;
    var statusText, statusIcon, dotContent = (i+1);

    if(val === 'done'){
      li.className = 'sp-complete';
      statusText = 'مكتملة';
      statusIcon = '<b><i class="bi bi-check-lg"></i> مكتملة</b>';
      dotContent = '<i class="bi bi-check"></i>';
    }else if(val === 'active'){
      li.className = 'sp-current';
      statusText = 'أنت هنا الآن';
      statusIcon = '<b>المرحلة الحالية</b>';
    }else if(val === true){
      statusText = 'الطلب قيد المراجعة';
      statusIcon = '<i class="bi bi-hourglass-split"></i>';
    }else{
      statusText = 'تُفتح بعد اجتياز المرحلة السابقة';
      statusIcon = '<i class="bi bi-lock"></i>';
    }

    li.innerHTML =
      '<span class="sp-stage-dot ' + s.colorClass + '">' + dotContent + '</span>' +
      '<div><strong>' + s.name + '</strong><small>' + statusText + '</small></div>' +
      statusIcon;
    list.appendChild(li);

    if(val === 'active' && stageSymbol && stageName){
      stageSymbol.textContent = (i+1);
      stageName.textContent = s.name;
    }
    if(val === 'active' && footerStageName){
      footerStageName.textContent = s.name;
    }
  });
}

// المصدر الوحيد لتحديد هذا، لا class0..class3 التي تعكس فقط انتقالًا إداريًا قد يسبق إصدار
// الشهادة الفعلي) — يستبدل نقطة المرحلة العادية (رقم/علامة صح) بشارة ذهبية تفتح رابط الشهادة
// عند الضغط، مع تاريخ الإصدار كعنوان تلميحي (tooltip) وإضافة نصية لسطر الحالة. تُستدعى بعد
// renderStudentJourney بشكل غير حاجب (لا تؤخّر رسم المسار الأساسي — استدعاء خادمي منفصل).

function applyStageCertBadges(cpr){
  var list = document.getElementById('spStageTimeline');
  if(!list) return;
  google.script.run.withSuccessHandler(function(certs){
    if(!Array.isArray(certs) || !certs.length) return;
    certs.forEach(function(cert){
      var li = list.querySelector('li[data-stage-index="' + cert.stageIndex + '"]');
      if(!li) return;
      var dot = li.querySelector('.sp-stage-dot');
      if(!dot) return;

      var dateStr = '';
      var d = cert.issuedAt ? new Date(cert.issuedAt) : null;
      if(d && !isNaN(d.getTime())) dateStr = d.toLocaleDateString('ar-BH', {day:'numeric', month:'long', year:'numeric'});

      var badge = document.createElement('a');
      badge.className = dot.className + ' sp-cert-badge';
      badge.href = cert.url;
      badge.target = '_blank';
      badge.rel = 'noopener';
      badge.title = dateStr ? ('اضغط لعرض شهادة الاجتياز — صدرت في ' + dateStr) : 'اضغط لعرض شهادة الاجتياز';
      badge.innerHTML = '<i class="bi bi-award-fill"></i>';
      dot.replaceWith(badge);

      var subEl = li.querySelector('div small');
      if(subEl && dateStr) subEl.textContent = subEl.textContent + ' · صدرت الشهادة في ' + dateStr;
    });
  }).withFailureHandler(function(){ /* لا حرج — الشارة تحسينية، لا تعطيل بديل */ })
  .getMyStageCertificates(cpr);
}

function renderStudentMetrics(stu){
  var attEl = document.getElementById('spMetricAttendance');
  var decEl = document.getElementById('spMetricRecitation');
  var examEl = document.getElementById('spMetricExams');

  // نسبة الحضور = محاضرات مرحلته الحالية الفعلية (من "إدارة المحاضرات") التي له حضور فيها ÷
  // إجمالي محاضراتها منذ "بداية الدورة" (راجع getStageAttendanceStats بdataGet.js ومناقشات.md
  // "نظام إدارة المراحل"). تحل محل عداد "أيام الحضور: إجمالي منذ التسجيل" القديم، الذي كان
  // فعليًا يعدّ كل تاريخ حضور بالسجل بأكمله بلا أي فلترة بتاريخ رغم تسميته.
  if(attEl){
    var subEl = document.getElementById('spMetricAttendanceSub');
    google.script.run.withSuccessHandler(function(res){
      if(!res || res.percent === null || res.percent === undefined){
        attEl.textContent = '—';
        if(subEl) subEl.textContent = 'لم تُحدَّد بداية الدورة بعد';
        return;
      }
      attEl.textContent = res.percent + '%';
      if(subEl) subEl.textContent = res.attended + ' من ' + res.total + ' محاضرة منذ بداية الدورة';
    }).withFailureHandler(function(){
      attEl.textContent = '—';
    }).getStageAttendanceStats(stu.cpr);
  }

  if(decEl){
    var decCount = Array.isArray(dectationData) ? dectationData.filter(function(e){
      return e.stuCpr*1 == stu.cpr*1 && e.level == currentLevel;
    }).length : 0;
    decEl.textContent = decCount;
  }

  if(examEl){
    if(Array.isArray(examsForStu)){
      examEl.textContent = examsForStu.filter(function(e){ return e.rate != 'راسب' && e.level == currentLevel; }).length;
    }else{
      google.script.run.withSuccessHandler(function(dr){
        examsForStu = dr;
        examEl.textContent = Array.isArray(examsForStu) ? examsForStu.filter(function(e){ return e.rate != 'راسب' && e.level == currentLevel; }).length : 0;
      }).getAnswersData(stu.cpr);
    }
  }
}

// يُغلّف google.script.run بوعد (Promise) عادي — نفس فكرة getDectationDataRef الموجودة أصلًا
// بالمشروع، لكن معمَّمة لأي دالة خادم بدل تكرار نفس النمط لكل نداء.
function pfGasCall(fnName){
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(resolve, reject){
    var caller = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    caller[fnName].apply(caller, args);
  });
}

// محدد دولة الهاتف في تبويب "الملف الشخصي" (طالب/متعاون/مدير معًا) — نفس نمط تسجيل طالب جديد
// (registration.html: #phoneCountry/populatePhoneCountrySelect/updatePhonePattern)، لكن هنا كل
// حقل هاتف له select مستقل قابل للتفاعل دومًا (بلا مفهوم "مقيم/خارج البحرين" الخاص بالتسجيل)،
// فنكتب مزامنة النمط بأنفسنا بدل استدعاء updatePhonePattern المرتبطة بمعرّفات ثابتة.
function pfSyncPhonePattern(selectEl, inputEl){
  if(!inputEl) return;
  inputEl.pattern = (selectEl && selectEl.value === '973') ? '^[0-9]{8}$' : '^[0-9]{4,14}$';
}
function pfInitPhoneCountrySelect(selectEl, inputEl){
  if(!selectEl || typeof populatePhoneCountrySelect !== 'function') return;
  populatePhoneCountrySelect(selectEl);
  pfSyncPhonePattern(selectEl, inputEl);
  selectEl.addEventListener('change', function(){ pfSyncPhonePattern(selectEl, inputEl); });
}

// يفصل رقم هاتف مخزَّن (قد يكون بادئة دولة + رقم محلي "973XXXXXXXX"، أو رقمًا محليًا مجرَّدًا
// بالصيغة القديمة قبل هذا التغيير "XXXXXXXX") إلى {dialCode, local} — لعرض الرقم المحلي فقط
// في الحقل (بلا تكرار الكود مع شارة الدولة)، مع اختيار الدولة الصحيحة تلقائيًا في القائمة.
// أي رقم 8 أرقام أو أقل يُعامَل دومًا كرقم بحريني مجرَّد قديم (تفاديًا لتطابق زائف مع كود دولة
// قصير كـ"1" لأمريكا). القائمة مرتَّبة من الأطول كودًا للأقصر لتفادي تطابق كود قصير جزئيًا أولًا.
function pfSplitPhoneValue(fullPhone){
  var digits = String(fullPhone || '').replace(/\D/g, '');
  if(!digits || digits.length <= 8 || typeof COUNTRY_LIST_ === 'undefined'){
    return { dialCode: '973', local: digits };
  }
  var candidates = COUNTRY_LIST_.filter(function(c){ return c[2]; }).slice().sort(function(a, b){ return b[2].length - a[2].length; });
  for(var i = 0; i < candidates.length; i++){
    var code = candidates[i][2];
    if(digits.indexOf(code) === 0 && digits.length - code.length >= 4){
      return { dialCode: code, local: digits.slice(code.length) };
    }
  }
  return { dialCode: '973', local: digits };
}
// يعكس pfSplitPhoneValue: يملأ شارة/قائمة الدولة بالكود الصحيح وحقل الإدخال بالرقم المحلي فقط
// (بلا كود الدولة داخله)، عند تحميل بيانات حقيقية من الخادم.
function pfApplyPhoneValue(selectEl, inputEl, fullPhone){
  if(!inputEl) return;
  var parts = pfSplitPhoneValue(fullPhone);
  if(selectEl) selectEl.value = parts.dialCode;
  inputEl.value = parts.local;
  pfSyncPhonePattern(selectEl, inputEl);
}
// يعكس الاتجاه عند الحفظ: يُلحق كود الدولة المختار بالرقم المحلي المُدخَل قبل إرساله للخادم،
// حتى يبقى الشكل المخزَّن دائمًا بصيغة دولية كاملة (نفس تنسيق toInternationalWhatsAppNumber
// المستخدَم بالفعل عند إرسال واتساب في أماكن أخرى بالمشروع)، لا رقمًا محليًا مجرَّدًا بعد الآن.
function pfComposePhoneValue(selectEl, inputEl){
  if(!inputEl) return '';
  var local = inputEl.value.trim();
  if(!local) return '';
  var dialCode = (selectEl && selectEl.value) || '973';
  return dialCode + local;
}

function initProfileTab(){
  var form = document.getElementById('profileForm');
  if(!form) return;

  var saveButton = document.getElementById('saveButton');
  var discardButton = document.getElementById('discardButton');
  var saveState = document.getElementById('pfSaveState');
  var unsavedIndicator = document.getElementById('unsavedIndicator');
  var avatarInput = document.getElementById('pfAvatarInput');
  var avatarPreview = document.getElementById('pfAvatarPreview');
  var initialState = '';

  pfInitPhoneCountrySelect(document.getElementById('phoneCountrySelect'), document.getElementById('phone'));
  pfInitPhoneCountrySelect(document.getElementById('phone2CountrySelect'), document.getElementById('phone2'));
  applyDobAgeLimit(document.getElementById('dob'));

  function activateTab(tabName){
    document.querySelectorAll('.sp-settings-tab').forEach(function(button){
      button.classList.toggle('active', button.dataset.tab === tabName);
    });
    document.querySelectorAll('.sp-settings-panel').forEach(function(panel){
      var active = panel.dataset.panel === tabName;
      panel.hidden = !active;
      panel.classList.toggle('active', active);
    });
  }
  document.querySelectorAll('.sp-settings-tab').forEach(function(button){
    button.addEventListener('click', function(){ activateTab(button.dataset.tab); });
  });

  function serializeForm(){
    var data = {};
    new FormData(form).forEach(function(value, key){ data[key] = value; });
    return JSON.stringify(data);
  }

  function markDirty(){
    var dirty = serializeForm() !== initialState || !!pfPendingAvatarBase64_;
    if(saveButton) saveButton.disabled = !dirty;
    if(discardButton) discardButton.disabled = !dirty;
    if(saveState){
      saveState.classList.toggle('dirty', dirty);
      saveState.querySelector('strong').textContent = dirty ? 'لديك تغييرات غير محفوظة' : 'جميع التغييرات محفوظة';
    }
    if(unsavedIndicator){
      unsavedIndicator.classList.toggle('dirty', dirty);
      unsavedIndicator.querySelector('strong').textContent = dirty ? 'تغييرات تنتظر الحفظ' : 'لا توجد تغييرات غير محفوظة';
    }
  }

  function syncDisplayName(){
    var fullNameEl = document.getElementById('fullName');
    var fullName = (fullNameEl && fullNameEl.value.trim()) || '—';
    var displayEl = document.getElementById('pfDisplayName');
    if(displayEl) displayEl.textContent = fullName;
  }

  function updateCompletion(){
    var required = ['fullName','dob','gender','nationality','email','phone','block','area'];
    var filled = required.filter(function(name){
      var field = form.elements.namedItem(name);
      return field && String(field.value).trim();
    }).length;
    var phone2El = form.elements.namedItem('phone2');
    var hasAvatar = avatarPreview && avatarPreview.src && avatarPreview.src.indexOf('id=1BifdUAOo6594jxvnkxOUiwXonhetUPpm') === -1;
    var percent = Math.round((filled / required.length) * 80) + ((phone2El && phone2El.value.trim()) ? 10 : 0) + (hasAvatar ? 10 : 0);
    percent = Math.min(percent, 100);
    var pctEl = document.getElementById('pfCompletionPercent');
    var barEl = document.getElementById('pfCompletionBar');
    var hintEl = document.getElementById('pfCompletionHint');
    if(pctEl) pctEl.textContent = percent + '%';
    if(barEl) barEl.style.width = percent + '%';
    if(hintEl) hintEl.textContent = percent === 100 ? 'ملفك مكتمل وجاهز' : 'أضف صورة شخصية ورقم هاتف بديل';
  }

  function validateField(field){
    var wrap = field.closest('.sp-input-wrap');
    if(!wrap) return field.checkValidity();
    var valid = field.checkValidity();
    wrap.classList.toggle('sp-invalid', !valid);
    var formField = field.closest('.sp-form-field');
    var message = formField ? formField.querySelector('.sp-field-message') : null;
    if(message && !valid){
      message.classList.add('error');
      message.textContent = field.validity.patternMismatch ? 'يرجى إدخال 8 أرقام صحيحة' : 'هذا الحقل مطلوب';
    }else if(message){
      message.classList.remove('error');
    }
    return valid;
  }

  form.addEventListener('input', function(event){
    if(event.target.matches('input, select')) validateField(event.target);
    if(event.target.id === 'fullName') syncDisplayName();
    updateCompletion();
    markDirty();
  });
  form.addEventListener('change', function(){ updateCompletion(); markDirty(); });

  document.querySelectorAll('[data-contact-choice]').forEach(function(button){
    button.addEventListener('click', function(){
      document.querySelectorAll('[data-contact-choice]').forEach(function(item){ item.classList.remove('active'); });
      button.classList.add('active');
      var prefInput = document.getElementById('contactPreference');
      if(prefInput) prefInput.value = button.dataset.contactChoice;
      markDirty();
    });
  });

  if(avatarInput && avatarPreview){
    avatarInput.addEventListener('change', function(){
      var file = avatarInput.files && avatarInput.files[0];
      if(!file) return;
      if(!/^image\/(png|jpe?g)$/.test(file.type)){
        alertMSG('صيغة الصورة غير مدعومة، يرجى اختيار png أو jpg', 'error');
        avatarInput.value = '';
        return;
      }
      if(file.size > 3 * 1024 * 1024){
        alertMSG('حجم الصورة يجب ألا يتجاوز 3 ميجابايت', 'error');
        avatarInput.value = '';
        return;
      }
      var reader = new FileReader();
      reader.onload = function(event){
        var dataUrl = event.target.result;
        avatarPreview.src = dataUrl;
        pfPendingAvatarBase64_ = dataUrl.split(',')[1];
        pfPendingAvatarMime_ = file.type;
        updateCompletion();
        markDirty();
      };
      reader.readAsDataURL(file);
    });
  }

  document.querySelectorAll('[data-toggle-password]').forEach(function(button){
    button.addEventListener('click', function(){
      var input = document.getElementById(button.dataset.togglePassword);
      var showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      button.setAttribute('aria-label', showing ? 'إظهار كلمة المرور' : 'إخفاء كلمة المرور');
      button.innerHTML = '<i class="bi ' + (showing ? 'bi-eye' : 'bi-eye-slash') + '"></i>';
    });
  });

  var currentPasswordEl = document.getElementById('currentPassword');
  var newPassword = document.getElementById('newPassword');
  var confirmPassword = document.getElementById('confirmPassword');
  var strength = form.querySelector('.sp-password-strength');
  var strengthText = document.getElementById('passwordStrengthText');
  var matchText = document.getElementById('passwordMatch');

  if(newPassword){
    newPassword.addEventListener('input', function(){
      var value = newPassword.value;
      var score = 0;
      if(value.length >= 8) score++;
      if(/[A-Zأ-ي]/.test(value) && /[a-zأ-ي]/.test(value)) score++;
      if(/\d/.test(value)) score++;
      if(/[^A-Za-z0-9أ-ي]/.test(value)) score++;
      strength.className = 'sp-password-strength ' + (['','weak','medium','good','strong'][score] || '');
      strengthText.textContent = ['لم تُدخل كلمة مرور','ضعيفة','متوسطة','جيدة','قوية'][score];
    });
  }

  if(confirmPassword){
    confirmPassword.addEventListener('input', function(){
      if(!confirmPassword.value){
        matchText.textContent = '';
        matchText.classList.remove('error');
        return;
      }
      var matches = newPassword.value === confirmPassword.value;
      matchText.textContent = matches ? 'كلمتا المرور متطابقتان' : 'كلمتا المرور غير متطابقتين';
      matchText.classList.toggle('error', !matches);
    });
  }

  function resetPasswordFields(){
    ['currentPassword','newPassword','confirmPassword'].forEach(function(id){ var el = document.getElementById(id); if(el) el.value = ''; });
    if(strength) strength.className = 'sp-password-strength';
    if(strengthText) strengthText.textContent = 'لم تُدخل كلمة مرور';
    if(matchText){ matchText.textContent = ''; matchText.classList.remove('error'); }
  }

  form.addEventListener('submit', async function(event){
    event.preventDefault();
    var fields = Array.prototype.slice.call(form.querySelectorAll('input[required], select[required]'));
    var allValid = fields.map(validateField).every(Boolean);
    if(newPassword.value && newPassword.value !== confirmPassword.value){
      activateTab('security');
      alertMSG('يرجى التأكد من تطابق كلمتي المرور', 'error');
      return;
    }
    if(!allValid){
      var invalid = fields.find(function(field){ return !field.checkValidity(); });
      var panel = invalid.closest('.sp-settings-panel');
      activateTab(panel.dataset.panel);
      setTimeout(function(){ invalid.focus(); }, 250);
      alertMSG('يرجى مراجعة الحقول المطلوبة', 'error');
      return;
    }

    saveButton.disabled = true;
    loadingStart();
    try{
      if(pfPendingAvatarBase64_){
        var avatarResult = await pfGasCall('uploadProfileAvatar', pfCpr_, pfPendingAvatarBase64_, pfPendingAvatarMime_);
        if(!avatarResult || !avatarResult.ok) throw new Error((avatarResult && avatarResult.message) || 'تعذّر رفع الصورة');
        pfPendingAvatarBase64_ = null;
        pfPendingAvatarMime_ = null;
        // تحديث الشريط الجانبي/العلوي فورًا بالصورة الجديدة — كانا يعتمدان studentData[0].avatarUrl
        // اللي محدَّثة أصلًا فقط بإعادة تحميل كاملة (تسجيل دخول من جديد)، فتظل الصورة القديمة/
        // الافتراضية ظاهرة رغم نجاح الرفع فعليًا حتى تحديث الصفحة.
        // قاعدة خصوصية صريحة: صورة المستخدِمة الأنثى لا تظهر إطلاقًا إلا داخل معاينة صفحة الملف
        // الشخصي نفسها (avatarPreview أعلاه، غير متأثر بهذا الشرط) — لا الشريط الجانبي/العلوي حتى
        // لصاحبة الحساب نفسها، فلا يُحدَّثان هنا لو كان الجنس أنثى (يبقيان على الصورة الافتراضية).
        var pfCurrentGender_ = (typeof studentData !== 'undefined' && studentData && studentData[0]) ? studentData[0].gender : '';
        if(pfCurrentGender_ !== 'أنثى'){
          if(typeof studentData !== 'undefined' && studentData && studentData[0]) studentData[0].avatarUrl = avatarResult.avatarUrl;
          var stuImageEl = document.getElementById('stuImage');
          var stuImageFooterEl2 = document.getElementById('stuImageFooter');
          if(stuImageEl) stuImageEl.src = avatarResult.avatarUrl;
          if(stuImageFooterEl2) stuImageFooterEl2.src = avatarResult.avatarUrl;
        }
      }

      var payload = {
        name: form.elements.namedItem('fullName').value,
        dob: form.elements.namedItem('dob').value,
        gender: form.elements.namedItem('gender').value,
        nationality: form.elements.namedItem('nationality').value,
        phone: pfComposePhoneValue(document.getElementById('phoneCountrySelect'), document.getElementById('phone')),
        phone2: pfComposePhoneValue(document.getElementById('phone2CountrySelect'), document.getElementById('phone2')),
        contactPreference: (document.getElementById('contactPreference') || {}).value || 'email'
      };
      var saveResult = await pfGasCall('saveProfileData', pfCpr_, payload);
      if(!saveResult || !saveResult.ok) throw new Error((saveResult && saveResult.message) || 'تعذّر حفظ البيانات');

      if(newPassword.value){
        var pwResult = await pfGasCall('changePassword', pfCpr_, currentPasswordEl.value, newPassword.value);
        if(!pwResult || !pwResult.ok) throw new Error((pwResult && pwResult.message) || 'تعذّر تغيير كلمة المرور');
        pfApplySecurityStatus(true);
      }

      resetPasswordFields();
      if(typeof studentData !== 'undefined' && studentData && studentData[0]){
        studentData[0].name = payload.name;
        studentData[0].phone = payload.phone;
      }
      syncDisplayName();
      if(typeof syncStudentTopbar === 'function' && typeof studentData !== 'undefined' && studentData && studentData[0]) syncStudentTopbar(studentData[0]);
      var footerNameEl = document.getElementById('stuNameFooter');
      if(footerNameEl && typeof shortDisplayName === 'function') footerNameEl.textContent = shortDisplayName(payload.name);

      initialState = serializeForm();
      loadingEnd();
      markDirty();
      alertMSG('تم حفظ التغييرات بنجاح', 'success');
    }catch(err){
      loadingEnd();
      saveButton.disabled = false;
      alertMSG('تعذّر الحفظ: ' + (err && err.message ? err.message : err), 'error');
    }
  });

  if(discardButton){
    discardButton.addEventListener('click', function(){
      pfPendingAvatarBase64_ = null;
      pfPendingAvatarMime_ = null;
      if(avatarInput) avatarInput.value = '';
      resetPasswordFields();
      renderProfileTab();
      alertMSG('تم التراجع عن التغييرات', 'info');
    });
  }

  var actionMessages = {
    academic: 'تم فتح ملخص رحلتك العلمية',
    'signout-all': 'تم إنهاء الجلسات الأخرى تجريبيًا',
    'end-session': 'تم إنهاء جلسة الهاتف تجريبيًا'
  };
  document.addEventListener('click', function(event){
    var pane = document.getElementById('profile-tab-pane');
    var element = event.target.closest('[data-action]');
    if(!element || !pane || !pane.contains(element)) return;
    var action = element.dataset.action;
    if(actionMessages[action]) alertMSG(actionMessages[action], 'info');
  });
  var viewJourneyBtn = document.getElementById('pfViewJourneyBtn');
  if(viewJourneyBtn) viewJourneyBtn.addEventListener('click', function(){ alertMSG('تم فتح ملخص رحلتك العلمية', 'info'); });
  var helpBtn = document.getElementById('pfHelpBtn');
  if(helpBtn) helpBtn.addEventListener('click', function(){ alertMSG('سيتم توصيلك بفريق دعم بصائر', 'info'); });

  // زر "ربط الحساب" في قائمة طرق الدخول (تبويب الأمان) يوجّه لنفس تدفّق ربط Google/Yahoo
  // الحقيقي المبني في تبويب التواصل، بدل تكرار نفس المنطق مرتين.
  var connectGoogleBtn = document.querySelector('#profile-tab-pane [data-action="connect-google"]');
  if(connectGoogleBtn){
    connectGoogleBtn.addEventListener('click', function(){
      activateTab('contact');
      var googleMethodBtn = document.querySelector('[data-email-method="google"]');
      if(googleMethodBtn) googleMethodBtn.click();
    });
  }

  // -- تُستدعى من renderProfileTab في كل مرة يُفتح فيها التبويب (بيانات حقيقية من الخادم) --
  pfApplyServerData_ = function(data){
    pfSetFieldValue(form, 'fullName', data.name);
    pfSetFieldValue(form, 'cpr', data.cpr);
    pfSetFieldValue(form, 'dob', data.dob);
    pfSetFieldValue(form, 'gender', data.gender);
    pfSetFieldValue(form, 'nationality', data.nationality);
    pfSetFieldValue(form, 'email', data.email);
    pfApplyPhoneValue(document.getElementById('phoneCountrySelect'), document.getElementById('phone'), data.phone);
    pfApplyPhoneValue(document.getElementById('phone2CountrySelect'), document.getElementById('phone2'), data.phone2);
    pfSetFieldValue(form, 'block', data.block);
    pfSetFieldValue(form, 'area', data.area);

    var preference = data.contactPreference || 'whatsapp';
    var prefInput = document.getElementById('contactPreference');
    if(prefInput) prefInput.value = preference;
    document.querySelectorAll('[data-contact-choice]').forEach(function(button){
      button.classList.toggle('active', button.dataset.contactChoice === preference);
    });

    pfPendingAvatarBase64_ = null;
    pfPendingAvatarMime_ = null;
    if(avatarInput) avatarInput.value = '';
    if(avatarPreview) avatarPreview.src = data.avatarUrl || 'https://drive.google.com/thumbnail?id=1BifdUAOo6594jxvnkxOUiwXonhetUPpm&sz=w500';

    var stageName = data.stageIndex > -1 ? PF_STAGE_NAMES_[data.stageIndex] : 'غير محدَّدة';
    var sub = document.getElementById('pfIdentitySub');
    if(sub) sub.textContent = 'طالب في ' + stageName + (data.cpr ? ' · رقم الطالب ' + data.cpr : '');
    var academic = document.getElementById('pfAcademicSummary');
    if(academic) academic.textContent = stageName + (data.mazhab ? ' · ' + data.mazhab : '');

    var methodEl = document.getElementById('emailVerificationMethod');
    if(methodEl) methodEl.value = 'manual';
    var verifiedEl = document.getElementById('emailVerifiedState');
    if(verifiedEl) verifiedEl.value = data.emailVerified ? 'true' : 'false';

    pfApplySecurityStatus(!!data.hasPassword);

    resetPasswordFields();
    syncDisplayName();
    updateCompletion();
    initialState = serializeForm();
    markDirty();

    initProfileEmailVerification();
  };
}

// تحديث حالة "الرقم الشخصي وكلمة المرور" في تبويب الأمان (مؤشر أعلى القسم + سطر طرق الدخول)
// بحسب hasPassword الحقيقية القادمة من الخادم، بدل نص ثابت "غير مُفعّلة" دائمًا.
function pfApplySecurityStatus(hasPassword){
  var scoreText = document.querySelector('#profile-tab-pane .sp-security-score strong');
  if(scoreText) scoreText.textContent = hasPassword ? 'مفعّلة' : 'غير مُفعّلة';

  var loginPill = document.querySelector('#profile-tab-pane .sp-login-methods article:first-child .sp-status-pill');
  if(loginPill){
    loginPill.className = 'sp-status-pill ' + (hasPassword ? 'success' : 'warning');
    loginPill.textContent = hasPassword ? 'مفعّلة' : 'غير مُفعّلة';
  }

  var heading = document.querySelector('#profile-tab-pane .sp-security-section .sp-subsection-heading h3');
  var currentPassField = document.getElementById('currentPassword');
  var currentPassWrap = currentPassField ? currentPassField.closest('.sp-form-field') : null;
  if(heading) heading.textContent = hasPassword ? 'تغيير كلمة المرور' : 'إنشاء كلمة مرور';
  if(currentPassWrap) currentPassWrap.style.display = hasPassword ? '' : 'none';
}

// تُستدعى في كل مرة يُفتح فيها التبويب (عبر pfApplyServerData_) — تربط مستمعي الأحداث مرة
// واحدة فقط (email.dataset.pfWired)، لكنها تُعيد مزامنة الحالة المعروضة (طريقة التوثيق/الشارة)
// من قيم الحقول المخفية الحالية في كل مرة، لأن pfApplyServerData_ يضبطها من بيانات الخادم
// الطازجة قبل استدعاء هذه الدالة.
function initProfileEmailVerification(){
  var email = document.getElementById('email');
  var methodInput = document.getElementById('emailVerificationMethod');
  var verifiedInput = document.getElementById('emailVerifiedState');
  var status = document.getElementById('emailStatus');
  var providerPanel = document.getElementById('providerEmailPanel');
  var manualPanel = document.getElementById('manualEmailPanel');
  var providerIcon = document.getElementById('providerConnectedIcon');
  var providerLabel = document.getElementById('providerLabel');
  var providerEmailText = document.getElementById('providerEmailText');
  var switchAccount = document.getElementById('switchProviderAccount');
  var sendCode = document.getElementById('sendEmailCode');
  var codeArea = document.getElementById('verificationCodeArea');
  var codeInput = document.getElementById('emailVerificationCode');
  var verifyCode = document.getElementById('verifyEmailCode');
  var resendCode = document.getElementById('resendEmailCode');
  var emailMessage = document.getElementById('emailMessage');
  var codeHint = document.getElementById('codeHint');
  var countdownTimer;
  if(!email || !methodInput) return;

  function notifyChange(){
    methodInput.dispatchEvent(new Event('change', { bubbles: true }));
  }

  function setStatus(state, label){
    status.className = 'sp-email-status ' + state;
    var icon = state === 'verified' ? 'bi-patch-check-fill' : state === 'pending' ? 'bi-clock' : 'bi-exclamation-circle';
    status.innerHTML = '<i class="bi ' + icon + '"></i><b>' + label + '</b>';
    verifiedInput.value = state === 'verified' ? 'true' : 'false';
    pfApplyEmailStatus(state === 'verified');
  }

  var PF_PROVIDER_MARKS_ = {
    google: { cls: 'sp-google-mark', text: 'G', label: 'حساب Google المرتبط' },
    yahoo: { cls: 'sp-yahoo-mark', text: 'Y!', label: 'حساب Yahoo المرتبط' }
  };
  function renderProvider(method){
    if(method === 'microsoft'){
      providerIcon.className = 'sp-provider-connected-icon sp-microsoft-mark';
      providerIcon.innerHTML = '<i></i><i></i><i></i><i></i>';
      providerLabel.textContent = 'حساب Microsoft المرتبط';
    }else{
      var mark = PF_PROVIDER_MARKS_[method] || PF_PROVIDER_MARKS_.google;
      providerIcon.className = 'sp-provider-connected-icon ' + mark.cls;
      providerIcon.textContent = mark.text;
      providerLabel.textContent = mark.label;
    }
    providerEmailText.textContent = email.value;
  }

  function selectMethod(method, options){
    var config = options || {};
    document.querySelectorAll('[data-email-method]').forEach(function(button){
      var active = button.dataset.emailMethod === method;
      button.classList.toggle('active', active);
      button.setAttribute('aria-selected', String(active));
    });

    methodInput.value = method;
    var manual = method === 'manual';
    providerPanel.hidden = manual;
    manualPanel.hidden = !manual;

    if(manual){
      if(!config.keepVerification) setStatus('unverified', 'غير متحقق');
      if(verifiedInput.value === 'true') setStatus('verified', 'تم التحقق يدويًا');
    }else if(config.linkedEmail){
      renderProvider(method);
      var verifiedLabels = { google: 'موثّق عبر Google', yahoo: 'موثّق عبر Yahoo', microsoft: 'موثّق عبر Microsoft' };
      setStatus('verified', verifiedLabels[method] || verifiedLabels.google);
      codeArea.hidden = true;
      codeInput.value = '';
    }
  }

  // بدء تدفّق ربط Google/Yahoo الحقيقي: نافذة OAuth وسيطة (startOAuthRelay في
  // auth-js.html، تُستخدم أيضًا في صفحة الدخول) → عند النجاح نرسل البريد المُتحقَّق منه فعليًا
  // للخادم (linkVerifiedEmailToProfile في auth.js) ليكتبه ويُعلّمه موثّقًا مباشرة.
  function startLinkFlow(method, btn){
    if(typeof startOAuthRelay !== 'function'){
      alertMSG('تعذّر فتح نافذة الربط، يرجى إعادة تحميل الصفحة والمحاولة مجددًا', 'error');
      return;
    }
    startOAuthRelay(method, btn, null, function(verifiedEmail){
      loadingStart();
      google.script.run.withSuccessHandler(function(result){
        loadingEnd();
        if(!result || !result.ok){
          alertMSG((result && result.message) || 'تعذّر ربط الحساب', 'error');
          return;
        }
        email.value = result.email;
        selectMethod(method, { linkedEmail: true });
        notifyChange();
        alertMSG('تم ربط البريد والتحقق منه بنجاح', 'success');
      }).withFailureHandler(function(err){
        loadingEnd();
        alertMSG('تعذّر ربط الحساب: ' + err, 'error');
      }).linkVerifiedEmailToProfile(pfCpr_, verifiedEmail);
    });
  }

  function startCountdown(seconds){
    clearInterval(countdownTimer);
    seconds = seconds || 75;
    resendCode.disabled = true;
    resendCode.innerHTML = 'إعادة الإرسال بعد <b id="codeCountdown">' + seconds + '</b> ثانية';
    var liveCountdown = resendCode.querySelector('b');
    countdownTimer = setInterval(function(){
      seconds -= 1;
      liveCountdown.textContent = seconds;
      if(seconds <= 0){
        clearInterval(countdownTimer);
        resendCode.disabled = false;
        resendCode.textContent = 'إعادة إرسال الرمز';
      }
    }, 1000);
  }

  function sendVerificationCode(){
    if(!email.checkValidity()){
      email.closest('.sp-input-wrap').classList.add('sp-invalid');
      emailMessage.classList.add('error');
      emailMessage.textContent = 'يرجى كتابة بريد إلكتروني صحيح';
      email.focus();
      return;
    }
    email.closest('.sp-input-wrap').classList.remove('sp-invalid');
    emailMessage.classList.remove('error');

    sendCode.disabled = true;
    google.script.run.withSuccessHandler(function(result){
      sendCode.disabled = false;
      if(!result || !result.ok){
        if(result && result.cooldown){
          alertMSG('يرجى الانتظار قليلًا قبل طلب رمز جديد', 'warning');
          codeArea.hidden = false;
          startCountdown(result.retryAfterSeconds);
          return;
        }
        alertMSG((result && result.message) || 'تعذّر إرسال رمز التحقق', 'error');
        return;
      }
      emailMessage.textContent = 'تم إرسال الرمز إلى ' + email.value;
      codeArea.hidden = false;
      codeInput.value = '';
      setStatus('pending', 'بانتظار الرمز');
      startCountdown(result.cooldownSeconds);
      notifyChange();
      codeInput.focus();
      alertMSG('تم إرسال رمز التحقق إلى بريدك الإلكتروني', 'success');
    }).withFailureHandler(function(err){
      sendCode.disabled = false;
      alertMSG('تعذّر إرسال رمز التحقق: ' + err, 'error');
    }).requestRegistrationOtp(pfCpr_, email.value);
  }

  // مستمعو الأحداث تُربَط مرة واحدة فقط (نفس عناصر DOM في كل استدعاء لاحق لهذه الدالة)؛
  // إعادة المزامنة الفعلية للحالة المعروضة تحدث دومًا عبر selectMethod أسفل الدالة.
  if(!email.dataset.pfWired){
    email.dataset.pfWired = '1';

    document.querySelectorAll('[data-email-method]').forEach(function(button){
      button.addEventListener('click', function(){
        var method = button.dataset.emailMethod;
        if(method === 'manual'){
          selectMethod('manual');
          notifyChange();
        }else{
          startLinkFlow(method, button);
        }
      });
    });

    if(switchAccount){
      switchAccount.addEventListener('click', function(){
        startLinkFlow(methodInput.value, switchAccount);
      });
    }

    if(sendCode) sendCode.addEventListener('click', sendVerificationCode);
    if(resendCode) resendCode.addEventListener('click', sendVerificationCode);

    if(codeInput){
      codeInput.addEventListener('input', function(){
        codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6);
        codeHint.classList.remove('error');
        codeHint.textContent = 'أدخل الرمز المرسَل إلى بريدك';
      });
    }

    if(verifyCode){
      verifyCode.addEventListener('click', function(){
        if(codeInput.value.length !== 6){
          codeHint.classList.add('error');
          codeHint.textContent = 'يرجى إدخال الرمز المكوّن من 6 أرقام';
          codeInput.focus();
          return;
        }
        verifyCode.disabled = true;
        google.script.run.withSuccessHandler(function(result){
          verifyCode.disabled = false;
          if(!result || !result.ok){
            codeHint.classList.add('error');
            codeHint.textContent = (result && result.message) || 'الرمز غير صحيح';
            codeInput.closest('.sp-input-wrap').classList.add('sp-invalid');
            codeInput.focus();
            return;
          }
          clearInterval(countdownTimer);
          codeInput.closest('.sp-input-wrap').classList.remove('sp-invalid');
          codeHint.classList.remove('error');
          codeHint.textContent = 'تم التحقق من البريد بنجاح';
          email.value = result.email;
          setStatus('verified', 'تم التحقق يدويًا');
          notifyChange();
          alertMSG('تم تفعيل بريدك الإلكتروني بنجاح', 'success');
        }).withFailureHandler(function(err){
          verifyCode.disabled = false;
          alertMSG('تعذّر التحقق من الرمز: ' + err, 'error');
        }).confirmProfileEmail(pfCpr_, codeInput.value);
      });
    }

    email.addEventListener('input', function(){
      if(methodInput.value !== 'manual') return;
      codeArea.hidden = true;
      codeInput.value = '';
      setStatus('unverified', 'غير متحقق');
      emailMessage.classList.remove('error');
      emailMessage.textContent = 'سنرسل رمز تحقق مكوّنًا من 6 أرقام';
    });
  }

  var initialMethod = methodInput.value || 'manual';
  selectMethod(initialMethod, {
    silent: true,
    keepVerification: verifiedInput.value === 'true'
  });
}

function loadStartData(){
  initFirebaseAuth();
  // نتحقق من حالة الجلسة مرة واحدة فقط عند فتح الصفحة، ثم نلغي الاشتراك في
  // هذا المستمع فورًا؛ فلا يُعاد استدعاؤه تلقائيًا لاحقًا أثناء تسجيل الدخول
  // اليدوي (وهو ما كان يحمّل الصفحة قبل إتمام خطوة إنشاء كلمة المرور).
  const unsubscribeAuthCheck = firebase.auth().onAuthStateChanged(function(user){
    unsubscribeAuthCheck();
    if (user) {
      AUTH_CPR = String(user.uid).replace(/^u/, '');
      // لا نعتمد على جلسة محفوظة إلا لحساب فعّل بريده وأنشأ كلمة مرور فعليًا؛
      // غير ذلك نخرج منها ونعرض شاشة الدخول من جديد (تفاديًا لتجاوز خطوة
      // إنشاء كلمة المرور الإلزامية بإغلاق المتصفح قبل إتمامها).
      google.script.run.withSuccessHandler(function(status){
        if (status && status.found && status.emailVerified && status.hasPassword) {
          loadLoginDataForAuthedUser(AUTH_CPR);
        } else {
          firebase.auth().signOut().catch(function(){}).then(loadLogin);
        }
      }).withFailureHandler(function(){
        // تعذّر التحقق (خطأ شبكة عابر) — لا نمنع دخولاً كان سيعمل غالبًا
        loadLoginDataForAuthedUser(AUTH_CPR);
      }).checkCprStatus(AUTH_CPR);

///////////////////////////////////////////////////////////////////////////
// تُعيد Promise حقيقيًا (بخلاف السابق الذي كان async بالاسم فقط دون أي await
// فعلي بداخله) حتى يستطيع من يستدعيها فعليًا انتظار اكتمال جلب dectationData بدل
// الاعتماد على مهلة setTimeout ثابتة تخمينية (كانت السبب في تأخير/فشل عرض تبويب
// التسميع). راجع setStudentDash في funcs-js.html للاستخدام الفعلي.
///////////////////////////////////////////////////////////////////////////
function getDectationDataRef(){
  loadingStart();
  dectationDataPromise_ = new Promise(function(resolve){
    google.script.run.withSuccessHandler(function(dr){
      dectationData = Array.isArray(dr) ? dr : [];
      try{ loadingEnd(); }catch(err){}
      loadingEnd();
      resolve(dectationData);
    }).withFailureHandler(function(err){
      try{ loadingEnd(); }catch(err){}
      loadingEnd();
      dectationData = dectationData || [];
      resolve(dectationData);
    }).getDectationData();
  });
  return dectationDataPromise_;
}

async function extractCertifications(e) {

  if (!userData[0].manage){
    swal.fire('خطأ!!','ليس لديك الصلاحية لهذا الإجراء','error');
    return;
  }

  const card = e.target.closest('.card');
  const spinner = card.querySelector('.spinner');
  const badge = card.querySelector('.badge').textContent;
  const exam = card.querySelector('.exam').textContent.replace(badge,'').trim();

  alertMSG('جاري استخراج شهادات '+exam+'، سيستغرق التنفيذ بعض الوقت','info');

  e.target.classList.add('d-none');
  spinner.classList.remove('d-none');

  google.script.run
    .withSuccessHandler(function(res){
      spinner.classList.add('d-none');
      alertMSG("تم الانتهاء من إصدار الشهادات","success");
      getAllCertiData();
      google.script.run.sendFinishedMail(exam);
    })
    .withFailureHandler(function(err){
      spinner.classList.add('d-none');
      e.target.classList.remove('d-none');
      alertMSG(err,'error');
    })
    .generatCertificate(exam, (typeof userData !== 'undefined' && userData && userData[0] && userData[0].cpr) || '');  // بدون استدعاء ذاتي
}

function searchInTable(inputID , tableID , indexField) {

  input = document.getElementById(inputID);
  filter = input.value.toUpperCase();
  table = document.getElementById(tableID);
  tr = table.getElementsByTagName("tr");
  for (i = 0; i < tr.length; i++) {
    td = tr[i].getElementsByTagName("td")[indexField];
    if (td) {
      txtValue = td.textContent || td.innerText;
      if (txtValue.toUpperCase().indexOf(filter) > -1) {
        tr[i].style.display = "";
      } else {
        tr[i].style.display = "none";
      }
    }       
  }
}

// تبويب "التسميع والأوراد" الجديد في بوابة الطالب (student.html، تصميم sp-*
// بنمط "قائمة مهام" بدل الجدول القديم أعلاه — راجع design-guidelines.md المرحلة 3).
// دالة منفصلة عن setStudentsDectation عمدًا: تلك ما زالت تُستخدم كما هي في صفحة
// الموظف (متابعة التسميع، emp.html) وصفحة "إرسال رسالة" (currentStus.html)،
// وكلتاهما تعتمدان على قالب <tr> مختلف تمامًا (#dectationRow) لم تُمس بهذا التغيير.
/////////////////////////////////////////////////////////////////////
function dectationRateLabel(rate){
  var n = Number(rate);
  if(isNaN(n)) return '';
  if(n >= 4) return 'ممتاز';
  if(n >= 3) return 'جيد جدًا';
  if(n >= 2) return 'جيد';
  if(n >= 1) return 'مقبول';
  return 'ضعيف';
}

// عدد الأسابيع المتتالية (تنتهي بأحدث أسبوع فيه تسميع) التي سُمِّع فيها ورد واحد على
// الأقل — مبني بالكامل من تواريخ حقيقية (dates)، وليس رقمًا افتراضيًا.
function computeRecitationStreak(dates){
  var weekOf = function(d){
    var oneJan = new Date(d.getFullYear(), 0, 1);
    var week = Math.ceil((((d - oneJan) / 86400000) + oneJan.getDay() + 1) / 7);
    return d.getFullYear() * 53 + week;
  };
  var weeks = {};
  dates.forEach(function(raw){
    var d = new Date(raw);
    if(isNaN(d.getTime())) return;
    weeks[weekOf(d)] = true;
  });
  var absWeeks = Object.keys(weeks).map(Number).sort(function(a,b){ return b - a; });
  if(!absWeeks.length) return 0;

  var curAbsWeek = weekOf(new Date());
  if(curAbsWeek - absWeeks[0] > 1) return 0; // آخر تسميع كان قبل أكثر من أسبوع، فالتتابع انقطع فعليًا

  var streak = 0, expected = absWeeks[0];
  for(var i = 0; i < absWeeks.length; i++){
    if(absWeeks[i] !== expected) break;
    streak++;
    expected--;
  }
  return streak;
}

function renderStudentDectationTaskList(data){
  var container = document.getElementById('spDectationList');
  var emptyEl = document.getElementById('dectationEmpty');
  if(!container) return;

  var list = Array.isArray(data) ? data : [];

  var countEl = document.getElementById('recitationCountStat');
  var avgEl = document.getElementById('recitationAvgStat');
  var streakEl = document.getElementById('recitationStreakStat');
  if(countEl) countEl.textContent = list.length;
  if(avgEl){
    var rates = list.map(function(e){ return Number(e.rate); }).filter(function(n){ return !isNaN(n); });
    avgEl.textContent = rates.length ? (rates.reduce(function(a,b){ return a+b; },0) / rates.length).toFixed(1) : '—';
  }
  if(streakEl) streakEl.textContent = computeRecitationStreak(list.map(function(e){ return e.date; }));

  if(!list.length){
    container.innerHTML = '';
    if(emptyEl) emptyEl.classList.remove('d-none');
    return;
  }
  if(emptyEl) emptyEl.classList.add('d-none');

  var sorted = list.slice().sort(function(a,b){ return new Date(b.date).getTime() - new Date(a.date).getTime(); });

  container.innerHTML = sorted.map(function(e){
    var dateStr = e.date ? new Date(e.date).toLocaleDateString('ar-BH', {day:'numeric', month:'long'}) : '';
    var label = dectationRateLabel(e.rate);
    return '<article class="sp-task-item">' +
      '<span class="sp-task-number">' + escapeHtmlSp(e.werd != null ? e.werd : '') + '</span>' +
      '<div><strong>' + escapeHtmlSp(e.matn || '') + '</strong>' +
        '<small>' + escapeHtmlSp(e.resp || '') + (dateStr ? ' · ' + dateStr : '') + '</small></div>' +
      '<span class="sp-rating"><i class="bi bi-star-fill"></i>' + (label ? label + ' ' : '') + '(' + escapeHtmlSp(e.rate != null ? e.rate : '—') + '/4)</span>' +
    '</article>';
  }).join('');
}

// نسخة محلية بسيطة من escapeHtml (المُعرَّفة أصلًا في admin-js.html فقط) حتى لا تعتمد
// صفحة الطالب على تحميل سكربت لوحة الإدارة.
function escapeHtmlSp(str){
  if(str === undefined || str === null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// عبر Trigger مجدول (wpQueue.js) ولا تتطلب إبقاء المتصفح مفتوحًا. هذه الدوال هنا
// لعرض آخر حالة معروفة عند فتح صفحة "إرسال رسالة" أو الضغط على "تحديث"، مع تحديث
// تلقائي كل 15 ثانية طالما الصفحة مفتوحة وما زالت العملية جارية.
/////////////////////////////////////////////////////////////////////////////////
var wpQueuePollTimer_ = null;

function refreshWPQueueStatus(){
  if(!document.getElementById('wpQueueStatusText')) return; // المستخدم غادر صفحة "إرسال رسالة"
  if(wpQueuePollTimer_){ clearTimeout(wpQueuePollTimer_); wpQueuePollTimer_ = null; }

  google.script.run.withSuccessHandler(function(st){
    renderWPQueueStatus(st);
    if(st.status === 'running' && document.getElementById('wpQueueStatusText')){
      wpQueuePollTimer_ = setTimeout(refreshWPQueueStatus, 15000);
    }
  }).withFailureHandler(function(){
    // تجاهل بصمت؛ سيُعاد المحاولة عند الضغط على تحديث يدويًا
  }).getWPQueueStatus();
}

function renderWPQueueStatus(st){
  var textEl = document.getElementById('wpQueueStatusText');
  if(!textEl) return;

  var stopBtn = document.getElementById('wpQueueStopBtn');
  var detailsBtn = document.getElementById('wpQueueDetailsBtn');
  var progressWrap = document.getElementById('wpQueueProgressWrap');
  var progressBar = document.getElementById('wpQueueProgressBar');

  window.wpLastQueueStatus_ = st;

  if(st.status === 'idle'){
    textEl.textContent = 'لم يتم إرسال أي رسالة جماعية بعد.';
    stopBtn.classList.add('d-none');
    detailsBtn.classList.add('d-none');
    progressWrap.classList.add('d-none');
    return;
  }

  var processed = st.sent + st.failed;
  var pct = st.total > 0 ? Math.round((processed / st.total) * 100) : 0;
  progressWrap.classList.remove('d-none');
  progressBar.style.width = pct + '%';

  if(st.status === 'running'){
    textEl.textContent = 'جارٍ الإرسال... تم إرسال ' + st.sent + ' من ' + st.total + ' (متبقٍّ ' + st.remaining + (st.failed ? '، تعذّر الإرسال لـ' + st.failed : '') + ')';
    stopBtn.classList.remove('d-none');
  }else if(st.status === 'stopped'){
    textEl.textContent = 'تم إيقاف عملية الإرسال يدويًا بعد إرسال ' + st.sent + ' من ' + st.total + (st.failed ? ' (تعذّر الإرسال لـ' + st.failed + ')' : '');
    stopBtn.classList.add('d-none');
  }else{ // done
    textEl.textContent = 'اكتملت آخر عملية إرسال: ' + st.sent + ' من ' + st.total + (st.failed ? ' — تعذّر الإرسال لـ' + st.failed : ' — بنجاح تام');
    stopBtn.classList.add('d-none');
  }
  detailsBtn.classList.remove('d-none');
}

// الجلب كان يتم مباشرة من المتصفح (fetch) على رابط Apps Script خارجي منفصل، وهو ما كان
// يفشل أحيانًا (خصوصًا في التصفح الخاص) بسبب قيود الإطار المعزول لصفحات Apps Script على
// إعادة التوجيه/الكوكيز الخاصة بذلك الرابط. أصبح الجلب الآن يتم من خادم Apps Script نفسه
// (UrlFetchApp عبر google.script.run)، وهو غير متأثر بهذه القيود إطلاقًا.
function searchBlock(blockNumber) {
  return new Promise(function (resolve) {
    google.script.run
      .withSuccessHandler(function (data) {
        resolve(data && !data.error ? data : 'error');
      })
      .withFailureHandler(function (err) {
        console.error('Error fetching block:', err);
        resolve('error');
      })
      .lookupBlockArea(blockNumber);
  });
}

/////////////////////////////////////////////////////////////////////////////
// اقتراح تصحيح لأخطاء إملائية شائعة في نطاق البريد الإلكتروني (الجزء بعد @)، مثل
// gamil.com أو gmail.con بدل gmail.com، عبر مقارنة النطاق المكتوب بقائمة أشهر
// النطاقات ومسافة التحرير (Levenshtein) بينهما.
/////////////////////////////////////////////////////////////////////////////
var COMMON_EMAIL_DOMAINS_ = ['gmail.com','hotmail.com','outlook.com','yahoo.com','icloud.com','live.com','msn.com'];

function levenshteinDistance(a, b){
  var m = a.length, n = b.length;
  var dp = [];
  for(var i = 0; i <= m; i++){ dp.push([i]); }
  for(var j = 0; j <= n; j++){ dp[0][j] = j; }
  for(i = 1; i <= m; i++){
    for(j = 1; j <= n; j++){
      dp[i][j] = a[i-1] === b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp[m][n];
}

function suggestEmailDomainFix(email){
  var m = /^([^\s@]+)@([^\s@]+)$/.exec(String(email || '').trim());
  if(!m) return null;
  var localPart = m[1], domain = m[2].toLowerCase();
  if(COMMON_EMAIL_DOMAINS_.indexOf(domain) !== -1) return null; // النطاق صحيح أصلًا

  var best = null, bestDist = 3; // نتجاهل فروقًا أكبر من فرقين حتى لا نقترح تصحيحًا لنطاق مختلف فعلًا
  COMMON_EMAIL_DOMAINS_.forEach(function(d){
    var dist = levenshteinDistance(domain, d);
    if(dist > 0 && dist < bestDist){ bestDist = dist; best = d; }
  });
  return best ? (localPart + '@' + best) : null;
}

function checkEmailTypo(inputEl){
  if(!inputEl || !inputEl.value) return;
  var suggestion = suggestEmailDomainFix(inputEl.value);
  if(!suggestion) return;
  Swal.fire({
    icon: 'question',
    text: 'هل تقصد ' + suggestion + '؟',
    showCancelButton: true,
    confirmButtonText: 'نعم، صحّح',
    cancelButtonText: 'لا'
  }).then(function(result){
    if(result.isConfirmed){
      inputEl.value = suggestion;
      inputEl.dispatchEvent(new Event('input', { bubbles: true }));
      inputEl.dispatchEvent(new Event('change', { bubbles: true }));
    }
  });
}

/////////////////////////////////////////////////////////////////////////////
// حارس إلزامي يُستدعى مباشرة قبل أي إرسال فعلي لبريد إلكتروني (رمز تحقق أو معرّف
// دخول)، في أي صفحة (تسجيل طالب، تفعيل بريد عند الدخول، إضافة/تعديل متعاون، ...).
// يُعيد Promise تُحسم بـ { proceed, correctedEmail }:
//  - صياغة غير صحيحة إطلاقًا (لا @ أو لا نقطة) → رسالة خطأ واضحة، proceed:false (لا إرسال).
//  - نطاق يبدو خطأ إملائيًا شائعًا (عبر suggestEmailDomainFix الموجودة أعلاه) → نافذة
//    "هل تقصد ...؟": الموافقة تُعيد correctedEmail بالنطاق المصحَّح، الرفض يُبقي البريد كما
//    كتبه المستخدم دون أي تعديل (وفي الحالتين proceed:true، أي "أكمل الآن").
//  - غير ذلك → proceed:true فورًا دون أي نافذة.
/////////////////////////////////////////////////////////////////////////////
function confirmEmailProviderOk(email){
  return new Promise(function(resolve){
    var trimmed = String(email || '').trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed)){
      Swal.fire({
        icon: 'error',
        title: 'تعذّر إرسال البريد',
        html: 'البريد الإلكتروني الذي أدخلته (<span dir="ltr" style="font-weight:700">' + escapeHtml(trimmed) + '</span>) غير مكتمل الصياغة (يجب أن يكون بالشكل name@domain.com). يرجى تصحيحه ثم المحاولة مرة أخرى.',
        confirmButtonText: 'حسنًا'
      }).then(function(){ resolve({ proceed:false, correctedEmail:null }); });
      return;
    }
    var suggestion = suggestEmailDomainFix(trimmed);
    if(suggestion){
      Swal.fire({
        icon: 'warning',
        title: 'تحقق من بريدك الإلكتروني',
        html: 'كتبت: <span dir="ltr" style="font-weight:700">' + escapeHtml(trimmed) + '</span><br><br>' +
              'يبدو أن هناك خطأ إملائيًا شائعًا في اسم مزوّد البريد. هل تقصد:<br>' +
              '<span dir="ltr" style="font-weight:700;color:#198754">' + escapeHtml(suggestion) + '</span>؟',
        showCancelButton: true,
        confirmButtonText: 'نعم، صحّح البريد',
        cancelButtonText: 'لا، هذا بريدي الصحيح',
        reverseButtons: true
      }).then(function(result){
        resolve({ proceed:true, correctedEmail: result.isConfirmed ? suggestion : null });
      });
      return;
    }
    resolve({ proceed:true, correctedEmail:null });
  });
}

// أغلب أخطاء التحقق من البريد سببها كتابة يدوية خاطئة. لو النطاق المكتوب هو أحد نطاقات
// المزوّدين المدعومين بزر "تحقّق سريع" (جوجل/ياهو/مايكروسوفت) بالضبط، أو خطأ إملائي قريب منه
// جدًا (اكتشفه suggestEmailDomainFix أعلاه)، الأصح إجبار المتابعة عبر ذلك الزر (تحقق فعلي
// 100%، ولا يستهلك أي رسالة) بدل مسار الرمز اليدوي الذي قد يحمل نفس الخطأ الإملائي. يعمل فقط
// في الصفحات التي فيها فعلًا الزر المطابق (صفحة التسجيل حاليًا) — الصفحات الأخرى (كالملف
// الشخصي) تُبقي المسار اليدوي متاحًا دائمًا.
