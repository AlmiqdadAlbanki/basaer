  google: '<svg width="16" height="16" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>',
  yahoo: '<svg width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#6001D2" d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z"/><path fill="#fff" d="M9.5 7l2 4.7L13.5 7H16l-3.4 7.3V17h-2.2v-2.7L7 7h2.5z"/></svg>'
};
var OAUTH_FORCE_DOMAIN_MAP_ = {
  'gmail.com': { btn:'googleSignInBtn', label:'تحقّق سريع عبر جوجل', icon:'google' },
  'yahoo.com': { btn:'yahooSignInBtn', label:'تحقّق سريع عبر ياهو', icon:'yahoo' }
};
// معرّف الزر الذي أُهملت (تجاهُل) بطاقته الإجبارية آخر مرة — يُلغى تلقائيًا فور تغيّر النطاق
// المكتشَف (مزوّد مختلف أو لا شيء)، فلا يبقى "التجاهل" ساريًا على نطاق مختلف بالخطأ.
var oauthForceDismissedFor_ = null;

function detectForcedOAuth(email){
  var m = /^([^\s@]+)@([^\s@]+)$/.exec(String(email || '').trim());
  if(!m) return null;
  var domain = m[2].toLowerCase();
  if(OAUTH_FORCE_DOMAIN_MAP_[domain]) return OAUTH_FORCE_DOMAIN_MAP_[domain];
  var suggestion = suggestEmailDomainFix(email);
  var sm = suggestion && /@([^\s@]+)$/.exec(suggestion.toLowerCase());
  return (sm && OAUTH_FORCE_DOMAIN_MAP_[sm[1]]) || null;
}

function updateGmailForceState(inputEl){
  var verMailBtn = document.getElementById('verMail');
  var hint = document.getElementById('mailFieldHint');
  if(!verMailBtn || !hint || !document.getElementById('googleSignInBtn')) return;

  var forced = detectForcedOAuth(inputEl.value);

  if(forced && forced.btn !== oauthForceDismissedFor_){
    verMailBtn.classList.add('d-none');
    hint.innerHTML =
      'يرجى التحقق من خلال الضغط على ' +
      '<button type="button" class="oauth-inline-icon-btn" id="oauthInlineTriggerBtn" title="' + forced.label + '" aria-label="' + forced.label + '">' +
        (OAUTH_FORCE_ICONS_[forced.icon] || '') +
      '</button> أو ' +
      '<button type="button" id="oauthForceDismissBtn" class="btn btn-link btn-sm text-secondary p-0 align-baseline">تجاهل</button>';
  }else{
    if(!forced) oauthForceDismissedFor_ = null;
    if(document.getElementById('mailBox').checkValidity()) verMailBtn.classList.remove('d-none');
    hint.textContent = 'سيتم إرسال رمز تحقق إلى بريدك قبل إتمام التسجيل.';
  }
}

// يمنع اختيار تاريخ ميلاد يجعل العمر أقل من 10 سنوات نسبةً لليوم الحالي (وقت استخدام الحقل
// فعليًا، وليس تاريخًا ثابتًا) — يُطبَّق على كل حقل "تاريخ الميلاد" بالمشروع (تسجيل طالب جديد،
// مراجعة طلبات جديدة/الطلاب الحاليين، الملف الشخصي لطالب/متعاون/مدير).
function applyDobAgeLimit(inputEl){
  if(!inputEl) return;
  var d = new Date();
  d.setFullYear(d.getFullYear() - 10);
  var mm = String(d.getMonth() + 1).padStart(2, '0');
  var dd = String(d.getDate()).padStart(2, '0');
  inputEl.max = d.getFullYear() + '-' + mm + '-' + dd;
}

function calculateAgeInYears(birthDateString) {
  const birthDate = new Date(birthDateString);
  const today = new Date();

  // لو تاريخ الميلاد بعد اليوم → نرجع 0
  if (birthDate > today) return 0;

  let age = today.getFullYear() - birthDate.getFullYear();

  // لو عيد الميلاد لسه مجاش السنة دي نقص سنة
  const hasBirthdayPassedThisYear =
    today.getMonth() > birthDate.getMonth() ||
    (today.getMonth() === birthDate.getMonth() && today.getDate() >= birthDate.getDate());

  if (!hasBirthdayPassedThisYear) {
    age--;
  }

  return age;
}

// دفعة قبول/رفض جماعية — تعرض تقدّمها عبر الشريط المشترك (acceptBatchBanner، admin-js.html) بدل
// مودال محلي، ولا تُشغَّل حالة "دفعة قبول جارية" إلا عند القبول الفعلي (newRegAproval === 'yes')،
// لا الرفض (لا يهم تزامنه بنفس القدر: لا ملفات ولا بريد). راجع مناقشات.md "علاج تكرار عملية القبول".
function acceptAllNewStu () {

  const rows = Array.from(document.querySelectorAll('#usersContainer .userRow'));
  if (rows.length === 0) return;

  const isAccepting = newRegAproval === 'yes';
  const staffName = (typeof userData !== 'undefined' && userData && userData[0] && userData[0].name) || '';
  const staffCpr = (typeof userData !== 'undefined' && userData && userData[0] && userData[0].cpr) || '';
  const total = rows.length;
  let completed = 0;
  const failures = [];

  if (isAccepting) google.script.run.startAcceptBatch(total, staffName);

  function finishBatch() {
    if (isAccepting) google.script.run.endAcceptBatch();
    setTimeout(() => {
      if (stopProcessing) return;
      let completionDialog;
      if (failures.length === 0) {
        completionDialog = Swal.fire('اكتمل القبول', 'تم قبول ' + total + ' من الطلبات الظاهرة وإنشاء الملفات المطلوبة.', 'success');
      } else {
        completionDialog = Swal.fire({
          icon: 'warning',
          title: 'اكتملت العملية مع بعض الأخطاء',
          html: 'نجح: ' + (total - failures.length) + ' من ' + total + '<br><br>تعذّرت معالجة:<br>' +
            failures.map(function (f) { return escapeHtml(f.name) + ' — ' + escapeHtml(f.reason); }).join('<br>')
        });
      }
      completionDialog.then(function(){ if(typeof getNewStuRegData === 'function') getNewStuRegData(); });
    }, 400);
  }

  function processStudent(index) {
    if (index >= rows.length || stopProcessing) {
      finishBatch();
      return;
    }

    const row = rows[index];
    const cpr = row.id;
    const nameEl = row.querySelector('.name');
    const studentName = nameEl ? nameEl.textContent : cpr;
    // مرحلة هذا الصف تحديدًا (row.dataset.grade، يضبطها setNewRegStudentsRow) بدل grade المشتركة —
    // ضرورية في تبويب "الكل" حيث grade = null (لا مرحلة واحدة ثابتة لكل الصفوف المعروضة معًا)
    const rowGrade = row.dataset.grade !== undefined && row.dataset.grade !== '' ? parseInt(row.dataset.grade, 10) : grade;

    // طالب سجّل دون اختيار مرحلة ولم يُحدِّد له الموظف مرحلة بعد من الخانة اليدوية — يُستبعَد من
    // دفعة القبول (لا معنى لقبوله دون مرحلة)، ولا يمنع ذلك بقية الدفعة من إكمال معالجتها.
    if (isAccepting && (rowGrade === null || typeof rowGrade === 'undefined' || isNaN(rowGrade))) {
      failures.push({ name: studentName, reason: 'لم تُحدَّد مرحلة لهذا الطالب' });
      completed++;
      google.script.run.updateAcceptBatchProgress(completed);
      processStudent(index + 1);
      return;
    }

    google.script.run
      .withSuccessHandler(function(s) {
        row.remove();
        completed++;
        if (isAccepting) google.script.run.updateAcceptBatchProgress(completed);
        processStudent(index + 1);
      })
      .withFailureHandler(function(f) {
        failures.push({ name: studentName, reason: String(f) });
        completed++;
        if (isAccepting) google.script.run.updateAcceptBatchProgress(completed);
        processStudent(index + 1);
      })
      .setStudentsQrCard(cpr, newRegAproval, rowGrade, staffName, staffCpr);
  }

  processStudent(0);
}

function closeAllSwal() {
  // غلق أي رسالة مفتوحة (لو موجودة)
  if (typeof Swal !== "undefined") {
    Swal.close();
  }

  // تنظيف أي كلاس مضاف على body أو html
  document.documentElement.classList.remove('swal2-shown', 'swal2-height-auto');
  document.body.classList.remove('swal2-shown', 'swal2-height-auto');

  // إعادة التفاعل مع الصفحة
  document.body.style.pointerEvents = 'auto';
  document.body.style.overflow = 'auto';

  // حذف أي كونتينر متبقي
  document.querySelectorAll('.swal2-container').forEach(el => el.remove());
}

function getDriveId(url) {

  return match ? match[0] : url;
